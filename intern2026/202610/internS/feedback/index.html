<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>要望フィードバック — G1 PREDICTOR</title>
<style>
  :root{
    --bg:#0f1a14; --panel:#16251c; --line:#2c4a38; --ink:#eef5ee; --soft:#9fb8a7; --gold:#f2c94c;
    --ok:#5fd08e; --part:#7fa8f0; --hold:#f2c94c; --no:#f08a80; --wait:#9fb8a7;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",system-ui,sans-serif; line-height:1.7; }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 16px 64px; display:flex; flex-direction:column; gap:18px; }
  .eyebrow{ color:var(--gold); font-size:12px; letter-spacing:.15em; font-weight:700; }
  h1{ font-size:26px; line-height:1.3; }
  .lead{ color:var(--soft); font-size:14px; }
  a{ color:var(--gold); }
  .legend{ display:flex; flex-wrap:wrap; gap:6px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; }
  .tabs button{ font:inherit; font-size:13px; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--soft); cursor:pointer; }
  .tabs button[aria-pressed="true"]{ background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
  .stamp{ display:inline-block; font-size:12px; font-weight:800; padding:1px 9px; border-radius:6px; border:2px solid currentColor; }
  .s-pending{ color:var(--wait); } .s-adopted{ color:var(--ok); } .s-partial{ color:var(--part); }
  .s-hold{ color:var(--hold); } .s-declined{ color:var(--no); }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .ask{ padding:14px 16px; display:flex; flex-direction:column; gap:6px; }
  .meta{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12px; color:var(--soft); }
  .kind{ border:1px solid var(--line); border-radius:999px; padding:0 8px; }
  .text{ white-space:pre-wrap; overflow-wrap:anywhere; }
  .reply{ border-top:1px dashed var(--line); padding:12px 16px 14px; display:flex; flex-direction:column; gap:6px; font-size:14px; }
  .reply .who{ font-size:12px; color:var(--soft); }
  .reply .sub{ font-size:13px; color:var(--soft); white-space:pre-wrap; overflow-wrap:anywhere; }
  .empty{ border:1px dashed var(--line); border-radius:12px; padding:24px 16px; text-align:center; color:var(--soft); }
  .count{ font-size:13px; color:var(--soft); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">G1 PREDICTOR</div>
    <h1>要望フィードバック</h1>
    <p class="lead">フォームから届いた要望に対する Claude の判定と理由です。新しいものが上に並びます。
      <a href="../">ゲームで遊ぶ</a></p>
  </header>

  <div class="legend" aria-label="判定の種類">
    <span class="stamp s-adopted">採用・反映済み</span>
    <span class="stamp s-partial">一部採用</span>
    <span class="stamp s-hold">相談中</span>
    <span class="stamp s-declined">見送り</span>
    <span class="stamp s-pending">確認中</span>
  </div>

  <div class="tabs" id="tabs" role="group" aria-label="絞り込み">
    <button type="button" data-f="all" aria-pressed="true">すべて</button>
    <button type="button" data-f="adopted" aria-pressed="false">採用</button>
    <button type="button" data-f="hold" aria-pressed="false">相談中</button>
    <button type="button" data-f="declined" aria-pressed="false">見送り</button>
  </div>
  <p class="count" id="count"></p>

  <section id="list"></section>
</div>

<script src="data.js?v=11"></script>
<script>
(function(){
  const STATUS = {
    pending:  { label:'確認中', cls:'s-pending' },
    adopted:  { label:'採用・反映済み', cls:'s-adopted' },
    partial:  { label:'一部採用', cls:'s-partial' },
    hold:     { label:'相談中', cls:'s-hold' },
    declined: { label:'見送り', cls:'s-declined' },
  };
  const data = Array.isArray(window.FEEDBACK) ? window.FEEDBACK : [];
  let filter = 'all';

  function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

  function match(st){
    if(filter === 'all') return true;
    if(filter === 'adopted') return st === 'adopted' || st === 'partial';
    return st === filter;
  }

  function render(){
    const list = document.getElementById('list');
    list.textContent = '';
    const rows = data.filter(d => match(d.status || 'pending'));
    document.getElementById('count').textContent = data.length ? `${rows.length}件 / 全${data.length}件` : '';
    if(!rows.length){
      list.appendChild(el('div','empty', data.length ? 'この絞り込みに当てはまる要望はありません。' : 'まだフィードバックはありません。フォームから要望を送ると、判定がここに表示されます。'));
      return;
    }
    rows.forEach(d => {
      const st = STATUS[d.status] || STATUS.pending;
      const card = el('article','card');
      card.style.marginBottom = '12px';
      const ask = el('div','ask');
      const meta = el('div','meta');
      meta.appendChild(el('span','stamp '+st.cls, st.label));
      if(d.kind) meta.appendChild(el('span','kind', d.kind));
      if(d.received) meta.appendChild(el('span', null, d.received + ' 受付'));
      ask.appendChild(meta);
      ask.appendChild(el('div','text', d.request || ''));
      card.appendChild(ask);
      const r = el('div','reply');
      r.appendChild(el('div','who', 'Claude からのフィードバック' + (d.reviewed ? '（' + d.reviewed + '）' : '')));
      r.appendChild(el('div','text', d.feedback || '確認中です。判定が出たらここに理由を書きます。'));
      if(d.safety) r.appendChild(el('div','sub', '安全チェック: ' + d.safety));
      if(d.ref) r.appendChild(el('div','sub', '反映先: ' + d.ref));
      card.appendChild(r);
      list.appendChild(card);
    });
  }

  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f;
    document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  render();
})();
</script>
</body>
</html>
