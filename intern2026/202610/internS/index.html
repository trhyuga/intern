<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>G1 PREDICTOR — 年間G1予想ゲーム</title>
<style>
  :root{
    --bg:#0f1a14; --panel:#16251c; --line:#2c4a38; --ink:#eef5ee; --soft:#9fb8a7;
    --gold:#f2c94c; --red:#e2574c; --turf:#2f8f4e; --paper:#f4efe1; --paper-ink:#222;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",system-ui,sans-serif;
    display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:520px; min-height:100%; display:flex; flex-direction:column; }
  header.bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; background:#0a120d; border-bottom:1px solid var(--line); font-size:14px;
  }
  header.bar .money{ color:var(--gold); font-weight:800; font-size:16px; }
  main{ flex:1; padding:16px; }
  .screen{ display:none; }
  .screen.on{ display:block; }
  h1{ font-size:30px; letter-spacing:.05em; }
  h2{ font-size:20px; margin-bottom:10px; }
  .sub{ color:var(--soft); font-size:13px; }
  .btn{
    display:block; width:100%; margin-top:12px; padding:14px; border:0; border-radius:12px;
    font-size:16px; font-weight:800; color:#10170f; background:var(--gold); cursor:pointer;
  }
  .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .row{ display:flex; gap:8px; }
  .row .btn{ margin-top:8px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; }

  /* タイトル */
  .title-wrap{ text-align:center; padding:48px 0 24px; }
  .title-wrap .badge{ display:inline-block; color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:4px 14px; font-size:12px; letter-spacing:.15em; margin-bottom:16px; }

  /* 競馬新聞 */
  .paper{ background:var(--paper); color:var(--paper-ink); border-radius:6px; padding:8px 6px; font-size:12px; overflow-x:auto; }
  .paper .head{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:2px 10px; border-bottom:3px double #333; padding-bottom:6px; margin-bottom:6px; }
  .paper .head span{ font-size:11px; color:#444; }
  .paper .head b{ font-size:18px; }
  .paper table{ width:100%; border-collapse:collapse; white-space:nowrap; }
  .paper th,.paper td{ border-bottom:1px solid #c9c1aa; padding:5px 2px; text-align:center; }
  .paper th{ font-size:10px; font-weight:700; color:#555; }
  /* 予想印の3列は細く詰める */
  .paper th.rp{ font-size:8.5px; line-height:1.15; padding:3px 0; width:2.1em; }
  .paper td.mark{ padding:5px 0; width:1.9em; }
  .paper td.odds{ font-weight:800; font-variant-numeric:tabular-nums; }
  @media (max-width:370px){ .paper{ font-size:11px; } .paper td.name{ letter-spacing:-.03em; } }
  .paper td.name{ text-align:left; font-weight:800; }
  .waku{ display:inline-block; width:20px; height:20px; line-height:20px; border-radius:3px; font-weight:800; border:1px solid #333; }
  .mark{ font-weight:800; color:#c0392b; }

  /* パドック */
  .paddock{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pd{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:13px; }
  .pd .nm{ font-weight:800; margin:4px 0; }
  .pd canvas{ width:100%; height:auto; display:block; background:#1d3326; border-radius:6px; }

  /* 馬券 */
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--ink); font-weight:800; cursor:pointer; }
  .seg button.on{ background:var(--gold); color:#111; border-color:var(--gold); }
  .picks{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .picks button{ padding:8px 2px; border-radius:8px; border:2px solid transparent; font-weight:800; cursor:pointer; font-size:12px; }
  .picks button.on{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); }
  .amt{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .amt button{ flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  ul.tickets{ list-style:none; font-size:14px; }
  ul.tickets li{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); }
  ul.tickets li button{ background:none; border:0; color:var(--red); cursor:pointer; }

  /* レース */
  #raceWrap{ position:relative; }
  #raceCv{ width:100%; height:auto; display:block; border-radius:10px; background:#000; }
  #phaseCard{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:40px; font-weight:900; letter-spacing:.2em; color:#fff; text-shadow:0 0 18px #000;
    background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .25s; border-radius:10px;
  }
  #phaseCard.on{ opacity:1; }

  /* タイトルのアニメーション */
  #titleCv{ width:100%; height:auto; display:block; border-radius:12px; margin:18px 0 6px; background:#000; }
  .title-wrap h1{ font-size:40px; background:linear-gradient(90deg,#fff3c4,var(--gold),#ffb347); -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 3s ease-in-out infinite; }
  @keyframes shine{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.35);} }

  /* 発走前のG1紹介 */
  #introCard{
    position:absolute; inset:0; border-radius:10px; display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:8px; padding:18px; text-align:center; background:linear-gradient(160deg,rgba(10,20,14,.92),rgba(40,30,8,.92));
    opacity:0; pointer-events:none; transition:opacity .35s;
  }
  #introCard.on{ opacity:1; }
  #introCard .ic-month{ color:var(--gold); font-size:13px; letter-spacing:.2em; }
  #introCard .ic-name{ font-size:30px; font-weight:900; letter-spacing:.05em; animation:pop .6s ease-out; }
  #introCard .ic-cond{ font-size:13px; color:var(--soft); }
  #introCard .ic-desc{ font-size:14px; line-height:1.6; max-width:34em; }
  @keyframes pop{ from{ transform:scale(.7); opacity:0; } to{ transform:none; opacity:1; } }

  /* 的中演出 */
  #celebrate{ position:fixed; inset:0; pointer-events:none; z-index:50; display:none; }
  #celebrate.on{ display:block; }
  #celebrate canvas{ position:absolute; inset:0; width:100%; height:100%; }
  #celebrate .msg{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); text-align:center;
    font-weight:900; color:var(--gold); text-shadow:0 0 18px rgba(0,0,0,.8), 0 0 4px #000; animation:hit 2.6s ease-out forwards;
  }
  #celebrate .msg b{ display:block; font-size:56px; letter-spacing:.1em; }
  #celebrate .msg span{ font-size:22px; color:#fff; }
  @keyframes hit{ 0%{ transform:translate(-50%,-50%) scale(.4); opacity:0; } 15%{ transform:translate(-50%,-50%) scale(1.15); opacity:1; }
    25%{ transform:translate(-50%,-50%) scale(1); } 80%{ opacity:1; } 100%{ opacity:0; } }

  /* エンディングロール */
  #rollView{ position:relative; height:70vh; overflow:hidden; border-radius:12px; background:#000; border:1px solid var(--line); }
  #rollBody{ position:absolute; left:0; right:0; top:100%; text-align:center; padding:0 16px 40px; }
  /* 年間成績（あとから見返す） */
  .rec-list{ display:flex; flex-direction:column; gap:8px; }
  .rec-list button{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; font-size:14px; cursor:pointer; text-align:left; }
  .rec-list button .tag{ font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  .rec-list .t-clear{ color:var(--gold); } .rec-list .t-over{ color:#f08a80; } .rec-list .t-live{ color:#7fd0a0; }
  #recDetail{ max-height:62vh; overflow-y:auto; border-radius:12px; background:#000; border:1px solid var(--line); text-align:center; padding:0 14px 24px; }
  /* 節目のおっちゃんとトロフィー */
  #ojisan{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); padding:16px; }
  #ojisan.on{ display:flex; }
  #ojisan .card{ width:100%; max-width:360px; background:var(--panel); border:2px solid var(--gold); border-radius:16px; padding:16px; text-align:center; animation:pop .45s ease-out; }
  #ojisan canvas{ width:170px; height:auto; display:block; margin:0 auto; }
  #ojisan .bubble{ position:relative; background:#fff; color:#222; border-radius:12px; padding:10px 12px; margin:6px 0 10px; font-weight:700; line-height:1.6; text-align:left; }
  #ojisan .bubble::before{ content:""; position:absolute; top:-10px; left:50%; margin-left:-10px; border:10px solid transparent; border-top:0; border-bottom-color:#fff; }
  #ojisan .tro{ font-size:13px; color:var(--soft); }
  .trophies{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .trophy{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:800; padding:2px 10px 2px 4px; border-radius:999px; color:#111; }
  .trophy i{ display:inline-block; width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 2px rgba(0,0,0,.25); }
  .trophy.none{ background:transparent; color:var(--soft); border:1px dashed var(--line); }
  /* 大的中の金色のフラッシュ */
  #celebrate.big::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 40%, rgba(255,215,90,.55), rgba(255,215,90,0) 60%); animation:flash 1.2s ease-out 2; }
  @keyframes flash{ 0%{ opacity:0; } 20%{ opacity:1; } 100%{ opacity:0; } }
  #celebrate.big .msg{ animation-duration:4.4s; }
  #celebrate.big .msg b{ font-size:52px; white-space:nowrap; letter-spacing:.04em; text-shadow:none; background:linear-gradient(90deg,#fff3c4,#f2c94c,#ff9f43,#f2c94c); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 10px rgba(0,0,0,.85)) drop-shadow(0 0 2px #000); }
  .report h3{ color:var(--gold); font-size:13px; letter-spacing:.25em; margin:34px 0 10px; }
  .report .big{ font-size:30px; font-weight:900; letter-spacing:.05em; }
  .report .r{ display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:3px 0; border-bottom:1px dashed #223; text-align:left; }
  .report .r span:last-child{ white-space:nowrap; font-variant-numeric:tabular-nums; }
  .report .plus{ color:var(--gold); } .report .minus{ color:var(--soft); }
  .report .fin{ font-size:28px; font-weight:900; color:var(--gold); margin-top:60px; letter-spacing:.2em; }
  @media (prefers-reduced-motion: reduce){ #celebrate .msg{ animation:none; } #introCard .ic-name{ animation:none; } }
  #commentary{
    margin-top:10px; height:170px; overflow:hidden; background:#000; border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; font-size:14px; line-height:1.6; display:flex; flex-direction:column; justify-content:flex-end;
  }
  #commentary p{ animation:fadein .3s; }
  #commentary p.big{ color:var(--gold); font-weight:800; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }

  /* 結果 */
  .podium{ display:flex; flex-direction:column; gap:6px; }
  .podium div{ display:flex; gap:10px; align-items:center; padding:10px; border-radius:10px; background:var(--panel); font-size:16px; }
  .podium .pos{ font-size:22px; font-weight:900; color:var(--gold); width:46px; }
  .win{ color:var(--gold); font-weight:800; }
  .lose{ color:var(--soft); }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <span id="hdrRace">G1 PREDICTOR</span>
    <span style="display:flex;align-items:center;gap:10px">
      <button id="btnSound" type="button" aria-label="効果音のオン・オフ" style="background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer">音 ON</button>
      <span class="money" id="hdrMoney"></span>
    </span>
  </header>
  <main>
    <!-- タイトル -->
    <section class="screen" id="sc-title">
      <div class="title-wrap">
        <div class="badge">ANNUAL G1 SERIES</div>
        <h1>G1 PREDICTOR</h1>
        <p class="sub" style="margin-top:8px">年間のG1をすべて予想して、元手を増やせ。</p>
        <canvas id="titleCv" width="480" height="190"></canvas>
      </div>
      <div class="panel sub" id="titleInfo"></div>
      <button class="btn" id="btnContinue">つづきから</button>
      <button class="btn ghost" id="btnNew">はじめから</button>
      <button class="btn ghost" id="btnRecords">年間成績を見る</button>
    </section>

    <!-- 競馬新聞 -->
    <section class="screen" id="sc-paper">
      <div class="paper" id="paper"></div>
      <div class="row">
        <button class="btn ghost" id="btnToPaddock">パドックを見る</button>
        <button class="btn" id="btnToBetFromPaper">馬券を買う</button>
      </div>
    </section>

    <!-- パドック -->
    <section class="screen" id="sc-paddock">
      <h2>パドック</h2>
      <p class="sub" style="margin-bottom:10px">馬の気配を見て、調子を見極めよう。</p>
      <div class="paddock" id="paddock"></div>
      <div class="row">
        <button class="btn ghost" id="btnBackPaper">新聞に戻る</button>
        <button class="btn" id="btnToBet">馬券を買う</button>
      </div>
    </section>

    <!-- 馬券 -->
    <section class="screen" id="sc-bet">
      <h2>馬券購入</h2>
      <div class="seg" id="betType">
        <button data-t="win" class="on">単勝</button>
        <button data-t="place">複勝</button>
        <button data-t="quin">馬連</button>
        <button data-t="trio">3連複</button>
        <button data-t="tri">3連単</button>
      </div>
      <p class="sub" id="betHint" style="margin-top:8px"></p>
      <div class="picks" id="picks"></div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between"><span>金額</span><b id="amtView">0円</b></div>
        <div class="amt" id="amtBtns">
          <button data-a="100">+100</button><button data-a="1000">+1,000</button>
          <button data-a="10000">+1万</button><button data-a="0">クリア</button>
        </div>
        <p class="sub" id="oddsView" style="margin-top:8px"></p>
        <button class="btn ghost" id="btnAddTicket">この馬券を追加</button>
      </div>
      <div class="panel">
        <ul class="tickets" id="tickets"></ul>
        <p class="sub" id="ticketSum" style="margin-top:6px"></p>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnBetBack">新聞に戻る</button>
        <button class="btn" id="btnStartRace">発走！</button>
      </div>
    </section>

    <!-- レース -->
    <section class="screen" id="sc-race">
      <div id="raceWrap">
        <canvas id="raceCv" width="480" height="400"></canvas>
        <div id="phaseCard"></div>
        <div id="introCard"></div>
      </div>
      <div id="commentary"></div>
      <button class="btn ghost" id="btnSkip">結果まで飛ばす</button>
    </section>

    <!-- 結果 -->
    <section class="screen" id="sc-result">
      <h2 id="resTitle">確定</h2>
      <div class="podium" id="podium"></div>
      <div class="panel" id="payout"></div>
      <button class="btn" id="btnNext">次のレースへ</button>
    </section>

    <!-- 年間成績（これまでの全シーズン） -->
    <section class="screen" id="sc-records">
      <h2>年間成績</h2>
      <p class="sub" style="margin-bottom:10px">これまでのシーズンの結果をいつでも見返せます。</p>
      <div class="trophies" id="recTrophies" style="margin-bottom:12px"></div>
      <div class="rec-list" id="recList"></div>
      <div id="recDetail" class="report" style="display:none"></div>
      <button class="btn ghost" id="btnRecBack">タイトルへ</button>
    </section>

    <!-- エンディングロール（年間の結果発表） -->
    <section class="screen" id="sc-credits">
      <div id="rollView"><div id="rollBody" class="report"></div></div>
      <button class="btn ghost" id="btnRollSkip">結果発表を飛ばす</button>
    </section>

    <!-- ゲームオーバー / クリア -->
    <section class="screen" id="sc-end">
      <div class="title-wrap">
        <h1 id="endTitle"></h1>
        <p class="sub" id="endText" style="margin-top:12px"></p>
      </div>
      <button class="btn" id="btnEndMain"></button>
      <button class="btn ghost" id="btnEndTitle">タイトルへ</button>
    </section>
  </main>
</div>
<div id="celebrate"><canvas id="confetti"></canvas><div class="msg" id="celebrateMsg"></div></div>
<div id="ojisan" role="dialog" aria-label="節目のお祝い">
  <div class="card">
    <canvas id="ojisanCv" width="170" height="170"></canvas>
    <div class="bubble" id="ojisanMsg"></div>
    <div class="tro" id="ojisanTro"></div>
    <button class="btn" id="btnOjisan">ありがとう！</button>
  </div>
</div>

<script>
'use strict';
/* =========================================================================
   G1 PREDICTOR — 初期設定版（雛形）
   画面: タイトル → 競馬新聞 → パドック → 馬券 → レース(序盤/中盤/ラストスパート) → 結果
   ※ レース名・馬名はすべて架空です。
   ========================================================================= */

// ---------- 設定値（バランス調整はここ） ----------
const CONFIG = {
  START_MONEY: 10000,      // 元手
  MIN_BET: 100,            // 最低購入単位
  FIELD: 8,                // 頭数
  TAKEOUT_WIN: 0.20,       // 単勝の控除率（仮の値）
  TAKEOUT_QUIN: 0.225,     // 馬連の控除率（仮の値）
  TAKEOUT_PLACE: 0.2,      // 複勝の控除率（仮の値）
  TAKEOUT_TRI: 0.275,      // 3連単の控除率（仮の値）
  TAKEOUT_TRIO: 0.25,      // 3連複の控除率（仮の値）
  ODDS_SIMS: 400,          // オッズ算出用のシミュレーション回数
  RACE_SECONDS: 36,        // レース演出の長さ(秒)
  SAVE_KEY: 'internS_g1predictor_save_v1',
};

// ---------- 年間G1カレンダー（JRA平地G1・2026年の日程順） ----------
// 2026年の開催日程をJRA等の公開情報で確認して並べた。年によって日程・競馬場が変わるので、年が変わったら確認すること。
// mareOnly: 牝馬限定戦。2歳戦・3歳戦の年齢制限は「時代を超えた夢のレース」として無視している。
const CALENDAR = [
  { name:'フェブラリーステークス', month:2,  venue:'東京', surface:'ダート', dist:1600, desc:'一年で最初のG1。東京ダート1600mで争うダートマイル王決定戦。' },
  { name:'高松宮記念',           month:3,  venue:'中京', surface:'芝', dist:1200, desc:'春のスプリント王決定戦。中京芝1200m、一瞬のスピードが勝負を分ける。' },
  { name:'大阪杯',               month:4,  venue:'阪神', surface:'芝', dist:2000, desc:'春の中距離王決定戦。2017年にG1へ昇格した阪神芝2000mの一戦。' },
  { name:'桜花賞',               month:4,  venue:'阪神', surface:'芝', dist:1600, mareOnly:true, desc:'牝馬クラシックの第一冠。満開の桜の下、阪神芝1600mで女王を決める。' },
  { name:'皐月賞',               month:4,  venue:'中山', surface:'芝', dist:2000, desc:'クラシック三冠の第一冠。「最も速い馬が勝つ」と言われる中山芝2000m。' },
  { name:'天皇賞（春）',         month:5,  venue:'京都', surface:'芝', dist:3200, desc:'平地G1で最も長い京都芝3200m。スタミナが試される伝統の盾。' },
  { name:'NHKマイルカップ',      month:5,  venue:'東京', surface:'芝', dist:1600, desc:'3歳マイル王決定戦。東京芝1600mでスピード自慢がぶつかる。' },
  { name:'ヴィクトリアマイル',   month:5,  venue:'東京', surface:'芝', dist:1600, mareOnly:true, desc:'牝馬のマイル女王決定戦。東京芝1600m、直線の長い舞台での叩き合い。' },

// ---------- 乱数（シード付き：同じレースは同じ出走表になる） ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(rnd){ let u=0,v=0; while(u===0)u=rnd(); while(v===0)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const pick = (rnd, arr) => arr[Math.floor(rnd()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// ---------- 出走表生成 ----------
// レースの条件（芝/ダート・距離・牝馬限定）に合う名馬ほど選ばれやすい。年ごとに顔ぶれが変わる。
function fitScore(h, race){
  let s = 0;
  if(h.surface !== race.surface) s -= 60;
  s -= Math.abs(race.dist - h.bestDist) / 70;  // 距離が合わない馬も時々出走する
  s += (h.speed + h.stamina * race.dist/3200 + h.kick) / 6;
  return s;
}
function makeField(year, idx){
  const race = CALENDAR[idx];
  const rnd = mulberry32(year*1000 + idx*37 + 11);
  const pool = LEGENDS.filter(h => !race.mareOnly || h.sex === '牝')
    .map(h => ({ h, s: fitScore(h, race) + gauss(rnd)*11 }))
    .sort((a,b) => b.s - a.s)
    .slice(0, CONFIG.FIELD);
  // 枠順はランダム
  for(let i=pool.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
  const horses = pool.map(({h}, i) => ({
    no: i+1,
    name: h.name, sex: h.sex, surface: h.surface, style: h.style, bestDist: h.bestDist,
    speed: h.speed, stamina: h.stamina, kick: h.kick,
    cond: clamp(gauss(rnd)*0.45, -1, 1),  // 当日の調子（隠し値。パドックでヒント）
    coat: h.coat || pick(rnd, RANDOM_COATS),
    lastRun: 0,
  }));
  // 前走着順（能力から作るそれっぽい数字）
  horses.forEach(h => {
    const r = rating(h, race.dist, race.surface);
    h.lastRun = clamp(Math.round(8 - (r-88)/4.5 + gauss(rnd)*2), 1, 12);
  });
  return { race, horses, rnd };
}

// 新聞記者から見える「強さ」の目安（調子は含まない）
function rating(h, dist, surface){
  const apt = 1 - Math.min(1, Math.abs(dist - h.bestDist)/1400);
  const stamW = dist/3200;
  const surf = (surface && h.surface && surface !== h.surface) ? -15 : 0;
  return h.speed*0.45 + h.stamina*0.35*stamW + h.kick*0.3 + apt*25 + surf;
}

// ---------- レースシミュレーション ----------
// 1回分のレースを最後まで計算し、着順と各ステップの位置を返す。
// record=true のときだけ演出用のフレームと実況イベントを記録する。
const DT = 0.25; // 秒
const RUNOUT_SEC = 6; // 全頭ゴール後に走り続ける時間（演出用）
// 能力差と運のバランス（大きいほどその要素が効く）
const SIM = { SPEED_W:0.008, KICK_W:0.006, STAM_W:0.02, APT_W:0.3, COND_W:0.22, LUCK:0.2, SURF_W:0.35,
  // 脚質: 序盤(〜30%)の加速と、直線(75%〜)の伸び
  EARLY: { '逃げ':0.3, '先行':0.12, '差し':-0.06, '追込':-0.18 },
  LATE:  { '逃げ':-0.02, '先行':0.12, '差し':0.33, '追込':0.5 },
  LATE_LUCK: 0.45, // 直線での運（大きいほど逆転が起きやすい）
  FADE: 0.6,       // 序盤に前に行った馬が直線で失速する度合い
  LATE_START: 0.75,
  PACK: 0.33,
  RAMP0: 0.35,
  CHASE: 0.05, CHASE_MAX: 0.6,  // 直線で前との差1mあたりの伸び、上限     // 直線入口での伸びの割合（小さいほど伸びがゴール前に集中する）      // 直線までは差がつきにくい（1=そのまま、小さいほど馬群が固まる）
  // ペース: 出現率 [スロー, 平均]（残りがハイ）と、それぞれの効き方
  PACE_P: [0.3, 0.4],
  PACE: { slow: { early:0.7, fade:0.5, late:0.8 }, avg: { early:1, fade:1, late:1 }, high: { early:1.5, fade:1.6, late:1.25 } },
  OONIGE_P: 0.35, OONIGE_V: 0.6, OONIGE_FADE: 1.7,  // 大逃げ: 逃げ馬がこの確率で選ぶ
  MAKURI_P: 0.18, MAKURI_V: 0.7, MAKURI_COST: 0.5, MAKURI_FROM: 0.5,
  // レース中のハプニング（1頭あたりの確率）。パドックでイレ込んでいた馬は出遅れ・暴れが2倍起きやすい
  EV_DEOKURE_P: 0.03,                    // 出遅れ: スタートで少し動けない
  EV_ABARE_P: 0.03, EV_ABARE_V: 1.1,     // 暴れる（掛かる）: 中盤でしばらく速度が落ちる
  EV_FURUI_P: 0.03, EV_FURUI_V: 0.9 };   // 奮い立つ: 終盤でしばらく速度が上がる // まくり: 差し・追込がこの確率で選ぶ     // 直線までは差がつきにくい（1=そのまま、小さいほど馬群が固まる）
function simulate(field, rnd, opts){
  const { race, horses } = field;
  const D = race.dist;
  const useCond = opts.useCond;
  const record = opts.record;
  const n = horses.length;
  const pos = new Array(n).fill(0);
  const fin = new Array(n).fill(-1);
  const luck = horses.map(() => gauss(rnd)*SIM.LUCK); // そのレースだけの運
  const lateLuck = horses.map(() => gauss(rnd)*SIM.LATE_LUCK); // 直線での伸びの運
  // レース展開: ペース（スロー／平均／ハイ）と、各馬の作戦（大逃げ・まくり）
  const pr = rnd();
  const pace = pr < SIM.PACE_P[0] ? 'slow' : pr < SIM.PACE_P[0] + SIM.PACE_P[1] ? 'avg' : 'high';
  const P = SIM.PACE[pace];
  const plan = horses.map(h => ({
    oonige: h.style === '逃げ' && rnd() < SIM.OONIGE_P,
    makuri: (h.style === '差し' || h.style === '追込') && rnd() < SIM.MAKURI_P,
  }));
  // ハプニング（出遅れ・暴れる・奮い立つ）
  const ev = horses.map(h => {
    const tense = useCond && h.cond < -0.3 ? 2 : 1;   // 調子が悪い（イレ込んでいる）馬ほど起きやすい
    const o = {};
    if(rnd() < SIM.EV_DEOKURE_P * tense) o.deokure = 0.15 + rnd() * 0.2;            // 何秒出遅れるか（短めに: 要望で0.35〜0.75秒→0.15〜0.35秒）
    if(rnd() < SIM.EV_ABARE_P * tense){ const a = 0.22 + rnd() * 0.4; o.abare = [a, a + 0.07]; }
    if(rnd() < SIM.EV_FURUI_P){ const a = 0.7 + rnd() * 0.15; o.furui = [a, a + 0.12]; }
    return o;
  });
  const events = [];   // 演出用: { type, i, from, to }（フレーム番号）
  const evOn = {};
  const frames = [];
  let t = 0, done = 0, lastFin = 0;
  const order = [];
  const finFrame = new Array(n).fill(-1);
  const finT = new Array(n).fill(Infinity);
  const lastV = new Array(n).fill(16);
  const base = 16.4 + 80*SIM.SPEED_W;
  // 演出用(record)のときは、全頭ゴールしたあとも少し走らせて「駆け抜け」を描く
  while((done < n || (record && t < lastFin + RUNOUT_SEC)) && t < 600){
    const leadPos = Math.max(...pos);
    for(let i=0;i<n;i++){
      if(fin[i] >= 0){
        if(record){ lastV[i] *= 0.985; pos[i] += lastV[i] * DT; }
        continue;
      }
      const h = horses[i];
      const f = pos[i]/D;
      // 出遅れ: ゲートが開いても少しの間動けない
      if(ev[i].deokure && t < ev[i].deokure){
        if(record && !evOn['d'+i]){ evOn['d'+i] = { type:'deokure', i, from: frames.length, to: frames.length + Math.round(ev[i].deokure/DT) }; events.push(evOn['d'+i]); }
        continue;
      }
      // その馬の地力（能力・運・距離・馬場・スタミナ）
      let v = 16.4 + h.speed*SIM.SPEED_W + luck[i];
      if(f > 0.55){
        const need = (D/2000) * 75;
        v -= Math.max(0, need - h.stamina) * SIM.STAM_W * (f-0.55)/0.45;
      }
      v -= Math.abs(D - h.bestDist)/1000 * SIM.APT_W;
      if(h.surface && h.surface !== race.surface) v -= SIM.SURF_W;
      v += gauss(rnd) * 0.35;
      // 直線に入るまでは馬群が固まって進む
      if(f < SIM.LATE_START) v = base + (v - base) * SIM.PACK;
      // ---- 脚質と展開（ここは馬群に固められない＝位置取りの差になる）----
      const early = SIM.EARLY[h.style], late = SIM.LATE[h.style];
      if(f < 0.3) v += early * P.early;
      if(plan[i].oonige && f < SIM.LATE_START) v += SIM.OONIGE_V;                        // 大逃げ: 後続を大きく離す
      if(plan[i].makuri && f >= SIM.MAKURI_FROM && f < SIM.LATE_START) v += SIM.MAKURI_V; // まくり: 3〜4コーナーで一気に進出
      if(f >= SIM.LATE_START){
        const k = (f - SIM.LATE_START) / (1 - SIM.LATE_START); // 直線の進み具合 0→1
        const ramp = SIM.RAMP0 + (1 - SIM.RAMP0) * 3 * k*k;      // 直線は後半ほど伸びる（ゴール前の逆転）
        v += (late * (h.kick/75) * P.late + lateLuck[i]) * ramp + (h.kick-70)*SIM.KICK_W;
        v -= Math.max(0, early) * SIM.FADE * P.fade * k*k * 2.25; // 前で飛ばした馬はゴール前で急に脚が上がる
        if(plan[i].oonige) v -= SIM.OONIGE_FADE * k*k * 1.5;
        if(plan[i].makuri) v -= SIM.MAKURI_COST;
        // 追う馬は前を目標に伸びる（直線で差が詰まり、ゴール前が接戦になりやすい）
        v += Math.min(SIM.CHASE_MAX, (leadPos - pos[i]) * SIM.CHASE);
      }
      // 当日の調子（パドックでヒントが出る）
      if(useCond) v += h.cond * SIM.COND_W;
      // ハプニング: 暴れる（掛かる）／奮い立つ
      for(const [key, sign, vv] of [['abare', -1, SIM.EV_ABARE_V], ['furui', 1, SIM.EV_FURUI_V]]){
        const w = ev[i][key];
        if(w && f >= w[0] && f < w[1]){
          v += sign * vv;
          if(record){
            if(!evOn[key+i]){ evOn[key+i] = { type:key, i, from: frames.length, to: frames.length }; events.push(evOn[key+i]); }
            evOn[key+i].to = frames.length;
          }
        }
      }
      lastV[i] = Math.max(10, v);
      const prev = pos[i];
      pos[i] += lastV[i] * DT;
      if(pos[i] >= D){
        fin[i] = t; finFrame[i] = frames.length; done++; lastFin = t;
        finT[i] = t + (D - prev) / lastV[i];   // ゴールした正確な時刻（同じコマ内の着順もこれで決める）
        order.push(i);
      }
    }
    if(record) frames.push(pos.slice());
    t += DT;
  }
  order.sort((a,b) => finT[a] - finT[b]);
  return { order, frames, D, finFrame, finT, pace, plan, lastV, events };
}

// ---------- オッズ ----------
function computeOdds(field){
  const n = field.horses.length;
  const rnd = mulberry32(Math.floor(Math.random()*1e9));
  const winC = new Array(n).fill(0);
  const placeC = new Array(n).fill(0);
  const quinC = {};
  // 世間（オッズ）は調子を知らない → useCond:false
  for(let s=0;s<CONFIG.ODDS_SIMS;s++){
    const { order } = simulate(field, rnd, { useCond:false, record:false });
    winC[order[0]]++;
    for(let r=0;r<3;r++) placeC[order[r]]++;   // 複勝: 3着以内
    const k = quinKey(order[0]+1, order[1]+1);
    quinC[k] = (quinC[k]||0) + 1;
  }
  const S = CONFIG.ODDS_SIMS;
  const win = winC.map(c => toOdds((c+0.5)/(S+n*0.5), CONFIG.TAKEOUT_WIN));
  const quin = {};
  for(let a=1;a<=n;a++) for(let b=a+1;b<=n;b++){
    const k = quinKey(a,b);
    quin[k] = toOdds(((quinC[k]||0)+0.3)/(S+0.3*n*(n-1)/2), CONFIG.TAKEOUT_QUIN);
  }
  // 複勝のオッズ（3着以内に入る確率から。単勝と同じく控除率を引く）
  const place = placeC.map(c => toOdds((c+0.5)/(S+n*0.5), CONFIG.TAKEOUT_PLACE));
  // 3連単のオッズ: 組み合わせが336通りあり走らせた回数では足りないので、
  // 各馬の勝つ確率から「1着の馬を除いた中で2着、さらに除いた中で3着」と順に掛けて確率を見積もる
  // 2着・3着は実力差が出にくいので、確率を少しならして（べき乗して）使う
  const pw = winC.map(c => (c+0.5)/(S+n*0.5));
  const flat = e => { const q = pw.map(x => Math.pow(x, e)); const sum = q.reduce((a,b)=>a+b,0); return q.map(x => x/sum); };
  const pw2 = flat(SIM_TRI.E2), pw3 = flat(SIM_TRI.E3);
  const tri = {}, trioP = {};
  for(let a=0;a<n;a++) for(let b=0;b<n;b++) for(let c=0;c<n;c++){
    if(a===b || b===c || a===c) continue;
    const p = pw[a] * pw2[b]/(1-pw2[a]) * pw3[c]/(1-pw3[a]-pw3[b]);
    tri[triKey(a+1,b+1,c+1)] = Math.min(99999, toOdds(p / SIM_TRI.CAL, CONFIG.TAKEOUT_TRI));
    // 3連複: 同じ3頭の6通りの着順の確率を合計
    const kk = trioKey(a+1,b+1,c+1);
    trioP[kk] = (trioP[kk] || 0) + p;
  }
  const trio = {};
  Object.keys(trioP).forEach(k => trio[k] = Math.min(99999, toOdds(trioP[k] / SIM_TRI.CAL_TRIO, CONFIG.TAKEOUT_TRIO)));
  return { win, quin, place, tri, trio };
}
function toOdds(p, takeout){ return Math.max(1.1, Math.floor((1-takeout)/p*10)/10); }
// 3連単オッズの見積もりの調整（E2/E3: 2着・3着の確率のならし具合、CAL: 全体の配当水準の補正）
const SIM_TRI = { E2: 0.81, E3: 0.65, CAL: 1, CAL_TRIO: 1 };
function trioKey(a,b,c){ return [a,b,c].sort((x,y)=>x-y).join('-'); }
function triKey(a,b,c){ return `${a}-${b}-${c}`; }
// 馬券が当たったか（o = 着順の馬番の配列）
function ticketHit(t, o){
  if(t.type === 'win') return t.sel[0] === o[0];
  if(t.type === 'place') return o.slice(0,3).includes(t.sel[0]);
  if(t.type === 'tri') return t.sel[0] === o[0] && t.sel[1] === o[1] && t.sel[2] === o[2];
  if(t.type === 'trio') return trioKey(t.sel[0], t.sel[1], t.sel[2]) === trioKey(o[0], o[1], o[2]);
  return quinKey(t.sel[0], t.sel[1]) === quinKey(o[0], o[1]);
}
function quinKey(a,b){ return a<b ? a+'-'+b : b+'-'+a; }

// ---------- 新聞の印・パドック ----------
const MARKS = ['◎','○','▲','△','△'];
const REPORTERS = ['本紙','記者A','記者B'];
function makeMarks(field){
  const rnd = field.rnd;
  return REPORTERS.map((_, ri) => {
    const sc = field.horses.map((h,i) => ({ i, s: rating(h, field.race.dist, field.race.surface) + gauss(rnd)*(6+ri*3) }));
    sc.sort((a,b) => b.s - a.s);
    const m = new Array(field.horses.length).fill('');
    sc.slice(0, MARKS.length).forEach((x,k) => m[x.i] = MARKS[k]);
    return m;
  });
}
function aptMark(h, dist){
  const d = Math.abs(dist - h.bestDist);
  return d <= 100 ? '◎' : d <= 400 ? '○' : d <= 800 ? '△' : '×';
}
// パドックの気配。text=コメント、look=パドックでの見た目（drawHorse の opts.look）
// 調子(cond)は隠し値で、コメントと見た目は少しブレたヒントになる
function paddockComment(h, rnd){
  const c = h.cond + gauss(rnd)*0.25; // ヒントは少しブレる
  if(c > 0.5)  return pick(rnd, [{ text:'毛ヅヤ抜群、気合い十分', look:'shine' }, { text:'踏み込み力強い。絶好調', look:'power' }, { text:'周回のたびに良く見せる', look:'shine' }]);
  if(c > 0.15) return pick(rnd, [{ text:'落ち着いて好気配', look:'calm' }, { text:'馬体の張り良好', look:'shine' }, { text:'リズム良く歩けている', look:'calm' }]);
  if(c > -0.15)return pick(rnd, [{ text:'平行線。可もなく不可もなく', look:'normal' }, { text:'いつも通りの気配', look:'normal' }, { text:'やや地味に映る', look:'plain' }]);
  if(c > -0.5) return pick(rnd, [{ text:'少しイレ込み気味', look:'nervous' }, { text:'やや太め残りか', look:'heavy' }, { text:'発汗が目立つ', look:'sweat' }]);
  return pick(rnd, [{ text:'テンションが高すぎる', look:'hot' }, { text:'覇気がない。割引必要', look:'dull' }, { text:'歩様に硬さが残る', look:'stiff' }]);
}

function drawOjisan(g, t){
  const W = 170, H = 170;
  g.clearRect(0,0,W,H);
  const bob = Math.sin(t*6)*2, wave = Math.sin(t*9)*0.5;
  // 背景の後光
  const gl = g.createRadialGradient(85, 80, 10, 85, 80, 85);
  gl.addColorStop(0, 'rgba(255,215,90,.55)'); gl.addColorStop(1, 'rgba(255,215,90,0)');
  g.fillStyle = gl; g.fillRect(0,0,W,H);
  g.save(); g.translate(0, bob);
  // 体（チョッキ）
  g.fillStyle = '#e9e3d4'; g.beginPath(); g.ellipse(85, 168, 58, 44, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#3d5a8a'; g.beginPath(); g.moveTo(40,170); g.lineTo(62,128); g.lineTo(78,170); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(130,170); g.lineTo(108,128); g.lineTo(92,170); g.closePath(); g.fill();
  // 手を振る腕と、競馬新聞
  g.save(); g.translate(132, 128); g.rotate(-0.9 + wave);
  g.fillStyle = '#e9e3d4'; g.fillRect(-6, -42, 12, 44);
  g.fillStyle = '#f0c9a0'; g.beginPath(); g.arc(0, -46, 8, 0, Math.PI*2); g.fill();
  g.restore();
  g.save(); g.translate(30, 140); g.rotate(-0.2);
  g.fillStyle = '#f4efe1'; g.fillRect(-16, -22, 30, 36); g.strokeStyle = '#999'; g.strokeRect(-16, -22, 30, 36);
  g.fillStyle = '#c0392b'; g.fillRect(-12, -18, 22, 4); g.fillStyle = '#555'; for(let k=0;k<4;k++) g.fillRect(-12, -10 + k*5, 22, 2);
  g.restore();
  // 顔
  g.fillStyle = '#f0c9a0'; g.beginPath(); g.ellipse(85, 78, 40, 44, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(46, 82, 7, 10, 0, 0, Math.PI*2); g.ellipse(124, 82, 7, 10, 0, 0, Math.PI*2); g.fill();
  // 鉢巻き
  g.fillStyle = '#d63031'; g.fillRect(45, 46, 80, 11);
  g.beginPath(); g.moveTo(125, 50); g.lineTo(142, 42 + wave*4); g.lineTo(140, 56 + wave*4); g.closePath(); g.fill();
  // 耳にかけた赤ペン
  g.save(); g.translate(128, 70); g.rotate(-0.6); g.fillStyle = '#c0392b'; g.fillRect(-2, -14, 4, 22); g.restore();
  // 眉・目（にっこり）・口ひげ・口
  g.strokeStyle = '#3a2a1e'; g.lineCap = 'round'; g.lineWidth = 3.5;
  g.beginPath(); g.moveTo(62, 66); g.lineTo(78, 63); g.moveTo(92, 63); g.lineTo(108, 66); g.stroke();
  g.lineWidth = 3;
  g.beginPath(); g.arc(70, 78, 6, Math.PI*1.1, Math.PI*1.9); g.stroke();
  g.beginPath(); g.arc(100, 78, 6, Math.PI*1.1, Math.PI*1.9); g.stroke();
  g.fillStyle = '#3a2a1e';
  g.beginPath(); g.ellipse(76, 96, 12, 5, -0.2, 0, Math.PI*2); g.ellipse(94, 96, 12, 5, 0.2, 0, Math.PI*2); g.fill();
  g.fillStyle = '#8a2e2e'; g.beginPath(); g.ellipse(85, 107, 11, 7 + Math.abs(Math.sin(t*8))*3, 0, 0, Math.PI); g.fill();
  // ほっぺ
  g.fillStyle = 'rgba(230,110,110,.35)'; g.beginPath(); g.arc(60, 92, 7, 0, Math.PI*2); g.arc(110, 92, 7, 0, Math.PI*2); g.fill();
  g.restore();
}

  archive(d, status){
    const r = this.load();

    const s = { run, year: d.year, status, history: (d.history || []).slice(), yearStart: d.yearStart, yearEnd: d.money, savedAt: Date.now() };
    const k = r.seasons.findIndex(x => x.run === run && x.year === d.year);

  newRun(){ const r = this.load(); const used = r.seasons.reduce((m,x) => Math.max(m, x.run || 0), 0); r.run = Math.max(r.run, used) + 1; this.save(r); return r.run; },
};

      g.fillStyle = '#2c5a3c'; g.fillRect(0,0,200,104);
      g.fillStyle = '#b9a27c'; g.fillRect(0,66,200,38);
      const look = Game.paddock[i].look, L = PADDOCK_LOOKS[look] || PADDOCK_LOOKS.normal;
      const x = 100 + Math.sin(t*0.6 + i)*36;
      const dir = Math.cos(t*0.6 + i) >= 0 ? 1 : -1;
      // イレ込み・テンションが高い馬は落ち着きなく揺れる
      const jit = L.jitter ? Math.sin(t*14+i)*L.jitter : 0;
      drawHorse(g, x + jit, 96, 1.05, Game.field.horses[i], t*3*L.speed + i, dir, { walk:true, look, time:t });
    });
    paddockRAF = requestAnimationFrame(loop);
  };
  paddockRAF = requestAnimationFrame(loop);
}

// ---------- 馬と騎手の描画 ----------
// 毛色（コート）。名前で指定されていない馬は鹿毛系からランダム
const COATS = {
  '鹿毛':   { base:'#7a4424', light:'#a5643a', dark:'#45240f', mane:'#1a0f08', leg:'#22140b' },
  '黒鹿毛': { base:'#4a2a17', light:'#6f4126', dark:'#25140a', mane:'#120a05', leg:'#140b06' },
  '青鹿毛': { base:'#2a1c16', light:'#4a3328', dark:'#120c09', mane:'#0a0605', leg:'#0d0907' },
  '栗毛':   { base:'#a8592a', light:'#cf8048', dark:'#6a3214', mane:'#c47a3c', leg:'#7a3c18' },
  '芦毛':   { base:'#b8b4ad', light:'#e2dfd8', dark:'#7d7972', mane:'#8e8a83', leg:'#6d6a64' },
  '白毛':   { base:'#f1efe9', light:'#ffffff', dark:'#c9c5bc', mane:'#e6e3dc', leg:'#d8d4cb' },
};
const RANDOM_COATS = ['鹿毛','鹿毛','黒鹿毛','栗毛','青鹿毛'];
function coatOf(h){ return COATS[h.coat] || COATS['鹿毛']; }

// 勝負服の柄（枠色＋柄）。実在の勝負服ではなく、枠色を使った架空の柄
const SILK_PATTERNS = ['plain','hoops','stripes','sleeves','cross','diamond'];
function silkOf(h){
  const w = WAKU[h.no-1];
  let hash = 0; for(const ch of (h.name||'')) hash = (hash*31 + ch.charCodeAt(0)) >>> 0;
  const accent = w.bg === '#ffffff' ? '#1d3f8f' : (w.fg === '#fff' ? '#ffffff' : '#1b1b1b');
  return { main: w.bg, accent, cap: w.bg, pattern: SILK_PATTERNS[(hash + h.no) % SILK_PATTERNS.length] };
}

// 1本の脚（上の骨→下の骨→蹄）。angle は鉛直からの角度（+で前）
function drawLeg(g, hx, hy, a1, a2, len1, len2, w1, w2, color, hoof){
  const kx = hx + Math.sin(a1)*len1, ky = hy + Math.cos(a1)*len1;
  const fx = kx + Math.sin(a1+a2)*len2, fy = ky + Math.cos(a1+a2)*len2;
  g.strokeStyle = color; g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = w1; g.beginPath(); g.moveTo(hx, hy); g.lineTo(kx, ky); g.stroke();
  g.lineWidth = w2; g.beginPath(); g.moveTo(kx, ky); g.lineTo(fx, fy); g.stroke();
  g.fillStyle = hoof; g.beginPath(); g.ellipse(fx + 0.8, fy, 2.6, 1.6, 0, 0, Math.PI*2); g.fill();
}

// 馬＋騎手（横向き）。dir=1 で右向き。opts.walk=歩き、opts.whip=ムチ
function drawHorse(g, x, y, s, h, phase, dir, opts){
  opts = opts || {};
  const c = coatOf(h), silk = silkOf(h), walk = !!opts.walk;
  const Lraw = (opts.look && PADDOCK_LOOKS[opts.look]) || null;
  const L = Lraw && !walk ? Object.assign({}, Lraw, { amp:1, head:0, toss:0, jitter:0, limp:false, tail:0 }) : Lraw;
  const tNow = opts.time || 0;
  const TAU = Math.PI*2;
  g.save(); g.translate(x, y); g.scale(s*dir, s);
  // 影
  g.fillStyle = 'rgba(0,0,0,.28)';
  g.beginPath(); g.ellipse(0, 1, 32, 4.5, 0, 0, TAU); g.fill();
  const bob = walk ? Math.sin(phase*2)*0.5 : Math.sin(phase*2)*1.8;
  g.translate(0, -bob);
  // 脚の動き（襲歩: 後左→後右→前左→前右）
  const off = walk ? [0, 0.5, 0.25, 0.75] : [0, 0.09, 0.46, 0.55];
  const amp = (walk ? 0.32 : 0.62) * (L ? L.amp : 1);
  const legAngles = (u, fore) => {
    const a = Math.sin(TAU*u);
    const lift = Math.max(0, Math.sin(TAU*u + 0.9));
    const a1 = (fore ? 0.12 : -0.05) + amp*a;
    const bend = (L && L.limp) ? 0.35 : 1;
    const a2 = (fore ? -lift*(walk ? 0.6 : 1.25) : lift*(walk ? 0.4 : 0.85) - 0.15) * bend;
    return [a1, a2];
  };
  const u = phase/TAU;
  const hip = [-17, -31], sh = [15, -30];
  // 奥側の脚（少し暗く）
  [[hip, off[0], false], [sh, off[2], true]].forEach(([p, o, fore]) => {
    const [a1, a2] = legAngles(u + o, fore);
    drawLeg(g, p[0]+1, p[1], a1, a2, 15, 15.5, 6.5, 3.6, c.dark, '#111');
  });
  // 尾（なびく）
  const wave = (L && L.tail) ? Math.sin(tNow*9)*L.tail*2 : Math.sin(phase*1.3)*2.5;
  g.strokeStyle = c.mane; g.lineCap = 'round';
  for(let k=0;k<4;k++){
    g.lineWidth = 3.2 - k*0.5;
    g.beginPath(); g.moveTo(-27, -40);
    g.bezierCurveTo(-36, -42 + wave*0.3 + k, -44, -36 + wave + k*1.5, walk ? -32 : -50, (walk ? -16 : -30) + wave + k*2);
    g.stroke();
  }
  if(L && L.belly){
    g.fillStyle = c.dark; g.beginPath(); g.ellipse(-3, -23, 18, 6.5, 0, 0, Math.PI*2); g.fill();
  }
  // 胴体
  const grad = g.createLinearGradient(0, -46, 0, -20);
  grad.addColorStop(0, c.light); grad.addColorStop(0.45, c.base); grad.addColorStop(1, c.dark);
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(26, -30);
  g.bezierCurveTo(26, -40, 18, -45, 8, -45);
  g.bezierCurveTo(-4, -44, -12, -42, -18, -45);
  g.bezierCurveTo(-26, -47, -31, -40, -29, -33);
  g.bezierCurveTo(-28, -27, -23, -23, -16, -23);
  g.bezierCurveTo(-6, -20, 8, -20, 16, -23);
  g.bezierCurveTo(22, -24, 26, -26, 26, -30);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 0.8; g.stroke();
  if(L && L.sheen){
    // 毛ヅヤ: 光が流れるハイライト
    const sx = -24 + ((tNow*18) % 56);
    const sg = g.createLinearGradient(sx - 8, 0, sx + 8, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,.6)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sg; g.beginPath(); g.ellipse(0, -40, 24, 3.2, -0.04, 0, Math.PI*2); g.fill();
  }
  // 首と頭（走るときは前に伸ばす）
  const reach = walk ? 0 : 3 + Math.sin(phase*2+1)*1.2;
  const headDrop = L ? L.head + (L.toss ? Math.sin(tNow*7)*L.toss : 0) : 0;
  const px = 34 + reach, py = (walk ? -62 : -58) + headDrop;
  const ng = g.createLinearGradient(20, -60, 30, -30);
  ng.addColorStop(0, c.light); ng.addColorStop(1, c.base);
  g.fillStyle = ng;
  g.beginPath();
  g.moveTo(9, -43);
  g.bezierCurveTo(16, -52, 24, -58, px, py);             // たてがみ側
  g.lineTo(px + 3, py - 1);
  g.bezierCurveTo(px + 9, py + 3, px + 14, py + 7, px + 15, py + 11);  // 額〜鼻
  g.bezierCurveTo(px + 15, py + 14, px + 11, py + 15, px + 8, py + 13); // 口
  g.bezierCurveTo(px + 4, py + 11, px, py + 12, px - 4, py + 15);      // あご
  g.bezierCurveTo(px - 8, py + 20, 24, -31, 22, -27);   // のど〜胸
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 0.8; g.stroke();
  // 耳・目・鼻・手綱
  g.fillStyle = c.base;
  g.beginPath(); g.moveTo(px - 1, py + 1); g.lineTo(px - 2, py - 6); g.lineTo(px + 3, py); g.closePath(); g.fill();
  g.fillStyle = '#0b0b0b';
  g.beginPath(); g.arc(px + 5, py + 4.5, 1.3, 0, TAU); g.fill();
  g.beginPath(); g.arc(px + 13, py + 11, 0.9, 0, TAU); g.fill();
  g.strokeStyle = '#2a1a10'; g.lineWidth = 1.1;
  g.beginPath(); g.moveTo(px + 1, py + 2); g.lineTo(px + 10, py + 13); g.moveTo(px + 6, py + 9); g.lineTo(px + 13, py + 7); g.stroke();
  // たてがみ
  g.strokeStyle = c.mane; g.lineWidth = 2.2;
  g.beginPath();
  for(let k=0;k<=6;k++){
    const t = k/6;
    const mx = 10 + (px - 10)*t, my = -44 + (py + 1 + 44)*t;
    const fl = walk ? 2 : 3.5 + Math.sin(phase*2 + k)*1.2;
    g.moveTo(mx, my); g.lineTo(mx - fl, my - 1 + Math.sin(phase + k)*0.8);
  }
  g.stroke();
  // ゼッケン（枠色＋馬番）と鞍
  const w = WAKU[h.no-1];
  g.fillStyle = w.bg; g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(-9, -44); g.lineTo(9, -45); g.lineTo(8, -31); g.lineTo(-10, -30); g.closePath(); g.fill(); g.stroke();
  // 左向きのときも数字が鏡文字にならないよう、文字だけ向きを戻す
  g.save(); g.translate(-0.5, -34.5); g.scale(dir, 1);
  g.fillStyle = w.fg; g.font = 'bold 9px sans-serif'; g.textAlign = 'center';
  g.fillText(String(h.no), 0, 0); g.restore();
  g.fillStyle = '#3a2414'; g.beginPath(); g.ellipse(1, -45.5, 8, 2.2, -0.05, 0, TAU); g.fill();
  // 手前側の脚
  [[hip, off[1], false], [sh, off[3], true]].forEach(([p, o, fore]) => {
    const [a1, a2] = legAngles(u + o, fore);
    drawLeg(g, p[0], p[1], a1, a2, 15, 15.5, 7.5, 4, c.leg === c.mane ? c.dark : c.leg, '#151515');
  });
  if(L && L.sweat){
    // 発汗: 首と腰の白い汗
    g.fillStyle = 'rgba(255,255,255,.75)';
    [[16,-40,3.2],[20,-36,2.4],[-14,-30,3],[-20,-34,2.2],[12,-26,2]].forEach(([sx,sy,r]) => { g.beginPath(); g.ellipse(sx, sy, r, r*0.7, 0, 0, Math.PI*2); g.fill(); });
  }
  if(L && L.jitter){
    // 落ち着きがない: 頭のまわりにピリピリした線
    g.strokeStyle = `rgba(255,90,60,${0.5 + 0.5*Math.abs(Math.sin(tNow*6))})`; g.lineWidth = 1.4;
    const hx0 = px + 4, hy0 = py - 8;
    g.beginPath();
    g.moveTo(hx0 - 4, hy0); g.lineTo(hx0 - 2, hy0 - 4); g.lineTo(hx0, hy0); g.lineTo(hx0 + 2, hy0 - 4);
    g.moveTo(hx0 + 7, hy0 + 3); g.lineTo(hx0 + 11, hy0 + 1);
    g.moveTo(hx0 + 7, hy0 + 7); g.lineTo(hx0 + 12, hy0 + 7);
    g.stroke();
  }
  if(L && L.dim){
    // 地味・覇気がない: 馬体を少しくすませる
    g.fillStyle = `rgba(90,90,90,${L.dim})`;
    g.beginPath(); g.ellipse(-1, -33, 29, 13, 0, 0, Math.PI*2); g.fill();
  }
  if(L && L.sheen){
    // 好調: きらっと光る
    const tw = (Math.sin(tNow*4) + 1) / 2;
    g.fillStyle = `rgba(255,240,170,${0.4 + tw*0.6})`;
    const star = (sx, sy, r) => { g.beginPath(); g.moveTo(sx, sy - r); g.lineTo(sx + r*0.3, sy); g.lineTo(sx, sy + r); g.lineTo(sx - r*0.3, sy); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(sx - r, sy); g.lineTo(sx, sy + r*0.3); g.lineTo(sx + r, sy); g.lineTo(sx, sy - r*0.3); g.closePath(); g.fill(); };
    star(-20, -50, 4 + tw*3); star(26, -68, 3 + (1-tw)*3); star(-30, -36, 2 + tw*2);
  }
  // ---- 騎手（前傾のモンキー乗り） ----
  const pump = walk ? 0 : Math.sin(phase*2)*1.6;
  const jy = walk ? -6 : 0; // 歩きのときは少し起き上がる
  // あし（白いズボン＋黒いブーツ）
  g.lineCap = 'round';
  g.strokeStyle = '#f4f2ee'; g.lineWidth = 4.2;
  g.beginPath(); g.moveTo(-3, -53 + jy); g.lineTo(7, -51 + jy*0.5); g.stroke();
  g.strokeStyle = '#151515'; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(7, -51 + jy*0.5); g.lineTo(3, -41); g.stroke();
  g.strokeStyle = '#999'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(3, -45); g.lineTo(2, -40); g.stroke(); // あぶみ
  // 胴（勝負服）
  const tx0 = -4, ty0 = -54 + jy, tx1 = 13, ty1 = (walk ? -66 : -60) + pump*0.3;
  g.save();
  g.beginPath();
  g.moveTo(tx0 - 1, ty0 + 3); g.lineTo(tx0 - 1, ty0 - 4);
  g.quadraticCurveTo((tx0+tx1)/2, ty1 - 5, tx1 + 1, ty1 - 3);
  g.lineTo(tx1 + 2, ty1 + 3);
  g.quadraticCurveTo((tx0+tx1)/2, ty1 + 6, tx0 - 1, ty0 + 3);
  g.closePath();
  g.fillStyle = silk.main; g.fill();
  g.clip();
  g.fillStyle = silk.accent;
  if(silk.pattern === 'hoops'){ for(let k=-6;k<20;k+=6) { g.save(); g.translate(k, 0); g.rotate(-0.35); g.fillRect(0, -80, 2.5, 60); g.restore(); } }
  else if(silk.pattern === 'stripes'){ g.fillRect(tx0 - 2, (ty0+ty1)/2 - 1.5, 20, 3); }
  else if(silk.pattern === 'cross'){ g.lineWidth = 2.2; g.strokeStyle = silk.accent; g.beginPath(); g.moveTo(tx0, ty0 - 4); g.lineTo(tx1, ty1 + 3); g.moveTo(tx0, ty0 + 2); g.lineTo(tx1, ty1 - 3); g.stroke(); }
  else if(silk.pattern === 'diamond'){ g.beginPath(); const mx = (tx0+tx1)/2, my = (ty0+ty1)/2; g.moveTo(mx-4, my); g.lineTo(mx, my-4); g.lineTo(mx+4, my); g.lineTo(mx, my+4); g.closePath(); g.fill(); }
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 0.7;
  g.beginPath(); g.moveTo(tx0 - 1, ty0 - 4); g.quadraticCurveTo((tx0+tx1)/2, ty1 - 5, tx1 + 1, ty1 - 3); g.stroke();
  // 腕（袖）と手綱
  const hx = 23 + pump*0.8 + reach*0.6, hy = (walk ? -55 : -52) + Math.abs(pump)*0.3;
  g.strokeStyle = silk.pattern === 'sleeves' ? silk.accent : silk.main; g.lineWidth = 3.2;
  g.beginPath(); g.moveTo(tx1 - 1, ty1 + 1); g.lineTo(tx1 + 5, ty1 + 6); g.lineTo(hx, hy); g.stroke();
  g.fillStyle = '#e9c9a8'; g.beginPath(); g.arc(hx, hy, 1.4, 0, TAU); g.fill();
  g.strokeStyle = '#3b2a1c'; g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(hx, hy); g.quadraticCurveTo((hx + px + 9)/2, hy + 3, px + 9, py + 12); g.stroke();
  // ムチ
  if(opts.whip){
    const sw = Math.sin(phase*2)*0.6;
    g.strokeStyle = '#1a1a1a'; g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(hx - 1, hy); g.lineTo(hx - 12 + sw*6, hy - 12 + sw*3); g.stroke();
  }
  // 頭（ヘルメット＝枠色の帽子、ゴーグル）
  const hdx = tx1 + 5, hdy = ty1 - 4;
  g.fillStyle = '#e9c9a8'; g.beginPath(); g.arc(hdx + 1.5, hdy + 2, 2.6, 0, TAU); g.fill();
  g.fillStyle = silk.cap; g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 0.7;
  g.beginPath(); g.arc(hdx, hdy, 4.4, Math.PI*0.95, Math.PI*2.05); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#222'; g.fillRect(hdx + 1, hdy - 0.6, 4, 1.6);
  g.restore();
}

// 高解像度画面でもにじまないよう、キャンバスの実ピクセルを端末に合わせる
function fitCanvas(cv, w, h){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return g;
}

// ---------- 馬券 ----------
function renderBet(){
  document.querySelectorAll('#betType button').forEach(b => b.classList.toggle('on', b.dataset.t === Game.betType));
  $('betHint').textContent = { win:'1着になる馬を1頭選ぶ', place:'3着以内に入る馬を1頭選ぶ（当たりやすいが配当は低め）', quin:'1着・2着になる2頭を選ぶ（順不同。「2連複」と同じ賭け方です）', trio:'1着・2着・3着になる3頭を選ぶ（順不同。3連単より当たりやすく配当は低め）', tri:'1着→2着→3着の順に3頭選ぶ（着順どおりに当てる。難しいぶん高配当）' }[Game.betType];
  const p = $('picks'); p.innerHTML = '';
  Game.field.horses.forEach(x => {
    const b = document.createElement('button');
    const w = WAKU[x.no-1];
    b.style.background = w.bg; b.style.color = w.fg;
    const ord = Game.betType === 'tri' ? Game.sel.indexOf(x.no) : -1;
    b.textContent = (ord >= 0 ? `${ord+1}着:` : '') + x.no + ' ' + x.name.slice(0, ord >= 0 ? 3 : 5);
    b.classList.toggle('on', Game.sel.includes(x.no));
    b.onclick = () => togglePick(x.no);
    p.appendChild(b);
  });
  $('amtView').textContent = yen(Game.amount);
  const need = { quin:2, tri:3, trio:3 }[Game.betType] || 1;
  let o = '';
  if(Game.sel.length === need){
    const odds = currentOdds();
    o = `オッズ ${odds.toFixed(1)}倍 → 的中で ${yen(Math.floor(Game.amount * odds))}`;
  }
  $('oddsView').textContent = o;
  $('btnAddTicket').disabled = !(Game.sel.length === need && Game.amount >= CONFIG.MIN_BET && Game.amount <= remaining());
  const ul = $('tickets'); ul.innerHTML = '';
  Game.tickets.forEach((t,k) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${BET_LABEL[t.type]} ${t.sel.join(t.type === 'tri' ? '→' : '-')}（${t.odds.toFixed(1)}倍）</span><span>${yen(t.amount)} <button data-k="${k}">✕</button></span>`;
    li.querySelector('button').onclick = () => { Game.tickets.splice(k,1); renderBet(); };
    ul.appendChild(li);
  });
  const sum = Game.tickets.reduce((a,t)=>a+t.amount,0);
  $('ticketSum').textContent = Game.tickets.length ? `合計 ${yen(sum)}（残り ${yen(remaining())}）` : '馬券なし（見送りで発走もできます）';
}
function remaining(){ return Save.data.money - Game.tickets.reduce((a,t)=>a+t.amount,0); }
const BET_LABEL = { win:'単勝', place:'複勝', quin:'馬連', trio:'3連複', tri:'3連単' };
function currentOdds(){
  if(Game.betType === 'win') return Game.odds.win[Game.sel[0]-1];
  if(Game.betType === 'place') return Game.odds.place[Game.sel[0]-1];
  if(Game.betType === 'tri') return Game.odds.tri[triKey(Game.sel[0], Game.sel[1], Game.sel[2])];
  if(Game.betType === 'trio') return Game.odds.trio[trioKey(Game.sel[0], Game.sel[1], Game.sel[2])];
  return Game.odds.quin[quinKey(Game.sel[0], Game.sel[1])];
}
function togglePick(no){
  const need = { quin:2, tri:3, trio:3 }[Game.betType] || 1;
  const k = Game.sel.indexOf(no);
  if(k >= 0) Game.sel.splice(k,1);
  else { Game.sel.push(no); if(Game.sel.length > need) Game.sel.shift(); }
  renderBet();
}

// ---------- レース演出 ----------
const PHASES = [
  { key:'early', label:'序 盤', until:0.30 },
  { key:'mid',   label:'中 盤', until:0.75 },
  { key:'last',  label:'ラストスパート', until:1.01 },
];
const Race = { sim:null, t:0, raf:0, lastNow:0, phase:-1, lines:[], said:{}, leader:-1, done:false };

function startRace(){
  const d = Save.data;
  d.money -= Game.tickets.reduce((a,t)=>a+t.amount,0);
  Save.write();
  // 本番は「調子」込みで走る
  const rnd = mulberry32(Math.floor(Math.random()*1e9));

  Race.t = 0; Race.phase = -1; Race.said = {}; Race.leader = -1; Race.done = false; Race.started = false;
  Race.rank50 = null; Race.rank75 = null; Race.camPx = null; Race.lastLeadSay = -99; Race.leadSays = 0;

// 順位: ゴール済みの馬は着順どおり、まだの馬は位置で並べる
function standings(fr, fi){
  const sim = Race.sim;
  return fr.map((p,i)=>({i,p})).sort((a,b) => {
    if(sim && fi != null){
      const fa = sim.finFrame[a.i], fb = sim.finFrame[b.i];
      const da = fa >= 0 && fa <= fi, db = fb >= 0 && fb <= fi;
      if(da && db) return sim.order.indexOf(a.i) - sim.order.indexOf(b.i);
      if(da) return -1; if(db) return 1;
    }
    return b.p - a.p;
  });
}

const RACE_W = 480, RACE_H = 400;
const SLOW_FACTOR = 0.3;   // 1〜3着がゴールする瞬間の再生速度
function raceLoop(now){
  const dt = Math.max(0, Math.min(0.05, (now - Race.lastNow)/1000)); Race.lastNow = now;
  const sim = Race.sim;
  const total = sim.frames.length - 1;
  const f1 = sim.finFrame[sim.order[0]], f3 = sim.finFrame[sim.order[Math.min(2, sim.order.length-1)]];
  // 1着がゴールするまでを RACE_SECONDS 秒で見せる
  const base = f1 / CONFIG.RACE_SECONDS;
  // 1〜3着がゴールする前後だけスローモーション（なめらかに切り替える）
  const inSlow = Race.t >= f1 - 1.5/DT && Race.t <= f3 + 0.5/DT;
  const target = inSlow ? SLOW_FACTOR : 1;
  Race.slow = (Race.slow == null ? 1 : Race.slow) + (target - (Race.slow == null ? 1 : Race.slow)) * Math.min(1, dt*5);
  Race.t = Math.min(total, Race.t + dt*base*Race.slow);
  const fi = Math.floor(Race.t), fr = sim.frames[fi];
  const st = standings(fr, fi);
  const prog = Math.min(1, Math.max(...fr) / sim.D);

  // フェーズ切り替え
  const ph = PHASES.findIndex(p => prog < p.until);
  if(ph !== Race.phase){ Race.phase = ph; phaseCard(PHASES[ph].label); commentPhase(ph, st); }
  commentEvents(prog, st, fi);

  const allGone = drawRace(fr, st, ph, now/1000, fi);

  // 全頭がゴールを駆け抜けて画面の右へ消えたら終了
  if(Race.t >= total || (allGone && fi > sim.finFrame[sim.order[sim.order.length-1]])){
    if(!Race.done){ Race.done = true; finishRace(); }
    return;
  }
  Race.raf = requestAnimationFrame(raceLoop);
}

// ---------- 実況の言い回し ----------
const pickL = arr => arr[Math.floor(Math.random()*arr.length)];
// 人気順（0=1番人気）
function popRank(i){ const w = Game.odds.win; return w.filter(x => x < w[i]).length; }
function favIndex(){ const w = Game.odds.win; return w.indexOf(Math.min(...w)); }
// その馬の「推せる理由」をゲーム内のデータから作る（実在馬の実績は語らない）
function horseReasons(i){
  const h = H(i), hs = Game.field.horses, race = Game.field.race, out = [];
  const best = key => hs.every(x => x[key] <= h[key]);
  const dm = Game.marks.filter(m => m[i] === '◎').length;
  if(dm >= 2) out.push(`記者の◎が${dm}つ集まった`);
  if(h.lastRun === 1) out.push('前走を勝った勢い');
  else if(h.lastRun <= 3) out.push(`前走も${h.lastRun}着と好調`);
  if(aptMark(h, race.dist) === '◎') out.push(`${race.dist}mはまさに得意の距離`);
  if(best('kick')) out.push('末脚の切れはメンバー随一');
  if(best('speed')) out.push('スピードはメンバー最上位');
  if(best('stamina') && race.dist >= 2400) out.push('スタミナ勝負なら負けない');
  const look = Game.paddock && Game.paddock[i] && Game.paddock[i].look;
  if(look === 'shine' || look === 'power') out.push('パドックでも目を引く好気配');
  return out;
}
const STYLE_WORD = { '逃げ':'逃げ', '先行':'好位からの競馬', '差し':'差し', '追込':'後方からの追い込み' };
// 勝ち馬をたたえる一言（脚質と勝ち方から）
function praiseLine(i, story){
  const n = H(i).name, st = H(i).style;
  const byStyle = {
    '逃げ': [`自分でレースを作って押し切る、これぞ${n}の真骨頂！`, `ハナを奪ったら誰にも譲らない！ ${n}、なんという逃げっぷりだ！`],
    '先行': [`好位から抜け出す完璧な競馬！ ${n}、盤石の強さだ！`, `${n}、まさに横綱の走り！ 力の違いを見せつけた！`],
    '差し': [`${n}のこの末脚は本物だ！ 一瞬で突き抜けた！`, `なんという切れ味！ ${n}、ここ一番で最高の脚を使った！`],
    '追込': [`信じられない末脚！ ${n}、次元が違う！`, `あの位置から届くのか！ ${n}、怪物級の追い込みだ！`],
  }[st] || [`${n}、強い！`];
  const extra = story.len >= 3 ? [`後続をまったく寄せつけない、圧巻の${story.margin}差！`, `${story.margin}差の独り舞台！ 今年のG1でも屈指の圧勝劇だ！`]
              : story.len < 0.6 ? ['最後まで諦めなかった執念の勝利！', '勝負根性の塊！ 首の上げ下げを制した！']
              : ['堂々たる勝ちっぷり！', `これが${n}の実力だ！`];
  return pickL(byStyle) + ' ' + pickL(extra);
}

// ---------- レースの物語: 決まり手と着差 ----------
function marginText(len){
  if(len < 0.15) return 'ハナ';
  if(len < 0.3) return 'アタマ';
  if(len < 0.55) return 'クビ';
  if(len < 0.8) return '1/2馬身';
  if(len < 1.1) return '3/4馬身';
  if(len > 10) return '大差';
  const half = Math.round(len*2)/2;
  return half % 1 ? `${Math.floor(half)}馬身半` : `${half}馬身`;
}
function raceStory(sim){
  const n = sim.order.length, w = sim.order[0], s2 = sim.order[1];
  const idx = sim.frames.findIndex(fr => Math.max(...fr) >= sim.D * SIM.LATE_START);
  const fr = sim.frames[Math.max(0, idx)];
  const ranks = fr.map((p,i)=>({i,p})).sort((a,b)=>b.p-a.p).map(x=>x.i);
  const r75 = ranks.indexOf(w), leader75 = ranks[0];
  const len = (sim.finT[s2] - sim.finT[w]) * (sim.lastV[s2] || 16) / 2.4;
  const mt = marginText(len);
  const h = H(w), wn = h.name, sn = H(s2).name;
  const nige = h.style === '逃げ';
  let kimarite, line, dramatic = false;
  if(r75 === 0){
    kimarite = nige ? '逃げ切り' : '押し切り';
    if(len >= 3){
      line = pickL([`${wn}、${nige ? '逃げ切った' : '押し切った'}！ ${mt}差の圧勝！ 後続は影も踏めない！`,
                    `${wn}だ！ ${wn}だ！ 誰も追いつけない！ ${mt}ちぎってゴールイン！`,
                    `強い強い強い！ ${wn}、${mt}差の独走でゴール！`]);
    } else if(len < 0.6){
      dramatic = true;
      line = pickL([`${wn}、ギリギリ粘り切った！ ${mt}だけしのいだ！`,
                    `粘る粘る${wn}！ ${sn}の猛追を${mt}差で振り切った！`,
                    `しのいだ！ しのいだ！ ${wn}、執念で${mt}だけ残した！`]);
    } else {
      line = pickL([`${wn}、そのまま押し切ってゴールイン！`, `${wn}、最後まで先頭を譲らずゴール！`, `${wn}、危なげなく押し切った！`]);
    }
  } else if(leader75 === s2 && len < 0.6){
    kimarite = '差し切り'; dramatic = true;
    line = pickL([`ゴール寸前！ ${wn}が${sn}をとらえた！ ${mt}差の大逆転！`,
                  `差した差した差した！ ${wn}だ！ 最後の最後で${sn}を飲み込んだ！`,
                  `ゴール前で逆転！ ${wn}！ ${sn}は${mt}差、無念の2着！`]);
  } else if(r75 === n-1){
    kimarite = '追い込み'; dramatic = true;
    line = pickL([`最後方から${wn}！ 全頭ごぼう抜きの怒涛の追い込み！`,
                  `来た来た来た！ 最後方から${wn}！ 信じられない、全馬をなで切った！`,
                  `なんということだ！ ${wn}、最後方から一気に突き抜けた！`]);
  } else if(r75 >= n-3){
    kimarite = '追い込み'; dramatic = true;
    line = pickL([`${wn}、後方一気！ 大外から突き抜けた！`, `大外から${wn}！ ものすごい脚で全部まとめて差し切った！`]);
  } else if(sim.plan[w].makuri){
    kimarite = 'まくり';
    line = pickL([`${wn}、まくって押し切った！ 早めの仕掛けが決まった！`, `${wn}、3コーナーからのロングスパートで押し切った！ 大胆な競馬！`]);
  } else if(h.style === '先行' || r75 <= 2){
    kimarite = '好位抜け出し';
    line = len >= 1 ? pickL([`${wn}、好位から抜け出して横綱相撲！ ${mt}差の完勝！`, `${wn}、射程圏から抜け出してあっさり${mt}突き放した！`])
                    : pickL([`${wn}、好位から抜け出して押し切った！`, `${wn}、好位から伸びて${mt}差の勝利！`]);
  } else {
    kimarite = '差し切り';
    line = pickL([`${wn}、中団から鋭く差し切った！`, `${wn}、馬群を割って鮮やかに差し切った！`, `外から${wn}！ 中団から伸びて差し切った！`]);
  }
  if(len < 0.3){ dramatic = true; line = pickL(['写真判定！ ', '際どい！ 写真判定だ！ ']) + line; }
  return { kimarite, margin: mt, len, line, r75, leader75, dramatic };
}

// 疑似乱数（描画用・毎フレーム同じ値になる）
const hash01 = n => { const x = Math.sin(n*12.9898)*43758.5453; return x - Math.floor(x); };

// スタートゲート: 1頭ずつの枠（奥の柱・屋根・横板）と、手前の柱・扉
const GATE_COL = '#2f8a5a', GATE_DARK = '#1d5c3c', GATE_LIGHT = '#e8f5ec';
// 1頭分の枠（馬の体がすっぽり入る大きさ）。gx はスタート地点での馬の中心
function drawGateBack(g, gx, y, sc, no){
  const back = gx - 36*sc, front = gx + 40*sc, top = y - 86*sc;
  // 奥の横板（半透明の緑）と、後ろの扉
  g.fillStyle = 'rgba(29,92,60,.55)'; g.fillRect(back, top + 10*sc, front - back, 46*sc);
  g.fillStyle = GATE_DARK; g.fillRect(back - 3*sc, top, 6*sc, 86*sc);
  g.fillStyle = GATE_LIGHT; for(let k=0;k<3;k++) g.fillRect(back - 3*sc, top + (22 + k*18)*sc, 6*sc, 2*sc);
  // 屋根
  g.fillStyle = GATE_COL; g.fillRect(back - 5*sc, top - 6*sc, front - back + 12*sc, 8*sc);
  g.fillStyle = GATE_LIGHT; g.fillRect(back - 5*sc, top - 6*sc, front - back + 12*sc, 1.6*sc);
  // 枠番の札
  const w = WAKU[no-1];
  g.fillStyle = w.bg; g.strokeStyle = '#000'; g.lineWidth = 0.8;
  g.fillRect(front - 10*sc, top - 20*sc, 16*sc, 13*sc); g.strokeRect(front - 10*sc, top - 20*sc, 16*sc, 13*sc);
  g.fillStyle = w.fg; g.font = `bold ${Math.max(8, 10*sc)}px sans-serif`; g.textAlign = 'center';
  g.fillText(String(no), front - 2*sc, top - 10*sc); g.textAlign = 'left';
}
function drawGateFront(g, gx, y, sc, closed){
  const front = gx + 40*sc, top = y - 86*sc;
  // 手前の柱
  g.fillStyle = GATE_COL; g.fillRect(front - 3*sc, top, 7*sc, 86*sc);
  g.fillStyle = GATE_LIGHT; g.fillRect(front - 1*sc, top + 4*sc, 2*sc, 78*sc);
  if(closed){
    // 閉じた前扉（格子）
    g.fillStyle = 'rgba(29,92,60,.92)'; g.fillRect(front - 4*sc, y - 60*sc, 10*sc, 54*sc);
    g.fillStyle = GATE_LIGHT;
    for(let k=0;k<5;k++) g.fillRect(front - 4*sc, y - (56 - k*11)*sc, 10*sc, 1.8*sc);
  } else {
    // 開いた前扉（前へ倒れている）
    g.save(); g.translate(front + 4*sc, y - 58*sc); g.rotate(-1.15);
    g.fillStyle = 'rgba(29,92,60,.92)'; g.fillRect(0, 0, 10*sc, 30*sc);
    g.fillStyle = GATE_LIGHT; for(let k=0;k<3;k++) g.fillRect(0, (4 + k*9)*sc, 10*sc, 1.6*sc);
    g.restore();
  }
}

// 描画: 序盤＝横からの引きの絵 / 中盤＝俯瞰のコース図 / ラスト＝寄りの絵
// 戻り値: 全頭が画面の右へ走り去ったか
// レース画面: メインの視点と、右上の小窓（ワイプ）にもう一方の視点。小窓をタップすると入れ替わる
function drawRace(fr, st, ph, time, fi){
  const g = fitCanvas($('raceCv'), RACE_W, RACE_H);
  const W = RACE_W, Hh = RACE_H, D = Race.sim.D;
  g.clearRect(0,0,W,Hh);
  const defaultKind = ph === 1 ? 'over' : 'side';
  const mainKind = Race.started && Race.viewSwap ? (defaultKind === 'side' ? 'over' : 'side') : defaultKind;
  let allGone = false;
  if(mainKind === 'side') allGone = drawSideView(g, fr, st, ph, time, fi, false);
  else drawOverhead(g, W, Hh, fr, D, fi, false);
  Race.pipRect = null;
  if(Race.started){
    const altKind = mainKind === 'side' ? 'over' : 'side';
    const off = Race.pipCv || (Race.pipCv = document.createElement('canvas'));
    if(off.width !== W){ off.width = W; off.height = Hh; }
    const og = off.getContext('2d'); og.setTransform(1,0,0,1,0,0); og.clearRect(0,0,W,Hh);
    if(altKind === 'side') allGone = drawSideView(og, fr, st, ph, time, fi, true);
    else drawOverhead(og, W, Hh, fr, D, fi, true);
    const pw = Math.round(W*0.36), phh = Math.round(Hh*0.36), px = W - pw - 8, py = 36;
    g.save();
    g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(px+3, py+3, pw, phh);   // 影
    g.drawImage(off, px, py, pw, phh);
    g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(px, py, pw, phh);
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(px, py + phh - 16, pw, 16);
    g.fillStyle = '#fff'; g.font = 'bold 10px sans-serif'; g.textAlign = 'center';
    g.fillText(`${altKind === 'side' ? '横から' : '俯瞰'}（タップで切替）`, px + pw/2, py + phh - 4);
    g.restore();
    Race.pipRect = { x: px, y: py, w: pw, h: phh };
  }
  return allGone;
}

// 横から見た絵。mini=true のときは小窓用（順位帯や残り距離は描かない）
function drawSideView(g, fr, st, ph, time, fi, mini){
  const W = RACE_W, Hh = RACE_H, D = Race.sim.D;
  g.clearRect(0,0,W,Hh);
  const last = ph === 2;
  const lead = Math.max(...fr);
  // カメラ: 序盤は馬群全体、直線は先頭と（結末の）1・2着が入るように自動でズーム
  let pxPerM, camX;
  if(!Race.started){
    pxPerM = 4.2; camX = lead - 60;
  } else {
    const o = Race.sim.order;
    const minP = last ? Math.min(fr[o[0]], fr[o[1]], lead - 22) : Math.min(...fr);
    const span = Math.max(last ? 22 : 40, lead - minP);
    const target = clamp((W*0.68) / (span + 6), 3.0, last ? 10 : 6);
    if(Race.camPx == null || Race.camPhase !== ph){ Race.camPx = target; Race.camPhase = ph; }
    Race.camPx += (target - Race.camPx) * 0.05;
    pxPerM = Race.camPx;
    // 先頭を画面の右寄りに置き、ゴール板が左寄りに来たら止める（各馬が右へ駆け抜ける）
    camX = Math.min(lead - (W*0.8)/pxPerM, D - W*0.38/pxPerM);
  }
  const dirt = Game.field.race.surface === 'ダート';
  const yRail = Hh*0.40, yTrackTop = Hh*0.43, yTrackBot = Hh - 40;

  // 空
  const sky = g.createLinearGradient(0,0,0,yRail);
  sky.addColorStop(0, last ? '#f27d4a' : '#5aa9e6'); sky.addColorStop(1, last ? '#ffd9a8' : '#d4ecfb');
  g.fillStyle = sky; g.fillRect(0,0,W,yRail);
  // 雲
  g.fillStyle = 'rgba(255,255,255,.75)';
  for(let k=0;k<5;k++){
    const cx = ((k*170 - camX*pxPerM*0.05) % (W+200) + W+200) % (W+200) - 100, cy = 20 + (k%3)*16;
    g.beginPath(); g.ellipse(cx, cy, 34, 9, 0, 0, Math.PI*2); g.ellipse(cx+18, cy-5, 20, 8, 0, 0, Math.PI*2); g.fill();
  }
  // スタンド（屋根・観客）
  const standY = Hh*0.17, standH = Hh*0.21;
  for(let k=-1;k<9;k++){
    const sx = ((k*110 - camX*pxPerM*0.3) % (W+220) + W+220) % (W+220) - 110;
    g.fillStyle = '#4c5966'; g.fillRect(sx, standY, 104, standH);
    g.fillStyle = '#2f3a44'; g.fillRect(sx - 4, standY - 8, 112, 9);
    for(let r=0;r<6;r++) for(let q=0;q<17;q++){
      const hv = hash01(k*997 + r*31 + q);
      g.fillStyle = hv < 0.25 ? '#e8d7c3' : hv < 0.45 ? '#c0392b' : hv < 0.6 ? '#2f6fd6' : hv < 0.75 ? '#f2d43c' : '#fafafa';
      g.fillRect(sx + 3 + q*6, standY + 5 + r*(standH-8)/6 + (hv-0.5)*1.5, 3.2, 3.2);
    }
  }
  // 馬場
  g.fillStyle = dirt ? '#a8804e' : '#2e8a4a';
  g.fillRect(0, yRail, W, Hh - yRail);
  // 芝の刈り目／ダートの筋
  g.fillStyle = dirt ? 'rgba(80,50,20,.12)' : 'rgba(255,255,255,.07)';
  for(let k=0;k<40;k++){ const sx = ((k*48 - camX*pxPerM) % (W+96) + W+96) % (W+96) - 48; g.fillRect(sx, yRail, 24, Hh - yRail); }
  // 内ラチ
  g.fillStyle = '#ffffff'; g.fillRect(0, yRail + 4, W, 3);
  for(let m = Math.floor(camX/10)*10; m < camX + W/pxPerM + 20; m += 10){
    const sx = (m - camX)*pxPerM; g.fillRect(sx, yRail - 6, 2.5, 13);
  }
  // ハロン棒（残り距離）
  for(let m = 0; m < D; m += 200){
    const sx = (m - camX)*pxPerM;
    if(sx < -20 || sx > W+20) continue;
    g.fillStyle = '#e33'; g.fillRect(sx, yRail - 30, 4, 34);
    g.fillStyle = '#fff'; g.font = 'bold 12px sans-serif'; g.fillText(String((D-m)/100|0), sx+6, yRail - 20);
  }
  // ゴール板
  const gx = (D - camX)*pxPerM;
  if(gx > -60 && gx < W+60){
    // ゴールライン: 馬場を横切る白黒の市松模様
    const lineTop = yRail + 6, lineBot = Hh - 34, cw = 5;
    for(let yy = lineTop, r = 0; yy < lineBot; yy += cw, r++){
      g.fillStyle = r % 2 ? '#111' : '#fff'; g.fillRect(gx - cw, yy, cw, cw);
      g.fillStyle = r % 2 ? '#fff' : '#111'; g.fillRect(gx, yy, cw, cw);
    }
    // ゴール板（赤い円盤）
    g.fillStyle = '#f5f5f5'; g.fillRect(gx-3, yRail - 58, 6, 64);
    g.fillStyle = '#d62828'; g.strokeStyle = '#fff'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(gx, yRail - 62, 16, 0, Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = '#fff'; g.font = 'bold 10px sans-serif'; g.textAlign = 'center'; g.fillText('GOAL', gx, yRail - 58); g.textAlign = 'left';
  }
  // スタートゲート（スタート地点＝0m）
  const gateX = (0 - camX)*pxPerM;  // スタート地点の馬の位置
  const gateVisible = gateX > -120 && gateX < W + 120;
  // 馬（奥の枠から手前へ）
  const zoomBase = clamp(0.72 * Math.pow(pxPerM/4.2, 0.75), 0.6, 1.35);
  const sFar = zoomBase*0.78, sNear = zoomBase*1.08;
  const yFeetFar = yTrackTop + 70*sFar, yFeetNear = yTrackBot - 4;
  let allGone = true;
  const order = [...st].sort((a,b) => H(a.i).no - H(b.i).no);
  order.forEach(({i,p}) => {
    const h = H(i);
    const l = (h.no-1)/(CONFIG.FIELD-1);
    const sc = sFar + (sNear - sFar)*l;
    const y = yFeetFar + (yFeetNear - yFeetFar)*l;
    const x = (p - camX)*pxPerM;
    if(x < W + 60*sc) allGone = false;
    if(x < -80 || x > W + 80) return;
    // 蹴り上げる芝・砂
    for(let k=0;k<5;k++){
      const age = (time*2.2 + k*0.2 + i*0.13) % 1;
      const dx = x - (18 + age*46)*sc, dy = y - (2 + Math.sin(age*Math.PI)*12 + k*1.2)*sc;
      g.fillStyle = dirt ? `rgba(205,170,120,${(1-age)*0.55})` : `rgba(40,95,40,${(1-age)*0.6})`;
      g.beginPath(); g.arc(dx, dy, (dirt ? 4 : 2.2)*sc*(0.6+age), 0, Math.PI*2); g.fill();
    }
    const finished = Race.sim.finFrame[i] >= 0 && Race.sim.finFrame[i] <= fi;
    if(gateVisible) drawGateBack(g, gateX, y, sc, h.no);
    drawHorse(g, x, y, sc, h, (Race.started ? time : 0)*(finished ? 11 : 14) + i*1.7, 1,
      { whip: last && !finished && st.findIndex(e => e.i === i) < 4, look: Game.paddock && Game.paddock[i] ? Game.paddock[i].look : null, time });
    if(gateVisible) drawGateFront(g, gateX, y, sc, !Race.started);
    // ハプニング中の印（暴れる＝赤い「！」、奮い立つ＝金色の炎、出遅れ＝「出遅れ」の札）
    const act = (Race.sim.events || []).find(e => e.i === i && Race.started && fi >= e.from && fi <= e.to + (e.type === 'deokure' ? 12 : 4));
    if(act){
      const ix = x + 6*sc, iy = y - 96*sc;
      g.save();
      if(act.type === 'abare'){
        g.fillStyle = '#e53935'; g.beginPath(); g.arc(ix, iy, 9*sc + 3, 0, Math.PI*2); g.fill();
        g.fillStyle = '#fff'; g.font = `bold ${Math.round(12*sc + 6)}px sans-serif`; g.textAlign = 'center'; g.fillText('!', ix, iy + 5*sc + 2);
      } else if(act.type === 'furui'){
        const fl = 1 + Math.sin(time*18)*0.15;
        g.fillStyle = 'rgba(255,190,40,.9)';
        g.beginPath(); g.moveTo(ix, iy - 14*sc*fl); g.quadraticCurveTo(ix + 9*sc, iy, ix, iy + 8*sc); g.quadraticCurveTo(ix - 9*sc, iy, ix, iy - 14*sc*fl); g.fill();
        g.fillStyle = 'rgba(255,90,30,.9)';
        g.beginPath(); g.moveTo(ix, iy - 7*sc*fl); g.quadraticCurveTo(ix + 5*sc, iy + 2*sc, ix, iy + 7*sc); g.quadraticCurveTo(ix - 5*sc, iy + 2*sc, ix, iy - 7*sc*fl); g.fill();
      } else {
        g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(ix - 22, iy - 9, 44, 16);
        g.fillStyle = '#ffd54f'; g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.fillText('出遅れ', ix, iy + 3);
      }
      g.restore();
    }
  });
  // スピード線（ラストスパート）
  if(last){
    g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 2;
    for(let k=0;k<14;k++){ const y = yRail + (k*29 + time*300) % (Hh - yRail - 40); const x = (k*97 + time*900) % W; g.beginPath(); g.moveTo(W-x, y); g.lineTo(W-x-60, y); g.stroke(); }
  }
  // スロー演出のときは画面の端を少し暗く
  if((Race.slow || 1) < 0.8){
    const v = g.createRadialGradient(W/2, Hh/2, Hh*0.3, W/2, Hh/2, W*0.7);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
    g.fillStyle = v; g.fillRect(0,0,W,Hh);
  }
  if(mini) return allGone;
  // 発走前は全頭横一線なので順位は出さない
  if(Race.started) drawRankStrip(g, W, Hh, st);
  const left = Race.started ? D - lead : D;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(W-112, 6, 106, 24);
  g.fillStyle = '#fff'; g.font = 'bold 14px sans-serif';
  g.fillText(left > 0 ? `残り ${Math.round(left)}m` : 'ゴール！', W-104, 23);
  return allGone;
}

function drawOverhead(g, W, Hh, fr, D, fi, mini){
  g.fillStyle = '#1b3d26'; g.fillRect(0,0,W,Hh);
  const cx = W/2, cy = (Hh-36)/2 + 4, rx = W*0.40, ry = (Hh-36)*0.36;
  g.strokeStyle = Game.field.race.surface === 'ダート' ? '#a9814f' : '#3fae63'; g.lineWidth = 38;
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); g.stroke();
  g.strokeStyle = '#fff'; g.lineWidth = 1.5;
  g.beginPath(); g.ellipse(cx, cy, rx-19, ry-19, 0, 0, Math.PI*2); g.stroke();
  // ゴール位置＝下側の右寄り。レースは反時計回り（仮）
  const ang = p => Math.PI*0.35 - (p/D)*Math.PI*2 * (D/2000) ;
  fr.forEach((p,i) => {
    const h = H(i), lane = (h.no-1)/(CONFIG.FIELD-1);
    const a = ang(p), r = 1 + (lane-0.5)*0.12;
    const x = cx + Math.cos(a)*rx*r, y = cy + Math.sin(a)*ry*r;
    const w = WAKU[h.no-1];
    g.fillStyle = w.bg; g.strokeStyle = '#000'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(x, y, 9, 0, Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = w.fg; g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.fillText(h.no, x, y+4); g.textAlign = 'left';
  });
  if(mini) return;
  g.fillStyle = '#fff'; g.font = 'bold 13px sans-serif'; g.fillText('俯瞰カメラ', 10, 20);
  drawRankStrip(g, W, Hh, standings(fr, fi));
  const left = Math.max(0, D - Math.max(...fr));
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(W-112, 6, 106, 24);
  g.fillStyle = '#fff'; g.font = 'bold 14px sans-serif';

function showResult(){
  cancelAnimationFrame(Race.raf);
  const o = Race.sim.order.map(i => H(i).no);
  const d = Save.data;
  let pay = 0, html = '';
  Game.tickets.forEach(t => {
    const hit = ticketHit(t, o);
    const back = hit ? Math.floor(t.amount * t.odds / 10) * 10 : 0; // 10円単位
    pay += back;
    html += `<div class="${hit?'win':'lose'}">${BET_LABEL[t.type]} ${t.sel.join(t.type === 'tri' ? '→' : '-')} ${yen(t.amount)} → ${hit ? '的中！ '+yen(back) : 'はずれ'}</div>`;
  });
  if(!Game.tickets.length) html = '<div class="lose">今回は見送り</div>';
  const before = d.money;
  d.money += pay;
  // 元手の10倍ごとの節目（このプレイで初めて超えたものだけ）
  d.milestones = d.milestones || [];
  const reached = MILESTONES.map((m,k) => k).filter(k => d.money >= MILESTONES[k].amount && !d.milestones.includes(k));
  reached.forEach(k => { d.milestones.push(k); Records.addTrophy(k, d); });
  d.best = Math.max(d.best, d.money);
  if(Race.story) html = `<div class="sub" style="margin-bottom:6px">着差 <b>${Race.story.margin}</b> ／ <b>${Race.story.kimarite}</b></div>` + html;
  html += `<div style="margin-top:8px">払戻 ${yen(pay)} ／ 所持金 <b>${yen(d.money)}</b></div>`;
  html += `<div class="sub" style="margin-top:4px">単勝 ${o[0]} ${Game.odds.win[o[0]-1].toFixed(1)}倍 ／ 複勝 ${o.slice(0,3).map(x => `${x} ${Game.odds.place[x-1].toFixed(1)}`).join('・')}倍 ／ 馬連 ${quinKey(o[0],o[1])} ${Game.odds.quin[quinKey(o[0],o[1])].toFixed(1)}倍 ／ 3連複 ${trioKey(o[0],o[1],o[2])} ${Game.odds.trio[trioKey(o[0],o[1],o[2])].toFixed(1)}倍 ／ 3連単 ${o[0]}→${o[1]}→${o[2]} ${Game.odds.tri[triKey(o[0],o[1],o[2])].toFixed(1)}倍</div>`;
  $('payout').innerHTML = html;
  $('resTitle').textContent = `${Game.field.race.name} 確定`;
  $('podium').innerHTML = o.slice(0,3).map((no,k) => `<div><span class="pos">${k+1}着</span>${wakuBadge(no)} ${Game.field.horses[no-1].name}</div>`).join('');
  // 年間の結果発表用に記録
  const stake = Game.tickets.reduce((a,t)=>a+t.amount,0);
  d.history.push({ race: Game.field.race.name, month: Game.field.race.month, winner: Game.field.horses[o[0]-1].name,
    winOdds: Game.odds.win[o[0]-1], stake, pay });
  // 次へ進める
  d.idx++;
  Save.write();
  show('result');
  // 当たった馬券のうち一番高いオッズ（10倍以上なら大的中の演出）
  const bigOdds = Game.tickets.reduce((m,t) => {
    const hit = ticketHit(t, o);
    return hit ? Math.max(m, t.odds) : m;
  }, 0);
  if(pay > 0) celebrate(pay, stake, bigOdds);
  if(reached.length) setTimeout(() => showOjisan(reached), bigOdds >= 10 ? 4700 : 3000);
}

let audioCtx = null;
let soundOn = true;
try{ soundOn = localStorage.getItem('internS_g1predictor_sound') !== 'off'; }catch(e){}
function updateSoundBtn(){ const b = $('btnSound'); if(b) b.textContent = soundOn ? '音 ON' : '音 OFF'; }
function ensureAudio(){
  if(!soundOn) return false;
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return false; } }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return true;
}
function tone(freq, start, dur, type, vol){
  if(!ensureAudio()) return;
  const t0 = audioCtx.currentTime + start;
  const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  gn.gain.setValueAtTime(0, t0); gn.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(gn); gn.connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
// 歓声: ノイズを帯域フィルタに通して、ふくらませてから引かせる
function cheer(start, dur, peak){
  if(!ensureAudio()) return;
  try{
    const len = Math.floor(audioCtx.sampleRate * (dur + 0.2));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), data = buf.getChannelData(0);
    // 人の声っぽく少しうねるノイズ
    let v = 0; for(let i=0;i<len;i++){ v = v*0.6 + (Math.random()*2-1)*0.4; data[i] = v * (0.75 + 0.25*Math.sin(i/2200) * Math.sin(i/731)); }
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
    const gn = audioCtx.createGain(); const t0 = audioCtx.currentTime + start;
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(peak || 0.35, t0 + dur*0.3);
    gn.gain.setValueAtTime(peak || 0.35, t0 + dur*0.6);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(gn); gn.connect(audioCtx.destination);
    src.start(t0); src.stop(t0 + dur + 0.1);
  }catch(e){}
}
// ゲートが開く音: 金属がガシャンと鳴る（短いノイズ＋金属っぽい響き）
function gateClang(){
  if(!ensureAudio()) return;
  try{
    const len = Math.floor(audioCtx.sampleRate * 0.25);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
    const gn = audioCtx.createGain(); gn.gain.value = 0.5;
    src.connect(hp); hp.connect(gn); gn.connect(audioCtx.destination); src.start();
    [[320,0.5],[471,0.4],[813,0.3]].forEach(([f,d]) => tone(f, 0, d, 'square', 0.05));
  }catch(e){}
}
// 発走前のファンファーレ（このゲーム用に作った短いオリジナルの旋律。実在のファンファーレではない）
function playFanfare(){
  const q = 0.17;
  const mel = [[392,0,1],[523,1,1],[659,2,1],[784,3,2],[659,5,1],[784,6,3],
               [880,9,1],[784,10,1],[659,11,1],[698,12,1],[880,13,1],[1047,14,4]];
  mel.forEach(([f,b,l]) => { tone(f, b*q, l*q*0.95, 'square', 0.05); tone(f, b*q, l*q*0.95, 'triangle', 0.06); });
  // 低音の和音で支える
  [[262,0,5],[330,5,4],[349,9,5],[262,14,4]].forEach(([f,b,l]) => tone(f/2, b*q, l*q, 'triangle', 0.07));
  [523,659,784].forEach(f => tone(f, 14*q, 4*q, 'triangle', 0.035));
}

function playHitSound(big){
  try{
    if(!ensureAudio()) return;
    if(!big){
      // 的中: 短いチャイム
      [[784,0],[1047,0.12]].forEach(([f,s]) => tone(f, s, 0.35, 'triangle', 0.1));
      return;
    }
    // 大的中: ファンファーレ（ド・ミ・ソ・ド〜 和音で締め）
    const n = [[523,0,0.16],[659,0.16,0.16],[784,0.32,0.16],[1047,0.48,0.5],[784,1.0,0.14],[1047,1.14,0.9]];
    n.forEach(([f,s,d]) => { tone(f, s, d, 'square', 0.06); tone(f/2, s, d, 'triangle', 0.08); });
    [1047,1319,1568].forEach(f => tone(f, 1.14, 1.1, 'triangle', 0.05));
  }catch(e){}
}

function celebrate(pay, stake, bigOdds){
  const big = (bigOdds || 0) >= 10;
  const box = $('celebrate'), cv = $('confetti'), g = cv.getContext('2d');
  const W = cv.width = innerWidth, Hh = cv.height = innerHeight;
  $('celebrateMsg').innerHTML = '';
  box.classList.toggle('big', big);
  playHitSound(big);
  const b = document.createElement('b'); b.textContent = big ? '大的中！！' : '的中！';
  const sp = document.createElement('span'); sp.textContent = (big ? `${bigOdds.toFixed(1)}倍的中！ ` : '') + `払戻 ${yen(pay)}` + (stake ? `（回収率 ${Math.round(pay/stake*100)}%）` : '');
  $('celebrateMsg').append(b, sp);
  // アニメーションをやり直すため一度外す
  $('celebrateMsg').style.animation = 'none'; void $('celebrateMsg').offsetWidth; $('celebrateMsg').style.animation = '';
  box.classList.add('on');
  const colors = big ? ['#f2c94c','#ffd96b','#fff3c4','#ff9f43','#ffffff'] : WAKU.map(w => w.bg).concat(['#f2c94c','#ffffff']);
  const parts = Array.from({ length: big ? 320 : 140 }, () => ({
    x: Math.random()*W, y: -20 - Math.random()*Hh*0.5, vx: (Math.random()-0.5)*2.5, vy: 2 + Math.random()*3.5,
    r: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.3, s: 5 + Math.random()*6, c: colors[Math.floor(Math.random()*colors.length)],
  }));
  const t0 = performance.now();
  cancelAnimationFrame(confettiRAF);
  const loop = now => {
    const t = (now - t0)/1000;
    g.clearRect(0,0,W,Hh);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); g.restore();
    });
    // 大的中は途中で紙吹雪を追加してもう一度降らせる
    if(big && t > 1.6 && !parts.again){ parts.again = true; parts.forEach(p => { if(p.y > Hh) { p.y = -20 - Math.random()*Hh*0.4; p.x = Math.random()*W; } }); }
    if(t < (big ? 4.5 : 2.8)) confettiRAF = requestAnimationFrame(loop);
    else { g.clearRect(0,0,W,Hh); box.classList.remove('on'); box.classList.remove('big'); }
  };
  confettiRAF = requestAnimationFrame(loop);
}

// 1シーズン分の結果発表を body に書く（エンディングロールと年間成績で共用）
function buildSeasonReport(body, s, opts){
  opts = opts || {};
  const hist = s.history || [];
  body.innerHTML = '';
  const add = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; body.appendChild(e); return e; };
  const row = (left, right, cls) => { const r = add('div','r'); const a = document.createElement('span'); a.textContent = left;
    const b = document.createElement('span'); b.textContent = right; if(cls) b.className = cls; r.append(a, b); };
  const d = { year: s.year, yearStart: s.yearStart, money: s.yearEnd };
  add('h3', null, `SEASON ${d.year} RESULTS`);
  add('div','big', s.status === 'live' ? `${d.year}年目（進行中 ${hist.length}/${CALENDAR.length}戦）` : s.status === 'over' ? `${d.year}年目（${hist.length}戦目で終了）` : `${d.year}年目 G1 全${CALENDAR.length}戦 結果発表`);
  add('h3', null, '優勝馬');
  hist.forEach(h => row(`${h.month}月 ${h.race}`, `${h.winner}（${h.winOdds.toFixed(1)}倍）`));
  add('h3', null, 'あなたの戦績');
  hist.forEach(h => {
    if(!h.stake){ row(h.race, '見送り'); return; }
    const diff = h.pay - h.stake;
    row(h.race, `${diff >= 0 ? '+' : ''}${diff.toLocaleString('ja-JP')}円`, diff > 0 ? 'plus' : 'minus');
  });
  const played = hist.filter(h => h.stake > 0);
  const hits = played.filter(h => h.pay > 0);
  const stake = played.reduce((a,h)=>a+h.stake,0), pay = played.reduce((a,h)=>a+h.pay,0);
  const bestPay = hits.reduce((m,h)=>Math.max(m,h.pay),0);
  add('h3', null, '年間成績');
  row('参加レース', `${played.length} / ${hist.length}戦`);
  row('的中レース', `${hits.length}戦（的中率 ${played.length ? Math.round(hits.length/played.length*100) : 0}%）`);
  row('購入総額', yen(stake));
  row('払戻総額', yen(pay));
  row('回収率', stake ? `${Math.round(pay/stake*100)}%` : '-');
  row('最高払戻', yen(bestPay));
  row('年初の所持金', yen(d.yearStart));
  row(s.status === 'clear' ? '年末の所持金' : '現在の所持金', yen(d.money), d.money >= d.yearStart ? 'plus' : 'minus');
  if(opts.fin) add('div','fin', 'THANK YOU FOR PLAYING');
}

  setTimeout(() => { const r = Records.load(); if(Object.keys(r.trophies || {}).length){ const box = document.createElement('div'); box.className = 'trophies'; renderTrophies(box); $('titleInfo').appendChild(box); } }, 0);
  $('titleInfo').innerHTML = d
    ? `${d.year}年目 ${d.idx+1}戦目から ／ 所持金 ${yen(d.money)} ／ 最高 ${yen(d.best)}`
    : `元手 ${yen(CONFIG.START_MONEY)} で全${CALENDAR.length}戦のG1に挑戦。<br>資金が${yen(CONFIG.MIN_BET)}を切るとゲームオーバー。`;
  show('title');
}
$('btnContinue').onclick = () => { if(Save.data.money < CONFIG.MIN_BET) return endScreen('over'); if(Save.data.idx >= CALENDAR.length) return showCredits(); prepareRace(); };
$('btnNew').onclick = () => { if(Save.data && !confirm('セーブを消して最初から始めますか？')) return; Save.reset(); prepareRace(); };
$('btnToPaddock').onclick = () => { renderPaddock(); show('paddock'); };
$('btnBackPaper').onclick = () => { cancelAnimationFrame(paddockRAF); show('paper'); };
const toBet = () => { cancelAnimationFrame(paddockRAF); renderBet(); show('bet'); };
$('btnToBet').onclick = toBet;
$('btnToBetFromPaper').onclick = toBet;
$('btnBetBack').onclick = () => show('paper');
document.querySelectorAll('#betType button').forEach(b => b.onclick = () => { Game.betType = b.dataset.t; Game.sel = []; renderBet(); });
document.querySelectorAll('#amtBtns button').forEach(b => b.onclick = () => {
  const a = +b.dataset.a; Game.amount = a === 0 ? 0 : Math.min(remaining(), Game.amount + a); renderBet();
});
$('btnAddTicket').onclick = () => {
  Game.tickets.push({ type: Game.betType, sel: Game.betType === 'tri' ? [...Game.sel] : [...Game.sel].sort((a,b)=>a-b), amount: Game.amount, odds: currentOdds() });
  Game.sel = []; Game.amount = 0; renderBet();
};
$('btnStartRace').onclick = startRace;
$('btnSkip').onclick = () => { if(!Race.done){ Race.done = true; clearIntro(); cancelAnimationFrame(Race.raf); showResult(); } };
$('btnNext').onclick = next;
$('btnEndTitle').onclick = titleScreen;

titleScreen();
</script>
</body>
</html>
