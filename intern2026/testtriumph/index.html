<script>
"use strict";
/* =========================================================================
   NEON VANGUARD v2  —  ネオンベクター縦スクロールSTG
   v2: BGM / 扇形ショット / ステージ間格納庫 / ステージ3倍 / 新敵4種
       ボス個性化・攻撃多彩化 / 蛇行レーザー / 難易度調整 / 英語UI(戦闘中)
   ========================================================================= */

/* ---------------- 論理解像度（縦長） ---------------- */
const VW = 480, VH = 800;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1;

function resize(){
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(ww/VW, wh/VH);
  const w = Math.round(VW*scale), h = Math.round(VH*scale);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = VW*dpr; canvas.height = VH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);

/* ---------------- ユーティリティ ---------------- */
const TAU = Math.PI*2;
const rand = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> Math.floor(rand(a,b+1));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const dist2 = (x1,y1,x2,y2)=>{ const dx=x1-x2, dy=y1-y2; return dx*dx+dy*dy; };
function circleHit(a,b){ const r=a.r+b.r; return dist2(a.x,a.y,b.x,b.y) < r*r; }
function fmt(n){ return Math.floor(n).toLocaleString('en-US'); }

/* ---------------- 入力 ---------------- */
const keys = {};
/* v5: 相対ドラッグ操作 — 指を置いた場所からの移動量ぶんだけ自機が動く */
const pointer = { active:false, id:null, px:VW/2, py:VH*0.8, dxAcc:0, dyAcc:0 };
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  Sound.init(); Sound.resume(); Music.unlock();
  handleKeyPress(e.code);
});
addEventListener('keyup', e=>{ keys[e.code]=false; });

function canvasPos(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return { x:(clientX-rect.left)/scale, y:(clientY-rect.top)/scale };
}
/* v23: マルチタッチ対応。
   ドラッグ移動は「最初に画面（ボタン以外）を触った1本の指」だけが担当し、
   その指の identifier を pointer.id に記録する。
   2本目以降の指（左手のボム連打など）はボタン判定にのみ使い、
   移動用の基準座標 pointer.px/py を絶対に書き換えない。
   → 別の指のタップで自機がワープする不具合を防ぐ。 */
const btnTouches = new Set();   /* ボタンを押した指の identifier */
/* v24: ドラッグ中に「2本目の指」で押せるボム用の広いエリア（左下の角） */
const BOMB_ZONE = { w:176, h:176 };
function inBombZone(x,y){ return x < BOMB_ZONE.w && y > VH - BOMB_ZONE.h; }
function pointerDown(x,y,id){
  const p = canvasPos(x,y);
  /* すでに別の指がドラッグ中か？ */
  const secondary = pointer.active && pointer.id !== null && pointer.id !== id;
  /* 2本目の指が左下エリアに触れたら、ボタンを外していてもボム発射。
     移動用の基準座標には一切触れないので、ドラッグ中の自機は動かない。 */
  if(secondary && Game.state===STATE.PLAY && inBombZone(p.x,p.y)){
    btnTouches.add(id);
    Sound.init(); Sound.resume(); Music.unlock();
    Game.click('bomb');
    return;
  }
  const hitBtn = Game.onPointer(p.x, p.y, 'down');
  /* ボタンを押した指はドラッグ担当にしない */
  if(hitBtn){ btnTouches.add(id); return; }
  /* ドラッグ中なら、担当外の指では基準を壊さない */
  if(secondary) return;
  pointer.active = true; pointer.id = (id===undefined? null : id);
  pointer.px = p.x; pointer.py = p.y;
  pointer.dxAcc = 0; pointer.dyAcc = 0;
}
function pointerMove(x,y,id){
  if(!pointer.active) return;
  /* ドラッグ担当の指以外の移動は無視 */
  if(pointer.id !== null && id !== undefined && pointer.id !== id) return;
  const p = canvasPos(x,y);
  pointer.dxAcc += p.x - pointer.px;
  pointer.dyAcc += p.y - pointer.py;
  pointer.px = p.x; pointer.py = p.y;
}
function pointerUp(id){
  btnTouches.delete(id);
  /* 担当外の指が離れてもドラッグは継続 */
  if(pointer.id !== null && id !== undefined && pointer.id !== id) return;
  pointer.active=false; pointer.id=null; pointer.dxAcc=0; pointer.dyAcc=0;
}
/* 担当の指を離した時、画面に残っている別の指（ボタン押下用を除く）へ
   ドラッグ担当を引き継ぐ。座標を基準に取り直すのでワープは起きない。 */
function reanchor(remaining){
  if(pointer.active) return;
  for(const t of remaining){
    if(btnTouches.has(t.identifier)) continue;
    const p = canvasPos(t.clientX, t.clientY);
    pointer.active=true; pointer.id=t.identifier;
    pointer.px=p.x; pointer.py=p.y; pointer.dxAcc=0; pointer.dyAcc=0;
    return;
  }
}

/* v12: 画面のどこを触っても音を解錠する保険（キャンバス外のタップ対策） */
addEventListener('pointerdown', ()=>{ Sound.init(); Sound.resume(); Music.unlock(); }, {passive:true});

canvas.addEventListener('mousedown', e=> pointerDown(e.clientX,e.clientY,'mouse'));
addEventListener('mousemove', e=> pointerMove(e.clientX,e.clientY,'mouse'));
addEventListener('mouseup', ()=> pointerUp('mouse'));
/* タッチは changedTouches を全件処理し、identifier で担当指を判別する */
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches) pointerDown(t.clientX, t.clientY, t.identifier);
}, {passive:false});
addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches) pointerMove(t.clientX, t.clientY, t.identifier);
}, {passive:false});
function onTouchEnd(e){
  e.preventDefault();
  for(const t of e.changedTouches) pointerUp(t.identifier);
  reanchor(e.touches);
}
addEventListener('touchend', onTouchEnd, {passive:false});
addEventListener('touchcancel', onTouchEnd, {passive:false});

/* ---------------- 効果音 (WebAudio 簡易シンセ) ---------------- */
const Sound = {
  ac:null, master:null, muted:false,
  init(){
    if(this.ac) return;
    try{
      this.ac = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.5;
      /* v12: リミッター。音量を上げても重なった時に歪まず、粒立ちが揃う */
      const comp = this.ac.createDynamicsCompressor();
      comp.threshold.value=-12; comp.knee.value=12; comp.ratio.value=6;
      comp.attack.value=0.003; comp.release.value=0.15;
      this.master.connect(comp); comp.connect(this.ac.destination);
    }catch(e){ this.ac=null; }
  },
  resume(){ if(this.ac && this.ac.state==='suspended'){ try{ this.ac.resume(); }catch(e){} } },
  /* v11: 効果音が鳴らなくなる主因＝AudioContextのsuspend。定期的に復帰させる */
  _et:0,
  ensure(){
    if(++this._et < 40) return; this._et=0;
    if(this.ac && this.ac.state!=='running'){ try{ this.ac.resume(); }catch(e){} }
  },
  blip(freq, dur, type='square', vol=0.3, slide=0){
    if(!this.ac || this.muted) return;
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur);
  },
  /* v9: ノイズは1秒バッファを使い回す（毎回生成しないので連射でも軽い） */
  _nbuf:null,
  noiseBuf(){
    if(!this._nbuf){
      const b=this.ac.createBuffer(1,this.ac.sampleRate,this.ac.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      this._nbuf=b;
    }
    return this._nbuf;
  },
  noise(dur, vol=0.4, filterFreq=800){
    if(!this.ac || this.muted) return;
    const t=this.ac.currentTime;
    const src=this.ac.createBufferSource(); src.buffer=this.noiseBuf();
    const f=this.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq;
    const g=this.ac.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random()*0.8); src.stop(t+dur+0.02);
  },
  /* v9: フィルタ付きの汎用オシレータ（音に太さと質感を出す） */
  osc(freq, dur, opt={}){
    if(!this.ac || this.muted) return;
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=opt.type||'square';
    o.frequency.setValueAtTime(freq,t);
    if(opt.to) o.frequency.exponentialRampToValueAtTime(Math.max(30,opt.to), t+dur);
    const vol=opt.vol!==undefined?opt.vol:0.15;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol, t+(opt.atk||0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    let node=o;
    if(opt.filter){
      const f=this.ac.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(opt.filter,t);
      if(opt.filterTo) f.frequency.exponentialRampToValueAtTime(Math.max(60,opt.filterTo), t+dur);
      o.connect(f); node=f;
    }
    node.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.03);
  },

  /* --- 発射: 威力レベルが上がるほど低く・太く・重い音に --- */
  shoot(tier){
    const t=tier||0;
    const base=820-t*74;
    this.osc(base, 0.045+t*0.005, {type:t>=4?'sawtooth':'square', vol:0.17+t*0.010, to:base*0.34, filter:3200+t*450});
    if(t>=1) this.osc(base*0.48, 0.06+t*0.009, {type:'triangle', vol:0.06+t*0.013, to:base*0.2});
    if(t>=5) this.noise(0.05, 0.08, 2600);
  },

  /* --- 敵への着弾: 硬さ(最大HP)と一撃の削り量で音が変わる --- */
  _hitT:-1, _combo:0, _bhitT:-1,
  enemyHit(e, dmg){
    if(!this.ac || this.muted) return;
    const now=this.ac.currentTime;
    if(now-this._hitT < 0.042) return;              // 連射の音つぶれ防止
    this._combo = (now-this._hitT < 0.5) ? Math.min(this._combo+1, 14) : 0;
    this._hitT = now;
    const hard  = clamp((e.maxHp-20)/280, 0, 1);    // 硬い敵ほど金属的
    const chunk = clamp(dmg/Math.max(1,e.maxHp), 0, 1); // 大きく削るほど重い
    const pitch = (300+280*hard) * (1+this._combo*0.02);
    /* v12: 硬さに関係なく必ず聞こえる明るいアタック（1面の柔らかい敵でも手応えが出る） */
    this.osc(pitch*2.1, 0.03, {type:'square', vol:0.11, to:pitch*1.2, filter:6000});
    this.noise(0.022+0.05*hard, 0.11+0.14*hard, 1400+3600*hard);
    this.osc(pitch, 0.035+0.085*hard, {type:hard>0.45?'square':'triangle',
      vol:0.14+0.07*hard+0.07*chunk, to:pitch*0.55, filter:4200});
    if(chunk>0.22) this.osc(125, 0.13, {type:'sawtooth', vol:0.09+0.10*chunk, to:48, filter:900});
  },
  /* --- ボスへの着弾: 分厚い装甲に弾かれる重い金属音 --- */
  bossHit(dmg, b){
    if(!this.ac || this.muted) return;
    const now=this.ac.currentTime;
    if(now-this._bhitT < 0.05) return;
    this._bhitT=now;
    const chunk=clamp(dmg/(b.maxHp*0.015),0,1);
    this.noise(0.05, 0.14+0.12*chunk, 2800);
    this.osc(195, 0.10, {type:'square', vol:0.11+0.07*chunk, to:112, filter:3000});
    this.osc(92, 0.17, {type:'sawtooth', vol:0.09+0.08*chunk, to:46, filter:700});
  },
  /* --- 装甲パネル破壊: 派手な金属クラッシュ --- */
  panelBreak(){
    this.noise(0.22, 0.30, 5200);
    this.osc(430, 0.20, {type:'square', vol:0.10, to:150, filter:6000});
    this.osc(900, 0.14, {type:'triangle', vol:0.06, to:430});
  },
  hit(){ this.osc(240,0.06,{type:'sawtooth',vol:0.09,to:160,filter:2000}); },
  /* --- 撃破: 敵の大きさで爆発の重さが変わる。連鎖でキラッと抜ける --- */
  explode(){ this.noise(0.3, 0.35, 700); this.osc(120,0.25,{type:'sawtooth',vol:0.12,to:50,filter:1200}); },
  explodeAt(e){
    const s=clamp((e.r-8)/16, 0, 1);
    this.noise(0.16+0.30*s, 0.40+0.28*s, 1300-800*s);
    this.osc(200-100*s, 0.20+0.32*s, {type:'sawtooth', vol:0.20+0.12*s, to:40, filter:1500, filterTo:220});
    if(this._combo>2) this.osc(680+this._combo*45, 0.10, {type:'triangle', vol:0.07, to:1500});
  },
  /* --- 被弾 --- */
  shieldHit(){ this.osc(1150,0.10,{type:'square',vol:0.12,to:2500,filter:6000}); this.noise(0.09,0.15,4200); },
  hullHit(){ this.noise(0.16,0.32,700); this.osc(150,0.18,{type:'sawtooth',vol:0.19,to:58,filter:800}); this.osc(320,0.10,{type:'square',vol:0.10,to:120}); },
  /* --- 強化の手応え --- */
  powerUp(){ this.osc(300,0.26,{type:'sawtooth',vol:0.11,to:1250,filter:4200}); this.osc(600,0.30,{type:'triangle',vol:0.07,to:2400}); },
  /* v15: 僚機ビームが敵に当たっている間の連続音 */
  beamHum(){ this.osc(520,0.16,{type:'sawtooth',vol:0.05,to:640,filter:2600}); this.noise(0.10,0.05,3000); },
  /* v18: 撃破シーケンス — 「ガガガガッ！」の連続破裂音 */
  deathRattle(){
    this.noise(0.08, 0.44, 2200);
    this.osc(rand(170,220), 0.10, {type:'square', vol:0.20, to:85, filter:2500});
  },
  /* v18: 「ドーン！」の大爆発（scaleで規模を変える）— v23で増量 */
  finalBoom(scale){
    const s=scale||1;
    this.noise(0.9*s, 0.85, 360);
    this.osc(155, 0.75*s, {type:'sawtooth', vol:0.38, to:32, filter:1700, filterTo:110});
    this.osc(72, 1.1*s, {type:'sine', vol:0.34, to:26});
    setTimeout(()=>this.noise(0.6*s, 0.46, 900), 100);
    setTimeout(()=>this.noise(0.5*s, 0.28, 500), 260);
  },
  /* v18: 自機被撃墜の重い一撃 — v23で増量 */
  playerDown(){
    this.noise(0.36, 0.62, 480);
    this.osc(112, 0.42, {type:'sawtooth', vol:0.36, to:42, filter:700});
    this.osc(300, 0.18, {type:'square', vol:0.18, to:85});
    this.osc(60, 0.6, {type:'sine', vol:0.26, to:34});
  },
  /* v23: ボス登場サイレン */
  siren(){
    this.osc(440, 0.55, {type:'sawtooth', vol:0.13, to:880, filter:3200});
    this.osc(220, 0.55, {type:'square', vol:0.08, to:440});
  },
  /* v23: ステージ開始のチャイム */
  stageStart(){
    [392,523,659,784].forEach((f,i)=> setTimeout(()=>{
      this.osc(f,0.35,{type:'triangle',vol:0.16,filter:5000});
      this.osc(f*2,0.25,{type:'sine',vol:0.08});
    }, i*90));
    setTimeout(()=>this.noise(0.5,0.12,5000), 300);
  },
  /* v23: 最終ボス出現の地鳴り */
  rumble(dur){
    this.osc(42, dur||1.6, {type:'sine', vol:0.34, to:30});
    this.osc(58, (dur||1.6)*0.8, {type:'sawtooth', vol:0.16, to:36, filter:400});
    this.noise((dur||1.6)*0.9, 0.22, 260);
  },
  /* v23: クリアの大ファンファーレ */
  victoryFanfare(){
    if(!this.ac || this.muted) return;
    [[523,0],[659,95],[784,190],[1047,285]].forEach(([f,d])=> setTimeout(()=>{
      this.osc(f,0.55,{type:'sawtooth',vol:0.20,filter:5200});
      this.osc(f*2,0.42,{type:'triangle',vol:0.12});
      this.osc(f/2,0.62,{type:'square',vol:0.10,filter:2000});
    }, d));
    setTimeout(()=>{
      [523,659,784,1047,1319].forEach((f,i)=> setTimeout(()=>{
        this.osc(f,1.5,{type:'sawtooth',vol:0.16,filter:6200});
        this.osc(f*2,1.2,{type:'triangle',vol:0.09});
      }, i*45));
      this.noise(1.3,0.34,6500);                       // シンバル
      this.osc(65,1.3,{type:'sine',vol:0.34,to:52});   // ティンパニ
    }, 430);
    setTimeout(()=>{ this.noise(0.9,0.26,4200); this.osc(1568,1.0,{type:'triangle',vol:0.13}); }, 1050);
    setTimeout(()=>{ this.osc(1047,1.6,{type:'sawtooth',vol:0.14,filter:7000}); this.osc(1319,1.6,{type:'triangle',vol:0.10}); this.osc(1568,1.6,{type:'sine',vol:0.08}); }, 1700);
  },
  /* v18: 「プスプス」と不調を起こす小さな破裂 */
  sputter(){
    this.noise(0.06, 0.17, 1300);
    this.osc(rand(200,280), 0.07, {type:'square', vol:0.09, to:110, filter:1800});
  },
  buyMax(){ [523,659,784,1047].forEach((f,i)=> setTimeout(()=>this.osc(f,0.18,{type:'triangle',vol:0.15,filter:5200}), i*70)); },
  bigExplode(){ this.noise(0.7, 0.85, 500); this.blip(80,0.6,'sawtooth',0.34,-40); },
  pickup(){ this.blip(660,0.08,'triangle',0.18,300); this.blip(990,0.09,'triangle',0.14,300); },
  buy(){ this.blip(523,0.08,'square',0.2); setTimeout(()=>this.blip(784,0.12,'square',0.2),70); },
  deny(){ this.blip(160,0.15,'square',0.2,-40); },
  bomb(){ this.noise(0.6,0.6,1600); this.blip(200,0.5,'sawtooth',0.2,-120); },
  boss(){ this.blip(90,0.9,'sawtooth',0.25,60); },
  laser(){ this.blip(1400,0.08,'sawtooth',0.06,-900); },
  transform(){ this.blip(110,1.2,'sawtooth',0.3,400); this.noise(1.0,0.4,2000); }
};

/* ---------------- BGM (bgm/ フォルダの mp3) ----------------
   v6: モバイル対応強化
   - warmup: 最初のタップで全トラックを無音再生→即停止して「解錠」
     (iOS/Androidはユーザー操作内で一度playしたAudioしか後から鳴らせないため、
      中ボス/ラスボスなど途中で切り替わる曲が鳴らない問題の根本対策)
   - ミュート: iOSはvolume変更が効かないため、停止/再開方式に変更 */
const Music = {
  vol:0.40, cur:null, name:null, pending:null, cache:{}, warmed:false,   /* v12: 効果音が埋もれないよう控えめに */
  files:{
    opening:'bgm/opening.mp3',
    stage0:'bgm/stage1.mp3', stage1:'bgm/stage2.mp3', stage2:'bgm/stage3.mp3',
    boss0:'bgm/boss1.mp3', boss1:'bgm/boss2.mp3', boss2:'bgm/boss3.mp3',
    midboss:'bgm/chuboss.mp3',
    final:'bgm/boss_final.mp3', ending:'bgm/ending.mp3'
  },
  get(name){
    let a=this.cache[name];
    if(!a){
      const src=this.files[name]; if(!src) return null;
      try{ a=new Audio(src); }catch(e){ return null; }
      a.loop=true; a.preload='auto'; a.onerror=()=>{};
      this.cache[name]=a;
    }
    return a;
  },
  /* v11: 世代番号(gen)で「古い再生要求」を無効化し、二重再生を根絶する */
  gen:0, _tick:0,
  /* キャッシュ内の全トラックを確実に停止（cur以外の鳴り残しも潰す） */
  stopAll(){
    for(const k in this.cache){
      const a=this.cache[k];
      try{ if(!a.paused) a.pause(); }catch(e){}
    }
    this.cur=null;
  },
  play(name){
    if(!this.files[name]) return;
    this.name=name;                 // ミュート中でも「今の曲」は覚えておく
    this.pending=null;
    const gen=++this.gen;
    if(Sound.muted){ this.stopAll(); return; }
    const a=this.get(name); if(!a) return;
    if(this.cur===a && !a.paused) return;   // 同じ曲が既に鳴っていれば何もしない
    this.stopAll();
    if(this.gen!==gen) return;              // 待っている間に別の曲が要求されたら中止
    a.muted=false; try{ a.volume=this.vol; }catch(e){}
    try{ a.currentTime=0; }catch(e){}
    this.cur=a;
    const pr=a.play();
    if(pr && pr.catch) pr.catch(()=>{
      /* 自動再生ブロック時だけ「後で鳴らす曲」に登録。
         曲の切り替えで中断された古い再生は gen が古いので無視される */
      if(this.gen===gen && this.name===name) this.pending=name;
    });
  },
  stopCur(){ this.stopAll(); },
  stop(){ this.gen++; this.stopAll(); this.name=null; this.pending=null; },
  unlock(){
    this.warmup();
    if(Sound.muted) return;
    const want = this.pending || this.name;
    this.pending = null;
    if(!want) return;
    const a=this.cache[want];
    if(!a || a.paused) this.play(want);
  },
  warmup(){
    if(this.warmed) return; this.warmed=true;
    for(const k in this.files){
      const a=this.get(k); if(!a || a===this.cur) continue;
      a.muted=true;
      let pr; try{ pr=a.play(); }catch(e){ a.muted=false; continue; }
      if(pr && pr.then){
        pr.then(()=>{
          /* 解錠が目的。いま流すべき曲なら止めない */
          if(this.cur===a || this.name===k){ a.muted=false; return; }
          try{ a.pause(); a.currentTime=0; }catch(e){}
          a.muted=false;
        }).catch(()=>{ a.muted=false; });
      } else { try{ a.pause(); a.currentTime=0; }catch(e){} a.muted=false; }
    }
  },
  /* 毎フレーム呼ぶ保険: 二重再生の掃除と、止まってしまった曲の復帰 */
  tick(){
    if(++this._tick < 45) return;
    this._tick=0;
    if(Sound.muted) return;
    for(const k in this.cache){
      const a=this.cache[k];
      if(a!==this.cur && !a.paused){ try{ a.pause(); }catch(e){} }
    }
    if(this.name && !this.pending && (!this.cur || this.cur.paused)){
      const a=this.cache[this.name];
      if(a && a.readyState>=2) this.play(this.name);
    }
  },
  setMuted(m){
    if(m){ this.gen++; this.stopAll(); }
    else if(this.name){ const n=this.name; this.name=null; this.play(n); }
  }
};

/* ---------------- セーブ (localStorage) ---------------- */
const SAVE_KEY = 'neon_vanguard_save_v1';
const Save = {
  data:{ credits:0, up:{}, best:0, cleared:false, muted:false, runs:0, ext:0, od:0 },
  load(){
    try{ const s=localStorage.getItem(SAVE_KEY); if(s) this.data=Object.assign(this.data, JSON.parse(s)); }catch(e){}
    if(!this.data.up) this.data.up={};
    // v2: スピード強化は廃止 → 購入済み分は返金
    if(this.data.up.speed){
      let refund=0; for(let l=0;l<this.data.up.speed;l++) refund+=Math.round(90*Math.pow(1.7,l));
      this.data.credits += refund; delete this.data.up.speed; this.save();
    }
    Sound.muted = !!this.data.muted;
  },
  save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); }catch(e){} },
  reset(){ this.data={ credits:0, up:{}, best:0, cleared:false, muted:Sound.muted, runs:0, ext:0, od:0 }; this.save(); }
};

/* ---------------- 強化 (ショップ定義) v2: speed廃止・扇形武器 ----------------
   v29: 説明はすべて実数値付き。desc=ショップ用の短い表記 / spec=エンドロール用の詳細。
   数値は playerStats() と同じ式から出しているので、調整すると表示も自動で追従する。 */
function fireIntervalAt(r){ return Math.max(78, 210 - r*24 - (r>=5?12:0)); }
function dmgAt(p){ return 9 + p*6 + (p>=6?10:0) + (p>=7?14:0); }
const SHIELD_DELAY = [0, 660, 300, 225, 185];        // 回復開始までのフレーム
const SHIELD_REGEN = [0, 0.045, 0.20, 0.32, 0.44];   // 毎フレーム回復量
const WAY_N = [1,2,3,5,7,9,11];                      // メインショットの同時発射数
const BOMB_DMG = 130, BOMB_BOSS_DMG = 240;

const UPGRADES = [

    spec:(l)=> (l>=6?'11way大扇 同時11発 ★強化弾'
                    : ['単発 同時1発','2連射 同時2発','3way扇 同時3発','5way扇 同時5発','7way扇 同時7発','9way扇 同時9発'][l]) },

    desc:(l)=> (l>=7?'★★':(l>=6?'★':''))+'1発 '+dmgAt(l)+' ダメージ',
    spec:(l)=> '1発 '+dmgAt(l)+' ダメージ（Lv0比'+(dmgAt(l)/dmgAt(0)).toFixed(1)+'倍）'
               +(l>=7?' ★★限界突破':(l>=6?' ★最終':'')) },

      : ('バリア'+(l*40)+' / 被弾'+(SHIELD_DELAY[l]/60).toFixed(1)+'秒後に毎秒'+(SHIELD_REGEN[l]*60).toFixed(1)+'回復') },

    spec:(l)=> '出撃時 '+l+'個 — 全画面'+BOMB_DMG+' / ボス'+BOMB_BOSS_DMG+' ダメージ' },

  { id:'missile', name:'ホーミング',     max:3, base:340, ext:true,
    desc:(l)=> l>0?('追尾ミサイル x'+l+' / 1発 '+Math.round(dmgAt(upLevel('power'))*1.4)):'なし',
    spec:(l)=> l>0?('1.5秒ごとに '+l+'発 — 1発 本体火力の1.4倍'+(l>=4?' ★★':'')):'なし' },

  { id:'greed',   name:'クレジット獲得', max:4, base:260,
    desc:(l)=> '+'+(l*20)+'% 取得',
    spec:(l)=> '取得クレジット +'+(l*20)+'%（1.'+(l*2)+'倍）' },
];
function upLevel(id){ return Save.data.up[id]||0; }
/* v15: 全項目カンストしているか（最終決戦のオーバードライブ条件） */
/* v20: 限界突破（フル強化でラスボスに敗北すると解放される追加レベル）
   火力・ホーミング・シールドの上限が+1され、全部上げ切るとオーバードライブが40%になる */
function extOn(){ return (Save.data.ext||0) > 0; }
function upMax(u){ return u.max + ((extOn() && u.ext) ? 1 : 0); }
/* 基本カンスト = オーバードライブ発動条件 */
function isFullyUpgraded(){ return UPGRADES.every(u=> upLevel(u.id) >= u.max); }
/* 限界突破ぶんも含めたカンスト = オーバードライブ強化条件 */
function isExtMaxed(){ return extOn() && UPGRADES.every(u=> upLevel(u.id) >= upMax(u)); }
function odMul(){ return isExtMaxed() ? 1.4 : 1.3; }
/* v28: 常時オーバードライブ — 限界突破カンスト後に ◈100,000c で恒久解放 */
const OD_COST = 100000;
function odAlways(){ return (Save.data.od||0) > 0; }
function odBuyable(){ return isExtMaxed() && !odAlways(); }
/* オーバードライブ中は火力・シールドが3割（限界突破カンストなら4割）増し */
function powerMul(){ return Game.overdrive ? odMul() : 1; }
/* v13: 強化コストを急カーブ化。最終段階だけさらに重くして「最後の一押し」を目標にする
   （全項目カンストまでの総額は約7.4万c ＝ 従来の約3倍） */
function upCost(u){
  const l=upLevel(u.id);
  const finalMul = (l === upMax(u)-1) ? 2.2 : 1;
  return Math.round(u.base*Math.pow(1.95,l)*finalMul);
}
function upMaxed(u){ return upLevel(u.id) >= upMax(u); }

/* プレイヤー派生ステータス */
function playerStats(){
  const w=upLevel('weapon'), r=upLevel('rate'), p=upLevel('power');
  /* v4: 最終レベルだけ大きく伸びる（最後の1個がパワースパイク） */
  const sl = upLevel('shield');
  return {
    maxHP: 100 + upLevel('hp')*40,
    fireInterval: fireIntervalAt(r),
    dmg: dmgAt(p),
    weapon: w,
    wings: upLevel('wing'),
    shield: sl,
    /* v7: シールド自動回復はレベル依存。Lv1は遅く、Lv3(最大)で従来の約8割の性能 */
    /* v22: Lv1は自動回復をごく僅かに（実質1回きりの盾）。Lv2以降は据え置き */
    shieldDelay: SHIELD_DELAY[sl],          // 回復開始までのフレーム数
    shieldRegenRate: SHIELD_REGEN[sl],      // 毎フレーム回復量
    bombs: upLevel('bomb'),
    missiles: upLevel('missile'),
    speed: 5.0,
    greed: 1 + upLevel('greed')*0.2,
  };
}

/* ---------------- v8: 威力レベル別の弾ビジュアル ----------------
   火力Lv(+武器最終Lv)に応じて 色・太さ・長さ・発光・紫のプラズマ光輪 が段階的に強化される */
const BULLET_TIERS = [
  {c:'#3f9bff', core:'#cfefff', w:3.0, len:10.0, glow:8,  halo:0},
  {c:'#4fc4ff', core:'#dff6ff', w:3.5, len:11.5, glow:11, halo:0},
  {c:'#6bdcff', core:'#eafcff', w:4.0, len:13.0, glow:14, halo:0},
  {c:'#8af0ff', core:'#ffffff', w:4.6, len:15.0, glow:17, halo:0.35},
  {c:'#a9f6ff', core:'#ffffff', w:5.3, len:17.0, glow:21, halo:0.55},
  {c:'#d6f2ff', core:'#ffffff', w:6.1, len:19.5, glow:26, halo:0.8},
  {c:'#ffffff', core:'#ffffff', w:7.0, len:22.0, glow:32, halo:1.0},
];
function bulletTier(){
  return clamp(upLevel('power') + (upLevel('weapon')>=6?1:0), 0, 6);
}
/* 弾の形（先端が尖り、後方が丸いエネルギーボルト） */
function bulletShape(w,len){
  const hw=w/2, h=len/2;
  ctx.beginPath();
  ctx.moveTo(0,-h);
  ctx.lineTo(hw,-h*0.3);
  ctx.lineTo(hw, h*0.62);
  ctx.quadraticCurveTo(0, h*1.1, -hw, h*0.62);
  ctx.lineTo(-hw,-h*0.3);
  ctx.closePath();
}
function drawBoltAt(x,y,tier,color){
  const T=BULLET_TIERS[tier]||BULLET_TIERS[0];
  ctx.save(); ctx.translate(x,y);
  if(T.halo>0){ ctx.globalAlpha=0.32*T.halo; ctx.shadowBlur=T.glow*1.3; ctx.shadowColor='#b58cff'; ctx.fillStyle='#b58cff';
    bulletShape(T.w*1.95,T.len*1.12); ctx.fill(); ctx.globalAlpha=1; }
  ctx.shadowBlur=T.glow; ctx.shadowColor=color||T.c; ctx.fillStyle=color||T.c;
  bulletShape(T.w,T.len); ctx.fill();
  ctx.shadowBlur=T.glow*0.5; ctx.shadowColor=T.core; ctx.fillStyle=T.core;
  bulletShape(T.w*0.42,T.len*0.72); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0;
}

/* ---------------- パーティクル ---------------- */
const particles = [];
function spawnParticle(x,y,color,opt={}){
  if(particles.length>520) return;
  particles.push({
    x,y,
    vx: opt.vx!==undefined?opt.vx:rand(-2,2),
    vy: opt.vy!==undefined?opt.vy:rand(-2,2),
    life: opt.life||rand(20,40), max: opt.life||40,
    r: opt.r||rand(1.5,3.5), color, glow: opt.glow!==false,
    fric: opt.fric||0.94, smoke: !!opt.smoke, grow: opt.grow||0
  });
}
/* v8: 着弾スパーク（威力レベルが高いほど派手に散る） */
function hitSpark(b){
  const t=b.tier||0, T=BULLET_TIERS[t];
  const n=1+Math.floor(t/2);
  for(let i=0;i<n;i++){
    spawnParticle(b.x,b.y, i%2?T.core:T.c,
      {vx:rand(-1.4,1.4)*(1+t*0.18), vy:rand(-1.4,0.6)*(1+t*0.18),
       life:rand(8,15)+t, r:rand(1.4,2.4)+t*0.22});
  }
}
function burst(x,y,color,count,speed=3){
  for(let i=0;i<count;i++){
    const a=rand(0,TAU), s=rand(0.3,1)*speed;
    spawnParticle(x,y,color,{vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(24,48), r:rand(1.5,4)});
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=p.fric; p.vy*=p.fric;
    p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha = p.smoke ? a*0.45 : a;
    if(p.glow){ ctx.shadowBlur=12; ctx.shadowColor=p.color; } else { ctx.shadowBlur=0; }
    ctx.fillStyle=p.color;
    const rr = p.grow ? p.r*(1+(1-a)*p.grow) : p.r;
    ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

   v18: 撃破演出の基盤 — 破片(デブリ)と衝撃波リング
   ========================================================================= */
const debris=[];
function spawnDebris(x,y,count,opt){
  opt=opt||{};
  for(let i=0;i<count;i++){

      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - rand(0,0.8),

    });

}
function updateDebris(dt){
  const p=Game.player;
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=0.035*dt; d.vx*=0.995; d.rot+=d.rotSpd*dt;
    d.life-=dt;
    if(d.hot && Math.random()<0.28) spawnParticle(d.x,d.y,d.color,{vx:rand(-.3,.3),vy:rand(-.3,.3),life:rand(6,14),r:rand(1,2)});
    if(d.dmg>0 && p && !p.dying && p.inv<=0 && !cineLock() && dist2(d.x,d.y,p.x,p.y) < (d.r*0.7+p.r)*(d.r*0.7+p.r)){
      playerHit(d.dmg); d.life=0;
      burst(d.x,d.y,d.color,10,3);
    }
    if(d.life<=0 || d.y>VH+40 || d.x<-40 || d.x>VW+40) debris.splice(i,1);
  }
}
function drawDebris(){
  for(const d of debris){
    const a=clamp(d.life/d.max,0,1);

    ctx.globalAlpha=a; ctx.shadowBlur=12; ctx.shadowColor=d.color;
    ctx.strokeStyle=d.color; ctx.lineWidth=2; ctx.fillStyle='rgba(255,180,90,0.18)';
    ctx.beginPath();
    ctx.moveTo(0,-d.r); ctx.lineTo(d.r*0.72,d.r*0.35); ctx.lineTo(-d.r*0.5,d.r*0.62);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}
/* 衝撃波リング */
const shocks=[];
function addShock(x,y,max,color){ shocks.push({x,y,r:10,max:max||260,color:color||'#fff',life:1}); }
function updateShocks(dt){
  for(let i=shocks.length-1;i>=0;i--){
    const s=shocks[i];
    s.r += (s.max-s.r)*0.09*dt + 2*dt;
    s.life -= 0.022*dt;
    if(s.life<=0) shocks.splice(i,1);
  }
}
function drawShocks(){
  for(const s of shocks){
    ctx.save(); ctx.globalAlpha=clamp(s.life,0,1)*0.75;
    ctx.shadowBlur=24; ctx.shadowColor=s.color; ctx.strokeStyle=s.color;
    ctx.lineWidth=3+6*clamp(s.life,0,1);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.stroke(); ctx.restore();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

/* v14: ボス戦が長引くほど敵弾が速くなる（ステージ2以降のボス／最終ボス） */
function rageSpeedMul(){
  const b=Game.boss;
  if(!b || b.entering || b.dead) return 1;
  if(!b.isGreat && Game.stageIndex<1) return 1;
  return 1 + (b.rage||0)*0.5;

/* v25: ボス登場カットイン／変身演出のあいだは戦闘を完全停止する。
   敵は弾を撃たず、こちらの攻撃もボスに通らない。演出が終わってから戦闘再開。 */
function cineLock(){
  const c=Game.cine;
  return !!c && (c.type==='boss' || c.type==='final' || c.type==='od');
}
function eb(x,y,vx,vy,opt){
  if(cineLock()) return;                 // 演出中は敵弾を出さない
  opt=opt||{};
  const rm=rageSpeedMul(); vx*=rm; vy*=rm;
  eBullets.push({x,y,vx,vy, r:opt.r||5, color:opt.color||'#ff5a7a', dmg:Math.round((opt.dmg||16)*dmgScale()),
    life:opt.life||300, t:0, wave:opt.wave||null, ax:opt.ax||0, ay:opt.ay||0,
    acc: opt.acc!==undefined?opt.acc:(ACC_MUL[Game.stageIndex]||0),
    accMax: opt.accMax!==undefined?opt.accMax:(ACC_CAP[Game.stageIndex]||1.8), mult:1});
}
function enemyBullet(x,y,vx,vy,r,color,dmg){ eb(x,y,vx,vy,{r:r,color:color,dmg:dmg}); }

/* ---------------- ゲーム状態 ---------------- */
const STATE = { TITLE:'title', HOWTO:'howto', HANGAR:'hangar', PLAY:'play', PAUSE:'pause', OVER:'over', WIN:'win', CREDITS:'credits' };

const Game = {
  state: STATE.TITLE,
  t:0, dt:1, last:0, shake:0, flash:0, flashColor:'#fff',
  player:null, wingmen:[], enemies:[], boss:null, helpers:[], helperIdx:0, overdrive:false,
  stageIndex:0, score:0, runCredits:0, message:null, messageT:0,
  midRun:false, pendingStage:0, stageClearMsgT:0, cine:null, odT:0,
  buttons:[], bg:null, lastGain:0, shopMsg:'', shopMsgT:0,

  start(){
    Save.load();
    resize();
    this.bg = makeStarfield();
    this.state = STATE.TITLE;
    this.last = performance.now();
    Music.play('opening');
    requestAnimationFrame(loop);
  },

  /* ---- 新規出撃 ---- */
  launch(){
    Sound.init(); Sound.resume();
    this.midRun=false;
    this.carryHP=null; this.carryShield=null;   // v4: 新規出撃は満タン
    this.score=0; this.runCredits=0;
    Save.data.runs++;
    this.beginStage(0);
  },

  /* ---- ステージ間格納庫から次ステージへ ---- */
  resumeNext(){
    Sound.init(); Sound.resume();
    this.midRun=false;
    this.beginStage(this.pendingStage, true);
  },

  beginStage(stage, carry){
    const st = playerStats();
    this.player = {
      x:VW/2, y:VH*0.82, r:9, hp:st.maxHP, maxHP:st.maxHP,
      inv:0, fireCd:0, missileCd:0, bombs:st.bombs, bombFlash:0,
      shieldHP: st.shield*40, shieldMax: st.shield*40, shieldRegen:0, st
    };
    /* v4: ステージ間はHP/シールドを持ち越し（全回復しない） */
    if(carry && this.carryHP!=null){
      this.player.hp = Math.min(st.maxHP, this.carryHP);
      this.player.shieldHP = Math.min(this.player.shieldMax, this.carryShield||0);
    }
    this.wingmen=[];
    for(let i=0;i<st.wings;i++){
      this.wingmen.push({x:VW/2, y:VH*0.9, side: i===0?-1:1, r:7, fireCd:0});
    }
    this.enemies=[]; this.boss=null; this.helpers=[]; this.helperIdx=0; this.overdrive=false;
    /* v28: 常時オーバードライブを購入済みなら、最初から金色形態で出撃する */
    if(odAlways()){
      this.overdrive = true;
      const p=this.player;
      p.shieldMax = Math.round(st.shield*40*odMul());
      p.shieldHP  = (carry && this.carryHP!=null) ? Math.min(p.shieldMax, this.carryShield||0) : p.shieldMax;
    }
    pBullets.length=0; eBullets.length=0;
    particles.length=0; floats.length=0; debris.length=0; shocks.length=0;
    this.stageIndex=stage;
    Director.begin(stage);
    this.state = STATE.PLAY;
    this.cine=null; this.odT=0; this.message=null; this.messageT=0;
    /* v23: 何ステージに入ったかがハッキリ分かる開幕カットイン */
    this.startCine('stage', 'STAGE '+(stage+1), STAGES[stage].name, 165);
    Sound.stageStart();
    Music.play('stage'+stage);
  },

  /* ---- ステージクリア → 格納庫（強化タイム） ---- */
  stageClear(nextStage){
    /* v4: 現在のHP/シールドを記録して持ち越す */
    this.carryHP = this.player ? this.player.hp : null;
    this.carryShield = this.player ? this.player.shieldHP : 0;
    const gain = Math.round(this.runCredits);
    Save.data.credits += gain; this.runCredits=0;
    if(nextStage+1 > Save.data.best) Save.data.best = nextStage+1;
    Save.save();
    this.lastGain = gain;
    this.midRun = true; this.pendingStage = nextStage;
    this.stageClearMsgT = 200;
    this.cine=null;
    this.state = STATE.HANGAR;
    Music.play('opening');
  },

  endRun(win){
    const gain = Math.round(this.runCredits);
    Save.data.credits += gain; this.runCredits=0;
    if(this.stageIndex+1 > Save.data.best) Save.data.best = this.stageIndex+1;
    if(win){ Save.data.cleared=true; }
    /* v20: フル強化でラスボスに敗れると「限界突破」が解放される */
    this.extUnlocked = false;
    if(!win && this.overdrive && !(Save.data.ext>0)){
      Save.data.ext = 1;
      this.extUnlocked = true;
    }
    Save.save();
    this.lastGain = gain;
    this.midRun=false;
    this.cine=null; this.odT=0;
    if(win){
      /* v28: クリア後はまず映画風のエンドロール、その後エンディング画面へ */
      this.state = STATE.CREDITS;
      this.roll = { t:110, lines:buildCreditRoll(), h:0 };   // 頭の空白を省いてすぐタイトルが出る
      this.roll.h = this.roll.lines.reduce((a,l)=>a+l.h, 0);
      Music.play('ending');
      this.winT=0; this.fwCd=0;
      this.doFlash('#fff8dc',1.0); this.screenShake(20);
    } else {
      this.state = STATE.OVER;
      Music.stop();
    }
  },

  /* v28: エンドロール終了 → エンディング画面 */
  finishCredits(){
    if(this.state!==STATE.CREDITS) return;
    this.state = STATE.WIN;
    this.winT=0; this.fwCd=0;
    this.doFlash('#fff8dc',1.0); this.screenShake(20);
    Sound.victoryFanfare();                      // クリアの大ファンファーレ
    for(let i=0;i<3;i++) setTimeout(()=>addShock(VW/2, VH*0.45, 420, i%2?'#fff':'#ffd76a'), i*220);
    if(!Music.cur || Music.cur.paused) Music.play('ending');
  },

  setMessage(a,b,dur){ this.message={a,b}; this.messageT=dur; },
  /* v23: 登場カットイン（ステージ開始 / ボス登場 / ラスボス降臨） */
  startCine(type,a,b,dur){
    this.cine={type,a,b,t:0,dur:dur||150};
    /* 戦闘停止系の演出に入るときは、画面に残っている敵弾も消して完全に手を止める */
    if(type==='boss'||type==='final'||type==='od') eBullets.length=0;
  },
  addCredits(v){ const g=v*(this.player?this.player.st.greed:1); this.runCredits+=g; return g; },
  screenShake(v){ this.shake=Math.min(this.shake+v, 26); },
  doFlash(c,v){ this.flashColor=c; this.flash=Math.max(this.flash,v); },

  bombBlast(){
    const p=this.player;
    if(!p || p.bombs<=0){ Sound.deny(); return; }
    p.bombs--; p.bombFlash=1; Sound.bomb();
    this.doFlash('#bff',0.9); this.screenShake(18);
    eBullets.length=0;
    for(const e of this.enemies){ damageEnemy(e, BOMB_DMG, e.x,e.y); }
    if(this.boss) damageBoss(BOMB_BOSS_DMG);
    for(const h of this.helpers.slice()) damageBossObj(h, BOMB_BOSS_DMG);
    for(let i=0;i<60;i++) burst(rand(0,VW),rand(0,VH*0.8), '#8ff', 3, 4);
  },

  onPointer(x,y,phase){
    if(phase==='down'){
      Sound.init(); Sound.resume(); Music.unlock();
      for(const b of this.buttons){
        if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ this.click(b.id); return true; }
      }
    }
    return false;
  },

  click(id){
    if(id==='start'){ this.gotoHangar(); }
    else if(id==='howto'){ this.state=STATE.HOWTO; }
    else if(id==='back'){ this.state=STATE.TITLE; }
    else if(id==='launch'){ if(this.midRun) this.resumeNext(); else this.launch(); }
    else if(id==='mute'){ Sound.muted=!Sound.muted; Save.data.muted=Sound.muted; Save.save(); Music.setMuted(Sound.muted); }
    else if(id==='reset'){ if(confirmReset()){ Save.reset(); } }
    else if(id==='hangar'){ this.midRun=false; this.gotoHangar(); }
    else if(id==='title'){ this.midRun=false; this.state=STATE.TITLE; Music.play('opening'); }
    else if(id==='resume'){ this.state=STATE.PLAY; }
    else if(id.startsWith('buy:')){ this.buy(id.slice(4)); }
    else if(id==='buyod'){ this.buyOverdrive(); }
    else if(id==='skiproll'){ this.finishCredits(); }
    else if(id==='bomb'){ this.bombBlast(); }
    else if(id==='pause'){ this.state = this.state===STATE.PLAY?STATE.PAUSE:STATE.PLAY; }
  },

  gotoHangar(){ this.state=STATE.HANGAR; Music.play('opening'); },

  buy(uid){
    const u = UPGRADES.find(x=>x.id===uid); if(!u) return;
    if(upMaxed(u)){ Sound.deny(); return; }
    const c=upCost(u);
    if(Save.data.credits < c){ Sound.deny(); this.shopMsg='クレジット不足'; this.shopMsgT=60; return; }
    Save.data.credits-=c; Save.data.up[uid]=upLevel(uid)+1; Save.save();
    /* v9: 最大まで上げ切ると勝利ファンファーレ、火力系は上昇スイープ */
    if(upMaxed(u)) Sound.buyMax();
    else if(uid==='power'||uid==='weapon'||uid==='rate') Sound.powerUp();
    else Sound.buy();
  },

  /* v28: 常時オーバードライブの購入 */
  buyOverdrive(){
    if(odAlways() || !isExtMaxed()){ Sound.deny(); return; }
    if(Save.data.credits < OD_COST){
      Sound.deny(); this.shopMsg='クレジット不足（◈'+fmt(OD_COST)+'c 必要）'; this.shopMsgT=90; return;
    }
    Save.data.credits -= OD_COST; Save.data.od = 1; Save.save();
    Sound.buyMax(); Sound.victoryFanfare();
    this.shopMsg='★ 常時オーバードライブ 解放！'; this.shopMsgT=150;
    this.doFlash('#ffd76a',0.85);
  },
};

function handleKeyPress(code){
  if(code==='Enter' || code==='Space'){
    if(Game.state===STATE.TITLE){ Game.gotoHangar(); }
    else if(Game.state===STATE.HANGAR){ Game.click('launch'); }
    else if(Game.state===STATE.CREDITS){ Game.finishCredits(); }
    else if(Game.state===STATE.OVER || Game.state===STATE.WIN){ Game.click('hangar'); }
    else if(Game.state===STATE.HOWTO){ Game.state=STATE.TITLE; }
  }
  if(code==='KeyB' && Game.state===STATE.PLAY){ Game.bombBlast(); }
  if(code==='KeyP' && (Game.state===STATE.PLAY||Game.state===STATE.PAUSE)){ Game.click('pause'); }
  if(code==='KeyM'){ Game.click('mute'); }
}
function confirmReset(){ return window.confirm('進行データ（クレジット・強化）をリセットしますか？'); }

/* =========================================================================
   敵の定義と behavior（v2: 新敵4種・攻撃強化）
   ========================================================================= */
const ENEMY_DEF = {
  grunt:    { r:14, hp:26, color:'#6cf', credit:8,  score:100, dmg:22, drop:0.09 },
  weaver:   { r:13, hp:32, color:'#5fe', credit:11, score:130, dmg:22, drop:0.11 },
  turret:   { r:16, hp:50, color:'#8af', credit:16, score:180, dmg:20, drop:0.15 },
  bomber:   { r:19, hp:78, color:'#a9f', credit:24, score:250, dmg:24, drop:0.18 },
  kamikaze: { r:13, hp:22, color:'#f86', credit:10, score:140, dmg:30, drop:0.09 },
  splitter: { r:20, hp:66, color:'#df6', credit:20, score:220, dmg:24, drop:0.16 },
  mini:     { r:9,  hp:13, color:'#df6', credit:5,  score:60,  dmg:18, drop:0.04 },
  shield:   { r:17, hp:130,color:'#7ff', credit:30, score:320, dmg:24, drop:0.22 },
  mine:     { r:12, hp:20, color:'#fd6', credit:9,  score:110, dmg:26, drop:0.08 },
  sniper:   { r:13, hp:55, color:'#f6f', credit:20, score:260, dmg:22, drop:0.16 },
  orbiter:  { r:14, hp:52, color:'#6fa', credit:18, score:240, dmg:22, drop:0.14 },
  carrier:  { r:24, hp:170,color:'#fa6', credit:40, score:420, dmg:26, drop:0.28 },
  dasher:   { r:13, hp:28, color:'#6ef', credit:12, score:160, dmg:24, drop:0.10 },
};
function makeEnemy(kind, x, y, opt={}){
  const base = ENEMY_DEF[kind];
  /* v3: 同一ステージ内でも後半ウェーブほど少し固くなる */
  const ramp = 1 + Math.min(Director.step||0,20)*0.04;
  const hp0 = base.hp*(opt.hpMul||1)*ramp;
  return {
    kind, x, y, r:base.r, hp:hp0, maxHp:hp0,
    color:base.color, credit:base.credit, dmg:base.dmg||20,
    t:0, mt:0, fireCd:rand(50,110), vx:0, vy:0, angle:0,
    entered:false, targetY: opt.targetY!==undefined?opt.targetY: rand(80,220),
    homeX:x, phase:rand(0,TAU), scoreV:base.score||100, drop:base.drop||0.12,
    opt
  };
}

/* =========================================================================
   v25: 「定位置に着いた瞬間に左右へワープする」不具合の対策
   降下中も e.t が進むため、着地した途端に sin(e.t*k) が一気に大きな値になり
   横位置が飛んでいた。着地時に専用タイマー e.mt を 0 に戻し、
   さらに振幅を 0 から立ち上げる（wobRamp）ことで必ず滑らかに揺れ始める。
   ========================================================================= */
function wobRamp(e){ return Math.min(1, (e.mt||0)/26); }
function enterDone(e){ e.entered=true; e.mt=0; }

function updateEnemy(e, dt){
  e.t += dt;
  const p = Game.player;
  switch(e.kind){
    case 'grunt': {
      if(!e.entered){ e.y += 2.4*dt; if(e.y>=e.targetY){ enterDone(e); e.fireCd=rand(120,220); } }
      else {
        e.mt+=dt; const s=wobRamp(e);
        e.x = e.homeX + Math.sin(e.mt*0.03+e.phase)*36*s;
        e.y = e.targetY + Math.sin(e.mt*0.02)*10*s;
        e.fireCd-=dt; if(e.fireCd<=0){ e.fireCd=rand(150,240); aimShot(e,3.8); }
      }
      break;
    }
    case 'weaver': {
      e.mt+=dt;
      e.y += 1.6*dt; e.x = e.homeX + Math.sin(e.mt*0.05+e.phase)*95*wobRamp(e);
      e.fireCd-=dt; if(e.fireCd<=0 && e.y<VH*0.7){ e.fireCd=rand(65,95); aimShot(e,4.0); }
      if(e.y>VH+30) e.dead=true;
      break;
    }
    case 'turret': {
      if(!e.entered){ e.y+=1.9*dt; if(e.y>=e.targetY) enterDone(e); }
      else { e.mt+=dt; e.x = e.homeX + Math.sin(e.mt*0.02+e.phase)*22*wobRamp(e); }
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(52,78); aimSpread(e,4,0.24,4.2); }
      break;
    }
    case 'bomber': {
      if(!e.entered){ e.y+=1.3*dt; if(e.y>=e.targetY) enterDone(e); }
      else { e.mt+=dt; e.x += Math.sin(e.mt*0.015)*1.2*dt*wobRamp(e); }
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(80,115); ringShot(e,12,2.9); }
      break;
    }
    case 'kamikaze': {
      if(!e.locked){ e.y+=2.2*dt; if(e.y>110){ e.locked=true; const a=Math.atan2(p.y-e.y,p.x-e.x); e.vx=Math.cos(a)*5.2; e.vy=Math.sin(a)*5.2; } }
      else { e.x+=e.vx*dt; e.y+=e.vy*dt; }
      if(e.y>VH+30||e.x<-30||e.x>VW+30) e.dead=true;
      break;
    }
    case 'splitter': {
      if(!e.entered){ e.y+=1.7*dt; if(e.y>=e.targetY) enterDone(e); }
      else { e.mt+=dt; e.x=e.homeX+Math.sin(e.mt*0.03+e.phase)*55*wobRamp(e); }
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(90,120); aimSpread(e,3,0.3,3.6); }
      break;
    }
    case 'mini': {
      e.mt+=dt;
      e.y += 2.8*dt; e.x += Math.sin(e.mt*0.08+e.phase)*1.7*dt*wobRamp(e);
      if(e.y>VH+30) e.dead=true;
      break;
    }
    case 'shield': {
      if(!e.entered){ e.y+=1.1*dt; if(e.y>=e.targetY) enterDone(e); }
      else { e.mt+=dt; e.x=e.homeX+Math.sin(e.mt*0.018+e.phase)*75*wobRamp(e); }
      e.fireCd-=dt; if(e.fireCd<=0&&e.entered){ e.fireCd=rand(75,105); aimSpread(e,5,0.22,3.8); }
      break;
    }
    case 'mine': {
      e.y += 1.3*dt; e.angle+=0.05*dt;
      if(e.y>VH+30) e.dead=true;
      break;
    }
    case 'sniper': {
      if(!e.entered){ e.y+=2.0*dt; if(e.y>=e.targetY) enterDone(e); }
      else {
        e.mt+=dt;
        e.x = e.homeX + Math.sin(e.mt*0.012+e.phase)*16*wobRamp(e);
        e.fireCd-=dt;
        e.charging = e.fireCd<45 && e.fireCd>0;
        if(e.fireCd<=0){
          e.fireCd=rand(125,165);
          const a=Math.atan2(p.y-e.y,p.x-e.x);
          eb(e.x,e.y,Math.cos(a)*6.6,Math.sin(a)*6.6,{r:5,color:'#f8f',dmg:20});
          eb(e.x,e.y,Math.cos(a+0.06)*6.0,Math.sin(a+0.06)*6.0,{r:4,color:'#f8f',dmg:16});
          Sound.laser();
        }
      }
      break;
    }
    case 'orbiter': {
      e.mt+=dt; const s=wobRamp(e);
      e.cy = e.cy===undefined? e.y : Math.min(e.targetY, e.cy+1.3*dt);
      e.oa = (e.oa===undefined? e.phase : e.oa) + 0.035*dt;
      e.x = e.homeX + (Math.cos(e.oa)-Math.cos(e.phase))*60*s;
      e.y = e.cy + Math.sin(e.oa)*38*s;
      if(e.cy>=e.targetY) e.entered=true;
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(120,160); ringShot(e,8,2.8); }
      break;
    }
    case 'carrier': {
      if(!e.entered){ e.y+=0.9*dt; if(e.y>=e.targetY) enterDone(e); }
      else { e.mt+=dt; e.x=e.homeX+Math.sin(e.mt*0.01+e.phase)*30*wobRamp(e); }
      e.fireCd-=dt;
      if(e.fireCd<=0 && e.entered){
        e.fireCd=rand(120,160);
        if(Game.enemies.length<42){ const m=makeEnemy('mini',e.x,e.y+10); m.homeX=e.x; Game.enemies.push(m); }
        aimSpread(e,3,0.3,3.4);
      }
      break;
    }
    case 'dasher': {
      e.x += e.vx*dt; e.y += Math.sin(e.t*0.06+e.phase)*1.4*dt;
      e.fireCd-=dt;
      if(e.fireCd<=0){ e.fireCd=52; eb(e.x,e.y,0.7,3.6,{color:'#8ef',dmg:16}); eb(e.x,e.y,-0.7,3.6,{color:'#8ef',dmg:16}); }
      if((e.vx>0&&e.x>VW+40)||(e.vx<0&&e.x<-40)) e.dead=true;
      break;
    }
  }
}

/* 敵の弾発射ヘルパー */
function aimShot(e,speed){
  const p=Game.player; if(!p)return; const a=Math.atan2(p.y-e.y,p.x-e.x);
  eb(e.x,e.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#ff6a8a',dmg:Math.round(e.dmg*0.6)});
  Sound.blip(300,0.05,'square',0.04,-60);
}
function aimSpread(e,count,spread,speed){
  const p=Game.player; if(!p)return; const a=Math.atan2(p.y-e.y,p.x-e.x);
  for(let i=0;i<count;i++){ const off=(i-(count-1)/2)*spread; eb(e.x,e.y,Math.cos(a+off)*speed,Math.sin(a+off)*speed,{r:5,color:'#ff88aa',dmg:Math.round(e.dmg*0.55)}); }
}
function ringShot(e,count,speed){
  for(let i=0;i<count;i++){ const a=i/count*TAU + e.t*0.02; eb(e.x,e.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#c9f',dmg:Math.round(e.dmg*0.5)}); }
}

/* v8: ダメージ表示も威力に応じて大きく・熱く */
function dmgSize(d){ return clamp(11 + d*0.09, 11, 21); }
function dmgColor(d){ return d>=90?'#fff3b0' : d>=55?'#ffe9a8' : d>=30?'#eafcff' : '#ffffff'; }
function damageEnemy(e, dmg, hx, hy, silent){
  e.hp -= dmg; e.hitFlash=4;
  if(hx!==undefined) addFloat(hx, hy-6, Math.round(dmg), dmgColor(dmg), dmgSize(dmg));
  if(e.hp>0 && !silent) Sound.enemyHit(e, dmg);
  if(e.hp<=0 && !e.dead){ killEnemy(e); }
}
function killEnemy(e){
  e.dead=true;
  burst(e.x,e.y,e.color,18,4); Sound.explodeAt(e); Game.screenShake(2+Math.min(4,e.r/7));
  Game.score += e.scoreV; const g=Game.addCredits(e.credit*credScale());
  addFloat(e.x,e.y,'+'+Math.round(g)+'c','#ffd76a');
  if(Math.random()<e.drop) spawnPowerup(e.x,e.y);
  if(e.kind==='splitter'){ for(let i=0;i<4;i++){ const m=makeEnemy('mini',e.x,e.y); m.homeX=e.x; m.phase=rand(0,TAU); Game.enemies.push(m); } }
  if(e.kind==='mine'){ for(let i=0;i<8;i++){ const a=i/8*TAU; eb(e.x,e.y,Math.cos(a)*3.4,Math.sin(a)*3.4,{r:4,color:'#fd8',dmg:14}); } }
}

/* ---------------- パワーアップ ---------------- */
const powerups=[];
const PU_TYPES=['heal','shield','credit','bomb'];
function spawnPowerup(x,y){
  /* v17: シールド未強化ではSアイテムが実質無意味なので、Lv1以上になるまで出さない */
  const pool = upLevel('shield')>=1 ? PU_TYPES : PU_TYPES.filter(t=>t!=='shield');
  const type = pool[randi(0,pool.length-1)];
  powerups.push({x,y,vy:1.4,r:11,type,t:0});
}
function updatePowerups(dt){
  const p=Game.player;
  for(let i=powerups.length-1;i>=0;i--){
    const pu=powerups[i]; pu.y+=pu.vy*dt; pu.t+=dt;
    if(p && dist2(pu.x,pu.y,p.x,p.y) < (pu.r+16)*(pu.r+16)){
      applyPowerup(pu.type); powerups.splice(i,1); continue;
    }
    if(pu.y>VH+20) powerups.splice(i,1);
  }
}
function applyPowerup(type){
  const p=Game.player; Sound.pickup();
  if(type==='heal'){ p.hp=Math.min(p.maxHP,p.hp+Math.max(30,p.maxHP*0.2)); addFloat(p.x,p.y-20,'+HP','#7fffa8'); }
  else if(type==='shield'){ if(p.shieldMax>0){ p.shieldHP=p.shieldMax; addFloat(p.x,p.y-20,'SHIELD','#7ff'); } else { const g=Game.addCredits(15); addFloat(p.x,p.y-20,'+'+Math.round(g)+'c','#ffd76a'); } }
  else if(type==='credit'){ const g=Game.addCredits(30); addFloat(p.x,p.y-20,'+'+Math.round(g)+'c','#ffd76a'); }
  else if(type==='bomb'){ p.bombs=Math.min(9,p.bombs+1); addFloat(p.x,p.y-20,'+BOMB','#bff'); }
}
function drawPowerup(pu){
  const col = pu.type==='heal'?'#7fffa8': pu.type==='shield'?'#7ff': pu.type==='credit'?'#ffd76a':'#bdf';
  const s=1+Math.sin(pu.t*0.15)*0.12;
  ctx.save(); ctx.translate(pu.x,pu.y); ctx.scale(s,s);
  ctx.shadowBlur=16; ctx.shadowColor=col; ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; const px=Math.cos(a)*pu.r, py=Math.sin(a)*pu.r; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.stroke();
  ctx.fillStyle=col; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const ch = pu.type==='heal'?'H': pu.type==='shield'?'S': pu.type==='credit'?'$':'B';
  ctx.fillText(ch,0,1);
  ctx.restore(); ctx.shadowBlur=0; ctx.textBaseline='alphabetic';
}

   フル強化時のプレイヤー火力/防御が大きく上回る設計なので、

const HP_MUL   = [1.0, 4.5, 13.0];  // 敵HP倍率(ステージ別) v13: さらに急カーブ

function formationRow(kind, count, y, hpMul){
  const gap=VW/(count+1);

function swarm(kind,count,hpMul){
  for(let i=0;i<count;i++){ const e=makeEnemy(kind,rand(50,VW-50),-30-i*26,{hpMul}); Game.enemies.push(e); }

function dashers(count, side, y0, hpMul){
  for(let i=0;i<count;i++){

function W(spawn,maxT){ return {type:'wave', clear:'all', maxT:maxT||1000, spawn}; }

const Director = {
  stage:0, step:0, timer:0, script:[], phase:'run', bossIntro:0, transformT:0,
  begin(stage){
    this.stage=stage; this.step=0; this.timer=0; this.phase='run';
    this.script = buildScript(stage);
    Game.stageIndex=stage;
  },
  update(dt){
    if(this.phase!=='run') return;
    const s=this.script[this.step];
    if(!s){ return; }
    if(s.type==='wave'){
      if(!s.started){ s.spawn(); s.started=true; this.timer=0; }
      this.timer+=dt;
      const cleared = Game.enemies.length===0;
      if(cleared && this.timer>30){ this.next(); }
      if(s.maxT && this.timer>s.maxT){ this.next(); }
    } else if(s.type==='wait'){
      this.timer+=dt; if(this.timer>s.t){ this.next(); }
    } else if(s.type==='midboss'){
      if(!s.started){ spawnMidboss(this.stage); s.started=true; }
      if(Game.boss==null && s.started && s.done){ this.next(); }
    } else if(s.type==='boss'){
      if(!s.started){
        this.phase='bossintro'; this.bossIntro=120; s.started=true;
        Music.play('boss'+this.stage);
      }
    }
  },
  next(){ this.step++; this.timer=0; },
  onBossDefeated(){
    if(this.stage<2){
      Game.stageClear(this.stage+1);   // v2: 格納庫を挟む
    } else {
      this.phase='transform'; this.transformT=150; Sound.transform();
      Game.doFlash('#fd6',1); Game.screenShake(24);
      Music.play('final');
    }
  }
};

/* =========================================================================
   ボス（v2: 個性化・パターンセット制）
   ========================================================================= */
function makeBoss(kind, stage){
  const B = {
    kind, stage, id:kind+stage, x:VW/2, y:-140, r:52, t:0, moveT:0, phase:-1, attackCd:70,
    patIdx:0, rep:-1, beam:0, beamAcc:0,
    entering:true, dead:false, hitFlash:0, spin:0,
    isGreat:(kind==='great'), isMid:(kind==='mid'),
    parts:[], anim:0, baseY:VH*0.22, tx:VW/2, dashT:0,
  };
  /* v3: ボスHPを終盤急カーブに（フル強化DPSなら短時間で溶かせる値） */
  /* v13: ボスHPを大幅に引き上げ。特に最終ボスは長期戦の総力戦にする */
  if(kind==='mid'){ B.r=38; B.maxHp=[1300,5200,15000][stage]; B.name=MID_NAMES[stage]; }
  else if(kind==='great'){ B.r=64; B.maxHp=95000; B.name='OMEGA CORE'; B.baseY=VH*0.24; }
  else { B.r=52; B.maxHp=[3400,14000,42000][stage]; B.name=BOSS_NAMES[stage]; }
  B.hp=B.maxHp;
  const pc = kind==='great'?10:(kind==='mid'?5:7);
  for(let i=0;i<pc;i++){ B.parts.push({a:i/pc*TAU, hp: kind==='great'?220:130, alive:true}); }
  return B;
}
function spawnMidboss(stage){
  const b=makeBoss('mid',stage); Game.boss=b;
  Game.setMessage('WARNING', MID_NAMES[stage]+' APPROACHING', 110); Sound.boss();
  Music.play('midboss');   // v6: 中ボス専用曲 (chuboss.mp3・3ステージ共通)
}
function spawnBoss(stage){
  const b=makeBoss('boss',stage); Game.boss=b;
  /* v23: ステージボスは専用の登場カットイン（警告ストライプ＋ネームプレート） */
  Game.startCine('boss', 'BOSS', BOSS_NAMES[stage], 165);
  Sound.boss(); Sound.siren(); Game.screenShake(10); Game.doFlash('#f66',0.35);
  setTimeout(()=>{ if(Game.state===STATE.PLAY) Sound.siren(); }, 620);
}
function spawnGreatBoss(x,y){
  const b=makeBoss('great',2); Game.boss=b;
  b.x = x!==undefined?x:VW/2; b.y = y!==undefined?y:VH*0.1;

  Game.startCine('final', 'OMEGA CORE', 'FINAL FORM AWAKENS', 235);

  [420,900,1380].forEach(d=> setTimeout(()=>{ if(Game.state===STATE.PLAY){ Sound.siren(); Game.screenShake(14); } }, d));
  setTimeout(()=>{ if(Game.state===STATE.PLAY){ Sound.rumble(1.4); Game.doFlash('#fd6',0.7); Game.screenShake(22); } }, 1750);
  /* v15: フル強化済みなら最終決戦だけ金色のオーバードライブ（火力・シールド2割増し）
     v28: 常時オーバードライブ購入済みなら既に発動中なので変身演出は行わない */
  if(isFullyUpgraded() && Game.player && !Game.overdrive){
    const p=Game.player;

      Sound.buyMax(); Sound.rumble(1.2);
      setTimeout(()=>{ if(Game.overdrive) Sound.powerUp(); }, 260);
      addShock(p.x,p.y,300,'#ffd76a');
      setTimeout(()=>{ if(Game.overdrive) addShock(p.x,p.y,360,'#fff2c0'); }, 180);
      setTimeout(()=>{ if(Game.overdrive){ addShock(p.x,p.y,420,'#ffd76a'); Game.screenShake(16); } }, 380);
      for(let i=0;i<70;i++) burst(p.x+rand(-24,24), p.y+rand(-24,24), i%3?'#ffd76a':'#fff6d8', 6, 5);
      eBullets.length=0;                               // 変身中は被弾しないようにクリア
    }, 2900);

/* =========================================================================
   v14: お助けボス — 最終ボスのHPが減るほど強い援軍が現れる
   中ボス → 1面ボス → 2面ボス → 3面ボス の順。倒すと次が控える。
   最終ボスを倒せば、援軍が残っていてもクリア。
   ========================================================================= */
const HELPERS = [
  {kind:'mid',  stage:2, hp: 6000, th:0.82, side:-1},
  {kind:'boss', stage:0, hp: 9000, th:0.62, side: 1},
  {kind:'boss', stage:1, hp:14000, th:0.42, side:-1},
  {kind:'boss', stage:2, hp:20000, th:0.22, side: 1},
];
function spawnHelper(i){
  const H=HELPERS[i]; if(!H) return;
  const b=makeBoss(H.kind, H.stage);
  b.isHelper=true; b.helperIdx=i;
  b.maxHp=H.hp; b.hp=H.hp;
  b.r=Math.round(b.r*0.8);
  b.homeX = clamp(VW/2 + H.side*VW*0.25, 90, VW-90);
  b.x=b.homeX; b.y=-120; b.baseY = VH*0.40 + (i%2)*36;
  b.entering=true;
  Game.helpers.push(b);
  Game.setMessage('SUPPORT', b.name+' 参戦', 110);
  Sound.boss(); Game.screenShake(12); Game.doFlash('#f6c',0.5);
}

function damageBossObj(b, dmg, hx, hy, silent){
  if(!b || b.dead || b.entering) return;
  if(cineLock()) return;                 // v25: 演出中はダメージも通らない
  b.hp-=dmg; b.hitFlash=3;
  if(hx!==undefined) addFloat(hx,hy-8,Math.round(dmg),dmgColor(dmg),dmgSize(dmg));
  if(b.hp>0 && !silent) Sound.bossHit(dmg, b);
  const alive=b.parts.filter(p=>p.alive);
  if(alive.length){ const idx=randi(0,alive.length-1); alive[idx].hp-=dmg; if(alive[idx].hp<=0){ alive[idx].alive=false; burst(b.x+Math.cos(alive[idx].a)*b.r, b.y+Math.sin(alive[idx].a)*b.r, '#fff',20,4); Sound.panelBreak(); Game.screenShake(6); } }
  if(b.hp<=0) defeatBossObj(b);
}
function damageBoss(dmg, hx, hy){ damageBossObj(Game.boss, dmg, hx, hy); }

/* =========================================================================
   v18: ボス撃破シーケンス
   「ガガガガッ！」と機体が軋みながら小爆発を連発 → 「ドーン！」の大爆発
   → 破片が飛び散り（当たるとダメージ）→ 余韻を経てから画面遷移
   ========================================================================= */
function startBossDeath(b){
  b.dead=true; b.deathT=0; b.boomed=false; b.rattleCd=0;
  b.deathDur = b.isGreat ? 330 : (b.isMid ? 105 : 185);
  if(b.isGreat){
    /* 最終ボスの爆発に巻き込まれて、援軍も雑魚も消し飛ぶ */
    for(const h of Game.helpers){ burst(h.x,h.y,'#ffd76a',30,5); addShock(h.x,h.y,180,'#ffd76a'); }
    Game.helpers.length=0;
    for(const e of Game.enemies){ burst(e.x,e.y,e.color,12,4); }
    Game.enemies.length=0;
  }
}
function updateBossDeath(b, dt){
  b.deathT += dt;
  const ph = b.deathT / b.deathDur;

  /* --- 前半: ガガガガッ！ 連続する小爆発と噴煙 --- */
  if(ph < 0.72){
    b.hitFlash = (Math.floor(b.deathT/4)%2===0) ? 3 : 0;
    b.rattleCd -= dt;
    if(b.rattleCd <= 0){
      b.rattleCd = b.isGreat ? rand(4,8) : rand(6,12);
      const a=rand(0,TAU), rr=rand(0.15,1)*b.r;
      const ex=b.x+Math.cos(a)*rr, ey=b.y+Math.sin(a)*rr;
      burst(ex, ey, ['#fff','#ffd76a','#ff9a5a'][randi(0,2)], b.isGreat?15:9, 3.6);
      spawnSmoke(ex, ey, b.isGreat?3:2);
      Game.screenShake(b.isGreat?5:3);
      Sound.deathRattle();
      const alive=b.parts.filter(pp=>pp.alive);
      if(alive.length && Math.random()<0.45){
        alive[0].alive=false;
        if(!b.isGreat) spawnDebris(ex, ey, 1, {dmg:0, speed:2.6, scale:0.75});
      }
    }
  }

  /* --- 後半: ドーン！ 大爆発と破片の飛散 --- */
  if(!b.boomed && ph >= 0.72){
    b.boomed=true;
    Sound.finalBoom(b.isGreat?1.6:(b.isMid?0.85:1.15));
    Game.doFlash(b.isGreat?'#fff':'#ffe9a8', b.isGreat?1:0.85);
    Game.screenShake(b.isGreat?32:(b.isMid?16:22));
    addShock(b.x, b.y, b.isGreat?460:(b.isMid?200:300), b.isGreat?'#ffd76a':'#fff');
    if(b.isGreat) setTimeout(()=>addShock(b.x,b.y,560,'#fff'), 300);
    const n = b.isGreat?90 : (b.isMid?26:52);
    for(let i=0;i<n;i++) setTimeout(()=>{
      if(Game.state!==STATE.PLAY) return;
      burst(b.x+rand(-b.r*1.3,b.r*1.3), b.y+rand(-b.r*1.3,b.r*1.3), i%3?'#ffd76a':'#fff', 10, 6);
      if(i%4===0){ spawnSmoke(b.x+rand(-b.r,b.r), b.y+rand(-b.r,b.r), 2); Game.screenShake(b.isGreat?6:3); }
      if(b.isGreat && i%12===0) Sound.finalBoom(0.6);
    }, i*(b.isGreat?20:11));
    /* 破片ばらまき（当たるとダメージ）— 大ボスは破片なしで純粋な大爆発に */
    if(!b.isGreat){
      spawnDebris(b.x, b.y, b.isMid?15:17,
        {dmg: b.isMid?18:16, speed:4.2, color:'#ffb86a'});
    }
  }
  return b.deathT >= b.deathDur;
}

function defeatBossObj(b){
  if(!b || b.dead) return;
  startBossDeath(b);
  Sound.bigExplode(); Game.screenShake(18); Game.doFlash('#fff',0.55);
  burst(b.x,b.y,'#fff',26,5);
  const bonus = Math.round((b.isGreat?3200: b.isMid?240:850)*(1+b.stage*0.35)*(b.isHelper?0.7:1));
  Game.score += bonus*4; const g=Game.addCredits(bonus);
  addFloat(b.x,b.y,'+'+Math.round(g)+'c','#ffd76a');

  if(!b.isHelper) eBullets.length=0;   // ボス撃破で弾消し（爽快感）
}

/* 撃破演出が終わってから、初めて画面/ステージを進める */
function finishBossDeath(b){
  if(b.isHelper){
    /* 援軍を撃破 → 次の援軍が控える（出現は最終ボスのHP次第） */
    Game.helperIdx = Math.max(Game.helperIdx, b.helperIdx+1);
    return;
  }
  if(b.isMid){
    const s=Director.script[Director.step]; if(s) s.done=true;
    Game.boss=null;
    Music.play('stage'+Director.stage);
  } else if(b.isGreat){
    /* 最終ボス撃破 → 援軍が残っていてもクリア */
    Game.boss=null; Game.helpers.length=0; Game.enemies.length=0;
    if(Game.state===STATE.PLAY) Game.endRun(true);
  } else {
    const bx=b.x, by=b.y;
    Game.boss=null;
    Game.lastBossX=bx; Game.lastBossY=by;
    Director.onBossDefeated();
  }
}

/* ---- ボスAI: フェーズ別パターンセットを順番に回す ---- */
function bossPhase(b){
  const ratio=b.hp/b.maxHp;
  if(b.isGreat) return ratio>0.62?0: ratio>0.3?1:2;
  return ratio>0.62?0: ratio>0.3?1:2;
}
/* パターン工場 */
function fAimN(n,spread,speed){ return (b)=>{ const p=Game.player; if(!p)return; const a=Math.atan2(p.y-b.y,p.x-b.x);
  for(let i=0;i<n;i++){ const off=(i-(n-1)/2)*spread; eb(b.x,b.y+16,Math.cos(a+off)*speed,Math.sin(a+off)*speed,{r:6,color:'#ff6a8a',dmg:18}); } }; }
function fRing(n,speed,color){ return (b)=>{ for(let i=0;i<n;i++){ const a=i/n*TAU + b.t*0.03; eb(b.x,b.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:color||'#c9f',dmg:16}); } }; }
function fSpiral(arms,speed,dir){ return (b)=>{ for(let i=0;i<arms;i++){ const a=b.t*0.09*(dir||1) + i/arms*TAU; eb(b.x,b.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#fda',dmg:15}); } }; }
function fWallGap(speed){ return (b)=>{ const p=Game.player; const gapX = p? clamp(p.x+rand(-70,70), 50, VW-50) : VW/2;
  for(let x=16;x<VW;x+=26){ if(Math.abs(x-gapX)<46) continue; eb(x, b.y+b.r*0.6, 0, speed, {r:5,color:'#f9c',dmg:17}); } }; }
function fWaveFan(n,speed,amp){ return (b)=>{ for(let i=0;i<n;i++){ const a=Math.PI/2 + (i-(n-1)/2)*0.22;
  eb(b.x,b.y+10,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#adf',dmg:16,wave:{a:amp,f:0.09,p:rand(0,TAU)}}); } }; }
function fClaws(speed){ return (b)=>{ const p=Game.player; if(!p)return;
  for(const s of [-1,1]){ const cx=b.x+s*b.r*1.1, cy=b.y+8; const a=Math.atan2(p.y-cy,p.x-cx);
    for(let k=0;k<3;k++) eb(cx,cy,Math.cos(a+k*0.09-0.09)*speed,Math.sin(a+k*0.09-0.09)*speed,{r:5,color:'#7df',dmg:17}); } }; }
function fScatter(n,speed){ return (b)=>{ for(let i=0;i<n;i++){ const a=Math.PI/2+rand(-1.1,1.1); const s=speed*rand(0.6,1.15);
  eb(b.x+rand(-b.r,b.r),b.y+rand(-8,16),Math.cos(a)*s,Math.sin(a)*s,{r:randi(4,6),color:'#f6c',dmg:16}); } }; }
function fCross(n,speed){ return (b)=>{ for(let i=0;i<n;i++){ const a=b.spin*2.2 + i/n*TAU;
  eb(b.x,b.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:6,color:'#ffd76a',dmg:18}); } }; }
function fAccelRain(n){ return (b)=>{ for(let i=0;i<n;i++){ const x=rand(30,VW-30);
  eb(x, b.y+rand(-10,20), rand(-0.4,0.4), 1.2, {r:5,color:'#fd9',dmg:16, ay:0.06}); } }; }
function fSummon(kinds){ return (b)=>{ if(Game.enemies.length>16) return;
  const kind=kinds[randi(0,kinds.length-1)];
  /* v14: 画面上部だけでなく中央付近まで配置される */
  const e=makeEnemy(kind, rand(60,VW-60), b.y+30, {targetY:rand(130,VH*0.5), hpMul:HP_MUL[b.stage]*0.8});
  e.entered = (kind!=='kamikaze'); e.fireCd=rand(30,70);
  Game.enemies.push(e); }; }

/* v14: 激化した時の増援。時間が経つほど数も頻度も増え、中央付近まで展開する */
function bossSummon(b){
  if(Game.enemies.length>18) return;
  const n = 1 + Math.floor((b.rage||0)*2.4);
  const pool = b.isGreat ? ['kamikaze','sniper','turret','dasher','orbiter']
                         : ['grunt','weaver','kamikaze','sniper','turret','dasher'];

    e.fireCd = rand(25,70);
    Game.enemies.push(e);
    burst(e.x, Math.max(e.y,0), '#f9c', 10, 3);
  }
  Sound.blip(180,0.22,'sawtooth',0.09,140);
}

    return       [ {f:fSpiral(3,3.8,1),cd:8,reps:14}, {f:fSpiral(3,3.8,-1),cd:8,reps:14}, {f:fWaveFan(11,3.6,2.4),cd:46,reps:2}, {f:fScatter(14,4.2),cd:32,reps:2} ];
