function updateBoss(b, dt){
  b.t+=dt; b.spin+=0.01*dt; b.anim+=dt;
  if(b.hitFlash>0) b.hitFlash-=dt;
  const p=Game.player;

  if(b.entering){
    /* v25: X も収束を待つ（お助けボスは自分の持ち場へ）。
       片方だけ見て entering を解除すると、解除の瞬間に横へワープしていた。 */
    const hx = b.isHelper ? b.homeX : VW/2;
    b.enterT=(b.enterT||0)+dt;
    b.y += (b.baseY - b.y)*0.035*dt;
    b.x += (hx - b.x)*0.035*dt;
    if((Math.abs(b.y-b.baseY)<3 && Math.abs(b.x-hx)<3) || b.enterT>300){
      b.x=hx; b.y=b.baseY; b.entering=false; b.moveT=0;
    }
    return;
  }
  /* 登場演出・変身演出の最中は、その場で待機して攻撃しない */
  if(cineLock()) return;
  b.moveT+=dt;

  /* --- v14: 長期戦になるほど激化（弾速アップ＋増援） --- */
  if(b.isGreat || Game.stageIndex>=1){
    b.rageT=(b.rageT||0)+dt;
    b.rage = Math.min(1, b.rageT/3300);          // 約55秒でMAX
    if(!b.isHelper){
      b.summonCd = (b.summonCd===undefined?300:b.summonCd) - dt;
      if(b.summonCd<=0){ b.summonCd = lerp(420,130,b.rage); bossSummon(b); }
    }
  }

  /* --- 移動（ボスごとに個性 / moveT基準なのでワープしない） --- */
  if(b.isHelper){ // お助けボスは左右に分かれて陣取る
    b.x = b.homeX + Math.sin(b.moveT*0.016)*66;
    b.y = b.baseY + Math.sin(b.moveT*0.026)*18;
  } else if(b.id==='mid1'){ // PHANTOM: ダッシュ移動
    b.dashT-=dt;
    if(b.dashT<=0){ b.tx=rand(70,VW-70); b.dashT=rand(85,130); }
    b.x = lerp(b.x, b.tx, 0.055*dt);
    b.y = b.baseY + Math.sin(b.moveT*0.03)*18;
  } else if(b.id==='boss1'){ // MOTH: ∞軌道
    b.x = VW/2 + Math.sin(b.moveT*0.014)*(VW*0.3);
    b.y = b.baseY + Math.sin(b.moveT*0.028)*46;
  } else if(b.id==='boss2' || b.id==='mid2'){ // 要塞系: ゆっくり
    b.x = VW/2 + Math.sin(b.moveT*0.009)*(VW*0.24);
    b.y = b.baseY + Math.sin(b.moveT*0.02)*12;
  } else if(b.isGreat){
    b.x = VW/2 + Math.sin(b.moveT*0.008)*(VW*0.3);
    b.y = b.baseY + Math.sin(b.moveT*0.016)*20;
  } else {
    b.x = VW/2 + Math.sin(b.moveT*0.013)*(VW*0.28);
    b.y = b.baseY + Math.sin(b.moveT*0.022)*10;
  }

  /* --- フェーズ切替 --- */
  const ph=bossPhase(b);
  if(ph!==b.phase){ b.phase=ph; b.patIdx=0; b.rep=-1; b.attackCd=50; b.beam=0;
    if(ph>0){ Game.doFlash(b.isGreat?'#fd6':'#f6c',0.35); Game.screenShake(8); burst(b.x,b.y,'#fff',26,5); } }

  /* --- 蛇行レーザー（発射中は連続射出） --- */
  if(b.beam>0 && p){
    b.beam-=dt; b.beamAcc+=dt;
    while(b.beamAcc>2){
      b.beamAcc-=2;
      const base=Math.atan2(p.y-b.y,p.x-b.x);
      const a1=base+Math.sin(b.t*0.17)*1.15;
      const a2=base+Math.sin(b.t*0.17+Math.PI)*1.15;
      eb(b.x,b.y,Math.cos(a1)*6.4,Math.sin(a1)*6.4,{r:6,color:'#fff',dmg:20,life:200});
      eb(b.x,b.y,Math.cos(a2)*6.4,Math.sin(a2)*6.4,{r:6,color:'#fd6',dmg:20,life:200});
      Sound.laser();
    }
  }

  /* --- パターン実行 --- */
  b.attackCd-=dt;
  if(b.attackCd<=0 && b.beam<=0){
    const list=bossPatterns(b);
    const P=list[b.patIdx % list.length];
    if(b.rep<0) b.rep=P.reps;
    P.f(b);
    b.attackCd=P.cd;
    b.rep--;
    if(b.rep<=0){ b.patIdx++; b.rep=-1; b.attackCd=P.cd+42; }
  }
}

/* =========================================================================
   プレイヤー更新（v2: 扇形ショット）
   ========================================================================= */
function updatePlayer(dt){
  const p=Game.player; if(!p) return;
  /* v5: 相対ドラッグ — 指の移動量ぶんだけ動く（自機が指で隠れない） */
  if(pointer.dxAcc!==0 || pointer.dyAcc!==0){
    p.x = clamp(p.x + pointer.dxAcc*1.15, 16, VW-16);
    p.y = clamp(p.y + pointer.dyAcc*1.15, 40, VH-30);
    pointer.dxAcc=0; pointer.dyAcc=0;
  }
  if(!pointer.active){
    const s=p.st.speed;
    if(keys.ArrowLeft||keys.KeyA) p.x-=s*dt;
    if(keys.ArrowRight||keys.KeyD) p.x+=s*dt;
    if(keys.ArrowUp||keys.KeyW) p.y-=s*dt;
    if(keys.ArrowDown||keys.KeyS) p.y+=s*dt;
    p.x=clamp(p.x,16,VW-16); p.y=clamp(p.y,40,VH-30);
  }
  /* v10: 左右の移動量に応じて機体がバンク（傾く） */
  const bdx = p.x - (p.lastX!==undefined?p.lastX:p.x);
  p.lastX = p.x;
  p.bank = lerp(p.bank||0, clamp(bdx*0.05, -0.38, 0.38), 0.22);
  if(p.inv>0) p.inv-=dt;
  if(p.muzzle>0) p.muzzle-=0.16*dt;
  if(p.bombFlash>0) p.bombFlash-=0.04*dt;
  if(p.shieldMax>0 && p.shieldHP<p.shieldMax){ p.shieldRegen+=dt; if(p.shieldRegen>p.st.shieldDelay){ p.shieldHP=Math.min(p.shieldMax,p.shieldHP+p.st.shieldRegenRate*powerMul()*dt); } }
  p.fireCd-=dt;
  if(p.fireCd<=0){ playerFire(); p.fireCd=p.st.fireInterval/16.67; }
  if(p.st.missiles>0){ p.missileCd-=dt; if(p.missileCd<=0){ for(let i=0;i<p.st.missiles;i++){ setTimeout(()=>{ if(Game.player===p && Game.state===STATE.PLAY) fireHoming(p.x+rand(-10,10),p.y,p.st.dmg*1.4*powerMul());},i*80);} p.missileCd=90; } }
  if(Math.random()<0.6) spawnParticle(p.x+rand(-4,4),p.y+14,'#4cf',{vx:rand(-.4,.4),vy:rand(1,2.4),life:rand(10,18),r:rand(1.5,3)});
  for(const w of Game.wingmen){
    const tx=p.x+w.side*34, ty=p.y+16;
    w.x=lerp(w.x,tx,0.2); w.y=lerp(w.y,ty,0.2);
    /* 1機なら通常弾、2機（最終Lv）なら貫通ビームに変化 */
    if(p.st.wings<2){
      w.fireCd-=dt; if(w.fireCd<=0){ firePlayer(w.x,w.y-8,0,-10,p.st.dmg*0.6*powerMul(),3,'#8fe8b8','shot',Math.max(0,bulletTier()-2)); w.fireCd=p.st.fireInterval/16.67*1.2; }
    }
  }
  if(p.st.wings>=2) updateWingBeams(dt);
}

/* =========================================================================
   v15: 僚機ビーム（ウイングマン最終Lv）
   貫通する連続ビーム。DPSは従来の僚機ショットの約1.3倍。
   ========================================================================= */
function wingBeamDps(){
  const st=Game.player.st;
  const perShot = st.dmg*0.6*powerMul();
  const shotsPerSec = 1000/(st.fireInterval*1.2);
  return perShot*shotsPerSec*1.10;
}
function updateWingBeams(dt){
  const p=Game.player; if(!p) return;
  const dmg = wingBeamDps()/60*dt;
  Game.beamT=(Game.beamT||0)+dt;
  const showFloat = Game.beamT>=11;
  if(showFloat) Game.beamT=0;
  let connected=false;
  const HALF=6;
  for(const w of Game.wingmen){
    for(let i=Game.enemies.length-1;i>=0;i--){
      const e=Game.enemies[i];
      if(e.dead || e.y>=w.y) continue;
      if(Math.abs(e.x-w.x) < e.r+HALF){
        connected=true;
        damageEnemy(e, dmg, showFloat?e.x:undefined, showFloat?e.y:undefined, true);
        if(Math.random()<0.25) spawnParticle(e.x+rand(-6,6), e.y+e.r*0.5, '#9fffd0', {life:rand(6,12), r:rand(1,2)});
      }
    }
    const targets=[Game.boss].concat(Game.helpers);
    for(const t of targets){
      if(!t || t.dead || t.entering || t.y>=w.y) continue;
      if(Math.abs(t.x-w.x) < t.r+HALF){
        connected=true;
        damageBossObj(t, dmg, showFloat?t.x:undefined, showFloat?t.y:undefined, true);
        if(Math.random()<0.3) spawnParticle(t.x+rand(-10,10), t.y+t.r*0.5, '#9fffd0', {life:rand(6,12), r:rand(1,2.2)});
      }
    }
  }
  Game.beamHit=connected;
  if(connected){ Game.beamSnd=(Game.beamSnd||0)+dt; if(Game.beamSnd>9){ Game.beamSnd=0; Sound.beamHum(); } }
}
function drawWingBeams(){
  const p=Game.player; if(!p || p.st.wings<2) return;
  const flick = 0.85 + 0.15*Math.sin(Game.t*0.6);
  const gold = Game.overdrive;
  const outer = gold?'rgba(255,215,106,0.30)':'rgba(90,255,190,0.28)';
  const core  = gold?'rgba(255,248,220,0.92)':'rgba(225,255,240,0.9)';
  for(const w of Game.wingmen){
    const top = 0, h = w.y-11;
    if(h<=0) continue;
    ctx.save();
    ctx.shadowBlur=20; ctx.shadowColor=gold?'#ffd76a':'#7fffd0';
    ctx.fillStyle=outer; ctx.fillRect(w.x-5.5*flick, top, 11*flick, h);
    ctx.shadowBlur=10;
    ctx.fillStyle=core;  ctx.fillRect(w.x-1.7*flick, top, 3.4*flick, h);
    ctx.restore();
    if(Math.random()<0.5) spawnParticle(w.x+rand(-3,3), w.y-12, gold?'#ffe9a8':'#9fffd0',
      {vx:rand(-.4,.4), vy:rand(-2.4,-0.8), life:rand(6,12), r:rand(1,2.2)});
  }
  ctx.shadowBlur=0;
}
/* v2: レベルに応じて扇形に大きく拡散するメインショット */
function playerFire(){
  const p=Game.player, d=p.st.dmg, lv=p.st.weapon;
  const counts  = [1, 2, 3, 5, 7, 9, 11];
  const spreads = [0, 10, 22, 38, 58, 80, 100];   // 扇の全角(度)
  const n = counts[lv], spreadRad = spreads[lv]*Math.PI/180;
  const speed = 10.5;
  /* v4: 武器最終Lvは弾自体も強化（ダメージ1.3倍） */
  const boost = lv>=6 ? 1.3 : 1;
  /* v8: 威力レベルで弾の見た目と当たり判定が育つ */
  const tier = bulletTier(), T = BULLET_TIERS[tier];
  const br = 4 + tier*0.3;
  p.tier = tier; p.muzzle = 1;
  Sound.shoot(tier);
  for(let i=0;i<n;i++){
    const off = n>1 ? (i/(n-1) - 0.5)*spreadRad : 0;
    const a = -Math.PI/2 + off;
    firePlayer(p.x, p.y-12, Math.cos(a)*speed, Math.sin(a)*speed, Math.round(d*boost*powerMul()), br,
      Game.overdrive?'#ffe9a8':T.c, 'shot', tier);
  }
  /* マズルフラッシュ（威力が上がるほど派手に） */
  const mf = 1 + tier*0.3;
  for(let i=0;i<1+Math.floor(tier/2);i++){
    spawnParticle(p.x+rand(-3,3), p.y-15, i%2?T.core:T.c,
      {vx:rand(-1,1)*mf, vy:rand(-1.6,-0.2)*mf, life:rand(6,13), r:rand(1.2,2.2)*mf});
  }
}
function playerHit(dmg){
  const p=Game.player; if(!p || p.dying || p.inv>0) return;
  if(p.shieldHP>0){ p.shieldHP-=dmg; if(p.shieldHP<0){ p.hp+=p.shieldHP; p.shieldHP=0; } p.shieldRegen=0; Sound.shieldHit(); Game.doFlash('#7ff',0.4); p.inv=20; Game.screenShake(5); }
  else { p.hp-=dmg; p.inv=50; p.shieldRegen=0; Sound.hullHit(); Game.doFlash('#f66',0.5); Game.screenShake(10); burst(p.x,p.y,'#f88',14,4); }
  /* ↑ v7: 本体被弾でも回復タイマーをリセット（戦闘中にシールドが復活し続ける抜け穴を修正） */
  if(p.hp<=0){ p.hp=0; playerDeath(); }
}
/* v18: 撃墜シーケンス — 重い被弾音 →「プスプス」と煙を吐きながら墜ちる →「ドカーン！」→ 余韻 → 遷移 */
function playerDeath(){
  const p=Game.player; if(p.dying) return;
  p.dying=true; p.deathT=0; p.boomed=false; p.sputCd=0; p.inv=999999;
  Sound.playerDown(); Game.screenShake(20); Game.doFlash('#f66',0.75);
  burst(p.x,p.y,'#ff9a5a',22,4);
  spawnSmoke(p.x,p.y,4);
}
function updatePlayerDeath(dt){
  const p=Game.player;
  p.deathT+=dt;
  const t=p.deathT;
  if(!p.boomed){
    /* 制御を失ってふらふらと降下 */
    p.y += 0.55*dt; p.x += Math.sin(t*0.07)*1.0*dt;
    p.x = clamp(p.x,16,VW-16); p.y = clamp(p.y,40,VH-24);
    p.bank = Math.sin(t*0.055)*0.55;
    p.sputCd -= dt;
    if(p.sputCd<=0){
      p.sputCd = rand(7,15);
      burst(p.x+rand(-10,10), p.y+rand(-10,10), '#ff9a5a', 6, 2.4);
      spawnSmoke(p.x+rand(-8,8), p.y+rand(-4,10), 3);
      Sound.sputter(); Game.screenShake(2);
    }
  }
  if(!p.boomed && t>=100){
    p.boomed=true;
    Sound.finalBoom(1.15); Game.doFlash('#fff',0.95); Game.screenShake(28);
    addShock(p.x,p.y,260,'#9cf');
    for(let i=0;i<34;i++) setTimeout(()=>{
      if(Game.state!==STATE.PLAY) return;
      burst(p.x+rand(-18,18), p.y+rand(-18,18), i%2?'#8cf':'#fff', 9, 5.5);
      if(i%5===0) spawnSmoke(p.x+rand(-14,14), p.y+rand(-14,14), 2);
    }, i*15);
    spawnDebris(p.x,p.y,15,{dmg:0, speed:4.6, color:'#9cf'});
  }
  if(t>=165 && Game.state===STATE.PLAY) Game.endRun(false);
}

/* =========================================================================
   衝突判定
   ========================================================================= */
function collisions(){
  const p=Game.player;
  if(cineLock()) return;                 // v25: 演出中は攻守ともに当たり判定を止める
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i]; let hit=false;
    for(const e of Game.enemies){ if(e.dead) continue; if(circleHit(b,e)){ damageEnemy(e,b.dmg,b.x,b.y); hitSpark(b); hit=true; break; } }
    if(!hit && Game.boss && !Game.boss.dead && !Game.boss.entering){ if(circleHit(b,Game.boss)){ damageBoss(b.dmg,b.x,b.y); hitSpark(b); hit=true; } }
    if(!hit){ for(const h of Game.helpers){ if(h.dead||h.entering) continue; if(circleHit(b,h)){ damageBossObj(h,b.dmg,b.x,b.y); hitSpark(b); hit=true; break; } } }
    if(hit) pBullets.splice(i,1);
  }
  if(!p) return;
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    if(dist2(b.x,b.y,p.x,p.y) < (b.r+p.r)*(b.r+p.r)){ playerHit(b.dmg); eBullets.splice(i,1); }
  }
  for(const e of Game.enemies){ if(e.dead) continue; if(circleHit(e,p)){ playerHit(Math.round(e.dmg*dmgScale())); damageEnemy(e,40,e.x,e.y); } }
  if(Game.boss && !Game.boss.entering && !Game.boss.dead){ if(circleHit(Game.boss,p)){ playerHit(Math.round(24*dmgScale())); } }
  for(const h of Game.helpers){ if(!h.dead && !h.entering && circleHit(h,p)) playerHit(Math.round(22*dmgScale())); }
}

/* =========================================================================
   更新 (プレイ中)
   ========================================================================= */
function updatePlay(dt){
  /* v18: 撃墜シーケンス中は操作・攻撃・当たり判定を止めて演出に専念 */
  if(Game.player && Game.player.dying){
    updatePlayerDeath(dt);
    for(let i=eBullets.length-1;i>=0;i--){ const b=eBullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(b.y<-40||b.y>VH+40||b.x<-40||b.x>VW+40||b.life<=0) eBullets.splice(i,1); }
    for(let i=Game.enemies.length-1;i>=0;i--){ const e=Game.enemies[i]; if(e.hitFlash>0)e.hitFlash-=dt; updateEnemy(e,dt); if(e.dead) Game.enemies.splice(i,1); }
    updateDebris(dt); updateShocks(dt); updateParticles(dt); updateFloats(dt); updateStarfield(dt);
    if(Game.shake>0) Game.shake*=0.9;
    if(Game.flash>0) Game.flash-=0.03*dt;
    return;
  }
  Director.update(dt);
  if(Director.phase==='bossintro'){ Director.bossIntro-=dt; if(Director.bossIntro<=0){ spawnBoss(Director.stage); Director.phase='boss'; } }
  if(Director.phase==='transform'){ Director.transformT-=dt; if(Director.transformT<=0){ spawnGreatBoss(Game.lastBossX, Game.lastBossY); Director.phase='great'; } }

  updatePlayer(dt);
  for(let i=pBullets.length-1;i>=0;i--){ const b=pBullets[i];
    if(b.homing){ let best=null,bd=1e9; for(const e of Game.enemies){ if(e.dead)continue; const d=dist2(b.x,b.y,e.x,e.y); if(d<bd){bd=d;best=e;} } if(!best&&Game.boss&&!Game.boss.dead){best=Game.boss;} if(best){ const a=Math.atan2(best.y-b.y,best.x-b.x); const ca=Math.atan2(b.vy,b.vx); let na=ca+clamp(((a-ca+Math.PI*3)%TAU)-Math.PI,-b.turn,b.turn); b.vx=Math.cos(na)*b.speed; b.vy=Math.sin(na)*b.speed; } if(Math.random()<0.5) spawnParticle(b.x,b.y,'#f9e',{life:8,r:2});
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.y<-20||b.y>VH+20||b.x<-20||b.x>VW+20||b.life<=0) pBullets.splice(i,1);
  }
  for(let i=eBullets.length-1;i>=0;i--){ const b=eBullets[i];
    b.t+=dt;
    if(b.ax) b.vx+=b.ax*dt; if(b.ay) b.vy+=b.ay*dt;
    /* v13: 飛翔中に加速（上限2.2倍かつ絶対速度9px/f まで＝元々速い弾は伸びない） */
    if(b.acc && b.mult<b.accMax){
      const sp=Math.abs(b.vx)+Math.abs(b.vy);
      if(sp<11){ const f=1+b.acc*dt; b.vx*=f; b.vy*=f; b.mult*=f; }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.wave){ b.x += Math.sin(b.t*b.wave.f + b.wave.p)*b.wave.a*dt; }
    b.life-=dt;
    if(b.y<-40||b.y>VH+40||b.x<-40||b.x>VW+40||b.life<=0) eBullets.splice(i,1);
  }
  for(let i=Game.enemies.length-1;i>=0;i--){ const e=Game.enemies[i]; if(e.hitFlash>0)e.hitFlash-=dt; updateEnemy(e,dt); if(e.dead) Game.enemies.splice(i,1); }
  if(Game.boss){
    if(Game.boss.dead){ const b=Game.boss; if(updateBossDeath(b,dt)) finishBossDeath(b); }
    else updateBoss(Game.boss,dt);
  }
  /* v14: お助けボスの出現管理と更新 */
  if(Game.boss && Game.boss.isGreat && !Game.boss.dead && !Game.boss.entering){
    const ratio=Game.boss.hp/Game.boss.maxHp;
    if(Game.helpers.length===0 && Game.helperIdx<HELPERS.length && ratio<=HELPERS[Game.helperIdx].th){
      spawnHelper(Game.helperIdx);
    }
  }
  for(let i=Game.helpers.length-1;i>=0;i--){
    const h=Game.helpers[i];
    if(h.dead){ if(updateBossDeath(h,dt)){ finishBossDeath(h); Game.helpers.splice(i,1); } continue; }
    updateBoss(h,dt);
  }
  updateDebris(dt); updateShocks(dt);
  updatePowerups(dt);
  updateParticles(dt); updateFloats(dt);
  collisions();
  updateStarfield(dt);
  if(Game.messageT>0) Game.messageT-=dt;
  if(Game.cine){ Game.cine.t+=dt; if(Game.cine.t>=Game.cine.dur) Game.cine=null; }
  if(Game.odT>0) Game.odT-=dt;
  if(Game.shake>0) Game.shake*=0.9;
  if(Game.flash>0) Game.flash-=0.03*dt;
}

/* =========================================================================
   背景 (パララックス星野 + グリッド)
   ========================================================================= */
function makeStarfield(){
  const layers=[];
  for(let l=0;l<3;l++){ const arr=[]; const n=[40,26,14][l]; for(let i=0;i<n;i++) arr.push({x:rand(0,VW),y:rand(0,VH),s:(l+1)*0.6+rand(0,0.5)}); layers.push({arr,speed:(l+1)*0.5}); }
  return {layers, grid:0};
}
function updateStarfield(dt){
  const bg=Game.bg; if(!bg) return;
  for(const L of bg.layers){ for(const s of L.arr){ s.y+=L.speed*dt; if(s.y>VH){ s.y=-2; s.x=rand(0,VW);} } }
  bg.grid=(bg.grid+0.6*dt)% 48;
}
function drawStarfield(){
  const bg=Game.bg; if(!bg) return;
  ctx.strokeStyle='rgba(80,140,220,0.06)'; ctx.lineWidth=1;
  for(let y=-48+bg.grid;y<VH;y+=48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(VW,y); ctx.stroke(); }
  for(let x=0;x<VW;x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,VH); ctx.stroke(); }
  const cols=['rgba(120,180,255,.5)','rgba(180,210,255,.8)','#dff'];
  bg.layers.forEach((L,li)=>{ ctx.fillStyle=cols[li]; for(const s of L.arr){ ctx.fillRect(s.x,s.y,s.s,s.s*2); } });
}

/* =========================================================================
   描画ヘルパー（ネオン図形）
   ========================================================================= */
/* v26: グロー品質。重い端末では自動的に下がる（下の loop で調整） */
let GLOWQ = 1;
function gq(v){ return v*GLOWQ; }
function neonPoly(pts,color,fill,lw=2,glow=14){
  ctx.save(); ctx.shadowBlur=glow*GLOWQ; ctx.shadowColor=color; ctx.lineWidth=lw; ctx.strokeStyle=color;
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } ctx.stroke(); ctx.restore();
}
function neonCircle(x,y,r,color,lw=2,glow=14,fill){
  ctx.save(); ctx.shadowBlur=glow*GLOWQ; ctx.shadowColor=color; ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); if(fill){ctx.fillStyle=fill;ctx.fill();} ctx.stroke(); ctx.restore();
}
/* =========================================================================
   v10: 自機の機体グラフィック
   ・後退翼を持つ戦闘機シルエット（胴体／主翼／尾翼／キャノピー／双発エンジン）
   ・強化状況で機体が進化（武器Lv→翼端キャノン、装甲Lv→増加装甲）
   ・キャノピーとエネルギーラインは威力レベルの色で光る
   ・タイトル/エンディング画面とも共用
   ========================================================================= */
/* v27: 攻撃系の強化度から「機体形式(MK-I〜MK-V)」を決める。
   メインショット×2＋火力＋連射 の合計で 5 段階に進化する。 */
function shipMark(wl,pw,rt){
  const atk = (wl||0)*2 + (pw||0) + (rt||0);      // 0 〜 23
  return atk>=19?4 : atk>=13?3 : atk>=8?2 : atk>=3?1 : 0;
}
const SHIP_MARKS = [
  {n:'MK-I',   t:'FALCON'},
  {n:'MK-II',  t:'RAPTOR'},
  {n:'MK-III', t:'LANCER'},
  {n:'MK-IV',  t:'CRUSADER'},
  {n:'MK-V',   t:'SOVEREIGN'},
];
function currentMark(){ return shipMark(upLevel('weapon'), upLevel('power'), upLevel('rate')); }
/* 各画面で共通に使う機体オプション */
function shipOpts(extra){
  return Object.assign({
    weapon: upLevel('weapon'), armor: upLevel('hp'),
    power: upLevel('power'), rate: upLevel('rate'), missiles: upLevel('missile')
  }, extra||{});
}

function drawShipBody(anim, accent, opt){
  opt = opt||{};
  const wl = opt.weapon||0, ar = opt.armor||0, pw = opt.power||0, rt = opt.rate||0, ms = opt.missiles||0;
  const mk = opt.mk!==undefined ? opt.mk : shipMark(wl,pw,rt);
  const thrust = opt.thrust!==undefined?opt.thrust:1;
  const hull = opt.hull||'#dffbff', wing = opt.wing||'#bfefff', tail = opt.tail||'#7fd4ff';
  const flameC = opt.flame||'#4cf';

  /* 形式ごとの寸法 */
  const WSPAN = [13.5, 16, 18, 20, 22][mk];      // 主翼の張り出し
  const WBACK = [8.5, 9.5, 10, 10.5, 11][mk];    // 翼端の後退量
  const BODY  = [1.0, 1.03, 1.08, 1.14, 1.20][mk]; // 胴体の太さ
  const NOSE  = [-19, -19.5, -20.5, -21.5, -23][mk];

  /* --- エンジン炎（機体の後ろに描く / スプライトなので軽い） --- */
  const fl = (13 + Math.sin(anim*0.45)*3.2) * thrust;
  const nozzles = mk>=2 ? [[-4.6,1],[4.6,1],[-11.5,0.62],[11.5,0.62]] : [[-4.6,1],[4.6,1]];
  if(fl>0){
    for(const nz of nozzles) eFlame(nz[0], 12*nz[1], fl*nz[1]*1.55, 3.6*nz[1], flameC, anim, 1);
  }

  /* --- 尾翼（後退翼） --- */
  const tf = 1+mk*0.06;
  neonPoly([[-4.5,3],[-11*tf,12],[-13*tf,16.5],[-5.5,10]], tail,'rgba(40,140,220,0.20)',1.5,9);
  neonPoly([[ 4.5,3],[ 11*tf,12],[ 13*tf,16.5],[ 5.5,10]], tail,'rgba(40,140,220,0.20)',1.5,9);

  /* --- 主翼（形式が上がるほど大きく張り出す） --- */
  neonPoly([[-4,-5],[-WSPAN,3],[-WSPAN-2,WBACK],[-5,5]], wing,'rgba(60,180,255,0.22)',1.8,12);
  neonPoly([[ 4,-5],[ WSPAN,3],[ WSPAN+2,WBACK],[ 5,5]], wing,'rgba(60,180,255,0.22)',1.8,12);

  /* --- MK-II〜: 翼端キャノン --- */
  if(mk>=1){
    ctx.save(); ctx.shadowBlur=gq(10); ctx.shadowColor=accent; ctx.strokeStyle=accent; ctx.lineWidth=1.7;
    ctx.beginPath();
    for(const s of [-1,1]){ ctx.moveTo(s*(WSPAN-0.5),-1.5); ctx.lineTo(s*(WSPAN-0.5),7.5); }
    ctx.stroke(); ctx.restore();
  }
  /* --- MK-III〜: 前進カナード＋インテーク --- */
  if(mk>=2){
    neonPoly([[-3.6,-12],[-11,-14.5],[-12.5,-9.5],[-4.6,-7.5]], wing,'rgba(60,180,255,0.26)',1.3,9);
    neonPoly([[ 3.6,-12],[ 11,-14.5],[ 12.5,-9.5],[ 4.6,-7.5]], wing,'rgba(60,180,255,0.26)',1.3,9);
    ctx.save(); ctx.shadowBlur=gq(7); ctx.shadowColor=tail; ctx.strokeStyle=tail; ctx.lineWidth=1.1; ctx.globalAlpha=0.8;
    ctx.beginPath();
    for(const s of [-1,1]){ ctx.moveTo(s*7.5,-1); ctx.lineTo(s*10.5,4); ctx.lineTo(s*10.5,8); }
    ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
  }
  /* --- MK-IV〜: 上段の副翼＋背びれ --- */
  if(mk>=3){
    neonPoly([[-5,-3],[-WSPAN+2,-6],[-WSPAN,-1.5],[-5.5,1]], tail,'rgba(120,210,255,0.24)',1.2,8);
    neonPoly([[ 5,-3],[ WSPAN-2,-6],[ WSPAN,-1.5],[ 5.5,1]], tail,'rgba(120,210,255,0.24)',1.2,8);
    neonPoly([[0,-9],[2.2,-1],[0,7],[-2.2,-1]], hull,'rgba(160,230,255,0.22)',1.1,9);
  }
  /* --- MK-V: 機首ブレード＋翼端オーブ --- */
  if(mk>=4){
    for(const s of [-1,1]){
      neonPoly([[s*3.2,-14],[s*4.6,-26],[s*2.4,-25],[s*1.8,-14]], accent,'rgba(180,240,255,0.30)',1.2,12);
    }
    const orb=0.6+0.4*Math.sin(anim*0.1);
    ctx.save(); ctx.shadowBlur=gq(16); ctx.shadowColor=accent; ctx.fillStyle=accent; ctx.globalAlpha=0.7+0.3*orb;
    ctx.beginPath();
    for(const s of [-1,1]){ ctx.moveTo(s*(WSPAN+2)+2.8,WBACK-1); ctx.arc(s*(WSPAN+2),WBACK-1,2.4+orb*0.7,0,TAU); }
    ctx.fill(); ctx.restore(); ctx.globalAlpha=1;
  }
  /* --- ホーミング弾のポッド（所持数だけ翼下に付く） --- */
  if(ms>0){
    ctx.save(); ctx.shadowBlur=gq(6); ctx.shadowColor='#9fd8ff'; ctx.strokeStyle='#9fd8ff'; ctx.lineWidth=1.1;
    ctx.fillStyle='rgba(140,210,255,0.22)';
    ctx.beginPath();
    for(let i=0;i<Math.min(ms,4);i++){
      const s = i%2? 1:-1, off = 9 + ((i/2)|0)*4.4;
      ctx.moveTo(s*off-1.5, 3); ctx.rect(s*off-1.5, 3, 3, 6.5);
    }
    ctx.fill(); ctx.stroke(); ctx.restore();
  }

  /* --- 胴体（形式が上がるほど厚みが増す） --- */
  neonPoly([[0,NOSE],[4.5*BODY,-6],[6*BODY,8],[3.5*BODY,13],[-3.5*BODY,13],[-6*BODY,8],[-4.5*BODY,-6]],
    hull,'rgba(80,190,255,0.28)',2,16);

  /* --- 増加装甲（装甲レベルで厚くなる） --- */
  if(ar>=2){
    ctx.save(); ctx.shadowBlur=gq(8); ctx.shadowColor='#9fd8ff'; ctx.strokeStyle='#9fd8ff'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-3.4,-3); ctx.lineTo(-4.6,7); ctx.moveTo(3.4,-3); ctx.lineTo(4.6,7); ctx.stroke();
    ctx.restore();
  }
  if(ar>=4){
    neonPoly([[-6*BODY,-2],[-8.6*BODY,1],[-8*BODY,7],[-5.6*BODY,6]], '#9fd8ff','rgba(120,200,255,0.25)',1.3,8);
    neonPoly([[ 6*BODY,-2],[ 8.6*BODY,1],[ 8*BODY,7],[ 5.6*BODY,6]], '#9fd8ff','rgba(120,200,255,0.25)',1.3,8);
  }

  /* --- 機首のエネルギーライン（形式が上がるほど長く強く光る） --- */
  ctx.save(); ctx.shadowBlur=gq(12+mk*3); ctx.shadowColor=accent; ctx.strokeStyle=accent; ctx.lineWidth=1.4+mk*0.15;
  ctx.beginPath(); ctx.moveTo(0,NOSE+2); ctx.lineTo(0,-11+mk*0.8); ctx.stroke(); ctx.restore();
  /* MK-IV〜: 背骨のエネルギーライン */
  if(mk>=3){
    const sp=0.45+0.55*Math.abs(Math.sin(anim*0.08));
    ctx.save(); ctx.globalAlpha=0.35+0.4*sp; ctx.shadowBlur=gq(10); ctx.shadowColor=accent;
    ctx.strokeStyle=accent; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,11); ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
  }

  /* --- キャノピー（威力レベルの色で脈動） --- */
  const cp = 0.75+0.25*Math.sin(anim*0.09);
  ctx.save(); ctx.shadowBlur=14*cp; ctx.shadowColor=accent; ctx.fillStyle=accent; ctx.globalAlpha=0.55+0.35*cp;
  ctx.beginPath(); ctx.ellipse(0,-8.5,2.6,5.2,0,0,TAU); ctx.fill();
  ctx.globalAlpha=1; ctx.fillStyle='#ffffff'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.ellipse(0,-9.5,1.1,2.2,0,0,TAU); ctx.fill();
  ctx.restore();

  /* --- エンジンノズルの光（形式が上がると4基になる） --- */
  ctx.save(); ctx.shadowBlur=gq(14); ctx.shadowColor=flameC; ctx.fillStyle='#bfefff';
  ctx.beginPath();
  for(const nz of nozzles){ const r=2.1*nz[1]; ctx.moveTo(nz[0]+r,12*nz[1]); ctx.arc(nz[0],12*nz[1],r,0,TAU); }
  ctx.fill(); ctx.restore();
  ctx.shadowBlur=0;

  /* --- v23: オーバードライブ形態（見た目をハッキリ変える） --- */
  if(opt.od){
    const gold='#ffd76a', lit='#fff6d8';
    /* 前進翼カナード（機首の左右に張り出す） */
    for(const s of [-1,1]){
      neonPoly([[s*3.6,-13],[s*13,-17],[s*16,-11],[s*5,-7]], gold,'rgba(255,190,60,0.28)',1.6,14);
    }
    /* 主翼の延長ブレード */
    for(const s of [-1,1]){
      neonPoly([[s*15,3],[s*23,6],[s*24.5,10],[s*17,9.5]], lit,'rgba(255,215,106,0.34)',1.5,16);
    }
    /* 背びれ（ドーサルフィン） */
    neonPoly([[0,-6],[2.4,2],[0,9],[-2.4,2]], lit,'rgba(255,240,200,0.35)',1.2,12);
    /* 光輪（ヘイロー） */
    const hp=0.6+0.4*Math.sin(anim*0.07);
    ctx.save(); ctx.globalAlpha=0.5+0.3*hp; ctx.shadowBlur=18; ctx.shadowColor=gold;
    ctx.strokeStyle=gold; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.ellipse(0,-2, 20+hp*2, 7.5+hp*1.2, 0, 0, TAU); ctx.stroke();
    ctx.restore();
    /* 翼端の金の火 */
    for(const s of [-1,1]){
      ctx.save(); ctx.shadowBlur=16; ctx.shadowColor=gold; ctx.fillStyle=lit; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(s*23.5, 8.5, 1.9+hp*0.8, 0, TAU); ctx.fill(); ctx.restore();
    }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
}

/* v18: 撃破演出中のボスは縮みながら消えていく */
function drawBossMaybeDying(b){
  if(!b) return;
  if(!b.dead){ drawBoss(b); return; }
  const ph=clamp(b.deathT/b.deathDur,0,1);
  const s=1-0.32*Math.max(0,(ph-0.7)/0.3);
  const a=1-Math.max(0,(ph-0.8)/0.2);
  if(a<=0) return;
  ctx.save(); ctx.globalAlpha=a;
  ctx.translate(b.x,b.y); ctx.scale(s,s); ctx.translate(-b.x,-b.y);
  drawBoss(b);
  ctx.restore(); ctx.globalAlpha=1;
}

/* シールド: 回転する六角バリア */
function drawShieldBarrier(p){
  const a=clamp(p.shieldHP/p.shieldMax,0,1), r=25;
  const gc = Game.overdrive?'#ffd76a':'#7ff';
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Game.t*0.012);
  ctx.shadowBlur=16; ctx.shadowColor=gc; ctx.strokeStyle=gc; ctx.lineWidth=2;
  ctx.globalAlpha=0.25+0.45*a;
  ctx.beginPath();
  for(let i=0;i<6;i++){ const ang=i/6*TAU; const x=Math.cos(ang)*r, y=Math.sin(ang)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.stroke();
  ctx.globalAlpha=0.12*a; ctx.fillStyle=gc; ctx.fill();
  ctx.globalAlpha=0.55*a; ctx.fillStyle=Game.overdrive?'#fff0c0':'#cff';
  for(let i=0;i<6;i++){ const ang=i/6*TAU; ctx.beginPath(); ctx.arc(Math.cos(ang)*r,Math.sin(ang)*r,2.2,0,TAU); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function drawPlayer(){
  const p=Game.player; if(!p) return;
  if(p.dying && p.boomed) return;                       // 爆散後は機体を消す
  const blink = p.dying ? (Math.floor(p.deathT/3)%2===0 && p.deathT>60)
                        : (p.inv>0 && Math.floor(p.inv/4)%2===0);
  const accent = BULLET_TIERS[p.tier!==undefined?p.tier:bulletTier()].c;

  const od = Game.overdrive;
  if(!blink){
    if(p.shieldHP>0) drawShieldBarrier(p);
    /* v15: オーバードライブの金色オーラ */
    if(od){
      const pulse=0.5+0.5*Math.sin(Game.t*0.08);
      ctx.save(); ctx.translate(p.x,p.y);
      /* 二重の金環＋逆回転する六芒星 */
      ctx.globalAlpha=0.26+0.22*pulse; ctx.shadowBlur=30; ctx.shadowColor='#ffd76a';
      ctx.strokeStyle='#ffd76a'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(0,0,27+pulse*5,0,TAU); ctx.stroke();
      ctx.globalAlpha=0.16+0.14*pulse; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(0,0,36+pulse*7,0,TAU); ctx.stroke();
      ctx.globalAlpha=0.16+0.12*pulse; ctx.lineWidth=1.1; ctx.strokeStyle='#fff2c0';
      for(const dir of [1,-1]){
        ctx.save(); ctx.rotate(dir*Game.t*0.02);
        ctx.beginPath();
        for(let i=0;i<3;i++){ const a=i/3*TAU+ (dir<0?Math.PI/3:0);
          const x=Math.cos(a)*31, y=Math.sin(a)*31; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.closePath(); ctx.stroke(); ctx.restore();
      }
      ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0;
      /* 金の粒子（多め）と残像 */
      for(let i=0;i<2;i++) if(Math.random()<0.6) spawnParticle(p.x+rand(-18,18), p.y+rand(-18,18),
        Math.random()<0.4?'#fff6d8':'#ffd76a',
        {vx:rand(-.6,.6), vy:rand(-1.8,-.2), life:rand(18,34), r:rand(1.2,3)});
      p.odTrail = p.odTrail||[];
      const lt=p.odTrail[p.odTrail.length-1];
      /* 動いている時だけ残像を残す（静止時に重なって滲まないように） */
      if(!lt || Math.abs(lt.x-p.x)+Math.abs(lt.y-p.y) > 2.2) p.odTrail.push({x:p.x,y:p.y,b:p.bank||0});
      else if(Game.t%3<1) p.odTrail.shift();
      if(p.odTrail.length>7) p.odTrail.shift();
      for(let i=0;i<p.odTrail.length-1;i++){
        const tr=p.odTrail[i];
        ctx.save(); ctx.globalAlpha=0.06+0.05*i; ctx.translate(tr.x,tr.y); ctx.rotate(tr.b); ctx.scale(0.94,0.94);
        drawShipBody(Game.t, '#fff4c4', shipOpts({thrust:0,
          hull:'#ffd76a', wing:'#ffd76a', tail:'#f5a83c', flame:'#fd8'}));
        ctx.restore();
      }
      ctx.globalAlpha=1;
    }
    ctx.save(); ctx.translate(p.x,p.y);
    /* 変身直後は機体がスピンしながら定位置に戻る */
    if(Game.odT>0){
      const q=clamp(Game.odT/130,0,1);
      ctx.rotate(q*q*TAU*2.2);
      const s2=1+q*0.55; ctx.scale(s2,s2);
    } else ctx.rotate(p.bank||0);
    drawShipBody(Game.t, od?'#fff4c4':accent, shipOpts({
      weapon:p.st.weapon,
      thrust: 1 + clamp(Math.abs(p.bank||0)*1.2, 0, 0.5) + (od?0.35:0),
      od: od,
      hull: od?'#fff6d8':undefined, wing: od?'#ffd76a':undefined,
      tail: od?'#f5a83c':undefined, flame: od?'#fd8':undefined
    }));
    /* 砲口の閃光（威力レベルで大きくなる） */
    if(p.muzzle>0){
      const tt=p.tier||0, T=BULLET_TIERS[tt];
      ctx.globalAlpha=clamp(p.muzzle,0,1)*0.85;
      ctx.shadowBlur=T.glow; ctx.shadowColor=T.c; ctx.fillStyle=T.core;
      ctx.beginPath(); ctx.ellipse(0,-20, 2.5+tt*0.85, 5+tt*1.5, 0,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.restore(); ctx.shadowBlur=0;
  }
  /* ウイングマン: 本機のミニチュア版 */
  if(p.dying) { ctx.shadowBlur=0; return; }
  for(const w of Game.wingmen){
    ctx.save(); ctx.translate(w.x,w.y); ctx.scale(0.58,0.58);
    drawShipBody(Game.t+w.side*4, od?'#fff4c4':'#9fffd0', {
      weapon:0, armor:0, mk:0, thrust:0.85,
      hull: od?'#fff2cc':'#c9ffe4', wing: od?'#ffd76a':'#8fe8b8',
      tail: od?'#e8a03c':'#6fd0a0', flame: od?'#fd8':'#5fd'
    });
    ctx.restore();
  }
  ctx.shadowBlur=0;
}
/* =========================================================================
   v26: 敵キャラのグラフィック作り込み
   ・機種ごとに「胴体／翼・装甲／コア／砲・エンジン」を組み上げたシルエットにする
   ・脈動するコア、自機を狙って回る砲塔、噴射炎、発射直前のチャージ光などを追加
   ・HPが減ると亀裂と黒煙が出て「弱っている」ことが見て分かる
   ・グロー(shadowBlur)は1体あたり数回に抑え、多数出ても速度を落とさない
   ========================================================================= */
/* 噴射炎（上方向＝進行方向の逆に伸びる） */
/* 噴射炎はオフスクリーンに一度だけ焼いて、以降は貼るだけにする。
   （毎フレーム グラデーション＋加算合成＋ぼかし を描くと極端に重く、
     40体表示で 474ms/frame → スプライト化で 30ms 台まで下がる） */
const FLAME_SPR = new Map();
function flameSprite(color){
  let s = FLAME_SPR.get(color);
  if(s) return s;
  const W=64, H=96;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const g2=cv.getContext('2d');
  const grd=g2.createLinearGradient(0,H,0,0);
  grd.addColorStop(0,'rgba(255,255,255,0.95)');
  grd.addColorStop(0.35,color);
  grd.addColorStop(1,'rgba(0,0,0,0)');
  g2.fillStyle=grd; g2.shadowBlur=16; g2.shadowColor=color;
  g2.beginPath();
  g2.moveTo(20,H-2);
  g2.quadraticCurveTo(26, H*0.42, 32, 6);
  g2.quadraticCurveTo(38, H*0.42, 44, H-2);
  g2.closePath(); g2.fill();
  FLAME_SPR.set(color, cv);
  return cv;
}
/* dir=-1: 上に伸びる（敵） / dir=+1: 下に伸びる（自機） */
function eFlame(x,y,len,w,color,anim,dir){
  const f = len*(0.72+0.28*Math.sin(anim*0.5));
  const spr = flameSprite(color);
  ctx.save();
  ctx.globalCompositeOperation='lighter';       // 加算合成で暗い背景でもしっかり光る
  ctx.globalAlpha=0.92;
  ctx.translate(x,y); if(dir>0) ctx.scale(1,-1);
  ctx.drawImage(spr, -w*2.1, -f, w*4.2, f);
  ctx.restore();
}
/* 脈動するコア（機体の“目”） */
function eCore(x,y,r,color,anim,speed){
  const pl = 0.62+0.38*Math.sin(anim*(speed||0.1));
  ctx.save();
  ctx.shadowBlur=gq(9)+7*pl; ctx.shadowColor=color;
  ctx.globalAlpha=0.55+0.45*pl; ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r*(0.86+0.14*pl),0,TAU); ctx.fill();
  ctx.globalAlpha=1; ctx.fillStyle='#ffffff'; ctx.shadowBlur=gq(5);
  ctx.beginPath(); ctx.arc(x,y,r*0.42,0,TAU); ctx.fill();
  ctx.restore();
}
/* 損傷表現: 亀裂と黒煙 */
function enemyDamage(e){
  if(!e.maxHp || e.maxHp<40) return;
  const f = e.hp/e.maxHp;
  if(f>=0.55) return;
  const sev = 1-(f/0.55);
  ctx.save();
  ctx.globalAlpha=0.30+0.40*sev; ctx.strokeStyle='#0d1a26'; ctx.lineWidth=1.7;
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const a=e.phase+i*2.1, d=e.r*0.8;
    ctx.moveTo(Math.cos(a)*d*0.15, Math.sin(a)*d*0.15);
    ctx.lineTo(Math.cos(a+0.55)*d*0.62, Math.sin(a+0.55)*d*0.62);
    ctx.lineTo(Math.cos(a-0.25)*d, Math.sin(a-0.25)*d);
  }
  ctx.stroke(); ctx.restore();
  if(Math.random() < 0.05+0.09*sev){
    spawnParticle(e.x+rand(-e.r*0.5,e.r*0.5), e.y+rand(-e.r*0.4,e.r*0.4),
      Math.random()<0.28?'#ff8844':'#3a5570',
      {vx:rand(-.35,.35), vy:rand(-1.3,-.3), life:rand(18,36), r:rand(1.4,3.1)});
  }
}

function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  const c = e.hitFlash>0?'#fff':e.color;
  const lit = '#ffffff';
  ctx.rotate(e.angle);
  const P = Game.player;
  switch(e.kind){

    /* インターセプター: 後退翼＋双発 */
    case 'grunt': {
      eFlame(-4.6,-8,15,3.2,'#3aaaff',e.t);
      eFlame( 4.6,-8,15,3.2,'#3aaaff',e.t+3);
      neonPoly([[-13,-7],[-5,-3],[-4,4],[-11,2]],c,'rgba(60,150,255,0.16)',1.3,7);
      neonPoly([[ 13,-7],[ 5,-3],[ 4,4],[ 11,2]],c,'rgba(60,150,255,0.16)',1.3,7);
      neonPoly([[0,12],[5,1],[4,-8],[-4,-8],[-5,1]],c,'rgba(80,180,255,0.22)',1.8,12);
      /* 翼端灯 */
      ctx.save(); ctx.fillStyle=lit; ctx.shadowBlur=gq(8); ctx.shadowColor=c; ctx.globalAlpha=0.8;
      ctx.beginPath(); ctx.moveTo(-11.5,-5); ctx.arc(-12.5,-5,1.3,0,TAU); ctx.moveTo(13.5,-5); ctx.arc(12.5,-5,1.3,0,TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha=1;
      eCore(0,0,2.7,c,e.t,0.11);
      break;
    }

    /* ウィーバー: ヒレを波打たせて泳ぐマンタ型 */
    case 'weaver': {
      const w=Math.sin(e.t*0.11)*4.5;
      eFlame(0,-11,13,2.6,'#3fffd0',e.t);
      /* 波打つヒレ */
      neonPoly([[0,-12],[12,-3+w],[7,5],[0,11],[-7,5],[-12,-3-w]],c,'rgba(80,255,220,0.17)',1.8,12);
      /* たなびく触手 */
      ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.shadowBlur=gq(6); ctx.shadowColor=c;
      ctx.beginPath();
      for(const s of [-1,1]){
        ctx.moveTo(s*8, 2);
        ctx.quadraticCurveTo(s*(10+w*0.6), -6, s*(7-w*0.5), -13);
      }
      ctx.moveTo(-4.5,-4); ctx.lineTo(0,7); ctx.lineTo(4.5,-4);
      ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
      eCore(0,-2,2.9,c,e.t,0.14);
      break;
    }

    /* タレット: 自機を狙って砲塔が回る固定砲台 */
    case 'turret': {
      neonPoly([[-13,-9],[13,-9],[10,6],[6,11],[-6,11],[-10,6]],c,'rgba(120,160,255,0.17)',1.8,12);
      neonPoly([[-16.5,-5],[-11,-6.5],[-11,4],[-15.5,3]],c,'rgba(120,160,255,0.24)',1.1,6);
      neonPoly([[ 16.5,-5],[ 11,-6.5],[ 11,4],[ 15.5,3]],c,'rgba(120,160,255,0.24)',1.1,6);
      const aim = P? Math.atan2(P.y-e.y,P.x-e.x) : Math.PI/2;
      ctx.save(); ctx.rotate(aim-Math.PI/2);
      ctx.shadowBlur=gq(9); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.moveTo(-2.2,3); ctx.lineTo(-2.2,13); ctx.moveTo(2.2,3); ctx.lineTo(2.2,13); ctx.stroke();
      ctx.restore();
      /* 旋回リング */
      ctx.save(); ctx.globalAlpha=0.55; ctx.strokeStyle=c; ctx.lineWidth=1.2;
      ctx.shadowBlur=gq(6); ctx.shadowColor=c;
      ctx.beginPath(); ctx.arc(0,0,8.6,0,TAU); ctx.stroke();
      ctx.setLineDash([3,3]); ctx.globalAlpha=0.35;
      ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.stroke();
      ctx.setLineDash([]); ctx.restore(); ctx.globalAlpha=1;
      neonCircle(0,0,5.4,c,1.7,9,'rgba(140,190,255,0.26)');
      eCore(0,0,2.3,c,e.t,0.09);
      break;
    }

    /* ボマー: 回転装甲リング＋発射直前に光る爆弾倉 */
    case 'bomber': {
      eFlame(-11,-9,9,2.2,'#b07dff',e.t);
      eFlame( 11,-9,9,2.2,'#b07dff',e.t+2);
      neonCircle(0,0,e.r,c,2,14,'rgba(150,110,255,0.14)');
      ctx.save(); ctx.rotate(e.t*0.012);
      ctx.shadowBlur=gq(6); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=1.5; ctx.globalAlpha=0.5;
      ctx.beginPath();
      for(let i=0;i<4;i++){ const a=i/4*TAU;
        ctx.moveTo(Math.cos(a+0.22)*(e.r-4), Math.sin(a+0.22)*(e.r-4));
        ctx.arc(0,0,e.r-4,a+0.22,a+1.34); }
      ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
      const ch = clamp(1-e.fireCd/40,0,1);
      neonPoly([[-8,4],[8,4],[0,14]], ch>0.25?lit:c,
        'rgba(230,190,255,'+(0.12+0.48*ch).toFixed(2)+')', 1.6, 7+ch*17);
      eCore(0,-3,3.4,c,e.t,0.08);
      break;
    }

    /* カミカゼ: 燃えながら突っ込む特攻ドローン */
    case 'kamikaze': {
      eFlame(0,-9,22+Math.sin(e.t*0.4)*6,4.6,'#ff6a30',e.t);
      /* 安定翼 */
      neonPoly([[-8,-4],[-13,-9],[-12,-2],[-7,0]],c,'rgba(255,120,60,0.28)',1.2,7);
      neonPoly([[ 8,-4],[ 13,-9],[ 12,-2],[ 7,0]],c,'rgba(255,120,60,0.28)',1.2,7);
      neonPoly([[0,13],[8,-4],[5,-9],[-5,-9],[-8,-4]],c,'rgba(255,130,90,0.24)',1.9,13);
      ctx.save(); ctx.globalAlpha=0.75; ctx.strokeStyle=lit; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(-4.6,-2); ctx.lineTo(4.6,-2); ctx.moveTo(-3.6,-5); ctx.lineTo(3.6,-5); ctx.stroke();
      ctx.restore();
      eCore(0,5,2.5,'#ff5522',e.t,0.34);
      break;
    }

    /* スプリッター: 分裂する子機を内包した細胞 */
    case 'splitter': {
      const br=1+Math.sin(e.t*0.06)*0.06;
      ctx.save(); ctx.scale(br,br); ctx.rotate(e.t*0.02);
      ctx.shadowBlur=gq(13); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<6;i++){ const a=i/6*TAU; const x=Math.cos(a)*e.r,y=Math.sin(a)*e.r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.closePath(); ctx.fillStyle='rgba(190,255,90,0.10)'; ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.rotate(-e.t*0.03);
      ctx.shadowBlur=gq(6); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=1;
      ctx.fillStyle='rgba(190,255,90,0.22)';
      ctx.beginPath();
      for(let i=0;i<4;i++){ const a=i/4*TAU+0.6, dx=Math.cos(a)*7, dy=Math.sin(a)*7;
        ctx.moveTo(dx,dy-4); ctx.lineTo(dx+4,dy+3); ctx.lineTo(dx-4,dy+3); ctx.closePath(); }
      ctx.fill(); ctx.stroke(); ctx.restore();
      eCore(0,0,3,c,e.t,0.12);
      break;
    }

    /* ミニ: 分裂して出てくる小型機 */
    case 'mini': {
      eFlame(0,-5,6,1.6,'#cfff66',e.t);
      neonPoly([[0,8],[5,-3],[0,-6],[-5,-3]],c,'rgba(190,255,90,0.22)',1.4,8);
      break;
    }

    /* シールド持ち: 回転する六角バリアを展開 */
    case 'shield': {
      eFlame(-4,-7,8,2,'#5fffff',e.t);
      eFlame( 4,-7,8,2,'#5fffff',e.t+2);
      neonPoly([[0,10],[7,2],[6,-7],[-6,-7],[-7,2]],c,'rgba(120,255,255,0.20)',1.6,10);
      ctx.save(); ctx.rotate(e.t*0.024);
      const sr=e.r+4;
      ctx.shadowBlur=gq(11); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=2; ctx.globalAlpha=0.72;
      ctx.beginPath();
      for(let i=0;i<6;i++){ const a=i/6*TAU;
        ctx.moveTo(Math.cos(a+0.14)*sr, Math.sin(a+0.14)*sr);
        ctx.arc(0,0,sr,a+0.14,a+0.90); }
      ctx.stroke();
      ctx.globalAlpha=0.10; ctx.fillStyle=c; ctx.shadowBlur=gq(0);
      ctx.beginPath(); ctx.arc(0,0,sr,0,TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha=1;
      eCore(0,-1,2.8,c,e.t,0.1);
      break;
    }

    /* 機雷: 棘つき球体＋点滅する起爆ランプ */
    case 'mine': {
      ctx.save();
      ctx.shadowBlur=gq(11); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<8;i++){ const a=i/8*TAU;
        ctx.moveTo(Math.cos(a)*5, Math.sin(a)*5);
        ctx.lineTo(Math.cos(a)*e.r, Math.sin(a)*e.r);
        ctx.moveTo(Math.cos(a)*e.r-1.6, Math.sin(a)*e.r-1.6);
        ctx.arc(Math.cos(a)*e.r, Math.sin(a)*e.r, 1.6, 0, TAU); }
      ctx.stroke(); ctx.restore();
      neonCircle(0,0,5.6,c,2,9,'rgba(255,210,100,0.22)');
      const bl = Math.sin(e.t*0.24)>0 ? 1 : 0.15;
      ctx.save(); ctx.globalAlpha=bl; ctx.fillStyle='#ff4444';
      ctx.shadowBlur=gq(13); ctx.shadowColor='#ff4444';
      ctx.beginPath(); ctx.arc(0,0,2.4,0,TAU); ctx.fill(); ctx.restore();
      break;
    }

    /* スナイパー: 長砲身を自機に向け、発射前に砲身が白熱する */
    case 'sniper': {
      const aim = P? Math.atan2(P.y-e.y,P.x-e.x) : Math.PI/2;
      eFlame(0,-13,11,2.4,'#ff6aff',e.t);
      /* 展開した安定板 */
      neonPoly([[-6,-3],[-12,-6],[-13,2],[-6,3]],c,'rgba(255,120,255,0.24)',1.2,7);
      neonPoly([[ 6,-3],[ 12,-6],[ 13,2],[ 6,3]],c,'rgba(255,120,255,0.24)',1.2,7);
      neonPoly([[0,-14],[6,-4],[5,6],[0,13],[-5,6],[-6,-4]],c,'rgba(255,120,255,0.17)',1.8,12);
      ctx.save(); ctx.rotate(aim-Math.PI/2);
      ctx.shadowBlur=gq(9); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(0,17); ctx.stroke();
      if(e.charging){
        const g=0.35+0.65*Math.abs(Math.sin(e.t*0.5));
        ctx.globalAlpha=g; ctx.strokeStyle='#fff'; ctx.lineWidth=1.3;
        ctx.shadowBlur=gq(17); ctx.shadowColor='#fff';
        ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(0,17); ctx.stroke();
        ctx.globalAlpha=1;
      }
      ctx.restore();
      eCore(0,-3,3, e.charging?'#ffffff':c, e.t, e.charging?0.5:0.08);
      if(e.charging){ const g=0.45+0.45*Math.sin(e.t*0.5); ctx.globalAlpha=g; neonCircle(0,0,e.r+5,'#fff',1.2,16); ctx.globalAlpha=1; }
      break;
    }

    /* オービター: 3基の子機を従えて周回する母機 */
    case 'orbiter': {
      /* 母機: 二重リング＋支柱 */
      neonCircle(0,0,e.r-3,c,2.2,12,'rgba(110,255,170,0.16)');
      ctx.save(); ctx.rotate(-e.t*0.03);
      ctx.shadowBlur=gq(6); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=1.4; ctx.globalAlpha=0.7;
      ctx.beginPath();
      for(let i=0;i<3;i++){ const a=i/3*TAU;
        ctx.moveTo(Math.cos(a)*3.5, Math.sin(a)*3.5);
        ctx.lineTo(Math.cos(a)*(e.r-3), Math.sin(a)*(e.r-3)); }
      ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
      /* 周回する子機とエネルギー結線 */
      const pts=[];
      for(let i=0;i<3;i++){ const a=e.t*0.1+i/3*TAU; pts.push([Math.cos(a)*(e.r+5),Math.sin(a)*(e.r+5)]); }
      ctx.save();
      ctx.shadowBlur=gq(7); ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=1; ctx.globalAlpha=0.38;
      ctx.beginPath(); pts.forEach((q,i)=> i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.stroke();
      ctx.globalAlpha=1; ctx.fillStyle=c; ctx.shadowBlur=gq(10);
      ctx.beginPath(); pts.forEach(q=>{ ctx.moveTo(q[0]+3,q[1]); ctx.arc(q[0],q[1],3,0,TAU); }); ctx.fill();
      ctx.shadowBlur=gq(0); ctx.fillStyle=lit;
      ctx.beginPath(); pts.forEach(q=>{ ctx.moveTo(q[0]+1.2,q[1]); ctx.arc(q[0],q[1],1.2,0,TAU); }); ctx.fill();
      ctx.restore();
      eCore(0,0,3.2,c,e.t,0.12);
      break;
    }

    /* キャリア: 子機を発艦させる大型輸送艦 */
    case 'carrier': {
      eFlame(-20,-11,12,3,'#ffaa66',e.t);
      eFlame( 20,-11,12,3,'#ffaa66',e.t+3);
      neonPoly([[-24,-11],[24,-11],[27,2],[15,13],[-15,13],[-27,2]],c,'rgba(255,170,100,0.14)',2,14);
      neonPoly([[-9,-11],[9,-11],[7,-17],[-7,-17]],c,'rgba(255,200,140,0.22)',1.3,7);
      const op = clamp(1-e.fireCd/45,0,1);
      ctx.save();
      ctx.strokeStyle= op>0.3?lit:c; ctx.lineWidth=1.5;
      ctx.shadowBlur=gq(5)+op*17; ctx.shadowColor= op>0.3?lit:c;
      ctx.fillStyle='rgba(255,230,180,'+(0.06+0.44*op).toFixed(2)+')';
      ctx.fillRect(-10,-2,20,9); ctx.strokeRect(-10,-2,20,9);
      ctx.restore();
      ctx.save(); ctx.shadowBlur=gq(7); ctx.shadowColor='#ffbb88';
      ctx.beginPath();
      for(let i=-2;i<=2;i++){ ctx.moveTo(i*8+1.5,-8); ctx.arc(i*8,-8,1.5,0,TAU); }
      ctx.fillStyle='rgba(255,190,120,0.5)'; ctx.fill();
      const k=Math.floor(e.t*0.07)%5-2;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(k*8,-8,1.7,0,TAU); ctx.fill();
      ctx.restore();
      break;
    }

    /* ダッシャー: 速度線を引いて横断する高速機 */
    case 'dasher': {
      const dir = e.vx>=0?1:-1;
      ctx.save(); ctx.globalAlpha=0.38; ctx.strokeStyle=c; ctx.lineWidth=1.4;
      ctx.shadowBlur=gq(7); ctx.shadowColor=c;
      ctx.beginPath();
      for(let i=0;i<3;i++){ const yy=(i-1)*5; ctx.moveTo(-12*dir,yy); ctx.lineTo(-(23+i*7)*dir,yy); }
      ctx.stroke(); ctx.restore();
      neonPoly([[14*dir,0],[-2*dir,-9],[-11*dir,-5],[-5*dir,0],[-11*dir,5],[-2*dir,9]],c,'rgba(110,230,255,0.19)',1.8,12);
      eCore(4*dir,0,2.4,c,e.t,0.2);
      break;
    }
  }
  enemyDamage(e);
  ctx.restore(); ctx.shadowBlur=gq(0); ctx.globalAlpha=1;
  if(e.maxHp>60 && e.hp<e.maxHp){
    const f=clamp(e.hp/e.maxHp,0,1);
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(e.x-15,e.y-e.r-9,30,4);
    ctx.fillStyle = f>0.5? e.color : (f>0.25? '#ffcc55' : '#ff5a6a');
    ctx.fillRect(e.x-15,e.y-e.r-9,30*f,4);
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1;
    ctx.strokeRect(e.x-15.5,e.y-e.r-9.5,31,5);
  }
}

/* ---- ボス描画（個体別デザイン） ---- */
function drawBoss(b){
  const flash=b.hitFlash>0;
  ctx.save(); ctx.translate(b.x,b.y);
  const R=b.r;
  if(b.id==='mid0'){ /* RAZOR: 双刃 */
    const c=flash?'#fff':'#7ef';
    neonPoly([[-R*1.2,0],[-R*0.5,-R*0.55],[R*0.5,-R*0.55],[R*1.2,0],[R*0.5,R*0.55],[-R*0.5,R*0.55]],c,'rgba(120,240,255,0.10)',2.5,16);
    for(const s of [-1,1]){
      ctx.save(); ctx.translate(s*R*1.05,0); ctx.rotate(b.spin*6*s);
      neonPoly([[0,-16],[14,0],[0,16],[-14,0]],c,'rgba(120,240,255,0.2)',2,12);
      ctx.restore();
    }
    neonCircle(0,0,R*0.32,flash?'#fff':'#39f',2,18,'rgba(60,150,255,0.5)');
  }
  else if(b.id==='mid1'){ /* PHANTOM: 残像ダイヤ */
    const c=flash?'#fff':'#c9f';
    for(let g=2;g>=0;g--){
      const off=(b.tx-b.x)*0.12*g;
      ctx.globalAlpha = g===0?1:0.22;
      neonPoly([[0-off,-R],[R*0.75-off,0],[0-off,R],[-R*0.75-off,0]],c,g===0?'rgba(190,130,255,0.12)':null,2.5,g===0?18:8);
    }
    ctx.globalAlpha=1;
    neonCircle(0,0,R*0.3,flash?'#fff':'#f6f',2,20,'rgba(255,80,220,0.45)');
  }
  else if(b.id==='mid2'){ /* WARDEN: 回転二重スクエア */
    const c=flash?'#fff':'#fd9';
    ctx.save(); ctx.rotate(b.spin*2);
    neonPoly([[-R,-R*0.7],[R,-R*0.7],[R,R*0.7],[-R,R*0.7]],c,'rgba(255,210,140,0.08)',2.5,14);
    ctx.restore();
    ctx.save(); ctx.rotate(-b.spin*3);
    neonPoly([[0,-R*0.75],[R*0.75,0],[0,R*0.75],[-R*0.75,0]],c,null,2,10);
    ctx.restore();
    for(let i=0;i<4;i++){ const a=i/4*TAU+Math.PI/4+b.spin*2; neonCircle(Math.cos(a)*R*0.95,Math.sin(a)*R*0.95,7,c,2,10,'rgba(255,200,120,0.3)'); }
    neonCircle(0,0,R*0.3,flash?'#fff':'#f83',2,18,'rgba(255,130,50,0.5)');
  }
  else if(b.id==='boss0'){ /* AZURE CRUSHER: 蟹型 */
    const c=flash?'#fff':'#6cf';
    neonPoly([[-R,-R*0.25],[-R*0.55,-R*0.62],[R*0.55,-R*0.62],[R,-R*0.25],[R*0.8,R*0.5],[0,R*0.72],[-R*0.8,R*0.5]],c,'rgba(90,190,255,0.10)',3,18);
    const open = 0.35+0.3*Math.sin(b.anim*0.06);
    for(const s of [-1,1]){
      ctx.save(); ctx.translate(s*R*1.12, R*0.1);
      ctx.rotate(s*0.25);
      neonPoly([[0,-8],[s*26,-14],[s*34,0],[s*26,14],[0,8]],c,'rgba(90,190,255,0.14)',2.5,12);
      ctx.save(); ctx.rotate(-s*open); neonPoly([[s*30,-4],[s*52,-16],[s*44,-2]],c,null,2,10); ctx.restore();
      ctx.save(); ctx.rotate(s*open);  neonPoly([[s*30,4],[s*52,16],[s*44,2]],c,null,2,10); ctx.restore();
      ctx.restore();
    }
    for(let i=0;i<2;i++){ neonCircle((i?1:-1)*R*0.34,-R*0.28,6,flash?'#fff':'#bff',2,12,'rgba(160,240,255,0.6)'); }
    neonCircle(0,R*0.08,R*0.3,flash?'#fff':'#39f',2.5,20,'rgba(50,140,255,0.5)');
  }
  else if(b.id==='boss1'){ /* CRIMSON MOTH: 蛾型 */
    const c=flash?'#fff':'#f6c';
    const flap = 0.7+0.3*Math.sin(b.anim*0.07);
    for(const s of [-1,1]){
      ctx.save(); ctx.scale(s*flap,1);
      neonPoly([[R*0.15,-R*0.1],[R*1.35,-R*0.75],[R*1.5,-R*0.15],[R*1.15,R*0.45],[R*0.4,R*0.5],[R*0.15,R*0.2]],c,'rgba(255,100,190,0.10)',2.5,16);
      neonPoly([[R*0.5,-R*0.3],[R*1.05,-R*0.5],[R*1.0,-R*0.1]],flash?'#fff':'#b3f',null,1.5,8);
      neonCircle(R*0.95,R*0.12,6,flash?'#fff':'#b3f',1.5,10,'rgba(180,80,255,0.35)');
      ctx.restore();
    }
    for(let i=0;i<3;i++){ neonCircle(0,-R*0.35+i*R*0.34,R*0.2-i*2,c,2,14,'rgba(255,110,200,0.25)'); }
    for(const s of [-1,1]){ ctx.strokeStyle=c; ctx.shadowBlur=8; ctx.shadowColor=c; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,-R*0.5); ctx.quadraticCurveTo(s*R*0.35,-R*0.95, s*R*0.5,-R*1.05); ctx.stroke(); }
    neonCircle(0,0,R*0.16,flash?'#fff':'#ff3a7a',2,18,'rgba(255,60,120,0.6)');
  }
  else if(b.id==='boss2'){ /* GOLD SENTINEL: 六角要塞 */
    const c=flash?'#fff':'#fd6';
    ctx.save(); ctx.rotate(b.spin*1.6);
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; const x=Math.cos(a)*R, y=Math.sin(a)*R; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath();
    ctx.shadowBlur=18; ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=3; ctx.fillStyle='rgba(255,210,100,0.08)'; ctx.fill(); ctx.stroke();
    for(let i=0;i<6;i++){ const a=i/6*TAU; neonCircle(Math.cos(a)*R,Math.sin(a)*R,8,c,2,10,'rgba(255,210,100,0.3)'); }
    ctx.restore();
    ctx.save(); ctx.rotate(-b.spin*2.4);
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU+Math.PI/6; const x=Math.cos(a)*R*0.6, y=Math.sin(a)*R*0.6; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath();
    ctx.shadowBlur=10; ctx.shadowColor=c; ctx.strokeStyle=flash?'#fff':'#f83'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
    neonCircle(0,0,R*0.3,flash?'#fff':'#f83',2.5,20,'rgba(255,130,50,0.5)');
  }
  else { /* GREAT: OMEGA CORE */
    const c=flash?'#fff':'#ffcf5a';
    ctx.save(); ctx.rotate(b.spin);
    ctx.shadowBlur=20; ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=3;
    b.parts.forEach((pt)=>{ if(!pt.alive) return; const a0=pt.a-0.28, a1=pt.a+0.28;
      ctx.beginPath(); ctx.arc(0,0,R,a0,a1); ctx.arc(0,0,R*0.66,a1,a0,true); ctx.closePath();
      ctx.globalAlpha=0.9; ctx.stroke(); ctx.fillStyle='rgba(255,200,90,0.10)'; ctx.fill(); ctx.globalAlpha=1; });
    ctx.restore();
    ctx.save(); ctx.rotate(-b.spin*1.5);
    ctx.shadowBlur=12; ctx.shadowColor='#fd6'; ctx.strokeStyle='#ffe'; ctx.lineWidth=2;
    for(let i=0;i<8;i++){ const a=i/8*TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a)*R*0.75,Math.sin(a)*R*0.75); ctx.lineTo(Math.cos(a)*R*1.3,Math.sin(a)*R*1.3); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.rotate(b.spin*2.2);
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; const x=Math.cos(a)*R*0.5,y=Math.sin(a)*R*0.5; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath();
    ctx.shadowBlur=10; ctx.shadowColor='#f83'; ctx.strokeStyle=flash?'#fff':'#f83'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
    for(let i=0;i<4;i++){ const a=b.anim*0.03+i/4*TAU; neonCircle(Math.cos(a)*R*1.05,Math.sin(a)*R*1.05,7,flash?'#fff':'#ff8a5a',2,12,'rgba(255,120,70,0.45)'); }
    const coreR=R*0.36*(1+Math.sin(b.anim*0.1)*0.08);
    neonCircle(0,0,coreR,flash?'#fff':'#ff3a3a',2.5,26,'rgba(255,60,50,0.75)');
  }

  /* 共通: 装甲パネル（GREAT以外は薄く重ねる） */
  if(!b.isGreat){
    ctx.save(); ctx.rotate(b.spin);
    ctx.globalAlpha=0.32; ctx.shadowBlur=6; const pc=flash?'#fff':'#f9c'; ctx.shadowColor=pc; ctx.strokeStyle=pc; ctx.lineWidth=2;
    b.parts.forEach((pt)=>{ if(!pt.alive) return; const a0=pt.a-0.26, a1=pt.a+0.26;
      ctx.beginPath(); ctx.arc(0,0,R+9,a0,a1); ctx.stroke(); });
    ctx.restore(); ctx.globalAlpha=1;
  }
  ctx.restore(); ctx.shadowBlur=0;
}

/* =========================================================================
   HUD & 各画面
   ========================================================================= */
function drawHUD(){
  const p=Game.player; if(!p) return;
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(12,14,180,12);
  const hpc = p.hp/p.maxHP>0.3?'#5fd08a':'#f66';
  ctx.fillStyle=hpc; ctx.fillRect(12,14,180*clamp(p.hp/p.maxHP,0,1),12);
  ctx.strokeStyle='#8fb'; ctx.lineWidth=1; ctx.strokeRect(12,14,180,12);

/* v17: 左下の大型ボムボタン（左手の親指で押しやすい位置・サイズ） */
const BOMB_BTN = { x:62, y:0, r:36 };
function drawBombButton(p){
  BOMB_BTN.y = VH-74;
  const bx=BOMB_BTN.x, by=BOMB_BTN.y, br=BOMB_BTN.r;
  /* v24: 左手の親指で確実に押せるよう、判定を見た目よりかなり広く取る */
  addBtn(bx-br-18, by-br-18, (br+18)*2, (br+18)*2, 'bomb');
  const ready = p.bombs>0;
  const pulse = ready ? 0.5+0.5*Math.sin(Game.t*0.07) : 0;
  const col = ready ? '#8fe8ff' : '#3d5468';
  ctx.save(); ctx.textAlign='center';
  /* v27: 判定エリアの枠は表示しない（見た目はボタンだけ、判定だけ広い）。
     ドラッグ中はボタン自体を少し強調して「押せる」ことだけ伝える。 */
  if(pointer.active && ready){
    ctx.globalAlpha=0.10+0.08*pulse; ctx.fillStyle='#8fe8ff';
    ctx.shadowBlur=gq(26); ctx.shadowColor='#8fe8ff';
    ctx.beginPath(); ctx.arc(bx,by,br+10+pulse*3,0,TAU); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  /* 外周のパルスリング */
  if(ready){
    ctx.globalAlpha=0.18+0.22*pulse; ctx.shadowBlur=22; ctx.shadowColor='#8fe8ff';
    ctx.strokeStyle='#8fe8ff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx,by,br+4+pulse*3,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
  }
  /* 本体 */
  ctx.shadowBlur=ready?16:4; ctx.shadowColor=col;
  ctx.fillStyle = ready?'rgba(24,64,96,0.62)':'rgba(18,26,38,0.5)';
  ctx.strokeStyle=col; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.arc(bx,by,br,0,TAU); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0; ctx.globalAlpha=0.45; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(bx,by,br-7,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
  /* 爆弾アイコン */
  ctx.shadowBlur=ready?10:0; ctx.shadowColor=col;
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(bx, by-7, 8.5, 0, TAU); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bx+6, by-13); ctx.quadraticCurveTo(bx+13, by-20, bx+9, by-24); ctx.stroke();
  if(ready){ ctx.fillStyle='#fff'; ctx.globalAlpha=0.6+0.4*pulse;
    ctx.beginPath(); ctx.arc(bx+9, by-26, 2.4, 0, TAU); ctx.fill(); ctx.globalAlpha=1; }
  ctx.shadowBlur=0;
  /* ラベルと残数 */
  ctx.fillStyle = ready?'#dff6ff':'#5a7286';
  ctx.font='bold 12px system-ui'; ctx.fillText('BOMB', bx, by+12);
  ctx.font='bold 13px system-ui'; ctx.fillStyle = ready?'#8fe8ff':'#4a6076';
  ctx.fillText('×'+p.bombs, bx, by+26);
  ctx.restore();
}

function addBtn(x,y,w,h,id){ Game.buttons.push({x,y,w,h,id}); }
function drawButton(x,y,w,h,label,active=true,accent='#6cf'){
  ctx.save();
  ctx.shadowBlur=active?16:6; ctx.shadowColor=accent; ctx.lineWidth=2; ctx.strokeStyle=accent;
  ctx.fillStyle='rgba(20,40,70,0.55)';
  roundRect(x,y,w,h,8); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0; ctx.fillStyle=active?'#eaffff':'#6a8'; ctx.font='bold 15px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, x+w/2, y+h/2+1);
  ctx.restore(); ctx.textBaseline='alphabetic';
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* --- 星雲（タイトル/エンディング共用の背景演出） --- */
function drawNebula(){
  const T=Game.t;
  const blobs=[
    [VW*0.25+Math.sin(T*0.004)*30, 180+Math.cos(T*0.003)*20, 190,'rgba(40,90,200,0.12)'],
    [VW*0.78+Math.cos(T*0.0035)*26, 330+Math.sin(T*0.0042)*24, 160,'rgba(150,40,160,0.10)'],
    [VW*0.5+Math.sin(T*0.0028)*20, 610+Math.cos(T*0.0036)*30, 210,'rgba(30,140,160,0.09)'],
  ];
  for(const bl of blobs){
    const g=ctx.createRadialGradient(bl[0],bl[1],0,bl[0],bl[1],bl[2]);
    g.addColorStop(0,bl[3]); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(bl[0]-bl[2],bl[1]-bl[2],bl[2]*2,bl[2]*2);
  }
}

function drawHangar(){
  Game.buttons=[];
  drawStarfield();
  ctx.textAlign='center';
  if(Game.midRun){
    ctx.fillStyle='#9fffd0'; ctx.font='bold 22px system-ui';
    ctx.shadowBlur=16; ctx.shadowColor='#5f8';
    ctx.fillText('STAGE '+(Game.pendingStage)+' クリア！', VW/2, 40); ctx.shadowBlur=0;
    ctx.fillStyle='#dffbff'; ctx.font='bold 18px system-ui'; ctx.fillText('格納庫 / 強化タイム', VW/2, 66);
  } else {
    ctx.fillStyle='#dffbff'; ctx.font='bold 24px system-ui';
    ctx.shadowBlur=16; ctx.shadowColor='#6cf'; ctx.fillText('格納庫 / 強化', VW/2, 56); ctx.shadowBlur=0;
  }
  ctx.fillStyle='#ffd76a'; ctx.font='bold 16px system-ui'; ctx.fillText('◈ '+fmt(Save.data.credits)+'c', VW/2, 90);
  /* v27: 現在の機体を実物プレビュー＋形式名（強化で姿が変わるのが分かる） */
  {
    const mk=currentMark(), M=SHIP_MARKS[mk];
    ctx.save(); ctx.translate(40, 44); ctx.scale(0.92,0.92);
    drawShipBody(Game.t, BULLET_TIERS[bulletTier()].c, shipOpts({thrust:0}));
    ctx.restore(); ctx.shadowBlur=0;
    ctx.textAlign='center'; ctx.fillStyle='#8fd4ff'; ctx.font='bold 11px system-ui';
    ctx.fillText(M.n, 40, 80);
    ctx.fillStyle='#5f88aa'; ctx.font='9px system-ui'; ctx.fillText(M.t, 40, 91);
  }
  if(extOn()){
    ctx.fillStyle=isExtMaxed()?'#9fffd0':'#ffd76a'; ctx.font='bold 10px system-ui';
    ctx.fillText(isExtMaxed()?'★★ 限界突破 完了 — OVERDRIVE+ 発動可能':'★ 限界突破 解放中（金の枠を埋めよう）', VW/2, 101);
  }

  const top=104, rh=56, lw=VW-32, lx=16;
  UPGRADES.forEach((u,i)=>{
    const y=top+i*rh; const lvl=upLevel(u.id); const maxed=upMaxed(u); const cost=upCost(u);
    const afford = Save.data.credits>=cost;
    ctx.save();
    ctx.strokeStyle=maxed?'#7f8': (afford?'#6cf':'#456'); ctx.lineWidth=1.5; ctx.shadowBlur=8; ctx.shadowColor=ctx.strokeStyle;
    ctx.fillStyle='rgba(16,30,54,0.5)'; roundRect(lx,y,lw,rh-8,8); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.restore();
    const mx=upMax(u);
    /* 上段: 名前 ＋ レベルの丸（右側） */
    ctx.textAlign='left'; ctx.fillStyle='#eaffff'; ctx.font='bold 14px system-ui'; ctx.fillText(u.name, lx+12, y+16);
    for(let k=0;k<mx;k++){
      const isExt = k>=u.max;                       // 限界突破ぶんは金色で示す
      ctx.beginPath(); ctx.arc(lx+165+k*12, y+13, 4, 0, TAU);
      if(k<lvl){ ctx.fillStyle=isExt?'#ffd76a':'#6cf'; ctx.shadowBlur=gq(6); ctx.shadowColor=ctx.fillStyle; ctx.fill(); ctx.shadowBlur=0; }
      else { ctx.strokeStyle=isExt?'#8a7038':'#456'; ctx.lineWidth=1; ctx.stroke(); }
    }
    /* v30: 下段は「いま」ではなく「次に買うとどうなるか」を主役にする */
    if(maxed){
      ctx.fillStyle='#9bd'; ctx.font='11px system-ui';
      ctx.fillText(u.desc(lvl), lx+12, y+36);
    } else {
      ctx.fillStyle='#5a7f9c'; ctx.font='10px system-ui';
      ctx.fillText('現在 Lv'+lvl+' '+u.desc(lvl), lx+12, y+30);
      ctx.fillStyle= afford ? '#9fffd0' : '#6f8fa6'; ctx.font='bold 11px system-ui';
      ctx.fillText('▲ Lv'+(lvl+1)+' '+u.desc(lvl+1), lx+12, y+43);
    }
    /* v8: 火力の行に、いまの弾と次の弾の見た目プレビューを表示 */
    if(u.id==='power'){
      const pv=clamp(lvl + (upLevel('weapon')>=6?1:0),0,6);
      const px0 = lx+165+mx*12+16;                 // 限界突破で丸が増えても重ならない位置
      drawBoltAt(px0, y+13, pv);
      if(!maxed){
        drawBoltAt(px0+34, y+13, clamp(pv+1,0,6));
        ctx.fillStyle='#5a7f9c'; ctx.font='11px system-ui'; ctx.textAlign='center';
        ctx.fillText('▶', px0+17, y+17); ctx.textAlign='left';
      }
    }
    const btw=90, btx=lx+lw-btw-8, bty=y+8;
    if(maxed){ drawButton(btx,bty,btw,rh-24,'MAX',false,'#7f8'); }
    else { drawButton(btx,bty,btw,rh-24,'◈'+fmt(cost),afford,afford?'#6cf':'#456'); addBtn(btx,bty,btw,rh-24,'buy:'+u.id); }
  });

  /* v28: 常時オーバードライブ（限界突破カンスト後に解放される最終購入） */
  let extraY = 0;
  if(isExtMaxed()){
    const oy = top+UPGRADES.length*rh+4, owned = odAlways();
    const afford = Save.data.credits >= OD_COST;
    const g = 0.6+0.4*Math.sin(Game.t*0.07);
    ctx.save();
    ctx.strokeStyle = owned? '#9fffd0' : (afford? '#ffd76a':'#7a6330');
    ctx.lineWidth=1.8; ctx.shadowBlur=gq(owned?14:(afford?10+8*g:5)); ctx.shadowColor=ctx.strokeStyle;
    const grd=ctx.createLinearGradient(lx,oy,lx+lw,oy);
    grd.addColorStop(0,'rgba(90,62,12,0.55)'); grd.addColorStop(1,'rgba(30,22,8,0.35)');
    ctx.fillStyle=grd; roundRect(lx,oy,lw,rh-8,8); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.textAlign='left'; ctx.fillStyle= owned?'#9fffd0':'#ffe9a8'; ctx.font='bold 14px system-ui';
    ctx.fillText('★ 常時オーバードライブ', lx+12, oy+20);
    ctx.fillStyle= owned?'#8fd0aa':'#c9a86a'; ctx.font='11px system-ui';
    ctx.fillText(owned?'出撃時から金色形態 — 火力・シールド +40%'
                     :'購入すると最初から金色形態で戦える（+40%）', lx+12, oy+38);
    const btw=90, btx=lx+lw-btw-8, bty=oy+8;
    if(owned) drawButton(btx,bty,btw,rh-24,'所有済',false,'#7f8');
    else { drawButton(btx,bty,btw,rh-24,'◈'+fmt(OD_COST),afford,afford?'#ffd76a':'#456');
           addBtn(btx,bty,btw,rh-24,'buyod'); }
    ctx.textAlign='center';
    extraY = rh;
  }

  const bw=210,bx=VW/2-bw/2, by=top+UPGRADES.length*rh+6+extraY;
  const lbl = Game.midRun ? ('STAGE '+(Game.pendingStage+1)+' へ ▶') : '出撃 ▶';
  drawButton(bx, by, bw, 48, lbl, true, '#f6c'); addBtn(bx,by,bw,48,'launch');
  ctx.textAlign='center'; ctx.fillStyle='#567'; ctx.font='11px system-ui'; ctx.fillText('Enter / タップ で出撃', VW/2, by+66);
  if(Game.midRun && Game.carryHP!=null){
    ctx.fillStyle='#f9a'; ctx.fillText('※ 機体ダメージは持ち越し（現在HP '+Math.ceil(Game.carryHP)+'）', VW/2, by+84);
  }

  /* 購入メッセージは下部に黒帯付きで出す（カードや装備欄と重ならないように） */
  if(Game.shopMsgT>0){
    Game.shopMsgT--;
    const gold = Game.shopMsg.indexOf('★')===0;
    ctx.font='bold 13px system-ui';
    const w=ctx.measureText(Game.shopMsg).width+28, my=by-8;
    ctx.save(); ctx.fillStyle='rgba(6,10,20,0.88)';
    ctx.strokeStyle= gold?'#ffd76a':'#f88'; ctx.lineWidth=1.2;
    ctx.shadowBlur=gq(10); ctx.shadowColor=ctx.strokeStyle;
    roundRect(VW/2-w/2, my-15, w, 24, 8); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle= gold?'#ffe9a8':'#f88'; ctx.fillText(Game.shopMsg, VW/2, my+2);
  }
}

  add('txt','OMEGA CORE 撃破 — 銀河に平和が戻った');
  add('sp'); add('sp');

  add('h2','― 強化仕様書 ―');
  add('txt','この機体を支えた すべての強化記録');

  for(const u of UPGRADES){
    add('sec', u.name, 'MAX Lv'+upMax(u));

  add('lv','限界突破','フル強化で敗北すると上限が解放');
  add('lv','OVERDRIVE+','限界突破カンストで +40% に強化');
  add('lv','常時オーバードライブ','◈'+fmt(OD_COST)+'c で恒久解放');
  add('sp');

  add('h2','― 敵性勢力 ―');
  add('lv','ザコ 13機種','グラント / ウィーバー / タレット / ボマー');
  add('lv','','カミカゼ / スプリッター / ミニ / シールド');
  add('lv','','機雷 / スナイパー / オービター / キャリア / ダッシャー');
  add('lv','中ボス ×3', MID_NAMES.join(' / '));
  add('lv','ステージボス ×3', BOSS_NAMES.join(' / '));
  add('lv','大ボス','OMEGA CORE');
  add('sp');

  add('h2','― 戦績 ―');
  add('lv','SCORE', fmt(Game.score));
  add('lv','総資産','◈ '+fmt(Save.data.credits)+'c');

const CR_H = { h1:52, sub:26, h2:38, sec:30, lv:21, txt:24, sp:20 };
const CR_SPEED = 1.32;            // スクロール速度(px/frame) — 全体で約40秒

function drawCreditRoll(){
  Game.buttons=[];
  const R=Game.roll; if(!R){ Game.finishCredits(); return; }
  drawNebula(); drawStarfield();
  /* 上下の黒帯（シネマスコープ） */
  ctx.fillStyle='rgba(3,5,12,0.55)'; ctx.fillRect(0,0,VW,VH);

  /* 流れる紙吹雪 */
  if(Math.random()<0.25) spawnParticle(rand(0,VW),-4, Math.random()<0.5?'#ffd76a':'#8fd4ff',
    {vx:rand(-0.25,0.25),vy:rand(0.6,1.4),life:rand(90,150),r:rand(1,2.2),fric:1});
  drawParticles();

  const top = VH - R.t*CR_SPEED;
  ctx.textAlign='center';
  let y = top;
  for(const l of R.lines){
    y += l.h;
    if(y < -20 || y > VH+40) continue;
    /* 画面端に近いほど薄くする（フェードイン・アウト） */
    const fade = clamp(Math.min(y-40, VH-70-y)/70, 0, 1);
    ctx.globalAlpha = fade;
    switch(l.k){
      case 'h1':
        ctx.shadowBlur=gq(26); ctx.shadowColor='#6cf'; ctx.fillStyle='#eaffff';
        ctx.font='bold 34px system-ui'; ctx.fillText(l.a, VW/2, y); ctx.shadowBlur=0; break;
      case 'sub':
        ctx.fillStyle='#9fd0ee'; ctx.font='13px system-ui'; ctx.fillText(l.a, VW/2, y); break;
      case 'h2':
        ctx.shadowBlur=gq(14); ctx.shadowColor='#ffd76a'; ctx.fillStyle='#ffd76a';
        ctx.font='bold 17px system-ui'; ctx.fillText(l.a, VW/2, y); ctx.shadowBlur=0; break;
      case 'txt':
        ctx.fillStyle='#8fb6d8'; ctx.font='12px system-ui'; ctx.fillText(l.a, VW/2, y); break;
      case 'sec':
        ctx.textAlign='left'; ctx.fillStyle='#dffbff'; ctx.font='bold 14px system-ui';
        ctx.fillText(l.a, 54, y);
        ctx.textAlign='right'; ctx.fillStyle='#5f88aa'; ctx.font='10px system-ui';
        ctx.fillText(l.b||'', VW-54, y);
        ctx.textAlign='center';
        ctx.strokeStyle='rgba(110,160,200,0.35)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(54,y+5); ctx.lineTo(VW-54,y+5); ctx.stroke();
        break;
      case 'lv':
        /* 左に Lv、右に数値付きの仕様。右カラムを広く取って折り返さない */
        ctx.textAlign='right'; ctx.fillStyle='#7fd4ff'; ctx.font='11px system-ui';
        ctx.fillText(l.a, 132, y);
        ctx.textAlign='left'; ctx.fillStyle='#cfe'; ctx.font='11px system-ui';
        ctx.fillText(l.b||'', 144, y);
        ctx.textAlign='center';
        break;
    }
    ctx.globalAlpha=1;
  }

  /* 最後に自機が下から昇っていく */
  const endT = (R.h + VH)/CR_SPEED;
  const shipT = R.t - (endT - 260);
  if(shipT > 0){
    const sy = VH*0.95 - shipT*CR_SPEED;
    if(sy > -60){
      if(Math.random()<0.8) spawnParticle(VW/2+rand(-4,4), sy+16,'#4cf',{vx:rand(-.4,.4),vy:rand(2,3.4),life:rand(16,28),r:rand(1.5,3)});
      ctx.save(); ctx.translate(VW/2, sy); ctx.scale(1.1,1.1);
      drawShipBody(Game.t, BULLET_TIERS[bulletTier()].c, shipOpts({thrust:1.5, od:odAlways(),
        hull: odAlways()?'#fff6d8':undefined, wing: odAlways()?'#ffd76a':undefined,
        tail: odAlways()?'#f5a83c':undefined, flame: odAlways()?'#fd8':undefined}));
      ctx.restore(); ctx.shadowBlur=0;
    }
  }

  /* スキップ */
  const bw=120, bx=VW-bw-14, by=VH-52;
  drawButton(bx, by, bw, 36, 'スキップ ▶', true, '#6cf'); addBtn(bx,by,bw,36,'skiproll');
  ctx.fillStyle='rgba(120,160,190,0.55)'; ctx.font='10px system-ui'; ctx.textAlign='left';
  ctx.fillText('END ROLL', 16, VH-30); ctx.textAlign='center';

  if(R.t > endT + 40) Game.finishCredits();
}

/* --- エンディング（v3: 花火・ランク表彰・凱旋） --- */
function drawWin(){
  Game.buttons=[];
  drawNebula();
  drawStarfield();
  const T=Game.winT||0;

  /* v23: 黄金の夜明け（画面下から光が差す） */
  {
    const dawn=clamp(T/90,0,1);
    const g=ctx.createLinearGradient(0,VH,0,VH*0.25);
    g.addColorStop(0,'rgba(255,196,80,'+(0.20*dawn).toFixed(2)+')');
    g.addColorStop(0.5,'rgba(255,140,60,'+(0.08*dawn).toFixed(2)+')');
    g.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
    /* 放射状の光条 */
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(VW/2, VH*1.05);
    for(let i=0;i<14;i++){
      const a=-Math.PI/2 + (i-6.5)*0.17 + Math.sin(T*0.01+i)*0.012;
      ctx.globalAlpha=(0.022+0.020*Math.abs(Math.sin(T*0.02+i)))*dawn;
      ctx.fillStyle='#ffd76a';
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a-0.035)*900, Math.sin(a-0.035)*900);
      ctx.lineTo(Math.cos(a+0.035)*900, Math.sin(a+0.035)*900);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  drawShocks();

  /* 花火（序盤は連発、以降ゆったり） */
  Game.fwCd=(Game.fwCd||0)-Game.dt;
  if(Game.fwCd<=0){
    Game.fwCd = T<120 ? rand(6,16) : rand(16,38);
    const fx=rand(50,VW-50), fy=rand(70,VH*0.58);
    const cols=['#ffd76a','#7df','#f6c','#9fffd0','#fff','#ff9be6'];
    const cc=cols[randi(0,cols.length-1)];
    burst(fx,fy,cc, T<120?40:28, T<120?5.6:4.6);
    /* 二重リングの花火 */
    if(Math.random()<0.5){
      for(let i=0;i<22;i++){ const a=i/22*TAU;
        spawnParticle(fx,fy,'#fff',{vx:Math.cos(a)*3.2, vy:Math.sin(a)*3.2, life:rand(30,46), r:2.2}); }
    }
    Sound.blip(rand(400,900),0.12,'triangle',0.05,-200);
  }
  /* 金の紙吹雪＋きらめき */
  if(Math.random()<0.75) spawnParticle(rand(0,VW),-4, Math.random()<0.5?'#ffd76a':'#fff', {vx:rand(-0.4,0.4),vy:rand(1.2,2.6),life:rand(70,120),r:rand(1.5,3.4),fric:1});
  drawParticles();

  /* 凱旋する自機（ゆっくり浮上 → 演出が落ち着いたら加速して飛び去る） */
  const sy = VH*0.92 - Math.min(T,60)*0.5 - Math.max(0,T-150)*2.2;
  /* 文字の帯に差しかかる手前で光に溶けて飛び去る（表示が重ならないように） */
  const shipA = clamp((sy-566)/64, 0, 1);
  if(sy>-50 && shipA>0.02){
    if(Math.random()<0.85*shipA) spawnParticle(VW/2+rand(-4,4), sy+16,'#4cf',{vx:rand(-.4,.4),vy:rand(2,3.4),life:rand(16,28),r:rand(1.5,3)});
    const boost = T>150 ? 2.6 : 1.6, s=1.15*(0.72+0.28*shipA);
    ctx.save(); ctx.globalAlpha=shipA; ctx.translate(VW/2,sy); ctx.scale(s,s);
    drawShipBody(T*1.4, BULLET_TIERS[bulletTier()].c, shipOpts({thrust:boost}));
    ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  /* 文字用の薄い帯 */
  ctx.fillStyle='rgba(4,6,15,0.38)'; ctx.fillRect(0,150,VW,410);

  /* MISSION COMPLETE: 大きくスラムインして着地、以後は鼓動＋光沢が走る */
  const appear=clamp(T/16,0,1);
  const slam = T<26 ? 2.4-1.4*Math.pow(T/26,0.55) : 1 + Math.sin((T-26)*0.05)*0.022;
  ctx.save(); ctx.translate(VW/2,240); ctx.scale(slam,slam); ctx.globalAlpha=appear;
  ctx.textAlign='center';
  ctx.font='bold 44px system-ui';
  /* クロマティックずれの残光 */
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,120,40,0.55)'; ctx.fillText('MISSION',-2.5,0); ctx.fillText('COMPLETE',-2.5,50);
  ctx.fillStyle='rgba(120,220,255,0.45)'; ctx.fillText('MISSION',2.5,0); ctx.fillText('COMPLETE',2.5,50);
  ctx.globalCompositeOperation='source-over';
  ctx.shadowBlur=30+14*Math.sin(T*0.08); ctx.shadowColor='#fd6';
  ctx.fillStyle='#fff3cf'; ctx.fillText('MISSION',0,0); ctx.fillText('COMPLETE',0,50);
  ctx.shadowBlur=0; ctx.globalAlpha=appear*0.45; ctx.lineWidth=1; ctx.strokeStyle='#fff';
  ctx.strokeText('MISSION',0,0); ctx.strokeText('COMPLETE',0,50);
  /* 文字の上を走る光沢 */
  if(T>26){
    ctx.save(); ctx.beginPath(); ctx.rect(-160,-38,320,100); ctx.clip();
    const sx=((T*4)%420)-210;
    const sg=ctx.createLinearGradient(sx,0,sx+70,0);
    sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.5,'rgba(255,255,255,0.55)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=1; ctx.globalCompositeOperation='lighter';
    ctx.font='bold 44px system-ui'; ctx.fillStyle=sg;
    ctx.fillText('MISSION',0,0); ctx.fillText('COMPLETE',0,50);
    ctx.restore();
  }
  ctx.restore(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.textAlign='center';
  /* 着地の衝撃波 */
  if(T<34){
    const q=clamp(T/34,0,1);
    ctx.save(); ctx.globalAlpha=(1-q)*0.6; ctx.strokeStyle='#ffd76a'; ctx.lineWidth=4;
    ctx.shadowBlur=24; ctx.shadowColor='#fd6';
    ctx.beginPath(); ctx.ellipse(VW/2,252, 40+q*300, 14+q*90, 0,0,TAU); ctx.stroke();
    ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  if(T>50){
    ctx.fillStyle='#9fffd0'; ctx.font='bold 16px system-ui';
    ctx.shadowBlur=12; ctx.shadowColor='#5f8';
    ctx.fillText('OMEGA CORE 撃破 — 銀河に平和が戻った', VW/2, 332); ctx.shadowBlur=0;
  }
  /* ランクメダル */
  if(T>70){
    const sc2=Game.score;
    /* v31: 最高ランクは S ではなく Z（Zenith） */
    const rank = sc2>=65000?'Z': sc2>=50000?'A': sc2>=35000?'B':'C';
    const rc = rank==='Z'?'#ffd76a': rank==='A'?'#f6c': rank==='B'?'#7df':'#9fd';
    const rp=1+Math.sin(T*0.1)*0.05;
    const pop = T<86 ? 1.8-0.8*((T-70)/16) : 1;
    ctx.save(); ctx.translate(VW/2, 396); ctx.scale(rp*pop,rp*pop);
    /* 月桂樹（左右の葉） */
    ctx.save(); ctx.globalAlpha=0.85; ctx.shadowBlur=14; ctx.shadowColor=rc;
    ctx.strokeStyle=rc; ctx.lineWidth=1.6;
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.arc(0,0,48, s>0?-1.05:2.09, s>0?1.05:4.19); ctx.stroke();
      for(let i=0;i<6;i++){
        const a=(-0.9+i*0.36)*(s>0?1:-1) + (s>0?0:Math.PI);
        const bx=Math.cos(a)*48, by=Math.sin(a)*48;
        ctx.save(); ctx.translate(bx,by); ctx.rotate(a+Math.PI/2);
        ctx.beginPath(); ctx.ellipse(0,0,7.5,3,0,0,TAU); ctx.stroke(); ctx.restore();
      }
    }
    ctx.restore();
    /* 回転する外周ダッシュ */
    ctx.save(); ctx.rotate(T*0.014); ctx.globalAlpha=0.55; ctx.strokeStyle=rc; ctx.lineWidth=2;
    for(let i=0;i<12;i++){ const a=i/12*TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*38, Math.sin(a)*38); ctx.lineTo(Math.cos(a)*43, Math.sin(a)*43); ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha=1;
    ctx.shadowBlur=26; ctx.shadowColor=rc; ctx.strokeStyle=rc; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,34,0,TAU); ctx.stroke();
    ctx.globalAlpha=0.14; ctx.fillStyle=rc; ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle=rc; ctx.font='bold 40px system-ui'; ctx.textBaseline='middle'; ctx.fillText(rank,0,2); ctx.textBaseline='alphabetic';
    ctx.restore();
    ctx.fillStyle='#8ac'; ctx.font='11px system-ui'; ctx.fillText('RANK', VW/2, 448);
  }
  if(T>85){
    ctx.fillStyle='#cfe'; ctx.font='14px system-ui';
    ctx.fillText('SCORE '+fmt(Game.score), VW/2, 480);
    ctx.fillStyle='#ffd76a';
    ctx.fillText('獲得 ◈ '+fmt(Game.lastGain||0)+'c ／ 総資産 ◈ '+fmt(Save.data.credits)+'c', VW/2, 504);
  }
  if(T>110){
    const tw=0.6+0.4*Math.sin(T*0.06);
    ctx.fillStyle='rgba(255,255,255,'+tw.toFixed(2)+')'; ctx.font='bold 14px system-ui';
    ctx.fillText('THANK YOU FOR PLAYING', VW/2, 540);
  }
  /* v28: 大団円の「FIN」 */
  if(T>130){
    const a=clamp((T-130)/45,0,1);
    const sc=(0.55+0.45*(1-Math.pow(1-a,3)));
    const gl=0.55+0.45*Math.sin(T*0.05);
    ctx.save(); ctx.translate(VW/2, 586); ctx.globalAlpha=a;
    /* 左右のライン */
    ctx.strokeStyle='rgba(255,215,106,'+(0.55*a).toFixed(2)+')'; ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(-150,0); ctx.lineTo(-76,0); ctx.moveTo(76,0); ctx.lineTo(150,0); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-154,-4); ctx.lineTo(-154,4); ctx.moveTo(154,-4); ctx.lineTo(154,4); ctx.stroke();
    ctx.scale(sc,sc);
    ctx.shadowBlur=gq(24+14*gl); ctx.shadowColor='#ffd76a';
    ctx.fillStyle='#fff6dc'; ctx.font='bold 40px Georgia, "Times New Roman", serif';
    ctx.fillText('F I N', 0, 14);
    ctx.shadowBlur=0; ctx.globalAlpha=0.4*a; ctx.lineWidth=1; ctx.strokeStyle='#ffd76a';
    ctx.strokeText('F I N', 0, 14);
    ctx.restore(); ctx.globalAlpha=1;
  }
  if(T>160){
    const bw=200,bx=VW/2-bw/2;
    drawButton(bx, 634, bw, 44, '格納庫へ', true, '#6cf'); addBtn(bx,634,bw,44,'hangar');
    drawButton(bx, 688, bw, 38, 'タイトルへ', true, '#9f8'); addBtn(bx,688,bw,38,'title');
  }
}
