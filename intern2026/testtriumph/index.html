   NEON VANGUARD v2  —  ネオンベクター縦スクロールSTG

/* ---------------- 論理解像度（縦長） ---------------- */
const VW = 480, VH = 800;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1;

function resize(){
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(ww/VW, wh/VH);
  const w = Math.round(VW*scale), h = Math.round(VH*scale);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = VW*dpr; canvas.height = VH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);

/* ---------------- ユーティリティ ---------------- */
const TAU = Math.PI*2;
const rand = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> Math.floor(rand(a,b+1));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const dist2 = (x1,y1,x2,y2)=>{ const dx=x1-x2, dy=y1-y2; return dx*dx+dy*dy; };
function circleHit(a,b){ const r=a.r+b.r; return dist2(a.x,a.y,b.x,b.y) < r*r; }
function fmt(n){ return Math.floor(n).toLocaleString('en-US'); }

/* ---------------- 入力 ---------------- */
const keys = {};
/* v5: 相対ドラッグ操作 — 指を置いた場所からの移動量ぶんだけ自機が動く */
const pointer = { active:false, px:VW/2, py:VH*0.8, dxAcc:0, dyAcc:0 };
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  Sound.init(); Sound.resume(); Music.unlock();
  handleKeyPress(e.code);
});
addEventListener('keyup', e=>{ keys[e.code]=false; });

function canvasPos(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return { x:(clientX-rect.left)/scale, y:(clientY-rect.top)/scale };
}
function pointerDown(x,y){
  const p = canvasPos(x,y);
  pointer.active = true; pointer.px = p.x; pointer.py = p.y;
  pointer.dxAcc = 0; pointer.dyAcc = 0;
  Game.onPointer(p.x, p.y, 'down');
}
function pointerMove(x,y){
  if(!pointer.active) return;
  const p = canvasPos(x,y);
  pointer.dxAcc += p.x - pointer.px;
  pointer.dyAcc += p.y - pointer.py;
  pointer.px = p.x; pointer.py = p.y;
}
function pointerUp(){ pointer.active=false; pointer.dxAcc=0; pointer.dyAcc=0; }

/* v12: 画面のどこを触っても音を解錠する保険（キャンバス外のタップ対策） */
addEventListener('pointerdown', ()=>{ Sound.init(); Sound.resume(); Music.unlock(); }, {passive:true});

canvas.addEventListener('mousedown', e=> pointerDown(e.clientX,e.clientY));
addEventListener('mousemove', e=> pointerMove(e.clientX,e.clientY));
addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; pointerDown(t.clientX,t.clientY); }, {passive:false});
addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.changedTouches[0]; pointerMove(t.clientX,t.clientY); }, {passive:false});
addEventListener('touchend', e=>{ e.preventDefault(); pointerUp(); }, {passive:false});

/* ---------------- 効果音 (WebAudio 簡易シンセ) ---------------- */
const Sound = {
  ac:null, master:null, muted:false,
  init(){
    if(this.ac) return;
    try{
      this.ac = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.5;
      /* v12: リミッター。音量を上げても重なった時に歪まず、粒立ちが揃う */
      const comp = this.ac.createDynamicsCompressor();
      comp.threshold.value=-12; comp.knee.value=12; comp.ratio.value=6;
      comp.attack.value=0.003; comp.release.value=0.15;
      this.master.connect(comp); comp.connect(this.ac.destination);
    }catch(e){ this.ac=null; }
  },
  resume(){ if(this.ac && this.ac.state==='suspended'){ try{ this.ac.resume(); }catch(e){} } },
  /* v11: 効果音が鳴らなくなる主因＝AudioContextのsuspend。定期的に復帰させる */
  _et:0,
  ensure(){
    if(++this._et < 40) return; this._et=0;
    if(this.ac && this.ac.state!=='running'){ try{ this.ac.resume(); }catch(e){} }
  },
  blip(freq, dur, type='square', vol=0.3, slide=0){
    if(!this.ac || this.muted) return;
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur);
  },
  /* v9: ノイズは1秒バッファを使い回す（毎回生成しないので連射でも軽い） */
  _nbuf:null,
  noiseBuf(){
    if(!this._nbuf){
      const b=this.ac.createBuffer(1,this.ac.sampleRate,this.ac.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      this._nbuf=b;
    }
    return this._nbuf;
  },
  noise(dur, vol=0.4, filterFreq=800){
    if(!this.ac || this.muted) return;
    const t=this.ac.currentTime;
    const src=this.ac.createBufferSource(); src.buffer=this.noiseBuf();
    const f=this.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq;
    const g=this.ac.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random()*0.8); src.stop(t+dur+0.02);
  },
  /* v9: フィルタ付きの汎用オシレータ（音に太さと質感を出す） */
  osc(freq, dur, opt={}){
    if(!this.ac || this.muted) return;
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=opt.type||'square';
    o.frequency.setValueAtTime(freq,t);
    if(opt.to) o.frequency.exponentialRampToValueAtTime(Math.max(30,opt.to), t+dur);
    const vol=opt.vol!==undefined?opt.vol:0.15;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol, t+(opt.atk||0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    let node=o;
    if(opt.filter){
      const f=this.ac.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(opt.filter,t);
      if(opt.filterTo) f.frequency.exponentialRampToValueAtTime(Math.max(60,opt.filterTo), t+dur);
      o.connect(f); node=f;
    }
    node.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.03);
  },

  /* --- 発射: 威力レベルが上がるほど低く・太く・重い音に --- */
  shoot(tier){
    const t=tier||0;
    const base=820-t*74;
    this.osc(base, 0.045+t*0.005, {type:t>=4?'sawtooth':'square', vol:0.17+t*0.010, to:base*0.34, filter:3200+t*450});
    if(t>=1) this.osc(base*0.48, 0.06+t*0.009, {type:'triangle', vol:0.06+t*0.013, to:base*0.2});
    if(t>=5) this.noise(0.05, 0.08, 2600);
  },

  /* --- 敵への着弾: 硬さ(最大HP)と一撃の削り量で音が変わる --- */
  _hitT:-1, _combo:0, _bhitT:-1,
  enemyHit(e, dmg){
    if(!this.ac || this.muted) return;
    const now=this.ac.currentTime;
    if(now-this._hitT < 0.042) return;              // 連射の音つぶれ防止
    this._combo = (now-this._hitT < 0.5) ? Math.min(this._combo+1, 14) : 0;
    this._hitT = now;
    const hard  = clamp((e.maxHp-20)/280, 0, 1);    // 硬い敵ほど金属的
    const chunk = clamp(dmg/Math.max(1,e.maxHp), 0, 1); // 大きく削るほど重い
    const pitch = (300+280*hard) * (1+this._combo*0.02);
    /* v12: 硬さに関係なく必ず聞こえる明るいアタック（1面の柔らかい敵でも手応えが出る） */
    this.osc(pitch*2.1, 0.03, {type:'square', vol:0.11, to:pitch*1.2, filter:6000});
    this.noise(0.022+0.05*hard, 0.11+0.14*hard, 1400+3600*hard);
    this.osc(pitch, 0.035+0.085*hard, {type:hard>0.45?'square':'triangle',
      vol:0.14+0.07*hard+0.07*chunk, to:pitch*0.55, filter:4200});
    if(chunk>0.22) this.osc(125, 0.13, {type:'sawtooth', vol:0.09+0.10*chunk, to:48, filter:900});
  },
  /* --- ボスへの着弾: 分厚い装甲に弾かれる重い金属音 --- */
  bossHit(dmg, b){
    if(!this.ac || this.muted) return;
    const now=this.ac.currentTime;
    if(now-this._bhitT < 0.05) return;
    this._bhitT=now;
    const chunk=clamp(dmg/(b.maxHp*0.015),0,1);
    this.noise(0.05, 0.14+0.12*chunk, 2800);
    this.osc(195, 0.10, {type:'square', vol:0.11+0.07*chunk, to:112, filter:3000});
    this.osc(92, 0.17, {type:'sawtooth', vol:0.09+0.08*chunk, to:46, filter:700});
  },
  /* --- 装甲パネル破壊: 派手な金属クラッシュ --- */
  panelBreak(){
    this.noise(0.22, 0.30, 5200);
    this.osc(430, 0.20, {type:'square', vol:0.10, to:150, filter:6000});
    this.osc(900, 0.14, {type:'triangle', vol:0.06, to:430});
  },
  hit(){ this.osc(240,0.06,{type:'sawtooth',vol:0.09,to:160,filter:2000}); },
  /* --- 撃破: 敵の大きさで爆発の重さが変わる。連鎖でキラッと抜ける --- */
  explode(){ this.noise(0.3, 0.35, 700); this.osc(120,0.25,{type:'sawtooth',vol:0.12,to:50,filter:1200}); },
  explodeAt(e){
    const s=clamp((e.r-8)/16, 0, 1);
    this.noise(0.16+0.30*s, 0.40+0.28*s, 1300-800*s);
    this.osc(200-100*s, 0.20+0.32*s, {type:'sawtooth', vol:0.20+0.12*s, to:40, filter:1500, filterTo:220});
    if(this._combo>2) this.osc(680+this._combo*45, 0.10, {type:'triangle', vol:0.07, to:1500});
  },
  /* --- 被弾 --- */
  shieldHit(){ this.osc(1150,0.10,{type:'square',vol:0.12,to:2500,filter:6000}); this.noise(0.09,0.15,4200); },
  hullHit(){ this.noise(0.16,0.32,700); this.osc(150,0.18,{type:'sawtooth',vol:0.19,to:58,filter:800}); this.osc(320,0.10,{type:'square',vol:0.10,to:120}); },
  /* --- 強化の手応え --- */
  powerUp(){ this.osc(300,0.26,{type:'sawtooth',vol:0.11,to:1250,filter:4200}); this.osc(600,0.30,{type:'triangle',vol:0.07,to:2400}); },
  buyMax(){ [523,659,784,1047].forEach((f,i)=> setTimeout(()=>this.osc(f,0.18,{type:'triangle',vol:0.15,filter:5200}), i*70)); },
  bigExplode(){ this.noise(0.7, 0.6, 500); this.blip(80,0.6,'sawtooth',0.2,-40); },
  pickup(){ this.blip(660,0.08,'triangle',0.18,300); this.blip(990,0.09,'triangle',0.14,300); },
  buy(){ this.blip(523,0.08,'square',0.2); setTimeout(()=>this.blip(784,0.12,'square',0.2),70); },
  deny(){ this.blip(160,0.15,'square',0.2,-40); },
  bomb(){ this.noise(0.6,0.6,1600); this.blip(200,0.5,'sawtooth',0.2,-120); },
  boss(){ this.blip(90,0.9,'sawtooth',0.25,60); },
  laser(){ this.blip(1400,0.08,'sawtooth',0.06,-900); },
  transform(){ this.blip(110,1.2,'sawtooth',0.3,400); this.noise(1.0,0.4,2000); }
};

/* ---------------- BGM (bgm/ フォルダの mp3) ----------------
   v6: モバイル対応強化
   - warmup: 最初のタップで全トラックを無音再生→即停止して「解錠」
     (iOS/Androidはユーザー操作内で一度playしたAudioしか後から鳴らせないため、
      中ボス/ラスボスなど途中で切り替わる曲が鳴らない問題の根本対策)
   - ミュート: iOSはvolume変更が効かないため、停止/再開方式に変更 */
const Music = {
  vol:0.40, cur:null, name:null, pending:null, cache:{}, warmed:false,   /* v12: 効果音が埋もれないよう控えめに */
  files:{
    opening:'bgm/opening.mp3',
    stage0:'bgm/stage1.mp3', stage1:'bgm/stage2.mp3', stage2:'bgm/stage3.mp3',
    boss0:'bgm/boss1.mp3', boss1:'bgm/boss2.mp3', boss2:'bgm/boss3.mp3',
    midboss:'bgm/chuboss.mp3',
    final:'bgm/boss_final.mp3', ending:'bgm/ending.mp3'
  },
  get(name){
    let a=this.cache[name];
    if(!a){
      const src=this.files[name]; if(!src) return null;
      try{ a=new Audio(src); }catch(e){ return null; }
      a.loop=true; a.preload='auto'; a.onerror=()=>{};
      this.cache[name]=a;
    }
    return a;
  },
  /* v11: 世代番号(gen)で「古い再生要求」を無効化し、二重再生を根絶する */
  gen:0, _tick:0,
  /* キャッシュ内の全トラックを確実に停止（cur以外の鳴り残しも潰す） */
  stopAll(){
    for(const k in this.cache){
      const a=this.cache[k];
      try{ if(!a.paused) a.pause(); }catch(e){}
    }
    this.cur=null;
  },
  play(name){
    if(!this.files[name]) return;
    this.name=name;                 // ミュート中でも「今の曲」は覚えておく
    this.pending=null;
    const gen=++this.gen;
    if(Sound.muted){ this.stopAll(); return; }
    const a=this.get(name); if(!a) return;
    if(this.cur===a && !a.paused) return;   // 同じ曲が既に鳴っていれば何もしない
    this.stopAll();
    if(this.gen!==gen) return;              // 待っている間に別の曲が要求されたら中止
    a.muted=false; try{ a.volume=this.vol; }catch(e){}
    try{ a.currentTime=0; }catch(e){}
    this.cur=a;
    const pr=a.play();
    if(pr && pr.catch) pr.catch(()=>{
      /* 自動再生ブロック時だけ「後で鳴らす曲」に登録。
         曲の切り替えで中断された古い再生は gen が古いので無視される */
      if(this.gen===gen && this.name===name) this.pending=name;
    });
  },
  stopCur(){ this.stopAll(); },
  stop(){ this.gen++; this.stopAll(); this.name=null; this.pending=null; },
  unlock(){
    this.warmup();
    if(Sound.muted) return;
    const want = this.pending || this.name;
    this.pending = null;
    if(!want) return;
    const a=this.cache[want];
    if(!a || a.paused) this.play(want);
  },
  warmup(){
    if(this.warmed) return; this.warmed=true;
    for(const k in this.files){
      const a=this.get(k); if(!a || a===this.cur) continue;
      a.muted=true;
      let pr; try{ pr=a.play(); }catch(e){ a.muted=false; continue; }
      if(pr && pr.then){
        pr.then(()=>{
          /* 解錠が目的。いま流すべき曲なら止めない */
          if(this.cur===a || this.name===k){ a.muted=false; return; }
          try{ a.pause(); a.currentTime=0; }catch(e){}
          a.muted=false;
        }).catch(()=>{ a.muted=false; });
      } else { try{ a.pause(); a.currentTime=0; }catch(e){} a.muted=false; }
    }
  },
  /* 毎フレーム呼ぶ保険: 二重再生の掃除と、止まってしまった曲の復帰 */
  tick(){
    if(++this._tick < 45) return;
    this._tick=0;
    if(Sound.muted) return;
    for(const k in this.cache){
      const a=this.cache[k];
      if(a!==this.cur && !a.paused){ try{ a.pause(); }catch(e){} }
    }
    if(this.name && !this.pending && (!this.cur || this.cur.paused)){
      const a=this.cache[this.name];
      if(a && a.readyState>=2) this.play(this.name);
    }
  },
  setMuted(m){
    if(m){ this.gen++; this.stopAll(); }
    else if(this.name){ const n=this.name; this.name=null; this.play(n); }
  }
};

/* ---------------- セーブ (localStorage) ---------------- */
const SAVE_KEY = 'neon_vanguard_save_v1';
const Save = {
  data:{ credits:0, up:{}, best:0, cleared:false, muted:false, runs:0 },
  load(){
    try{ const s=localStorage.getItem(SAVE_KEY); if(s) this.data=Object.assign(this.data, JSON.parse(s)); }catch(e){}
    if(!this.data.up) this.data.up={};
    // v2: スピード強化は廃止 → 購入済み分は返金
    if(this.data.up.speed){
      let refund=0; for(let l=0;l<this.data.up.speed;l++) refund+=Math.round(90*Math.pow(1.7,l));
      this.data.credits += refund; delete this.data.up.speed; this.save();
    }
    Sound.muted = !!this.data.muted;
  },
  save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); }catch(e){} },
  reset(){ this.data={ credits:0, up:{}, best:0, cleared:false, muted:Sound.muted, runs:0 }; this.save(); }
};

/* ---------------- 強化 (ショップ定義) v2: speed廃止・扇形武器 ---------------- */
const UPGRADES = [
  { id:'weapon',  name:'メインショット', max:6, base:160,
    desc:(l)=> ['単発','2連射','3way扇','5way扇','7way扇','9way扇','11way大扇★強化弾'][l] },
  { id:'rate',    name:'連射速度',       max:5, base:150, desc:(l)=> l>=5?'Lv5★最終: 超連射':'Lv'+l+' 発射間隔短縮' },
  { id:'power',   name:'火力',           max:6, base:150, desc:(l)=> l>=6?'Lv6★最終: 火力大幅上昇':'Lv'+l+' 1発ダメージ上昇' },
  { id:'wing',    name:'僚機ウイングマン', max:2, base:900, desc:(l)=> l+'機 随伴して追加射撃' },
  { id:'hp',      name:'装甲(最大HP)',   max:5, base:220, desc:(l)=> '最大HP '+(100+l*40) },
  { id:'shield',  name:'シールド',       max:3, base:950, desc:(l)=> l>0?('バリア'+(l*40)+' / 回復速度Lv'+l+(l>=3?'★':'')):'なし' },
  { id:'bomb',    name:'ボム所持数',     max:3, base:300, desc:(l)=> '出撃時ボム '+l+' 個' },
  { id:'missile', name:'ホーミング',     max:3, base:340, desc:(l)=> l>0?('追尾ミサイル x'+l):'なし' },
  { id:'greed',   name:'クレジット獲得', max:4, base:260, desc:(l)=> '+'+(l*20)+'% 取得' },
];
function upLevel(id){ return Save.data.up[id]||0; }
/* v13: 強化コストを急カーブ化。最終段階だけさらに重くして「最後の一押し」を目標にする
   （全項目カンストまでの総額は約7.4万c ＝ 従来の約3倍） */
function upCost(u){
  const l=upLevel(u.id);
  const finalMul = (l === u.max-1) ? 2.2 : 1;
  return Math.round(u.base*Math.pow(1.95,l)*finalMul);
}
function upMaxed(u){ return upLevel(u.id) >= u.max; }

/* プレイヤー派生ステータス */
function playerStats(){
  const w=upLevel('weapon'), r=upLevel('rate'), p=upLevel('power');
  /* v4: 最終レベルだけ大きく伸びる（最後の1個がパワースパイク） */
  const sl = upLevel('shield');
  return {
    maxHP: 100 + upLevel('hp')*40,
    fireInterval: Math.max(78, 210 - r*24 - (r>=5?12:0)),
    dmg: 9 + p*6 + (p>=6?10:0),
    weapon: w,
    wings: upLevel('wing'),
    shield: sl,
    /* v7: シールド自動回復はレベル依存。Lv1は遅く、Lv3(最大)で従来の約8割の性能 */
    shieldDelay: [0, 360, 300, 225][sl],          // 回復開始までのフレーム数(6s/5s/3.75s)
    shieldRegenRate: [0, 0.10, 0.20, 0.32][sl],   // 毎フレーム回復量(6/12/19 per 秒)
    bombs: upLevel('bomb'),
    missiles: upLevel('missile'),
    speed: 5.0,
    greed: 1 + upLevel('greed')*0.2,
  };
}

/* ---------------- v8: 威力レベル別の弾ビジュアル ----------------
   火力Lv(+武器最終Lv)に応じて 色・太さ・長さ・発光・紫のプラズマ光輪 が段階的に強化される */
const BULLET_TIERS = [
  {c:'#3f9bff', core:'#cfefff', w:3.0, len:10.0, glow:8,  halo:0},
  {c:'#4fc4ff', core:'#dff6ff', w:3.5, len:11.5, glow:11, halo:0},
  {c:'#6bdcff', core:'#eafcff', w:4.0, len:13.0, glow:14, halo:0},
  {c:'#8af0ff', core:'#ffffff', w:4.6, len:15.0, glow:17, halo:0.35},
  {c:'#a9f6ff', core:'#ffffff', w:5.3, len:17.0, glow:21, halo:0.55},
  {c:'#d6f2ff', core:'#ffffff', w:6.1, len:19.5, glow:26, halo:0.8},
  {c:'#ffffff', core:'#ffffff', w:7.0, len:22.0, glow:32, halo:1.0},
];
function bulletTier(){
  return clamp(upLevel('power') + (upLevel('weapon')>=6?1:0), 0, 6);
}
/* 弾の形（先端が尖り、後方が丸いエネルギーボルト） */
function bulletShape(w,len){
  const hw=w/2, h=len/2;
  ctx.beginPath();
  ctx.moveTo(0,-h);
  ctx.lineTo(hw,-h*0.3);
  ctx.lineTo(hw, h*0.62);
  ctx.quadraticCurveTo(0, h*1.1, -hw, h*0.62);
  ctx.lineTo(-hw,-h*0.3);
  ctx.closePath();
}
function drawBoltAt(x,y,tier,color){
  const T=BULLET_TIERS[tier]||BULLET_TIERS[0];
  ctx.save(); ctx.translate(x,y);
  if(T.halo>0){ ctx.globalAlpha=0.32*T.halo; ctx.shadowBlur=T.glow*1.3; ctx.shadowColor='#b58cff'; ctx.fillStyle='#b58cff';
    bulletShape(T.w*1.95,T.len*1.12); ctx.fill(); ctx.globalAlpha=1; }
  ctx.shadowBlur=T.glow; ctx.shadowColor=color||T.c; ctx.fillStyle=color||T.c;
  bulletShape(T.w,T.len); ctx.fill();
  ctx.shadowBlur=T.glow*0.5; ctx.shadowColor=T.core; ctx.fillStyle=T.core;
  bulletShape(T.w*0.42,T.len*0.72); ctx.fill();
  ctx.restore(); ctx.shadowBlur=0;
}

/* ---------------- パーティクル ---------------- */
const particles = [];
function spawnParticle(x,y,color,opt={}){
  if(particles.length>520) return;
  particles.push({
    x,y,
    vx: opt.vx!==undefined?opt.vx:rand(-2,2),
    vy: opt.vy!==undefined?opt.vy:rand(-2,2),
    life: opt.life||rand(20,40), max: opt.life||40,
    r: opt.r||rand(1.5,3.5), color, glow: opt.glow!==false,
    fric: opt.fric||0.94
  });
}
/* v8: 着弾スパーク（威力レベルが高いほど派手に散る） */
function hitSpark(b){
  const t=b.tier||0, T=BULLET_TIERS[t];
  const n=1+Math.floor(t/2);
  for(let i=0;i<n;i++){
    spawnParticle(b.x,b.y, i%2?T.core:T.c,
      {vx:rand(-1.4,1.4)*(1+t*0.18), vy:rand(-1.4,0.6)*(1+t*0.18),
       life:rand(8,15)+t, r:rand(1.4,2.4)+t*0.22});
  }
}
function burst(x,y,color,count,speed=3){
  for(let i=0;i<count;i++){
    const a=rand(0,TAU), s=rand(0.3,1)*speed;
    spawnParticle(x,y,color,{vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(24,48), r:rand(1.5,4)});
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=p.fric; p.vy*=p.fric;
    p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    if(p.glow){ ctx.shadowBlur=12; ctx.shadowColor=p.color; }
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

/* ---------------- フローティングテキスト ---------------- */
const floats=[];
function addFloat(x,y,text,color='#9fe',size=13){ if(floats.length>60)return; floats.push({x,y,text,color,size,life:50,max:50}); }
function updateFloats(dt){ for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.y-=0.6*dt; f.life-=dt; if(f.life<=0) floats.splice(i,1); } }
function drawFloats(){
  ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=clamp(f.life/f.max,0,1);
    ctx.font='bold '+(f.size||13)+'px system-ui';
    if((f.size||13)>15){ ctx.shadowBlur=10; ctx.shadowColor=f.color; }
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

/* ---------------- 弾 ---------------- */

const eBullets=[]; // 敵弾
function firePlayer(x,y,vx,vy,dmg,r=4,color='#7df',type='shot',tier=0){

/* ---------------- ゲーム状態 ---------------- */
const STATE = { TITLE:'title', HOWTO:'howto', HANGAR:'hangar', PLAY:'play', PAUSE:'pause', OVER:'over', WIN:'win' };

const Game = {
  state: STATE.TITLE,
  t:0, dt:1, last:0, shake:0, flash:0, flashColor:'#fff',
  player:null, wingmen:[], enemies:[], boss:null,
  stageIndex:0, score:0, runCredits:0, message:null, messageT:0,
  midRun:false, pendingStage:0, stageClearMsgT:0,
  buttons:[], bg:null, lastGain:0, shopMsg:'', shopMsgT:0,

  start(){
    Save.load();
    resize();
    this.bg = makeStarfield();
    this.state = STATE.TITLE;
    this.last = performance.now();
    Music.play('opening');
    requestAnimationFrame(loop);
  },

  /* ---- 新規出撃 ---- */
  launch(){
    Sound.init(); Sound.resume();
    this.midRun=false;
    this.carryHP=null; this.carryShield=null;   // v4: 新規出撃は満タン
    this.score=0; this.runCredits=0;
    Save.data.runs++;
    this.beginStage(0);
  },

  /* ---- ステージ間格納庫から次ステージへ ---- */
  resumeNext(){
    Sound.init(); Sound.resume();
    this.midRun=false;
    this.beginStage(this.pendingStage, true);
  },

  beginStage(stage, carry){
    const st = playerStats();
    this.player = {
      x:VW/2, y:VH*0.82, r:9, hp:st.maxHP, maxHP:st.maxHP,
      inv:0, fireCd:0, missileCd:0, bombs:st.bombs, bombFlash:0,
      shieldHP: st.shield*40, shieldMax: st.shield*40, shieldRegen:0, st
    };
    /* v4: ステージ間はHP/シールドを持ち越し（全回復しない） */
    if(carry && this.carryHP!=null){
      this.player.hp = Math.min(st.maxHP, this.carryHP);
      this.player.shieldHP = Math.min(this.player.shieldMax, this.carryShield||0);
    }
    this.wingmen=[];
    for(let i=0;i<st.wings;i++){
      this.wingmen.push({x:VW/2, y:VH*0.9, side: i===0?-1:1, r:7, fireCd:0});
    }
    this.enemies=[]; this.boss=null; pBullets.length=0; eBullets.length=0;
    particles.length=0; floats.length=0;
    this.stageIndex=stage;
    Director.begin(stage);
    this.state = STATE.PLAY;
    this.setMessage('STAGE '+(stage+1), STAGES[stage].name, 150);
    Music.play('stage'+stage);
  },

  /* ---- ステージクリア → 格納庫（強化タイム） ---- */
  stageClear(nextStage){
    /* v4: 現在のHP/シールドを記録して持ち越す */
    this.carryHP = this.player ? this.player.hp : null;
    this.carryShield = this.player ? this.player.shieldHP : 0;
    const gain = Math.round(this.runCredits);
    Save.data.credits += gain; this.runCredits=0;
    if(nextStage+1 > Save.data.best) Save.data.best = nextStage+1;
    Save.save();
    this.lastGain = gain;
    this.midRun = true; this.pendingStage = nextStage;
    this.stageClearMsgT = 200;
    this.state = STATE.HANGAR;
    Music.play('opening');
  },

  endRun(win){
    const gain = Math.round(this.runCredits);
    Save.data.credits += gain; this.runCredits=0;
    if(this.stageIndex+1 > Save.data.best) Save.data.best = this.stageIndex+1;
    if(win){ Save.data.cleared=true; }
    Save.save();
    this.lastGain = gain;
    this.midRun=false;
    this.state = win?STATE.WIN:STATE.OVER;
    if(win){ Music.play('ending'); this.winT=0; this.fwCd=0; this.doFlash('#ffd76a',0.7); }
    else Music.stop();
  },

  setMessage(a,b,dur){ this.message={a,b}; this.messageT=dur; },
  addCredits(v){ const g=v*(this.player?this.player.st.greed:1); this.runCredits+=g; return g; },
  screenShake(v){ this.shake=Math.min(this.shake+v, 26); },
  doFlash(c,v){ this.flashColor=c; this.flash=Math.max(this.flash,v); },

  bombBlast(){
    const p=this.player;
    if(!p || p.bombs<=0){ Sound.deny(); return; }
    p.bombs--; p.bombFlash=1; Sound.bomb();
    this.doFlash('#bff',0.9); this.screenShake(18);
    eBullets.length=0;
    for(const e of this.enemies){ damageEnemy(e, 130, e.x,e.y); }
    if(this.boss) damageBoss(240);
    for(let i=0;i<60;i++) burst(rand(0,VW),rand(0,VH*0.8), '#8ff', 3, 4);
  },

  onPointer(x,y,phase){
    if(phase==='down'){
      Sound.init(); Sound.resume(); Music.unlock();
      for(const b of this.buttons){
        if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ this.click(b.id); return; }
      }
    }
  },

  click(id){
    if(id==='start'){ this.gotoHangar(); }
    else if(id==='howto'){ this.state=STATE.HOWTO; }
    else if(id==='back'){ this.state=STATE.TITLE; }
    else if(id==='launch'){ if(this.midRun) this.resumeNext(); else this.launch(); }
    else if(id==='mute'){ Sound.muted=!Sound.muted; Save.data.muted=Sound.muted; Save.save(); Music.setMuted(Sound.muted); }
    else if(id==='reset'){ if(confirmReset()){ Save.reset(); } }
    else if(id==='hangar'){ this.midRun=false; this.gotoHangar(); }
    else if(id==='title'){ this.midRun=false; this.state=STATE.TITLE; Music.play('opening'); }
    else if(id==='resume'){ this.state=STATE.PLAY; }
    else if(id.startsWith('buy:')){ this.buy(id.slice(4)); }
    else if(id==='bomb'){ this.bombBlast(); }
    else if(id==='pause'){ this.state = this.state===STATE.PLAY?STATE.PAUSE:STATE.PLAY; }
  },

  gotoHangar(){ this.state=STATE.HANGAR; Music.play('opening'); },

  buy(uid){
    const u = UPGRADES.find(x=>x.id===uid); if(!u) return;
    if(upMaxed(u)){ Sound.deny(); return; }
    const c=upCost(u);
    if(Save.data.credits < c){ Sound.deny(); this.shopMsg='クレジット不足'; this.shopMsgT=60; return; }
    Save.data.credits-=c; Save.data.up[uid]=upLevel(uid)+1; Save.save();
    /* v9: 最大まで上げ切ると勝利ファンファーレ、火力系は上昇スイープ */
    if(upMaxed(u)) Sound.buyMax();
    else if(uid==='power'||uid==='weapon'||uid==='rate') Sound.powerUp();
    else Sound.buy();
  },
};

function handleKeyPress(code){
  if(code==='Enter' || code==='Space'){
    if(Game.state===STATE.TITLE){ Game.gotoHangar(); }
    else if(Game.state===STATE.HANGAR){ Game.click('launch'); }
    else if(Game.state===STATE.OVER || Game.state===STATE.WIN){ Game.click('hangar'); }
    else if(Game.state===STATE.HOWTO){ Game.state=STATE.TITLE; }
  }
  if(code==='KeyB' && Game.state===STATE.PLAY){ Game.bombBlast(); }
  if(code==='KeyP' && (Game.state===STATE.PLAY||Game.state===STATE.PAUSE)){ Game.click('pause'); }
  if(code==='KeyM'){ Game.click('mute'); }
}
function confirmReset(){ return window.confirm('進行データ（クレジット・強化）をリセットしますか？'); }

/* =========================================================================
   敵の定義と behavior（v2: 新敵4種・攻撃強化）
   ========================================================================= */
const ENEMY_DEF = {
  grunt:    { r:14, hp:26, color:'#6cf', credit:8,  score:100, dmg:22, drop:0.09 },
  weaver:   { r:13, hp:32, color:'#5fe', credit:11, score:130, dmg:22, drop:0.11 },
  turret:   { r:16, hp:50, color:'#8af', credit:16, score:180, dmg:20, drop:0.15 },
  bomber:   { r:19, hp:78, color:'#a9f', credit:24, score:250, dmg:24, drop:0.18 },
  kamikaze: { r:13, hp:22, color:'#f86', credit:10, score:140, dmg:30, drop:0.09 },
  splitter: { r:20, hp:66, color:'#df6', credit:20, score:220, dmg:24, drop:0.16 },
  mini:     { r:9,  hp:13, color:'#df6', credit:5,  score:60,  dmg:18, drop:0.04 },
  shield:   { r:17, hp:130,color:'#7ff', credit:30, score:320, dmg:24, drop:0.22 },
  mine:     { r:12, hp:20, color:'#fd6', credit:9,  score:110, dmg:26, drop:0.08 },
  sniper:   { r:13, hp:55, color:'#f6f', credit:20, score:260, dmg:22, drop:0.16 },
  orbiter:  { r:14, hp:52, color:'#6fa', credit:18, score:240, dmg:22, drop:0.14 },
  carrier:  { r:24, hp:170,color:'#fa6', credit:40, score:420, dmg:26, drop:0.28 },
  dasher:   { r:13, hp:28, color:'#6ef', credit:12, score:160, dmg:24, drop:0.10 },
};
function makeEnemy(kind, x, y, opt={}){
  const base = ENEMY_DEF[kind];
  /* v3: 同一ステージ内でも後半ウェーブほど少し固くなる */
  const ramp = 1 + Math.min(Director.step||0,20)*0.04;
  const hp0 = base.hp*(opt.hpMul||1)*ramp;
  return {
    kind, x, y, r:base.r, hp:hp0, maxHp:hp0,
    color:base.color, credit:base.credit, dmg:base.dmg||20,
    t:0, fireCd:rand(50,110), vx:0, vy:0, angle:0,
    entered:false, targetY: opt.targetY!==undefined?opt.targetY: rand(80,220),
    homeX:x, phase:rand(0,TAU), scoreV:base.score||100, drop:base.drop||0.12,
    opt
  };
}

function updateEnemy(e, dt){
  e.t += dt;
  const p = Game.player;
  switch(e.kind){
    case 'grunt': {
      if(!e.entered){ e.y += 2.4*dt; if(e.y>=e.targetY){ e.entered=true; e.fireCd=rand(120,220); } }
      else {
        e.x = e.homeX + Math.sin(e.t*0.03+e.phase)*36; e.y = e.targetY + Math.sin(e.t*0.02)*10;
        e.fireCd-=dt; if(e.fireCd<=0){ e.fireCd=rand(150,240); aimShot(e,3.8); }
      }
      break;
    }
    case 'weaver': {
      e.y += 1.6*dt; e.x = e.homeX + Math.sin(e.t*0.05+e.phase)*95;
      e.fireCd-=dt; if(e.fireCd<=0 && e.y<VH*0.7){ e.fireCd=rand(65,95); aimShot(e,4.0); }
      if(e.y>VH+30) e.dead=true;
      break;
    }
    case 'turret': {
      if(!e.entered){ e.y+=1.9*dt; if(e.y>=e.targetY) e.entered=true; }
      else { e.x = e.homeX + Math.sin(e.t*0.02+e.phase)*22; }
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(52,78); aimSpread(e,4,0.24,4.2); }
      break;
    }
    case 'bomber': {
      if(!e.entered){ e.y+=1.3*dt; if(e.y>=e.targetY) e.entered=true; }
      else { e.x += Math.sin(e.t*0.015)*1.2*dt; }
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(80,115); ringShot(e,12,2.9); }
      break;
    }
    case 'kamikaze': {
      if(!e.locked){ e.y+=2.2*dt; if(e.y>110){ e.locked=true; const a=Math.atan2(p.y-e.y,p.x-e.x); e.vx=Math.cos(a)*5.2; e.vy=Math.sin(a)*5.2; } }
      else { e.x+=e.vx*dt; e.y+=e.vy*dt; }
      if(e.y>VH+30||e.x<-30||e.x>VW+30) e.dead=true;
      break;
    }
    case 'splitter': {
      if(!e.entered){ e.y+=1.7*dt; if(e.y>=e.targetY) e.entered=true; }
      else { e.x=e.homeX+Math.sin(e.t*0.03+e.phase)*55; }
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(90,120); aimSpread(e,3,0.3,3.6); }
      break;
    }
    case 'mini': {
      e.y += 2.8*dt; e.x += Math.sin(e.t*0.08+e.phase)*1.7*dt;
      if(e.y>VH+30) e.dead=true;
      break;
    }
    case 'shield': {
      if(!e.entered){ e.y+=1.1*dt; if(e.y>=e.targetY) e.entered=true; }
      else { e.x=e.homeX+Math.sin(e.t*0.018+e.phase)*75; }
      e.fireCd-=dt; if(e.fireCd<=0&&e.entered){ e.fireCd=rand(75,105); aimSpread(e,5,0.22,3.8); }
      break;
    }
    case 'mine': {
      e.y += 1.3*dt; e.angle+=0.05*dt;
      if(e.y>VH+30) e.dead=true;
      break;
    }
    case 'sniper': {
      if(!e.entered){ e.y+=2.0*dt; if(e.y>=e.targetY) e.entered=true; }
      else {
        e.x = e.homeX + Math.sin(e.t*0.012+e.phase)*16;
        e.fireCd-=dt;
        e.charging = e.fireCd<45 && e.fireCd>0;
        if(e.fireCd<=0){
          e.fireCd=rand(125,165);
          const a=Math.atan2(p.y-e.y,p.x-e.x);
          eb(e.x,e.y,Math.cos(a)*6.6,Math.sin(a)*6.6,{r:5,color:'#f8f',dmg:20});
          eb(e.x,e.y,Math.cos(a+0.06)*6.0,Math.sin(a+0.06)*6.0,{r:4,color:'#f8f',dmg:16});
          Sound.laser();
        }
      }
      break;
    }
    case 'orbiter': {
      e.cy = e.cy===undefined? e.y : Math.min(e.targetY, e.cy+1.3*dt);
      e.oa = (e.oa===undefined? e.phase : e.oa) + 0.035*dt;
      e.x = e.homeX + Math.cos(e.oa)*60;
      e.y = e.cy + Math.sin(e.oa)*38;
      if(e.cy>=e.targetY) e.entered=true;
      e.fireCd-=dt; if(e.fireCd<=0 && e.entered){ e.fireCd=rand(120,160); ringShot(e,8,2.8); }
      break;
    }
    case 'carrier': {
      if(!e.entered){ e.y+=0.9*dt; if(e.y>=e.targetY) e.entered=true; }
      else { e.x=e.homeX+Math.sin(e.t*0.01+e.phase)*30; }
      e.fireCd-=dt;
      if(e.fireCd<=0 && e.entered){
        e.fireCd=rand(120,160);
        if(Game.enemies.length<42){ const m=makeEnemy('mini',e.x,e.y+10); m.homeX=e.x; Game.enemies.push(m); }
        aimSpread(e,3,0.3,3.4);
      }
      break;
    }
    case 'dasher': {
      e.x += e.vx*dt; e.y += Math.sin(e.t*0.06+e.phase)*1.4*dt;
      e.fireCd-=dt;
      if(e.fireCd<=0){ e.fireCd=52; eb(e.x,e.y,0.7,3.6,{color:'#8ef',dmg:16}); eb(e.x,e.y,-0.7,3.6,{color:'#8ef',dmg:16}); }
      if((e.vx>0&&e.x>VW+40)||(e.vx<0&&e.x<-40)) e.dead=true;
      break;
    }
  }
}

/* 敵の弾発射ヘルパー */
function aimShot(e,speed){
  const p=Game.player; if(!p)return; const a=Math.atan2(p.y-e.y,p.x-e.x);
  eb(e.x,e.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#ff6a8a',dmg:Math.round(e.dmg*0.6)});
  Sound.blip(300,0.05,'square',0.04,-60);
}
function aimSpread(e,count,spread,speed){
  const p=Game.player; if(!p)return; const a=Math.atan2(p.y-e.y,p.x-e.x);
  for(let i=0;i<count;i++){ const off=(i-(count-1)/2)*spread; eb(e.x,e.y,Math.cos(a+off)*speed,Math.sin(a+off)*speed,{r:5,color:'#ff88aa',dmg:Math.round(e.dmg*0.55)}); }
}
function ringShot(e,count,speed){
  for(let i=0;i<count;i++){ const a=i/count*TAU + e.t*0.02; eb(e.x,e.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#c9f',dmg:Math.round(e.dmg*0.5)}); }
}

/* v8: ダメージ表示も威力に応じて大きく・熱く */
function dmgSize(d){ return clamp(11 + d*0.09, 11, 21); }
function dmgColor(d){ return d>=90?'#fff3b0' : d>=55?'#ffe9a8' : d>=30?'#eafcff' : '#ffffff'; }
function damageEnemy(e, dmg, hx, hy){
  e.hp -= dmg; e.hitFlash=4;
  addFloat(hx, hy-6, Math.round(dmg), dmgColor(dmg), dmgSize(dmg));
  if(e.hp>0) Sound.enemyHit(e, dmg);
  if(e.hp<=0 && !e.dead){ killEnemy(e); }
}
function killEnemy(e){
  e.dead=true;
  burst(e.x,e.y,e.color,18,4); Sound.explodeAt(e); Game.screenShake(2+Math.min(4,e.r/7));
  Game.score += e.scoreV; const g=Game.addCredits(e.credit*credScale());
  addFloat(e.x,e.y,'+'+Math.round(g)+'c','#ffd76a');
  if(Math.random()<e.drop) spawnPowerup(e.x,e.y);
  if(e.kind==='splitter'){ for(let i=0;i<4;i++){ const m=makeEnemy('mini',e.x,e.y); m.homeX=e.x; m.phase=rand(0,TAU); Game.enemies.push(m); } }
  if(e.kind==='mine'){ for(let i=0;i<8;i++){ const a=i/8*TAU; eb(e.x,e.y,Math.cos(a)*3.4,Math.sin(a)*3.4,{r:4,color:'#fd8',dmg:14}); } }
}

/* ---------------- パワーアップ ---------------- */
const powerups=[];
const PU_TYPES=['heal','shield','credit','bomb'];
function spawnPowerup(x,y){
  const type = PU_TYPES[randi(0,PU_TYPES.length-1)];
  powerups.push({x,y,vy:1.4,r:11,type,t:0});
}
function updatePowerups(dt){
  const p=Game.player;
  for(let i=powerups.length-1;i>=0;i--){
    const pu=powerups[i]; pu.y+=pu.vy*dt; pu.t+=dt;
    if(p && dist2(pu.x,pu.y,p.x,p.y) < (pu.r+16)*(pu.r+16)){
      applyPowerup(pu.type); powerups.splice(i,1); continue;
    }
    if(pu.y>VH+20) powerups.splice(i,1);
  }
}
function applyPowerup(type){
  const p=Game.player; Sound.pickup();
  if(type==='heal'){ p.hp=Math.min(p.maxHP,p.hp+Math.max(30,p.maxHP*0.2)); addFloat(p.x,p.y-20,'+HP','#7fffa8'); }
  else if(type==='shield'){ if(p.shieldMax>0){ p.shieldHP=p.shieldMax; addFloat(p.x,p.y-20,'SHIELD','#7ff'); } else { const g=Game.addCredits(15); addFloat(p.x,p.y-20,'+'+Math.round(g)+'c','#ffd76a'); } }
  else if(type==='credit'){ const g=Game.addCredits(30); addFloat(p.x,p.y-20,'+'+Math.round(g)+'c','#ffd76a'); }
  else if(type==='bomb'){ p.bombs=Math.min(9,p.bombs+1); addFloat(p.x,p.y-20,'+BOMB','#bff'); }
}
function drawPowerup(pu){
  const col = pu.type==='heal'?'#7fffa8': pu.type==='shield'?'#7ff': pu.type==='credit'?'#ffd76a':'#bdf';
  const s=1+Math.sin(pu.t*0.15)*0.12;
  ctx.save(); ctx.translate(pu.x,pu.y); ctx.scale(s,s);
  ctx.shadowBlur=16; ctx.shadowColor=col; ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; const px=Math.cos(a)*pu.r, py=Math.sin(a)*pu.r; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); ctx.stroke();
  ctx.fillStyle=col; ctx.font='bold 11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const ch = pu.type==='heal'?'H': pu.type==='shield'?'S': pu.type==='credit'?'$':'B';
  ctx.fillText(ch,0,1);
  ctx.restore(); ctx.shadowBlur=0; ctx.textBaseline='alphabetic';
}

/* v3 難易度カーブ: 終盤ほど敵が固く・痛くなる。クレジット収入も増える。
   フル強化時のプレイヤー火力/防御が大きく上回る設計なので、
   最後まで強化すれば初心者でも爽快にクリアできる。 */
const HP_MUL   = [1.0, 4.5, 13.0];  // 敵HP倍率(ステージ別) v13: さらに急カーブ

   （撃ち出しの初速は同じ。低速弾ほどよく伸び、元から速い弾は伸びない） */
const ACC_MUL  = [0.005, 0.009, 0.014];
const ACC_CAP  = [1.70, 2.05, 2.45];   // 到達できる最大倍率（終盤ほど伸びる）
function dmgScale(){ return DMG_MUL[Game.stageIndex]||1; }
function credScale(){ return CRED_MUL[Game.stageIndex]||1; }

function formationRow(kind, count, y, hpMul){
  const gap=VW/(count+1);
  for(let i=0;i<count;i++){ const e=makeEnemy(kind, gap*(i+1), -30-i*4, {targetY:y, hpMul}); Game.enemies.push(e); }
}
function swarm(kind,count,hpMul){
  for(let i=0;i<count;i++){ const e=makeEnemy(kind,rand(50,VW-50),-30-i*26,{hpMul}); Game.enemies.push(e); }
}
function dashers(count, side, y0, hpMul){
  for(let i=0;i<count;i++){
    const e=makeEnemy('dasher', side>0?-30-i*60:VW+30+i*60, y0+i*34, {hpMul});
    e.vx = side>0?3.7:-3.7; e.fireCd=rand(20,60);
    Game.enemies.push(e);
  }
}
function W(spawn,maxT){ return {type:'wave', clear:'all', maxT:maxT||1000, spawn}; }

const Director = {
  stage:0, step:0, timer:0, script:[], phase:'run', bossIntro:0, transformT:0,
  begin(stage){
    this.stage=stage; this.step=0; this.timer=0; this.phase='run';
    this.script = buildScript(stage);
    Game.stageIndex=stage;
  },
  update(dt){
    if(this.phase!=='run') return;
    const s=this.script[this.step];
    if(!s){ return; }
    if(s.type==='wave'){
      if(!s.started){ s.spawn(); s.started=true; this.timer=0; }
      this.timer+=dt;
      const cleared = Game.enemies.length===0;
      if(cleared && this.timer>30){ this.next(); }
      if(s.maxT && this.timer>s.maxT){ this.next(); }
    } else if(s.type==='wait'){
      this.timer+=dt; if(this.timer>s.t){ this.next(); }
    } else if(s.type==='midboss'){
      if(!s.started){ spawnMidboss(this.stage); s.started=true; }
      if(Game.boss==null && s.started && s.done){ this.next(); }
    } else if(s.type==='boss'){
      if(!s.started){
        this.phase='bossintro'; this.bossIntro=120; s.started=true;
        Music.play('boss'+this.stage);
      }
    }
  },
  next(){ this.step++; this.timer=0; },
  onBossDefeated(){
    if(this.stage<2){
      Game.stageClear(this.stage+1);   // v2: 格納庫を挟む
    } else {
      this.phase='transform'; this.transformT=150; Sound.transform();
      Game.doFlash('#fd6',1); Game.screenShake(24);
      Music.play('final');
    }
  }
};

/* =========================================================================
   ボス（v2: 個性化・パターンセット制）
   ========================================================================= */
function makeBoss(kind, stage){
  const B = {
    kind, stage, id:kind+stage, x:VW/2, y:-140, r:52, t:0, moveT:0, phase:-1, attackCd:70,
    patIdx:0, rep:-1, beam:0, beamAcc:0,
    entering:true, dead:false, hitFlash:0, spin:0,
    isGreat:(kind==='great'), isMid:(kind==='mid'),
    parts:[], anim:0, baseY:VH*0.22, tx:VW/2, dashT:0,
  };
  /* v3: ボスHPを終盤急カーブに（フル強化DPSなら短時間で溶かせる値） */
  /* v13: ボスHPを大幅に引き上げ。特に最終ボスは長期戦の総力戦にする */
  if(kind==='mid'){ B.r=38; B.maxHp=[1300,5200,15000][stage]; B.name=MID_NAMES[stage]; }
  else if(kind==='great'){ B.r=64; B.maxHp=95000; B.name='OMEGA CORE'; B.baseY=VH*0.24; }
  else { B.r=52; B.maxHp=[3400,14000,42000][stage]; B.name=BOSS_NAMES[stage]; }
  B.hp=B.maxHp;
  const pc = kind==='great'?10:(kind==='mid'?5:7);
  for(let i=0;i<pc;i++){ B.parts.push({a:i/pc*TAU, hp: kind==='great'?220:130, alive:true}); }
  return B;
}
function spawnMidboss(stage){
  const b=makeBoss('mid',stage); Game.boss=b;
  Game.setMessage('WARNING', MID_NAMES[stage]+' APPROACHING', 110); Sound.boss();
  Music.play('midboss');   // v6: 中ボス専用曲 (chuboss.mp3・3ステージ共通)
}
function spawnBoss(stage){
  const b=makeBoss('boss',stage); Game.boss=b;
  Game.setMessage('BOSS', BOSS_NAMES[stage], 120); Sound.boss();
}
function spawnGreatBoss(x,y){
  const b=makeBoss('great',2); Game.boss=b;
  b.x = x!==undefined?x:VW/2; b.y = y!==undefined?y:VH*0.1;
  Game.setMessage('FINAL FORM', 'OMEGA CORE AWAKENS', 150); Sound.boss();
}

function damageBoss(dmg, hx, hy){
  const b=Game.boss; if(!b||b.dead||b.entering) return;
  b.hp-=dmg; b.hitFlash=3;
  if(hx!==undefined) addFloat(hx,hy-8,Math.round(dmg),dmgColor(dmg),dmgSize(dmg));
  if(b.hp>0) Sound.bossHit(dmg, b);
  const alive=b.parts.filter(p=>p.alive);
  if(alive.length){ const idx=randi(0,alive.length-1); alive[idx].hp-=dmg; if(alive[idx].hp<=0){ alive[idx].alive=false; burst(b.x+Math.cos(alive[idx].a)*b.r, b.y+Math.sin(alive[idx].a)*b.r, '#fff',20,4); Sound.panelBreak(); Game.screenShake(6); } }
  if(b.hp<=0) defeatBoss();
}
function defeatBoss(){
  const b=Game.boss; if(b.dead) return; b.dead=true;
  Sound.bigExplode(); Game.screenShake(22); Game.doFlash('#fff',0.8);
  for(let i=0;i<40;i++) setTimeout(()=>{ burst(b.x+rand(-b.r,b.r), b.y+rand(-b.r,b.r), i%2?'#fd6':'#f6c', 8, 5); }, i*20);
  const bonus = Math.round((b.isGreat?3200: b.isMid?240:850)*(1+b.stage*0.35));
  Game.score += bonus*4; const g=Game.addCredits(bonus);
  addFloat(b.x,b.y,'+'+Math.round(g)+'c','#ffd76a');
  eBullets.length=0;   // ボス撃破で弾消し（爽快感）

  if(b.isMid){
    const s=Director.script[Director.step]; if(s) s.done=true;
    Game.boss=null;
    Music.play('stage'+Director.stage);
  } else if(b.isGreat){
    Game.boss=null; setTimeout(()=>{ if(Game.state===STATE.PLAY) Game.endRun(true); }, 1200);
  } else {
    const bx=b.x, by=b.y;
    Game.boss=null;
    Game.lastBossX=bx; Game.lastBossY=by;
    Director.onBossDefeated();
  }
}

/* ---- ボスAI: フェーズ別パターンセットを順番に回す ---- */
function bossPhase(b){
  const ratio=b.hp/b.maxHp;
  if(b.isGreat) return ratio>0.62?0: ratio>0.3?1:2;
  return ratio>0.62?0: ratio>0.3?1:2;
}
/* パターン工場 */
function fAimN(n,spread,speed){ return (b)=>{ const p=Game.player; if(!p)return; const a=Math.atan2(p.y-b.y,p.x-b.x);
  for(let i=0;i<n;i++){ const off=(i-(n-1)/2)*spread; eb(b.x,b.y+16,Math.cos(a+off)*speed,Math.sin(a+off)*speed,{r:6,color:'#ff6a8a',dmg:18}); } }; }
function fRing(n,speed,color){ return (b)=>{ for(let i=0;i<n;i++){ const a=i/n*TAU + b.t*0.03; eb(b.x,b.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:color||'#c9f',dmg:16}); } }; }
function fSpiral(arms,speed,dir){ return (b)=>{ for(let i=0;i<arms;i++){ const a=b.t*0.09*(dir||1) + i/arms*TAU; eb(b.x,b.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#fda',dmg:15}); } }; }
function fWallGap(speed){ return (b)=>{ const p=Game.player; const gapX = p? clamp(p.x+rand(-70,70), 50, VW-50) : VW/2;
  for(let x=16;x<VW;x+=26){ if(Math.abs(x-gapX)<46) continue; eb(x, b.y+b.r*0.6, 0, speed, {r:5,color:'#f9c',dmg:17}); } }; }
function fWaveFan(n,speed,amp){ return (b)=>{ for(let i=0;i<n;i++){ const a=Math.PI/2 + (i-(n-1)/2)*0.22;
  eb(b.x,b.y+10,Math.cos(a)*speed,Math.sin(a)*speed,{r:5,color:'#adf',dmg:16,wave:{a:amp,f:0.09,p:rand(0,TAU)}}); } }; }
function fClaws(speed){ return (b)=>{ const p=Game.player; if(!p)return;
  for(const s of [-1,1]){ const cx=b.x+s*b.r*1.1, cy=b.y+8; const a=Math.atan2(p.y-cy,p.x-cx);
    for(let k=0;k<3;k++) eb(cx,cy,Math.cos(a+k*0.09-0.09)*speed,Math.sin(a+k*0.09-0.09)*speed,{r:5,color:'#7df',dmg:17}); } }; }
function fScatter(n,speed){ return (b)=>{ for(let i=0;i<n;i++){ const a=Math.PI/2+rand(-1.1,1.1); const s=speed*rand(0.6,1.15);
  eb(b.x+rand(-b.r,b.r),b.y+rand(-8,16),Math.cos(a)*s,Math.sin(a)*s,{r:randi(4,6),color:'#f6c',dmg:16}); } }; }
function fCross(n,speed){ return (b)=>{ for(let i=0;i<n;i++){ const a=b.spin*2.2 + i/n*TAU;
  eb(b.x,b.y,Math.cos(a)*speed,Math.sin(a)*speed,{r:6,color:'#ffd76a',dmg:18}); } }; }
function fAccelRain(n){ return (b)=>{ for(let i=0;i<n;i++){ const x=rand(30,VW-30);
  eb(x, b.y+rand(-10,20), rand(-0.4,0.4), 1.2, {r:5,color:'#fd9',dmg:16, ay:0.06}); } }; }
function fSummon(kinds){ return (b)=>{ if(Game.enemies.length>14) return;
  const kind=kinds[randi(0,kinds.length-1)];
  const e=makeEnemy(kind, rand(60,VW-60), b.y+30, {targetY:rand(130,210), hpMul:HP_MUL[b.stage]*0.8});
  e.entered = (kind!=='kamikaze'); e.fireCd=rand(30,70);
  Game.enemies.push(e); }; }
function fSnake(dur){ return (b)=>{ b.beam=dur; b.beamAcc=0; }; }

/* 各ボスのフェーズ別パターンリスト {f, cd, reps} */
function bossPatterns(b){
  const ph = b.phase;
  if(b.id==='mid0'){ // RAZOR: 壁と挟み撃ち
    return ph===0 ? [ {f:fAimN(3,0.22,4.6),cd:38,reps:3}, {f:fWallGap(3.0),cd:95,reps:1} ]
                  : [ {f:fAimN(5,0.2,4.8),cd:34,reps:3}, {f:fWallGap(3.4),cd:80,reps:2}, {f:fRing(12,3.0),cd:70,reps:1} ];
  }
  if(b.id==='mid1'){ // PHANTOM: ダッシュ＋リング
    return ph===0 ? [ {f:fRing(14,3.0),cd:60,reps:2}, {f:fAimN(4,0.3,5.0),cd:36,reps:3} ]
                  : [ {f:fRing(18,3.2),cd:52,reps:2}, {f:fScatter(10,3.6),cd:46,reps:2}, {f:fAimN(6,0.24,5.2),cd:30,reps:3} ];
  }
  if(b.id==='mid2'){ // WARDEN: 加速弾雨＋十字
    return ph===0 ? [ {f:fAccelRain(9),cd:46,reps:3}, {f:fCross(6,3.4),cd:40,reps:3} ]
                  : [ {f:fAccelRain(12),cd:38,reps:3}, {f:fCross(8,3.8),cd:32,reps:4}, {f:fAimN(5,0.22,5.4),cd:30,reps:2} ];

  if(b.id==='boss0'){ // AZURE CRUSHER: カニ。壁＋ハサミ集中砲火
    if(ph===0) return [ {f:fClaws(4.4),cd:40,reps:4}, {f:fWallGap(3.0),cd:100,reps:1}, {f:fAimN(3,0.26,4.6),cd:36,reps:3} ];
    if(ph===1) return [ {f:fClaws(4.8),cd:32,reps:4}, {f:fWallGap(3.3),cd:85,reps:2}, {f:fRing(14,3.0),cd:60,reps:2}, {f:fSummon(['grunt','weaver']),cd:50,reps:2} ];
    return       [ {f:fClaws(5.2),cd:26,reps:5}, {f:fWallGap(3.7),cd:70,reps:2}, {f:fRing(18,3.4),cd:48,reps:2}, {f:fAimN(7,0.18,5.2),cd:30,reps:2} ];

  if(b.id==='boss1'){ // CRIMSON MOTH: 蛾。鱗粉スキャッター＋波状扇＋二重螺旋
    if(ph===0) return [ {f:fScatter(9,3.4),cd:42,reps:3}, {f:fWaveFan(7,3.2,1.6),cd:60,reps:2}, {f:fAimN(4,0.24,4.8),cd:34,reps:2} ];
    if(ph===1) return [ {f:fSpiral(3,3.6,1),cd:9,reps:16}, {f:fWaveFan(9,3.4,2.0),cd:52,reps:2}, {f:fScatter(12,3.8),cd:38,reps:3}, {f:fSummon(['kamikaze','sniper']),cd:46,reps:2} ];
    return       [ {f:fSpiral(3,3.8,1),cd:8,reps:14}, {f:fSpiral(3,3.8,-1),cd:8,reps:14}, {f:fWaveFan(11,3.6,2.4),cd:46,reps:2}, {f:fScatter(14,4.2),cd:32,reps:2} ];
  }
  if(b.id==='boss2'){ // GOLD SENTINEL: 要塞。十字砲＋加速雨＋密リング
    if(ph===0) return [ {f:fCross(8,3.6),cd:34,reps:4}, {f:fRing(16,3.2),cd:58,reps:2}, {f:fAimN(5,0.2,5.0),cd:32,reps:2} ];

    {f:fCross(10,3.8),cd:30,reps:3},           // GOLD SENTINEL の十字砲

  /* 最終フェーズ: 蛇行レーザーを軸に全パターンを畳みかける */
  return [
    {f:fSnake(110),cd:150,reps:1},
    {f:fSpiral(5,4.0,-1),cd:7,reps:16},
    {f:fCross(14,4.4),cd:22,reps:4},
    {f:fRing(26,3.8),cd:40,reps:2},
    {f:fClaws(5.6),cd:24,reps:5},
    {f:fSnake(130),cd:170,reps:1},

    {f:fSummon(['kamikaze','sniper','shield']),cd:40,reps:2},

}

function updateBoss(b, dt){
  b.t+=dt; b.spin+=0.01*dt; b.anim+=dt;
  if(b.hitFlash>0) b.hitFlash-=dt;
  const p=Game.player;

  if(b.entering){
    b.y += (b.baseY - b.y)*0.035*dt;
    b.x += (VW/2 - b.x)*0.035*dt;
    if(Math.abs(b.y-b.baseY)<3){ b.entering=false; b.moveT=0; }
    return;
  }
  b.moveT+=dt;

  /* --- 移動（ボスごとに個性 / moveT基準なのでワープしない） --- */
  if(b.id==='mid1'){ // PHANTOM: ダッシュ移動
    b.dashT-=dt;
    if(b.dashT<=0){ b.tx=rand(70,VW-70); b.dashT=rand(85,130); }
    b.x = lerp(b.x, b.tx, 0.055*dt);
    b.y = b.baseY + Math.sin(b.moveT*0.03)*18;
  } else if(b.id==='boss1'){ // MOTH: ∞軌道
    b.x = VW/2 + Math.sin(b.moveT*0.014)*(VW*0.3);
    b.y = b.baseY + Math.sin(b.moveT*0.028)*46;
  } else if(b.id==='boss2' || b.id==='mid2'){ // 要塞系: ゆっくり
    b.x = VW/2 + Math.sin(b.moveT*0.009)*(VW*0.24);
    b.y = b.baseY + Math.sin(b.moveT*0.02)*12;
  } else if(b.isGreat){
    b.x = VW/2 + Math.sin(b.moveT*0.008)*(VW*0.3);
    b.y = b.baseY + Math.sin(b.moveT*0.016)*20;
  } else {
    b.x = VW/2 + Math.sin(b.moveT*0.013)*(VW*0.28);
    b.y = b.baseY + Math.sin(b.moveT*0.022)*10;
  }

  /* --- フェーズ切替 --- */
  const ph=bossPhase(b);
  if(ph!==b.phase){ b.phase=ph; b.patIdx=0; b.rep=-1; b.attackCd=50; b.beam=0;
    if(ph>0){ Game.doFlash(b.isGreat?'#fd6':'#f6c',0.35); Game.screenShake(8); burst(b.x,b.y,'#fff',26,5); } }

  /* --- 蛇行レーザー（発射中は連続射出） --- */
  if(b.beam>0 && p){
    b.beam-=dt; b.beamAcc+=dt;
    while(b.beamAcc>2){
      b.beamAcc-=2;
      const base=Math.atan2(p.y-b.y,p.x-b.x);
      const a1=base+Math.sin(b.t*0.17)*1.15;
      const a2=base+Math.sin(b.t*0.17+Math.PI)*1.15;
      eb(b.x,b.y,Math.cos(a1)*6.4,Math.sin(a1)*6.4,{r:6,color:'#fff',dmg:20,life:200});
      eb(b.x,b.y,Math.cos(a2)*6.4,Math.sin(a2)*6.4,{r:6,color:'#fd6',dmg:20,life:200});
      Sound.laser();
    }
  }

  /* --- パターン実行 --- */
  b.attackCd-=dt;
  if(b.attackCd<=0 && b.beam<=0){
    const list=bossPatterns(b);
    const P=list[b.patIdx % list.length];
    if(b.rep<0) b.rep=P.reps;
    P.f(b);
    b.attackCd=P.cd;
    b.rep--;
    if(b.rep<=0){ b.patIdx++; b.rep=-1; b.attackCd=P.cd+42; }
  }
}

/* =========================================================================
   プレイヤー更新（v2: 扇形ショット）
   ========================================================================= */
function updatePlayer(dt){
  const p=Game.player; if(!p) return;
  /* v5: 相対ドラッグ — 指の移動量ぶんだけ動く（自機が指で隠れない） */
  if(pointer.dxAcc!==0 || pointer.dyAcc!==0){
    p.x = clamp(p.x + pointer.dxAcc*1.15, 16, VW-16);
    p.y = clamp(p.y + pointer.dyAcc*1.15, 40, VH-30);
    pointer.dxAcc=0; pointer.dyAcc=0;
  }
  if(!pointer.active){
    const s=p.st.speed;
    if(keys.ArrowLeft||keys.KeyA) p.x-=s*dt;
    if(keys.ArrowRight||keys.KeyD) p.x+=s*dt;
    if(keys.ArrowUp||keys.KeyW) p.y-=s*dt;
    if(keys.ArrowDown||keys.KeyS) p.y+=s*dt;
    p.x=clamp(p.x,16,VW-16); p.y=clamp(p.y,40,VH-30);
  }
  /* v10: 左右の移動量に応じて機体がバンク（傾く） */
  const bdx = p.x - (p.lastX!==undefined?p.lastX:p.x);
  p.lastX = p.x;
  p.bank = lerp(p.bank||0, clamp(bdx*0.05, -0.38, 0.38), 0.22);
  if(p.inv>0) p.inv-=dt;
  if(p.muzzle>0) p.muzzle-=0.16*dt;
  if(p.bombFlash>0) p.bombFlash-=0.04*dt;
  if(p.shieldMax>0 && p.shieldHP<p.shieldMax){ p.shieldRegen+=dt; if(p.shieldRegen>p.st.shieldDelay){ p.shieldHP=Math.min(p.shieldMax,p.shieldHP+p.st.shieldRegenRate*dt); } }
  p.fireCd-=dt;
  if(p.fireCd<=0){ playerFire(); p.fireCd=p.st.fireInterval/16.67; }
  if(p.st.missiles>0){ p.missileCd-=dt; if(p.missileCd<=0){ for(let i=0;i<p.st.missiles;i++){ setTimeout(()=>{ if(Game.player===p && Game.state===STATE.PLAY) fireHoming(p.x+rand(-10,10),p.y,p.st.dmg*1.4);},i*80);} p.missileCd=90; } }
  if(Math.random()<0.6) spawnParticle(p.x+rand(-4,4),p.y+14,'#4cf',{vx:rand(-.4,.4),vy:rand(1,2.4),life:rand(10,18),r:rand(1.5,3)});
  for(const w of Game.wingmen){
    const tx=p.x+w.side*34, ty=p.y+16;
    w.x=lerp(w.x,tx,0.2); w.y=lerp(w.y,ty,0.2);
    w.fireCd-=dt; if(w.fireCd<=0){ firePlayer(w.x,w.y-8,0,-10,p.st.dmg*0.6,3,'#8fe8b8','shot',Math.max(0,bulletTier()-2)); w.fireCd=p.st.fireInterval/16.67*1.2; }
  }
}
/* v2: レベルに応じて扇形に大きく拡散するメインショット */
function playerFire(){
  const p=Game.player, d=p.st.dmg, lv=p.st.weapon;
  const counts  = [1, 2, 3, 5, 7, 9, 11];
  const spreads = [0, 10, 22, 38, 58, 80, 100];   // 扇の全角(度)
  const n = counts[lv], spreadRad = spreads[lv]*Math.PI/180;
  const speed = 10.5;
  /* v4: 武器最終Lvは弾自体も強化（ダメージ1.3倍） */
  const boost = lv>=6 ? 1.3 : 1;
  /* v8: 威力レベルで弾の見た目と当たり判定が育つ */
  const tier = bulletTier(), T = BULLET_TIERS[tier];
  const br = 4 + tier*0.3;
  p.tier = tier; p.muzzle = 1;
  Sound.shoot(tier);
  for(let i=0;i<n;i++){
    const off = n>1 ? (i/(n-1) - 0.5)*spreadRad : 0;
    const a = -Math.PI/2 + off;
    firePlayer(p.x, p.y-12, Math.cos(a)*speed, Math.sin(a)*speed, Math.round(d*boost), br, T.c, 'shot', tier);
  }
  /* マズルフラッシュ（威力が上がるほど派手に） */
  const mf = 1 + tier*0.3;
  for(let i=0;i<1+Math.floor(tier/2);i++){
    spawnParticle(p.x+rand(-3,3), p.y-15, i%2?T.core:T.c,
      {vx:rand(-1,1)*mf, vy:rand(-1.6,-0.2)*mf, life:rand(6,13), r:rand(1.2,2.2)*mf});
  }
}
function playerHit(dmg){
  const p=Game.player; if(p.inv>0) return;
  if(p.shieldHP>0){ p.shieldHP-=dmg; if(p.shieldHP<0){ p.hp+=p.shieldHP; p.shieldHP=0; } p.shieldRegen=0; Sound.shieldHit(); Game.doFlash('#7ff',0.4); p.inv=20; Game.screenShake(5); }
  else { p.hp-=dmg; p.inv=50; p.shieldRegen=0; Sound.hullHit(); Game.doFlash('#f66',0.5); Game.screenShake(10); burst(p.x,p.y,'#f88',14,4); }
  /* ↑ v7: 本体被弾でも回復タイマーをリセット（戦闘中にシールドが復活し続ける抜け穴を修正） */
  if(p.hp<=0){ p.hp=0; playerDeath(); }
}
function playerDeath(){
  Sound.bigExplode(); Game.screenShake(24); Game.doFlash('#fff',0.9);
  for(let i=0;i<40;i++) burst(Game.player.x+rand(-14,14),Game.player.y+rand(-14,14),'#8cf',6,5);
  setTimeout(()=>{ if(Game.state===STATE.PLAY) Game.endRun(false); }, 900);
}

/* =========================================================================
   衝突判定
   ========================================================================= */
function collisions(){
  const p=Game.player;
  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i]; let hit=false;
    for(const e of Game.enemies){ if(e.dead) continue; if(circleHit(b,e)){ damageEnemy(e,b.dmg,b.x,b.y); hitSpark(b); hit=true; break; } }
    if(!hit && Game.boss && !Game.boss.dead && !Game.boss.entering){ if(circleHit(b,Game.boss)){ damageBoss(b.dmg,b.x,b.y); hitSpark(b); hit=true; } }
    if(hit) pBullets.splice(i,1);
  }
  if(!p) return;
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    if(dist2(b.x,b.y,p.x,p.y) < (b.r+p.r)*(b.r+p.r)){ playerHit(b.dmg); eBullets.splice(i,1); }
  }
  for(const e of Game.enemies){ if(e.dead) continue; if(circleHit(e,p)){ playerHit(Math.round(e.dmg*dmgScale())); damageEnemy(e,40,e.x,e.y); } }
  if(Game.boss && !Game.boss.entering && !Game.boss.dead){ if(circleHit(Game.boss,p)){ playerHit(Math.round(24*dmgScale())); } }
}

/* =========================================================================
   更新 (プレイ中)
   ========================================================================= */
function updatePlay(dt){
  Director.update(dt);
  if(Director.phase==='bossintro'){ Director.bossIntro-=dt; if(Director.bossIntro<=0){ spawnBoss(Director.stage); Director.phase='boss'; } }
  if(Director.phase==='transform'){ Director.transformT-=dt; if(Director.transformT<=0){ spawnGreatBoss(Game.lastBossX, Game.lastBossY); Director.phase='great'; } }

  updatePlayer(dt);
  for(let i=pBullets.length-1;i>=0;i--){ const b=pBullets[i];
    if(b.homing){ let best=null,bd=1e9; for(const e of Game.enemies){ if(e.dead)continue; const d=dist2(b.x,b.y,e.x,e.y); if(d<bd){bd=d;best=e;} } if(!best&&Game.boss&&!Game.boss.dead){best=Game.boss;} if(best){ const a=Math.atan2(best.y-b.y,best.x-b.x); const ca=Math.atan2(b.vy,b.vx); let na=ca+clamp(((a-ca+Math.PI*3)%TAU)-Math.PI,-b.turn,b.turn); b.vx=Math.cos(na)*b.speed; b.vy=Math.sin(na)*b.speed; } if(Math.random()<0.5) spawnParticle(b.x,b.y,'#f9e',{life:8,r:2});
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.y<-20||b.y>VH+20||b.x<-20||b.x>VW+20||b.life<=0) pBullets.splice(i,1);
  }
  for(let i=eBullets.length-1;i>=0;i--){ const b=eBullets[i];
    b.t+=dt;
    if(b.ax) b.vx+=b.ax*dt; if(b.ay) b.vy+=b.ay*dt;
    /* v13: 飛翔中に加速（上限2.2倍かつ絶対速度9px/f まで＝元々速い弾は伸びない） */
    if(b.acc && b.mult<b.accMax){
      const sp=Math.abs(b.vx)+Math.abs(b.vy);
      if(sp<11){ const f=1+b.acc*dt; b.vx*=f; b.vy*=f; b.mult*=f; }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.wave){ b.x += Math.sin(b.t*b.wave.f + b.wave.p)*b.wave.a*dt; }
    b.life-=dt;
    if(b.y<-40||b.y>VH+40||b.x<-40||b.x>VW+40||b.life<=0) eBullets.splice(i,1);
  }
  for(let i=Game.enemies.length-1;i>=0;i--){ const e=Game.enemies[i]; if(e.hitFlash>0)e.hitFlash-=dt; updateEnemy(e,dt); if(e.dead) Game.enemies.splice(i,1); }
  if(Game.boss) updateBoss(Game.boss,dt);
  updatePowerups(dt);
  updateParticles(dt); updateFloats(dt);
  collisions();
  updateStarfield(dt);
  if(Game.messageT>0) Game.messageT-=dt;
  if(Game.shake>0) Game.shake*=0.9;
  if(Game.flash>0) Game.flash-=0.03*dt;
}

/* =========================================================================
   背景 (パララックス星野 + グリッド)
   ========================================================================= */
function makeStarfield(){
  const layers=[];
  for(let l=0;l<3;l++){ const arr=[]; const n=[40,26,14][l]; for(let i=0;i<n;i++) arr.push({x:rand(0,VW),y:rand(0,VH),s:(l+1)*0.6+rand(0,0.5)}); layers.push({arr,speed:(l+1)*0.5}); }
  return {layers, grid:0};
}
function updateStarfield(dt){
  const bg=Game.bg; if(!bg) return;
  for(const L of bg.layers){ for(const s of L.arr){ s.y+=L.speed*dt; if(s.y>VH){ s.y=-2; s.x=rand(0,VW);} } }
  bg.grid=(bg.grid+0.6*dt)% 48;
}
function drawStarfield(){
  const bg=Game.bg; if(!bg) return;
  ctx.strokeStyle='rgba(80,140,220,0.06)'; ctx.lineWidth=1;
  for(let y=-48+bg.grid;y<VH;y+=48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(VW,y); ctx.stroke(); }
  for(let x=0;x<VW;x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,VH); ctx.stroke(); }
  const cols=['rgba(120,180,255,.5)','rgba(180,210,255,.8)','#dff'];
  bg.layers.forEach((L,li)=>{ ctx.fillStyle=cols[li]; for(const s of L.arr){ ctx.fillRect(s.x,s.y,s.s,s.s*2); } });
}

/* =========================================================================
   描画ヘルパー（ネオン図形）
   ========================================================================= */
function neonPoly(pts,color,fill,lw=2,glow=14){
  ctx.save(); ctx.shadowBlur=glow; ctx.shadowColor=color; ctx.lineWidth=lw; ctx.strokeStyle=color;
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); } ctx.stroke(); ctx.restore();
}
function neonCircle(x,y,r,color,lw=2,glow=14,fill){
  ctx.save(); ctx.shadowBlur=glow; ctx.shadowColor=color; ctx.strokeStyle=color; ctx.lineWidth=lw;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); if(fill){ctx.fillStyle=fill;ctx.fill();} ctx.stroke(); ctx.restore();
}
/* =========================================================================
   v10: 自機の機体グラフィック
   ・後退翼を持つ戦闘機シルエット（胴体／主翼／尾翼／キャノピー／双発エンジン）
   ・強化状況で機体が進化（武器Lv→翼端キャノン、装甲Lv→増加装甲）
   ・キャノピーとエネルギーラインは威力レベルの色で光る
   ・タイトル/エンディング画面とも共用
   ========================================================================= */
function drawShipBody(anim, accent, opt){
  opt = opt||{};
  const wl = opt.weapon||0, ar = opt.armor||0;
  const thrust = opt.thrust!==undefined?opt.thrust:1;
  const hull = opt.hull||'#dffbff', wing = opt.wing||'#bfefff', tail = opt.tail||'#7fd4ff';
  const flameC = opt.flame||'#4cf';

  /* --- エンジン炎（機体の後ろに描く） --- */
  const fl = (13 + Math.sin(anim*0.45)*3.2) * thrust;
  if(fl>0){
    for(const sx of [-4.6, 4.6]){
      const g=ctx.createLinearGradient(0,12,0,12+fl);
      g.addColorStop(0,'rgba(215,250,255,0.95)');
      g.addColorStop(0.4,'rgba(90,205,255,0.55)');
      g.addColorStop(1,'rgba(60,120,255,0)');
      ctx.save(); ctx.shadowBlur=16; ctx.shadowColor=flameC; ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(sx-2.9,11.5); ctx.lineTo(sx+2.9,11.5);
      ctx.quadraticCurveTo(sx+1.4, 12+fl*0.72, sx, 12+fl);
      ctx.quadraticCurveTo(sx-1.4, 12+fl*0.72, sx-2.9, 11.5);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  /* --- 尾翼（後退翼） --- */
  neonPoly([[-4.5,3],[-11,12],[-13,16.5],[-5.5,10]], tail,'rgba(40,140,220,0.20)',1.5,9);
  neonPoly([[ 4.5,3],[ 11,12],[ 13,16.5],[ 5.5,10]], tail,'rgba(40,140,220,0.20)',1.5,9);

  /* --- 主翼 --- */
  neonPoly([[-4,-5],[-15,3],[-17,9.5],[-5,5]], wing,'rgba(60,180,255,0.22)',1.8,12);
  neonPoly([[ 4,-5],[ 15,3],[ 17,9.5],[ 5,5]], wing,'rgba(60,180,255,0.22)',1.8,12);

  /* --- 翼端キャノン（武器レベルで増える） --- */
  if(wl>=2){
    for(const s of [-1,1]){
      ctx.save(); ctx.shadowBlur=10; ctx.shadowColor=accent; ctx.strokeStyle=accent; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(s*14.5,-1); ctx.lineTo(s*14.5,7); ctx.stroke();
      ctx.restore();
    }
  }
  if(wl>=4){
    for(const s of [-1,1]){
      ctx.save(); ctx.shadowBlur=10; ctx.shadowColor=accent; ctx.strokeStyle=accent; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(s*9.5,-3); ctx.lineTo(s*9.5,5); ctx.stroke();
      ctx.restore();
    }
  }
  if(wl>=6){
    for(const s of [-1,1]){
      ctx.save(); ctx.shadowBlur=16; ctx.shadowColor=accent; ctx.fillStyle=accent;
      ctx.beginPath(); ctx.arc(s*16,8,2.4,0,TAU); ctx.fill(); ctx.restore();
    }
  }

  /* --- 胴体 --- */
  neonPoly([[0,-19],[4.5,-6],[6,8],[3.5,13],[-3.5,13],[-6,8],[-4.5,-6]], hull,'rgba(80,190,255,0.28)',2,16);

  /* --- 増加装甲（装甲レベルで厚くなる） --- */
  if(ar>=2){
    ctx.save(); ctx.shadowBlur=8; ctx.shadowColor='#9fd8ff'; ctx.strokeStyle='#9fd8ff'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(-3.4,-3); ctx.lineTo(-4.6,7); ctx.moveTo(3.4,-3); ctx.lineTo(4.6,7); ctx.stroke();
    ctx.restore();
  }
  if(ar>=4){
    neonPoly([[-6,-2],[-8.6,1],[-8,7],[-5.6,6]], '#9fd8ff','rgba(120,200,255,0.25)',1.3,8);
    neonPoly([[ 6,-2],[ 8.6,1],[ 8,7],[ 5.6,6]], '#9fd8ff','rgba(120,200,255,0.25)',1.3,8);
  }

  /* --- 機首のエネルギーライン --- */
  ctx.save(); ctx.shadowBlur=12; ctx.shadowColor=accent; ctx.strokeStyle=accent; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(0,-17); ctx.lineTo(0,-11); ctx.stroke(); ctx.restore();

  /* --- キャノピー（威力レベルの色で脈動） --- */
  const cp = 0.75+0.25*Math.sin(anim*0.09);
  ctx.save(); ctx.shadowBlur=14*cp; ctx.shadowColor=accent; ctx.fillStyle=accent; ctx.globalAlpha=0.55+0.35*cp;
  ctx.beginPath(); ctx.ellipse(0,-8.5,2.6,5.2,0,0,TAU); ctx.fill();
  ctx.globalAlpha=1; ctx.fillStyle='#ffffff'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.ellipse(0,-9.5,1.1,2.2,0,0,TAU); ctx.fill();
  ctx.restore();

  /* --- エンジンノズルの光 --- */
  ctx.save(); ctx.shadowBlur=14; ctx.shadowColor=flameC; ctx.fillStyle='#bfefff';
  ctx.beginPath(); ctx.arc(-4.6,12,2.1,0,TAU); ctx.arc(4.6,12,2.1,0,TAU); ctx.fill(); ctx.restore();
  ctx.shadowBlur=0;
}

/* シールド: 回転する六角バリア */
function drawShieldBarrier(p){
  const a=clamp(p.shieldHP/p.shieldMax,0,1), r=25;
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Game.t*0.012);
  ctx.shadowBlur=16; ctx.shadowColor='#7ff'; ctx.strokeStyle='#7ff'; ctx.lineWidth=2;
  ctx.globalAlpha=0.25+0.45*a;
  ctx.beginPath();
  for(let i=0;i<6;i++){ const ang=i/6*TAU; const x=Math.cos(ang)*r, y=Math.sin(ang)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); ctx.stroke();
  ctx.globalAlpha=0.12*a; ctx.fillStyle='#7ff'; ctx.fill();
  ctx.globalAlpha=0.55*a; ctx.fillStyle='#cff';
  for(let i=0;i<6;i++){ const ang=i/6*TAU; ctx.beginPath(); ctx.arc(Math.cos(ang)*r,Math.sin(ang)*r,2.2,0,TAU); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function drawPlayer(){
  const p=Game.player; if(!p) return;
  const blink = p.inv>0 && Math.floor(p.inv/4)%2===0;
  const accent = BULLET_TIERS[p.tier!==undefined?p.tier:bulletTier()].c;

  if(!blink){
    if(p.shieldHP>0) drawShieldBarrier(p);
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.bank||0);
    drawShipBody(Game.t, accent, {
      weapon:p.st.weapon, armor:upLevel('hp'),
      thrust: 1 + clamp(Math.abs(p.bank||0)*1.2, 0, 0.5)
    });
    /* 砲口の閃光（威力レベルで大きくなる） */
    if(p.muzzle>0){
      const tt=p.tier||0, T=BULLET_TIERS[tt];
      ctx.globalAlpha=clamp(p.muzzle,0,1)*0.85;
      ctx.shadowBlur=T.glow; ctx.shadowColor=T.c; ctx.fillStyle=T.core;
      ctx.beginPath(); ctx.ellipse(0,-20, 2.5+tt*0.85, 5+tt*1.5, 0,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.restore(); ctx.shadowBlur=0;
  }
  /* ウイングマン: 本機のミニチュア版 */
  for(const w of Game.wingmen){
    ctx.save(); ctx.translate(w.x,w.y); ctx.scale(0.58,0.58);
    drawShipBody(Game.t+w.side*4, '#9fffd0', {
      weapon:0, armor:0, thrust:0.85,
      hull:'#c9ffe4', wing:'#8fe8b8', tail:'#6fd0a0', flame:'#5fd'
    });
    ctx.restore();
  }
  ctx.shadowBlur=0;
}
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  const c = e.hitFlash>0?'#fff':e.color;
  ctx.rotate(e.angle);
  switch(e.kind){
    case 'grunt': neonPoly([[0,10],[10,-8],[0,-3],[-10,-8]],c,'rgba(80,180,255,0.15)',2,12); break;
    case 'weaver': neonPoly([[0,-11],[9,0],[0,11],[-9,0]],c,'rgba(80,255,220,0.15)',2,12); break;
    case 'turret': neonPoly([[-12,-8],[12,-8],[8,10],[-8,10]],c,'rgba(120,160,255,0.15)',2,12); ctx.strokeStyle=c;ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.stroke(); break;
    case 'bomber': { neonCircle(0,0,e.r,c,2,14); neonPoly([[-8,-6],[8,-6],[0,10]],c,null,1.5,8); break; }
    case 'kamikaze': neonPoly([[0,12],[9,-9],[-9,-9]],c,'rgba(255,130,90,0.2)',2,14); break;
    case 'splitter': { ctx.shadowBlur=14;ctx.shadowColor=c;ctx.strokeStyle=c;ctx.lineWidth=2; ctx.beginPath(); for(let i=0;i<6;i++){const a=i/6*TAU+e.t*0.02;const x=Math.cos(a)*e.r,y=Math.sin(a)*e.r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke(); break; }
    case 'mini': neonPoly([[0,7],[6,-5],[-6,-5]],c,null,1.5,8); break;
    case 'shield': { neonCircle(0,0,e.r,c,2.5,16); ctx.globalAlpha=0.5; neonCircle(0,0,e.r+5,c,1.5,8); ctx.globalAlpha=1; neonPoly([[-7,-4],[7,-4],[0,9]],c,null,1.5,6); break; }
    case 'mine': { ctx.shadowBlur=14;ctx.shadowColor=c;ctx.strokeStyle=c;ctx.lineWidth=2; for(let i=0;i<8;i++){const a=i/8*TAU;ctx.beginPath();ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r);ctx.stroke();} ctx.beginPath();ctx.arc(0,0,5,0,TAU);ctx.stroke(); break; }
    case 'sniper': {
      neonPoly([[0,-15],[7,0],[0,15],[-7,0]],c,'rgba(255,120,255,0.15)',2,12);
      if(e.charging){ const g=0.5+0.5*Math.sin(e.t*0.5); ctx.globalAlpha=g; neonCircle(0,0,e.r+5,'#fff',1.5,18); ctx.globalAlpha=1; }
      break;
    }
    case 'orbiter': { neonCircle(0,0,e.r-3,c,2,12); for(let i=0;i<3;i++){ const a=e.t*0.1+i/3*TAU; ctx.fillStyle=c; ctx.shadowBlur=8; ctx.shadowColor=c; ctx.beginPath(); ctx.arc(Math.cos(a)*(e.r+3),Math.sin(a)*(e.r+3),2.5,0,TAU); ctx.fill(); } break; }
    case 'carrier': {
      neonPoly([[-22,-10],[22,-10],[26,4],[14,12],[-14,12],[-26,4]],c,'rgba(255,170,100,0.12)',2,14);
      ctx.strokeStyle=c; ctx.lineWidth=1.5; ctx.strokeRect(-10,-3,20,8);
      break;
    }
    case 'dasher': {
      const dir = e.vx>=0?1:-1;
      neonPoly([[12*dir,0],[-10*dir,-8],[-4*dir,0],[-10*dir,8]],c,'rgba(110,230,255,0.15)',2,12);
      break;
    }
  }
  ctx.restore(); ctx.shadowBlur=0;
  if(e.maxHp>60 && e.hp<e.maxHp){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(e.x-14,e.y-e.r-8,28,3); ctx.fillStyle=e.color; ctx.fillRect(e.x-14,e.y-e.r-8,28*(e.hp/e.maxHp),3); }
}

/* ---- ボス描画（個体別デザイン） ---- */
function drawBoss(b){
  const flash=b.hitFlash>0;
  ctx.save(); ctx.translate(b.x,b.y);
  const R=b.r;
  if(b.id==='mid0'){ /* RAZOR: 双刃 */
    const c=flash?'#fff':'#7ef';
    neonPoly([[-R*1.2,0],[-R*0.5,-R*0.55],[R*0.5,-R*0.55],[R*1.2,0],[R*0.5,R*0.55],[-R*0.5,R*0.55]],c,'rgba(120,240,255,0.10)',2.5,16);
    for(const s of [-1,1]){
      ctx.save(); ctx.translate(s*R*1.05,0); ctx.rotate(b.spin*6*s);
      neonPoly([[0,-16],[14,0],[0,16],[-14,0]],c,'rgba(120,240,255,0.2)',2,12);
      ctx.restore();
    }
    neonCircle(0,0,R*0.32,flash?'#fff':'#39f',2,18,'rgba(60,150,255,0.5)');
  }
  else if(b.id==='mid1'){ /* PHANTOM: 残像ダイヤ */
    const c=flash?'#fff':'#c9f';
    for(let g=2;g>=0;g--){
      const off=(b.tx-b.x)*0.12*g;
      ctx.globalAlpha = g===0?1:0.22;
      neonPoly([[0-off,-R],[R*0.75-off,0],[0-off,R],[-R*0.75-off,0]],c,g===0?'rgba(190,130,255,0.12)':null,2.5,g===0?18:8);
    }
    ctx.globalAlpha=1;
    neonCircle(0,0,R*0.3,flash?'#fff':'#f6f',2,20,'rgba(255,80,220,0.45)');
  }
  else if(b.id==='mid2'){ /* WARDEN: 回転二重スクエア */
    const c=flash?'#fff':'#fd9';
    ctx.save(); ctx.rotate(b.spin*2);
    neonPoly([[-R,-R*0.7],[R,-R*0.7],[R,R*0.7],[-R,R*0.7]],c,'rgba(255,210,140,0.08)',2.5,14);
    ctx.restore();
    ctx.save(); ctx.rotate(-b.spin*3);
    neonPoly([[0,-R*0.75],[R*0.75,0],[0,R*0.75],[-R*0.75,0]],c,null,2,10);
    ctx.restore();
    for(let i=0;i<4;i++){ const a=i/4*TAU+Math.PI/4+b.spin*2; neonCircle(Math.cos(a)*R*0.95,Math.sin(a)*R*0.95,7,c,2,10,'rgba(255,200,120,0.3)'); }
    neonCircle(0,0,R*0.3,flash?'#fff':'#f83',2,18,'rgba(255,130,50,0.5)');
  }
  else if(b.id==='boss0'){ /* AZURE CRUSHER: 蟹型 */
    const c=flash?'#fff':'#6cf';
    neonPoly([[-R,-R*0.25],[-R*0.55,-R*0.62],[R*0.55,-R*0.62],[R,-R*0.25],[R*0.8,R*0.5],[0,R*0.72],[-R*0.8,R*0.5]],c,'rgba(90,190,255,0.10)',3,18);
    const open = 0.35+0.3*Math.sin(b.anim*0.06);
    for(const s of [-1,1]){
      ctx.save(); ctx.translate(s*R*1.12, R*0.1);
      ctx.rotate(s*0.25);
      neonPoly([[0,-8],[s*26,-14],[s*34,0],[s*26,14],[0,8]],c,'rgba(90,190,255,0.14)',2.5,12);
      ctx.save(); ctx.rotate(-s*open); neonPoly([[s*30,-4],[s*52,-16],[s*44,-2]],c,null,2,10); ctx.restore();
      ctx.save(); ctx.rotate(s*open);  neonPoly([[s*30,4],[s*52,16],[s*44,2]],c,null,2,10); ctx.restore();
      ctx.restore();
    }
    for(let i=0;i<2;i++){ neonCircle((i?1:-1)*R*0.34,-R*0.28,6,flash?'#fff':'#bff',2,12,'rgba(160,240,255,0.6)'); }
    neonCircle(0,R*0.08,R*0.3,flash?'#fff':'#39f',2.5,20,'rgba(50,140,255,0.5)');
  }
  else if(b.id==='boss1'){ /* CRIMSON MOTH: 蛾型 */
    const c=flash?'#fff':'#f6c';
    const flap = 0.7+0.3*Math.sin(b.anim*0.07);
    for(const s of [-1,1]){
      ctx.save(); ctx.scale(s*flap,1);
      neonPoly([[R*0.15,-R*0.1],[R*1.35,-R*0.75],[R*1.5,-R*0.15],[R*1.15,R*0.45],[R*0.4,R*0.5],[R*0.15,R*0.2]],c,'rgba(255,100,190,0.10)',2.5,16);
      neonPoly([[R*0.5,-R*0.3],[R*1.05,-R*0.5],[R*1.0,-R*0.1]],flash?'#fff':'#b3f',null,1.5,8);
      neonCircle(R*0.95,R*0.12,6,flash?'#fff':'#b3f',1.5,10,'rgba(180,80,255,0.35)');
      ctx.restore();
    }
    for(let i=0;i<3;i++){ neonCircle(0,-R*0.35+i*R*0.34,R*0.2-i*2,c,2,14,'rgba(255,110,200,0.25)'); }
    for(const s of [-1,1]){ ctx.strokeStyle=c; ctx.shadowBlur=8; ctx.shadowColor=c; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,-R*0.5); ctx.quadraticCurveTo(s*R*0.35,-R*0.95, s*R*0.5,-R*1.05); ctx.stroke(); }
    neonCircle(0,0,R*0.16,flash?'#fff':'#ff3a7a',2,18,'rgba(255,60,120,0.6)');
  }
  else if(b.id==='boss2'){ /* GOLD SENTINEL: 六角要塞 */
    const c=flash?'#fff':'#fd6';
    ctx.save(); ctx.rotate(b.spin*1.6);
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; const x=Math.cos(a)*R, y=Math.sin(a)*R; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath();
    ctx.shadowBlur=18; ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=3; ctx.fillStyle='rgba(255,210,100,0.08)'; ctx.fill(); ctx.stroke();
    for(let i=0;i<6;i++){ const a=i/6*TAU; neonCircle(Math.cos(a)*R,Math.sin(a)*R,8,c,2,10,'rgba(255,210,100,0.3)'); }
    ctx.restore();
    ctx.save(); ctx.rotate(-b.spin*2.4);
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU+Math.PI/6; const x=Math.cos(a)*R*0.6, y=Math.sin(a)*R*0.6; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath();
    ctx.shadowBlur=10; ctx.shadowColor=c; ctx.strokeStyle=flash?'#fff':'#f83'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
    neonCircle(0,0,R*0.3,flash?'#fff':'#f83',2.5,20,'rgba(255,130,50,0.5)');
  }
  else { /* GREAT: OMEGA CORE */
    const c=flash?'#fff':'#ffcf5a';
    ctx.save(); ctx.rotate(b.spin);
    ctx.shadowBlur=20; ctx.shadowColor=c; ctx.strokeStyle=c; ctx.lineWidth=3;
    b.parts.forEach((pt)=>{ if(!pt.alive) return; const a0=pt.a-0.28, a1=pt.a+0.28;
      ctx.beginPath(); ctx.arc(0,0,R,a0,a1); ctx.arc(0,0,R*0.66,a1,a0,true); ctx.closePath();
      ctx.globalAlpha=0.9; ctx.stroke(); ctx.fillStyle='rgba(255,200,90,0.10)'; ctx.fill(); ctx.globalAlpha=1; });
    ctx.restore();
    ctx.save(); ctx.rotate(-b.spin*1.5);
    ctx.shadowBlur=12; ctx.shadowColor='#fd6'; ctx.strokeStyle='#ffe'; ctx.lineWidth=2;
    for(let i=0;i<8;i++){ const a=i/8*TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a)*R*0.75,Math.sin(a)*R*0.75); ctx.lineTo(Math.cos(a)*R*1.3,Math.sin(a)*R*1.3); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.rotate(b.spin*2.2);
    ctx.beginPath(); for(let i=0;i<6;i++){ const a=i/6*TAU; const x=Math.cos(a)*R*0.5,y=Math.sin(a)*R*0.5; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath();
    ctx.shadowBlur=10; ctx.shadowColor='#f83'; ctx.strokeStyle=flash?'#fff':'#f83'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
    for(let i=0;i<4;i++){ const a=b.anim*0.03+i/4*TAU; neonCircle(Math.cos(a)*R*1.05,Math.sin(a)*R*1.05,7,flash?'#fff':'#ff8a5a',2,12,'rgba(255,120,70,0.45)'); }
    const coreR=R*0.36*(1+Math.sin(b.anim*0.1)*0.08);
    neonCircle(0,0,coreR,flash?'#fff':'#ff3a3a',2.5,26,'rgba(255,60,50,0.75)');
  }

  /* 共通: 装甲パネル（GREAT以外は薄く重ねる） */
  if(!b.isGreat){
    ctx.save(); ctx.rotate(b.spin);
    ctx.globalAlpha=0.32; ctx.shadowBlur=6; const pc=flash?'#fff':'#f9c'; ctx.shadowColor=pc; ctx.strokeStyle=pc; ctx.lineWidth=2;
    b.parts.forEach((pt)=>{ if(!pt.alive) return; const a0=pt.a-0.26, a1=pt.a+0.26;
      ctx.beginPath(); ctx.arc(0,0,R+9,a0,a1); ctx.stroke(); });

  }

}

function addBtn(x,y,w,h,id){ Game.buttons.push({x,y,w,h,id}); }
function drawButton(x,y,w,h,label,active=true,accent='#6cf'){
  ctx.save();

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* --- 星雲（タイトル/エンディング共用の背景演出） --- */
function drawNebula(){
  const T=Game.t;

    [VW*0.25+Math.sin(T*0.004)*30, 180+Math.cos(T*0.003)*20, 190,'rgba(40,90,200,0.12)'],
    [VW*0.78+Math.cos(T*0.0035)*26, 330+Math.sin(T*0.0042)*24, 160,'rgba(150,40,160,0.10)'],
    [VW*0.5+Math.sin(T*0.0028)*20, 610+Math.cos(T*0.0036)*30, 210,'rgba(30,140,160,0.09)'],
  ];
  for(const bl of blobs){

    ctx.fillStyle=g; ctx.fillRect(bl[0]-bl[2],bl[1]-bl[2],bl[2]*2,bl[2]*2);
  }
}

/* --- プレイ画面ワールド --- */
function drawWorld(){
  const pal = STAGES[Game.stageIndex]?STAGES[Game.stageIndex].pal:STAGES[0].pal;
  const grd=ctx.createLinearGradient(0,0,0,VH); grd.addColorStop(0, pal.bg); grd.addColorStop(1,'#05060f');
  ctx.fillStyle=grd; ctx.fillRect(0,0,VW,VH);
  drawStarfield();
  for(const pu of powerups) drawPowerup(pu);
  for(const b of eBullets){ ctx.save(); ctx.shadowBlur=10; ctx.shadowColor=b.color; ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.restore(); }
  for(const b of pBullets){
    if(b.type==='missile'){
      ctx.save(); ctx.shadowBlur=12; ctx.shadowColor=b.color; ctx.fillStyle=b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.restore();
    } else {
      const T=BULLET_TIERS[b.tier||0];
      const ang=Math.atan2(b.vy,b.vx);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(ang+Math.PI/2);
      if(T.halo>0){ ctx.globalAlpha=0.3*T.halo; ctx.shadowBlur=T.glow*1.3; ctx.shadowColor='#b58cff'; ctx.fillStyle='#b58cff';
        bulletShape(T.w*1.95,T.len*1.12); ctx.fill(); ctx.globalAlpha=1; }
      ctx.shadowBlur=T.glow; ctx.shadowColor=b.color; ctx.fillStyle=b.color;
      bulletShape(T.w,T.len); ctx.fill();
      ctx.shadowBlur=T.glow*0.5; ctx.shadowColor=T.core; ctx.fillStyle=T.core;
      bulletShape(T.w*0.42,T.len*0.72); ctx.fill();
      ctx.restore();
    }
  }
  ctx.shadowBlur=0;
  for(const e of Game.enemies) drawEnemy(e);
  if(Game.boss && !Game.boss.dead) drawBoss(Game.boss);
  drawParticles();
  drawPlayer();
  drawFloats();
  drawHUD();
  if(Game.messageT>0 && Game.message){ const a=clamp(Game.messageT/40,0,1); ctx.globalAlpha=Math.min(1,a);
    ctx.textAlign='center'; ctx.shadowBlur=20; ctx.shadowColor='#6cf';
    ctx.fillStyle='#eaffff'; ctx.font='bold 34px system-ui'; ctx.fillText(Game.message.a, VW/2, VH/2-10);
    ctx.fillStyle='#ffd76a'; ctx.font='16px system-ui'; ctx.fillText(Game.message.b, VW/2, VH/2+22);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(Director.phase==='bossintro'){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,80,120,'+(0.3+0.3*Math.sin(Game.t*0.2))+')'; ctx.font='bold 40px system-ui'; ctx.fillText('WARNING', VW/2, VH/2); }
  if(Director.phase==='transform'){ ctx.fillStyle='rgba(255,215,100,'+(0.4+0.4*Math.sin(Game.t*0.3))+')'; ctx.textAlign='center'; ctx.font='bold 30px system-ui'; ctx.fillText('FINAL FORM INCOMING...', VW/2, VH/2); }
}

/* =========================================================================
   メインループ
   ========================================================================= */
function loop(ts){
  const raw=(ts-Game.last)/16.67; Game.last=ts;
  Game.dt = clamp(raw,0.1,2.5); Game.t += Game.dt;
  Sound.ensure(); Music.tick();

  if(Game.state===STATE.PLAY){ updatePlay(Game.dt); }
  else {
    updateStarfield(Game.dt); updateParticles(Game.dt); updateFloats(Game.dt);
    if(Game.state===STATE.WIN) Game.winT=(Game.winT||0)+Game.dt;
    if(Game.flash>0) Game.flash-=0.03*Game.dt; if(Game.shake>0) Game.shake*=0.9;
  }

  const dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.save();
  if(Game.shake>0.4){ ctx.translate(rand(-Game.shake,Game.shake), rand(-Game.shake,Game.shake)); }

  switch(Game.state){
    case STATE.TITLE: drawBackdrop(); drawTitle(); break;
    case STATE.HOWTO: drawBackdrop(); drawHowto(); break;
    case STATE.HANGAR: drawBackdrop(); drawHangar(); break;
    case STATE.PLAY: drawWorld(); break;
    case STATE.PAUSE: drawPause(); break;
    case STATE.OVER: drawOver(); break;
    case STATE.WIN: drawWin(); break;
  }
  ctx.restore();
  if(Game.flash>0){ ctx.globalAlpha=clamp(Game.flash,0,1); ctx.fillStyle=Game.flashColor; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }

  requestAnimationFrame(loop);
}
function drawBackdrop(){ const grd=ctx.createLinearGradient(0,0,0,VH); grd.addColorStop(0,'#050a18'); grd.addColorStop(1,'#05060f'); ctx.fillStyle=grd; ctx.fillRect(0,0,VW,VH); }

/* v11: バックグラウンド復帰時に音を確実に戻す（スマホでの無音対策） */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    Sound.resume();
    if(!Sound.muted && Music.name && (!Music.cur || Music.cur.paused)) Music.play(Music.name);
  } else {
    Music.stopAll();   // 裏に回ったら全部止めて、戻った時の重なりを防ぐ
  }
});

/* ---------------- 起動 ---------------- */
Game.start();
</script>
