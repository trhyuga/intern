/* --- プレイ画面ワールド --- */
function drawWorld(){
  const pal = STAGES[Game.stageIndex]?STAGES[Game.stageIndex].pal:STAGES[0].pal;
  const grd=ctx.createLinearGradient(0,0,0,VH); grd.addColorStop(0, pal.bg); grd.addColorStop(1,'#05060f');
  ctx.fillStyle=grd; ctx.fillRect(0,0,VW,VH);
  drawStarfield();
  for(const pu of powerups) drawPowerup(pu);
  for(const b of pBullets){
    if(b.type==='missile'){
      ctx.save(); ctx.shadowBlur=12; ctx.shadowColor=b.color; ctx.fillStyle=b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); ctx.restore();
    } else {
      const T=BULLET_TIERS[b.tier||0];
      const ang=Math.atan2(b.vy,b.vx);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(ang+Math.PI/2);
      if(T.halo>0){ ctx.globalAlpha=0.3*T.halo; ctx.shadowBlur=T.glow*1.3; ctx.shadowColor='#b58cff'; ctx.fillStyle='#b58cff';
        bulletShape(T.w*1.95,T.len*1.12); ctx.fill(); ctx.globalAlpha=1; }
      ctx.shadowBlur=T.glow; ctx.shadowColor=b.color; ctx.fillStyle=b.color;
      bulletShape(T.w,T.len); ctx.fill();
      ctx.shadowBlur=T.glow*0.5; ctx.shadowColor=T.core; ctx.fillStyle=T.core;
      bulletShape(T.w*0.42,T.len*0.72); ctx.fill();
      ctx.restore();
    }
  }
  ctx.shadowBlur=0;
  drawWingBeams();
  for(const e of Game.enemies) drawEnemy(e);
  for(const h of Game.helpers) drawBossMaybeDying(h);
  drawBossMaybeDying(Game.boss);
  drawParticles();
  drawDebris();
  drawShocks();
  /* v19: 敵弾は常に最前面。装飾はステージが進むほど段階的に足す
     ステージ1=素の発光 / ステージ2=＋暗い縁取り / ステージ3=＋白いハイライト */
  {
    const st=Game.stageIndex;
    for(const b of eBullets){
      ctx.save();
      if(st>=1){
        ctx.globalAlpha=0.85; ctx.fillStyle='#180008';
        ctx.beginPath(); ctx.arc(b.x,b.y,b.r+2.2,0,TAU); ctx.fill();
        ctx.globalAlpha=1;
      }
      ctx.shadowBlur=12; ctx.shadowColor=b.color; ctx.fillStyle=b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
      if(st>=2){
        ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.75)';
        ctx.beginPath(); ctx.arc(b.x-b.r*0.28, b.y-b.r*0.28, b.r*0.34, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }
  drawPlayer();
  drawFloats();
  drawHUD();
  if(Game.messageT>0 && Game.message){ const a=clamp(Game.messageT/40,0,1); ctx.globalAlpha=Math.min(1,a);
    ctx.textAlign='center'; ctx.shadowBlur=20; ctx.shadowColor='#6cf';
    ctx.fillStyle='#eaffff'; ctx.font='bold 34px system-ui'; ctx.fillText(Game.message.a, VW/2, VH/2-10);
    ctx.fillStyle='#ffd76a'; ctx.font='16px system-ui'; ctx.fillText(Game.message.b, VW/2, VH/2+22);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(Director.phase==='bossintro' && !Game.cine){ ctx.textAlign='center'; ctx.fillStyle='rgba(255,80,120,'+(0.3+0.3*Math.sin(Game.t*0.2))+')'; ctx.font='bold 40px system-ui'; ctx.fillText('WARNING', VW/2, VH/2); }
  if(Director.phase==='transform' && !Game.cine){ ctx.fillStyle='rgba(255,215,100,'+(0.4+0.4*Math.sin(Game.t*0.3))+')'; ctx.textAlign='center'; ctx.font='bold 30px system-ui'; ctx.fillText('FINAL FORM INCOMING...', VW/2, VH/2); }
  drawCinematic();
}

/* =========================================================================
   v23: 登場カットイン描画
   stage = ステージ開幕 / boss = ステージボス / final = ラスボス / od = 変身
   ========================================================================= */
function letterbox(a){
  if(a<=0) return;
  const h=Math.round(64*a);
  ctx.fillStyle='rgba(3,5,12,0.92)';
  ctx.fillRect(0,0,VW,h); ctx.fillRect(0,VH-h,VW,h);
  ctx.strokeStyle='rgba(140,200,255,'+(0.45*a).toFixed(2)+')'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(VW,h); ctx.moveTo(0,VH-h); ctx.lineTo(VW,VH-h); ctx.stroke();
}
/* 斜めの警告ストライプ帯 */
function hazardBand(y, h, scroll, c1, c2, alpha){
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.rect(0,y,VW,h); ctx.clip();
  ctx.fillStyle=c1; ctx.fillRect(0,y,VW,h);
  ctx.fillStyle=c2;
  const w=22, off=((scroll%(w*2))+w*2)%(w*2);
  for(let x=-h-w*2; x<VW+w*2; x+=w*2){
    ctx.beginPath();
    ctx.moveTo(x+off, y+h); ctx.lineTo(x+off+h, y);
    ctx.lineTo(x+off+h+w, y); ctx.lineTo(x+off+w, y+h);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawCinematic(){
  const c=Game.cine; if(!c) return;
  const T=c.t, D=c.dur, P=clamp(T/D,0,1);
  /* 出入りのフェード */
  const inA  = clamp(T/14,0,1);
  const outA = clamp((D-T)/22,0,1);
  const A = Math.min(inA,outA);
  ctx.save(); ctx.textAlign='center';

  if(c.type==='stage'){
    const pal = STAGES[Game.stageIndex]?STAGES[Game.stageIndex].pal:STAGES[0].pal;
    const col = [ '#7fe6ff', '#ff9bea', '#ffd76a' ][Game.stageIndex] || '#7fe6ff';
    letterbox(A);
    /* 中央を横切る光のバンド（左右から開く） */
    const bh = 118*A;
    const g=ctx.createLinearGradient(0,VH/2-bh/2,0,VH/2+bh/2);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.5,'rgba(8,16,34,0.82)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,VH/2-bh/2,VW,bh);
    /* 走るライン */
    for(const s of [-1,1]){
      const lw = VW*clamp(T/18,0,1)*A;
      ctx.globalAlpha=0.9*A; ctx.strokeStyle=col; ctx.lineWidth=2; ctx.shadowBlur=14; ctx.shadowColor=col;
      const yy = VH/2 + s*54;
      ctx.beginPath(); ctx.moveTo(VW/2 - lw/2, yy); ctx.lineTo(VW/2 + lw/2, yy); ctx.stroke();
    }
    ctx.shadowBlur=0;
    /* 流れるシェブロン */
    ctx.globalAlpha=0.22*A; ctx.strokeStyle=col; ctx.lineWidth=3;
    for(let i=0;i<7;i++){
      const x=((T*3 + i*80)%(VW+120))-60;
      ctx.beginPath(); ctx.moveTo(x,VH/2-22); ctx.lineTo(x+16,VH/2); ctx.lineTo(x,VH/2+22); ctx.stroke();
    }
    ctx.globalAlpha=1;
    /* STAGE 番号: オーバーシュートしながら拡大 */
    const e = T<26 ? 1.9-0.9*(T/26) : 1 + Math.sin((T-26)*0.08)*0.012;
    ctx.save(); ctx.translate(VW/2, VH/2-4); ctx.scale(e,e); ctx.globalAlpha=A;
    ctx.shadowBlur=28; ctx.shadowColor=col; ctx.fillStyle='#f2ffff';
    ctx.font='bold 42px system-ui'; ctx.fillText(c.a, 0, 0);
    ctx.shadowBlur=0; ctx.globalAlpha=0.35*A; ctx.lineWidth=1; ctx.strokeStyle=col; ctx.strokeText(c.a,0,0);
    ctx.restore(); ctx.globalAlpha=1;
    /* サブタイトル: ワイプで出す */
    if(T>22){
      const w=clamp((T-22)/26,0,1);
      ctx.save(); ctx.beginPath(); ctx.rect(VW/2-160*w, VH/2+14, 320*w, 40); ctx.clip();
      ctx.globalAlpha=A; ctx.fillStyle=col; ctx.font='bold 17px system-ui';
      ctx.shadowBlur=12; ctx.shadowColor=col;
      ctx.fillText(c.b, VW/2, VH/2+42); ctx.restore();
    }
    ctx.globalAlpha=A*0.7; ctx.fillStyle='#8fb6d8'; ctx.font='11px system-ui'; ctx.shadowBlur=0;
    ctx.fillText('MISSION START', VW/2, VH/2+72);
  }

  else if(c.type==='boss'){
    /* 赤い警告ビネット */
    const puls=0.45+0.55*Math.abs(Math.sin(T*0.13));
    const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.22,VW/2,VH/2,VH*0.62);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(220,30,60,'+(0.34*puls*A).toFixed(2)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
    letterbox(A*0.9);
    hazardBand(VH/2-64, 20, T*2.4, '#1a0308', 'rgba(255,80,110,0.85)', 0.85*A);
    hazardBand(VH/2+46, 20, -T*2.4, '#1a0308', 'rgba(255,80,110,0.85)', 0.85*A);
    /* WARNING 点滅 */
    if(T<58){
      const bl = Math.floor(T/7)%2===0 ? 1 : 0.18;
      ctx.globalAlpha=A*bl; ctx.shadowBlur=26; ctx.shadowColor='#f45';
      ctx.fillStyle='#ffd7de'; ctx.font='bold 40px system-ui';
      ctx.fillText('WARNING', VW/2, VH/2-4);
      ctx.shadowBlur=0; ctx.globalAlpha=A*bl*0.8; ctx.fillStyle='#ff8fa8'; ctx.font='12px system-ui';
      ctx.fillText('LARGE ENERGY SIGNATURE DETECTED', VW/2, VH/2+24);
    } else {
      /* ネームプレートが左からスライドイン */
      const s=clamp((T-58)/16,0,1), ease=1-Math.pow(1-s,3);
      const px=-VW + VW*ease;
      ctx.save(); ctx.translate(px,0);
      ctx.globalAlpha=A;
      const grd=ctx.createLinearGradient(0,VH/2-40,VW,VH/2-40);
      grd.addColorStop(0,'rgba(150,10,40,0.0)'); grd.addColorStop(0.25,'rgba(150,10,40,0.85)');
      grd.addColorStop(0.85,'rgba(60,4,18,0.85)'); grd.addColorStop(1,'rgba(60,4,18,0)');
      ctx.fillStyle=grd; ctx.fillRect(0,VH/2-42,VW,84);
      ctx.strokeStyle='rgba(255,110,140,0.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,VH/2-42); ctx.lineTo(VW,VH/2-42); ctx.moveTo(0,VH/2+42); ctx.lineTo(VW,VH/2+42); ctx.stroke();
      ctx.fillStyle='#ff8fa8'; ctx.font='bold 13px system-ui'; ctx.fillText('◆ '+c.a+' ◆', VW/2, VH/2-16);
      ctx.shadowBlur=20; ctx.shadowColor='#f45'; ctx.fillStyle='#fff0f3'; ctx.font='bold 26px system-ui';
      ctx.fillText(c.b, VW/2, VH/2+18);
      ctx.restore(); ctx.shadowBlur=0;
    }
  }

  else if(c.type==='final'){
    /* 暗転 → 亀裂 → 巨大ロゴ */
    const dark = clamp(T/12,0,1) * (T>D-30 ? clamp((D-T)/30,0,1) : 1);
    ctx.fillStyle='rgba(2,0,6,'+(0.80*dark).toFixed(2)+')'; ctx.fillRect(0,0,VW,VH);
    /* 赤い脈動リング */
    for(let i=0;i<3;i++){
      const rt=((T*4 + i*70)%210)/210;
      ctx.globalAlpha=(1-rt)*0.5*A; ctx.strokeStyle='#ff3355'; ctx.lineWidth=3;
      ctx.shadowBlur=24; ctx.shadowColor='#f04';
      ctx.beginPath(); ctx.arc(VW/2, VH*0.3, 30+rt*330, 0, TAU); ctx.stroke();
    }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    /* 稲妻の亀裂 */
    if(T>18 && T<120){
      ctx.globalAlpha=(0.35+0.5*Math.abs(Math.sin(T*0.4)))*A;
      ctx.strokeStyle='#ffd76a'; ctx.lineWidth=1.6; ctx.shadowBlur=16; ctx.shadowColor='#fd6';
      for(let i=0;i<5;i++){
        const bx=VW*(0.12+0.19*i);
        ctx.beginPath(); ctx.moveTo(bx, 0);
        let yy=0, xx=bx;
        while(yy<VH){ yy+=rand(50,110); xx+=rand(-34,34); ctx.lineTo(xx,yy); }
        ctx.stroke();
      }
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    }
    letterbox(A);
    hazardBand(VH/2-96, 16, T*3.2, '#12000a', 'rgba(255,60,90,0.9)', 0.8*A);
    hazardBand(VH/2+80, 16, -T*3.2, '#12000a', 'rgba(255,60,90,0.9)', 0.8*A);
    if(T<48){
      const bl = Math.floor(T/5)%2===0 ? 1 : 0.15;
      ctx.globalAlpha=A*bl; ctx.shadowBlur=30; ctx.shadowColor='#f04';
      ctx.fillStyle='#ffdde4'; ctx.font='bold 34px system-ui';
      ctx.fillText('DANGER', VW/2, VH/2-16);
      ctx.font='bold 15px system-ui'; ctx.fillStyle='#ff9bb0';
      ctx.fillText('CORE SIGNATURE : ∞', VW/2, VH/2+12);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
    } else {
      const s=clamp((T-48)/34,0,1);
      const sc=(0.35+0.65*(1-Math.pow(1-s,4))) + Math.sin(T*0.09)*0.02;
      /* クロマティックずれの3重描画 */
      ctx.save(); ctx.translate(VW/2, VH/2-6); ctx.scale(sc,sc); ctx.globalAlpha=A;
      const jj = T<70 ? rand(-3,3) : Math.sin(T*0.2)*1.2;
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,40,80,0.85)'; ctx.font='bold 40px system-ui';
      ctx.fillText(c.a, jj-3, 0);
      ctx.fillStyle='rgba(90,200,255,0.75)'; ctx.fillText(c.a, jj+3, 0);
      ctx.globalCompositeOperation='source-over';
      ctx.shadowBlur=30; ctx.shadowColor='#fd6'; ctx.fillStyle='#fff6dc';
      ctx.fillText(c.a, jj, 0);
      ctx.shadowBlur=0; ctx.globalAlpha=0.4*A; ctx.lineWidth=1; ctx.strokeStyle='#fff';
      ctx.strokeText(c.a, jj, 0);
      ctx.restore(); ctx.globalAlpha=1;
      if(T>70){
        ctx.globalAlpha=A*clamp((T-70)/20,0,1);
        ctx.fillStyle='#ffd76a'; ctx.font='bold 15px system-ui'; ctx.shadowBlur=14; ctx.shadowColor='#fd6';
        ctx.fillText(c.b, VW/2, VH/2+34);
        ctx.shadowBlur=0; ctx.fillStyle='#ff8fa8'; ctx.font='12px system-ui';
        ctx.fillText('全兵装をもって迎え撃て', VW/2, VH/2+58);
        ctx.globalAlpha=1;
      }
    }
  }

  else if(c.type==='od'){
    /* 金色の変身演出 */
    const p=Game.player;
    const rad=ctx.createRadialGradient(VW/2,VH*0.55,0,VW/2,VH*0.55,VH*0.7);
    rad.addColorStop(0,'rgba(255,225,150,'+(0.30*A).toFixed(2)+')');
    rad.addColorStop(1,'rgba(255,180,40,0)');
    ctx.fillStyle=rad; ctx.fillRect(0,0,VW,VH);
    /* 金の光条（放射） */
    if(p){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(T*0.03);
      ctx.globalCompositeOperation='lighter';
      for(let i=0;i<12;i++){
        const a=i/12*TAU, len=60+Math.abs(Math.sin(T*0.1+i))*90;
        ctx.globalAlpha=0.22*A;
        ctx.fillStyle='#ffd76a';
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a-0.05)*len, Math.sin(a-0.05)*len);
        ctx.lineTo(Math.cos(a+0.05)*len, Math.sin(a+0.05)*len);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore(); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    }
    const e = T<24 ? 1.7-0.7*(T/24) : 1 + Math.sin((T-24)*0.1)*0.03;
    ctx.save(); ctx.translate(VW/2, VH*0.3); ctx.scale(e,e); ctx.globalAlpha=A;
    ctx.shadowBlur=34; ctx.shadowColor='#fd6'; ctx.fillStyle='#fff8dc';
    ctx.font='bold 38px system-ui'; ctx.fillText(c.a, 0, 0);
    ctx.shadowBlur=0; ctx.globalAlpha=0.45*A; ctx.strokeStyle='#ffd76a'; ctx.lineWidth=1;
    ctx.strokeText(c.a,0,0);
    ctx.restore(); ctx.globalAlpha=A;
    ctx.fillStyle='#ffd76a'; ctx.font='bold 15px system-ui';
    ctx.fillText(c.b, VW/2, VH*0.3+30);
    ctx.fillStyle='#ffe9a8'; ctx.font='12px system-ui';
    ctx.fillText('火力・シールド強化 ／ 機体が黄金化', VW/2, VH*0.3+54);
    ctx.globalAlpha=1;
  }
  ctx.restore(); ctx.shadowBlur=0; ctx.globalAlpha=1;
}

/* =========================================================================
   メインループ
   ========================================================================= */
function loop(ts){
  const ms = clamp(ts-Game.last, 1, 120);
  const raw=(ts-Game.last)/16.67; Game.last=ts;
  Game.dt = clamp(raw,0.1,2.5); Game.t += Game.dt;
  /* v26: 描画が重い端末では発光のぼかしを自動的に弱め、フレームレートを優先する。
     ヒステリシスを付けて境界でチラつかないようにしている。 */
  Game.msAvg = Game.msAvg===undefined ? ms : Game.msAvg*0.94 + ms*0.06;
  if(GLOWQ===1){ if(Game.msAvg > 27) GLOWQ = 0.35; }
  else if(Game.msAvg < 19) GLOWQ = 1;
  Sound.ensure(); Music.tick();

  if(Game.state===STATE.PLAY){ updatePlay(Game.dt); }
  else {
    updateStarfield(Game.dt); updateParticles(Game.dt); updateFloats(Game.dt); updateShocks(Game.dt);
    if(Game.state===STATE.WIN) Game.winT=(Game.winT||0)+Game.dt;
    if(Game.state===STATE.CREDITS && Game.roll) Game.roll.t += Game.dt;
    if(Game.flash>0) Game.flash-=0.03*Game.dt; if(Game.shake>0) Game.shake*=0.9;
  }

  const dpr=Math.min(window.devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.save();
  if(Game.shake>0.4){ ctx.translate(rand(-Game.shake,Game.shake), rand(-Game.shake,Game.shake)); }

  switch(Game.state){
    case STATE.TITLE: drawBackdrop(); drawTitle(); break;
    case STATE.HOWTO: drawBackdrop(); drawHowto(); break;
    case STATE.HANGAR: drawBackdrop(); drawHangar(); break;
    case STATE.PLAY: drawWorld(); break;
    case STATE.PAUSE: drawPause(); break;
    case STATE.OVER: drawOver(); break;
    case STATE.CREDITS: drawBackdrop(); drawCreditRoll(); break;
    case STATE.WIN: drawWin(); break;
  }
  ctx.restore();
  if(Game.flash>0){ ctx.globalAlpha=clamp(Game.flash,0,1); ctx.fillStyle=Game.flashColor; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }

  requestAnimationFrame(loop);
}
function drawBackdrop(){ const grd=ctx.createLinearGradient(0,0,0,VH); grd.addColorStop(0,'#050a18'); grd.addColorStop(1,'#05060f'); ctx.fillStyle=grd; ctx.fillRect(0,0,VW,VH); }

/* v11: バックグラウンド復帰時に音を確実に戻す（スマホでの無音対策） */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    Sound.resume();
    if(!Sound.muted && Music.name && (!Music.cur || Music.cur.paused)) Music.play(Music.name);
  } else {
    Music.stopAll();   // 裏に回ったら全部止めて、戻った時の重なりを防ぐ
  }
});

/* ---------------- 起動 ---------------- */
Game.start();
</script>
